group('Closing an account');
/* Until now `until` could only be written by the spreadsheet importer, so
   anybody else's closed account carried its last balance forward for ever. */
const withBalances = (months) => ({ settings: { accounts: [
    { id: 'cash', name: 'Cash', hub: true }, { id: 'old', name: 'Old Bank' }] },
  years: { '2026': { kind: 'grid', startMonth: '2026-01', monthCount: 12, categories: [],
    cells: {}, seeds: {}, overrides: Object.fromEntries(
      months.map(m => [`old|${m}`, { v: 10 }])) } } });
t('a figure recorded after the closing month is what blocks it', () => {
  const st = withBalances(['2026-03', '2026-09']);
  eq(H.statedAfter(st, 'old', '2026-06'), ['2026-09'],
     'September would be hidden by closing in June');
  eq(H.statedAfter(st, 'old', '2026-12'), [], 'closing after everything is safe');
});
t('the closing month itself is not "after" it', () => {
  const st = withBalances(['2026-06']);
  eq(H.statedAfter(st, 'old', '2026-06'), [],
     'an account closed in the month of its last balance keeps that balance');
});
t('it only ever looks at the account being closed', () => {
  const st = withBalances(['2026-09']);
  st.years['2026'].overrides['cash|2026-11'] = { v: 500 };
  eq(H.statedAfter(st, 'old', '2026-10'), [], 'another account’s figures are not in the way');
});
/* ── Earnings never fall down the gap a closing leaves ──────────────────────
   `running` is a LATCH: an account that has started never unsets, so a closed
   one went on looking like a live destination for another account's interest.
   The credit was filed under an id the balance loop no longer visits and the
   money simply evaporated — while `interest[…]` still reported it, so the
   Interest & Dividends row, money in vs money out and the savings rate all
   counted earnings that no balance anywhere held. The books have to balance:
   every dollar reported as earned is a dollar some account is holding. */
t('interest bound for a closed account stays where it grew', () => {
  const st = H.coerceShape({ settings: { accounts: [
      { id: 'cash', name: 'Cash', rate: 0, creditTo: 'cash', hub: true },
      { id: 'inv', name: 'Inv', rate: 0.12, creditTo: 'sweep' },
      { id: 'sweep', name: 'Sweep', rate: 0, creditTo: 'sweep', until: '2026-03' }] },
    years: { '2026': { kind: 'grid', model: 'live', startMonth: '2026-01', monthCount: 6,
      enteredThrough: '2025-12', categories: [], cells: {},
      seeds: { cash: 1000, inv: 12000, sweep: 500 } } } });
  const c = H.computeYear(st, '2026', null);
  eq(c.balances['sweep|2026-03'], 860, 'while it is open the sweep collects it');
  eq(c.balances['sweep|2026-04'], undefined, 'and from April the account is gone');
  eq(c.balances['inv|2026-04'], 12120, 'so April’s interest stays in the account that made it');
  eq(c.balances['inv|2026-05'], 12241.20, 'and compounds there');
  /* The whole point, stated as arithmetic: earnings reported == earnings held. */
  const earned = H.accountEarnings(c, st.years['2026'], c.months).v;
  const opened = 1000 + 12000 + 500;
  const closedOut = c.balances['sweep|2026-03'];
  const heldAtEnd = c.balances['cash|2026-06'] + c.balances['inv|2026-06'] + closedOut;
  eq(H.round2(heldAtEnd - opened), H.round2(earned),
     'every dollar counted as income is a dollar some account is holding');
});
t('interest bound for an account that has not STARTED yet stays put too', () => {
  /* The same fallback, from the other end — this half always worked, and it is
     what the closed case now matches rather than inventing a second rule. */
  const st = H.coerceShape({ settings: { accounts: [
      { id: 'cash', name: 'Cash', rate: 0, creditTo: 'cash', hub: true },
      { id: 'inv', name: 'Inv', rate: 0.12, creditTo: 'later' },
      { id: 'later', name: 'Later', rate: 0, creditTo: 'later' }] },
    years: { '2026': { kind: 'grid', model: 'live', startMonth: '2026-01', monthCount: 4,
      enteredThrough: '2025-12', categories: [], cells: {}, seeds: { cash: 0, inv: 12000 },
      overrides: { 'later|2026-03': { v: 700 } } } } });
  const c = H.computeYear(st, '2026', null);
  eq(c.balances['inv|2026-01'], 12120, 'January’s interest has nowhere else to go');
  eq(c.balances['later|2026-01'], undefined, 'because the account is not running yet');
});

group('A dividends row names the accounts it earns on');
/* It used to read the ids `cash` and `mid` literally — invisible until someone
   who wasn't the author renamed or deleted them, whereupon the row went blank
   with nothing on screen saying why. */
const divState = (cat) => H.coerceShape({
  settings: { accounts: [
    { id: 'cash', name: 'Cash', hub: true, creditTo: 'cash', divTo: 'cash' },
    { id: 'mid', name: 'Savings', creditTo: 'mid', divTo: 'mid' },
    { id: 'pot', name: 'Pot', creditTo: 'pot', divTo: 'pot' }] },
  years: { '2026': { kind: 'grid', model: 'live', startMonth: '2026-01', monthCount: 12,
    seeds: { cash: 1000, mid: 2000, pot: 5000 }, overrides: {}, cells: {},
    categories: [Object.assign({ id: 'div', name: 'Dividends', role: 'normal',
      section: 'income', rule: 'dividends', rate: 0.12 }, cat)] } },
});
/* The injected date, like everywhere else — computeAll ignores it today, but
   the suite's stability convention is that engine time is always handed in. */
const divCell = (st) => H.computeAll(st, '2026-06-15')['2026'].cells['div|2026-02'];
t('a row written before the setting existed keeps earning on the old two', () => {
  const st = divState({});
  eq(H.dividendAccounts(st.years['2026'].categories[0]), ['cash', 'mid'],
     'backfilled once, from the ids the engine used to assume');
  eq(H.round2(divCell(st).v), 30, '12%/yr on 1000 + 2000 = 30 a month');
});
t('and it can be pointed at any accounts instead', () => {
  const st = divState({ accounts: ['pot'] });
  eq(H.round2(divCell(st).v), 50, '12%/yr on the 5000 pot');
});
t('naming none leaves the month blank rather than claiming zero', () => {
  const st = divState({ accounts: [] });
  eq(divCell(st).kind, 'missing', 'blank — “nothing earned” is not the same claim as $0');
  eq(H.dividendAccounts(st.years['2026'].categories[0]), [],
     'and an empty list is never re-filled behind the reader');
});
t('an account that no longer exists is dropped, not counted as zero', () => {
  const st = divState({ accounts: ['pot', 'deleted-account'] });
  eq(H.dividendAccounts(st.years['2026'].categories[0]), ['pot']);
  eq(H.round2(divCell(st).v), 50);
});

group('Nominating the main account');
/* The hub is one boolean the whole engine reads: `normal` rows land on it and
   nowhere else, transfer and pass-through are both defined against it, and it
   is the only account with no start date. */
const threeAccounts = () => ({ settings: { accounts: [
  { id: 'cash', name: 'Cash (SPAXX)', hub: true, creditTo: 'cash', divTo: 'cash' },
  { id: 'chase', name: 'Chase Checking', creditTo: 'chase', divTo: 'chase' },
  { id: 'mt', name: 'M&T Checking', creditTo: 'mt', divTo: 'mt' }] }, years: {} });
t('nominating one moves it, and leaves exactly one', () => {
  const st = threeAccounts();
  const moved = H.nominateHub(st, 'chase');
  eq(moved, { from: 'Cash (SPAXX)', to: 'Chase Checking' }, 'it says what moved');
  eq(st.settings.accounts.filter(a => a.hub).length, 1, 'exactly one, always');
  eq(H.hubAccount(st).id, 'chase');
  eq(st.settings.accounts[0].hub, undefined, 'and the old one is properly cleared');
});
t('nominating the one that already holds it does nothing', () => {
  const st = threeAccounts();
  eq(H.nominateHub(st, 'cash'), null, 'nothing to report');
  eq(H.hubAccount(st).id, 'cash');
});
t('an unknown account cannot take it away from the one that has it', () => {
  const st = threeAccounts();
  eq(H.nominateHub(st, 'nope'), null);
  eq(H.hubAccount(st).id, 'cash', 'the plan is never left without one');
});
t('a plan that somehow had two ends up with one', () => {
  /* Two would send every ordinary row to whichever the engine found first. */
  const st = threeAccounts();
  st.settings.accounts[1].hub = true;
  H.nominateHub(st, 'mt');
  eq(st.settings.accounts.filter(a => a.hub).length, 1);
  eq(H.hubAccount(st).id, 'mt');
});
t('the shape check always leaves a hub to find', () => {
  const st = H.coerceShape({ settings: { accounts: [
    { id: 'a', name: 'A' }, { id: 'b', name: 'B' }] }, years: {} });
  eq(st.settings.accounts.filter(x => x.hub).length, 1, 'one is chosen rather than none');
});

group('Accounts sharing a name are one account');
/* The history import made an account per distinct row NAME per sheet, so one
   real brokerage account arrived as four ids as the spreadsheet's wording
   drifted. Renaming them to match is how you say they are the same thing. */
const twoYears = (a, b) => ({
  settings: { accounts: [
    { id: 'old', name: 'Savings', until: '2021-12', creditTo: 'old', divTo: 'old' },
    { id: 'new', name: 'Savings', creditTo: 'new', divTo: 'new' }] },
  years: {
    '2021': { kind: 'grid', model: 'pinned', startMonth: '2021-01', monthCount: 12,
              overrides: a, seeds: {}, categories: [], cells: {} },
    '2022': { kind: 'grid', startMonth: '2022-01', monthCount: 12,
              overrides: b, seeds: {}, categories: [], cells: {} } },
});
t('a succession of same-named accounts becomes one, keeping every figure', () => {
  const st = twoYears({ 'old|2021-06': { v: 100 }, 'old|2021-12': { v: 250 } },
                      { 'new|2022-06': { v: 400 } });
  const rep = H.mergeAccountsByName(st);
  eq(st.settings.accounts.length, 1, 'one account left');
  eq(st.settings.accounts[0].id, 'new', 'the still-open one survives, not the closed one');
  eq(st.settings.accounts[0].until, undefined, 'and it is open, because the survivor was');
  eq(st.years['2021'].overrides['new|2021-06'].v, 100, 'the old balances moved across');
  eq(st.years['2021'].overrides['new|2021-12'].v, 250);
  eq(st.years['2021'].overrides['old|2021-06'], undefined, 'and left nothing behind');
  eq(st.years['2022'].overrides['new|2022-06'].v, 400, 'the survivor keeps its own');
  eq(rep[0].moved, 2);
});
t('a month claimed by both refuses the merge outright', () => {
  /* A balance is a fact. Dropping one to tidy a list is not a trade worth
     making, so an overlap leaves the whole group alone. */
  const st = twoYears({ 'old|2021-06': { v: 100 }, 'new|2021-06': { v: 999 } }, {});
  const rep = H.mergeAccountsByName(st);
  eq(st.settings.accounts.length, 2, 'both survive');
  eq(st.years['2021'].overrides['old|2021-06'].v, 100, 'and neither figure moved');
  eq(st.years['2021'].overrides['new|2021-06'].v, 999);
  eq(rep[0].refused, 1, 'and it says how many months were in the way');
});
t('every reference to an absorbed account is repointed', () => {
  /* Missing one would leave a row paying into an account that no longer
     exists, which reads on screen as money vanishing. */
  const st = twoYears({ 'old|2021-06': { v: 1 } }, {});
  st.settings.accounts[1].creditTo = 'old';
  st.years['2022'].categories = [{ id: 'x', name: 'X', role: 'transfer', transferTo: 'old' }];
  st.goals = [{ id: 'g', name: 'G', accounts: ['old', 'new'] }];
  H.mergeAccountsByName(st);
  eq(st.settings.accounts[0].creditTo, 'new');
  eq(st.years['2022'].categories[0].transferTo, 'new');
  eq(st.goals[0].accounts, ['new'], 'and a goal naming both does not list it twice');
});
t('the net-worth link and a dividends row move with the merge', () => {
  /* Both lists are FILTERED against live ids by coerceShape on the next load,
     so a missed rewrite here does not dangle — it silently deletes: the pane
     link goes and the Total counts the pot twice, or the dividends row quietly
     stops earning on the absorbed account. Worse than dangling, because
     nothing ever says so. */
  const st = twoYears({ 'old|2021-06': { v: 1 } }, {});
  st.side = { portfolios: [{ id: 'pf', name: 'Brokerage', accounts: ['old'],
    rows: [{ ticker: 'VOO', shares: 1, price: 100 }] }] };
  st.years['2022'].categories = [{ id: 'div', name: 'Dividends', role: 'normal',
    rule: 'dividends', accounts: ['old', 'new'] }];
  H.mergeAccountsByName(st);
  eq(st.side.portfolios[0].accounts, ['new'], 'the pane still claims its money');
  eq(st.years['2022'].categories[0].accounts, ['new'],
    'the dividends row earns on the survivor, listed once');
});
t('different names are left well alone, and running twice changes nothing', () => {
  const st = twoYears({ 'old|2021-06': { v: 100 } }, { 'new|2022-06': { v: 400 } });
  st.settings.accounts[0].name = 'Old Savings';
  eq(H.mergeAccountsByName(st).length, 0, 'nothing to do');
  eq(st.settings.accounts.length, 2);
  st.settings.accounts[0].name = 'Savings';
  H.mergeAccountsByName(st);
  const once = JSON.stringify(st);
  H.mergeAccountsByName(st);
  eq(JSON.stringify(st), once, 'a second pass is a no-op');
});
t('the hub survives being merged into', () => {
  const st = twoYears({ 'old|2021-06': { v: 1 } }, {});
  st.settings.accounts[0].hub = true;          // the closed one was the hub
  H.mergeAccountsByName(st);
  eq(st.settings.accounts[0].hub, true, 'hub is a fact about the account, not the row that won');
});

group('The Refresh button ignores the six-hour cache');
/* Pressing the button is an explicit "look now". The six hours only ever
   existed to stop the AUTOMATIC pass spending the allowance on prices that
   cannot have moved. */
t('a price the automatic pass calls fresh is re-asked by a manual press', () => {
  const q = { price: 100, ts: Date.now() - 60 * 60e3 };   // an hour old
  eq(H.freshWithin(q, H.QUOTE_TTL_MS), true, 'the automatic pass leaves it alone');
  eq(H.freshWithin(q, H.MANUAL_FRESH_MS), false, 'the button asks again');
});
t('but a press seconds after the last one does not re-ask what it just got', () => {
  /* This is what makes a throttled batch CARRY ON instead of starting over:
     without it the next press spends the whole minute re-fetching the holdings
     the previous press already had, and never reaches the ones it missed. */
  const justNow = { price: 100, ts: Date.now() - 10e3 };
  eq(H.freshWithin(justNow, H.MANUAL_FRESH_MS), true);
});
t('the manual window is far too short to be a cache', () => {
  eq(H.MANUAL_FRESH_MS < H.QUOTE_TTL_MS, true);
  eq(H.MANUAL_FRESH_MS <= 5 * 60e3, true, 'minutes, not hours');
});

group('Where a holding’s price came from');
/* The bar above the tables reports ONE time for the whole table, and the oldest
   of them, so a holding fetched minutes ago sits under a heading hours old.
   That is what made a working fund lookup look like it had never run. */
const NOON = new Date(2026, 7, 13, 12, 0, 0).getTime();
const at = (h, m) => new Date(2026, 7, 13, h, m, 0).getTime();
t('a fetched price says so, and when', () => {
  const s = H.priceProvenance({ price: 715.61, ts: at(15, 41) }, 715.61, true, NOON);
  eq(/^Fetched today at /.test(s), true, s);
});
t('a price typed over a fetched one does not claim to be fetched', () => {
  const s = H.priceProvenance({ price: 713.20, ts: at(15, 41) }, 715.61, true, NOON);
  eq(/^You typed this over /.test(s), true, s);
  eq(s.includes('713.20'), true, 'says what the fetched figure actually was');
});
t('a “no quote” marker is reported as one, not as a price', () => {
  const s = H.priceProvenance({ noQuote: true, ts: at(9, 5) }, 715.61, true, NOON);
  eq(/^No quote came back /.test(s), true, s);
});
t('a row never looked up, and one with lookup switched off, differ', () => {
  eq(H.priceProvenance(undefined, 10, true, NOON), 'Not fetched yet.');
  eq(H.priceProvenance({ price: 10, ts: at(9, 0) }, 10, false, NOON).includes('Lookup is off'),
     true, 'the reason there is no fetch time is the setting, not the clock');
});
t('the day is named only when it is not today', () => {
  eq(H.fetchedWhen(at(15, 41), NOON).startsWith('today at '), true);
  const y = new Date(2026, 7, 12, 15, 41, 0).getTime();
  eq(H.fetchedWhen(y, NOON).startsWith('on '), true, H.fetchedWhen(y, NOON));
});

group('What one price answer means');
/* Real shapes, captured from Twelve Data rather than imagined. The two 429s
   are the pair that must never merge: the per-minute one clears while you are
   reading about it, the daily one does not. */
t('a quote is a price', () => {
  const v = H.classifyQuote(200, { symbol: 'FSKAX', close: '213.92999' });
  eq(v.kind, 'price');
  eq(v.price, 213.93, 'rounded to cents like every other figure in the app');
});
t('a fund quotes like anything else — the whole reason for the move', () => {
  eq(H.classifyQuote(200, { symbol: 'VTSAX', close: '185.87000' }).kind, 'price');
});
t('running out for the minute is not running out for the day', () => {
  const minute = H.classifyQuote(429, { code: 429, status: 'error', message:
    'You have run out of API credits for the current minute. 9 API credits were used, ' +
    'with the current limit being 8. Wait for the next minute or consider upgrading.' });
  eq(minute.kind, 'throttled', 'press Refresh again in a minute — do NOT say come back tomorrow');
  const day = H.classifyQuote(429, { code: 429, status: 'error', message:
    'You have run out of API credits for the current day.' });
  eq(day.kind, 'limited');
});
t('a rejected key says so, instead of hiding as “no quote”', () => {
  eq(H.classifyQuote(401, { code: 401, status: 'error',

  eq(H.classifyQuote(403, { code: 403, status: 'error', message: 'forbidden' }).kind, 'badKey');
});
t('an unknown symbol is a determinate “there is no price”', () => {
  eq(H.classifyQuote(404, { code: 404, status: 'error',
    message: '**symbol** or **figi** parameter is missing or invalid.' }).kind, 'noQuote');
  eq(H.classifyQuote(200, { symbol: 'X' }).kind, 'noQuote', 'a 200 carrying no price');
});
t('their outage is not our answer, and must not mark the ticker', () => {
  eq(H.classifyQuote(503, { code: 503, status: 'error', message: 'unavailable' }).kind, 'failed');
  eq(H.classifyQuote(500, {}).kind, 'failed');
});

group('The price lookup’s memory');
/* A holding that can NEVER be quoted — a mutual fund on the free tier, or a row
   that isn't a security — used to be asked about on every single page load,
   spending one of the daily lookups each time (25 a day back on Alpha Vantage,
   where this bit; 800 on Twelve Data now) and never getting anything
   back. The marker is what stops that; its expiry is what keeps it honest. */
t('a “no quote” marker is remembered, but only for a day', () => {
  const now = Date.now();
  eq(H.noQuoteFresh({ noQuote: true, ts: now }), true, 'just answered — do not ask again');
  eq(H.noQuoteFresh({ noQuote: true, ts: now - 23 * 3600e3 }), true, 'still the same day');
  eq(H.noQuoteFresh({ noQuote: true, ts: now - 25 * 3600e3 }), false,
     'a fund the free tier starts covering is retried tomorrow');
  eq(H.noQuoteFresh(undefined), false, 'never asked about at all');
});
t('a marker is not a price, and a price is not a marker', () => {
  const now = Date.now();
  eq(H.quoteFresh({ noQuote: true, ts: now }), false,
     'a marker must never be read as a price — it has none');
  eq(H.noQuoteFresh({ price: 12, ts: now }), false,
     'a real quote is not a refusal');
  eq(H.quoteFresh({ price: 12, ts: now }), true);
});

group('How long a lookup’s complaints stay true');
/* Both notes used to be drawn straight out of stored state with no age check,
   so a run from the previous morning sat on the tab reading as a live refusal —
   which is exactly what "how can I be out of lookups?" was looking at. */
t('the daily cap is news only on the day it happened', () => {
  eq(H.runIsToday({ at: Date.now() }), true);
  eq(H.runIsToday({ at: Date.now() - 26 * 3600e3 }), false,
     'the allowance has reset since — saying otherwise sends you away for nothing');
  eq(H.runIsToday(null), false);
});
t('the frequency limit clears in about a minute', () => {
  eq(H.runIsRecent({ at: Date.now() - 5e3 }, 10 * 60e3), true);
  eq(H.runIsRecent({ at: Date.now() - 30 * 60e3 }, 10 * 60e3), false);
  eq(H.runIsRecent(null, 10 * 60e3), false);
});

group('Average of last year');
t('averages the prior year’s stored months, ignoring what it estimated', () => {
  const s = H.coerceShape(fixtureState());
  s.years['2029'].categories.push({ id: 'gas', name: 'Gas', role: 'normal', rule: 'none' });

group('What a subtotal is made of');
t('a subtotal of one kind is that kind', () => {
  eq(H.sumKind(['actual', 'actual']), 'actual');
  eq(H.sumKind(['auto', 'auto', 'auto']), 'auto');
  eq(H.sumKind(['manual', 'manual']), 'manual', 'all your own estimates, still yours');
});
t('blanks are ignored rather than counted as anything', () => {

    'a blank must not drag a column of real figures into looking part-estimated');

  eq(H.sumKind([]), 'missing');
});

  eq(H.sumKind(['actual', 'manual']), 'mixed');
  eq(H.sumKind(['auto', 'mixed']), 'mixed', 'a split month carries its own actual up');
});
t('two flavours of estimate are still just an estimate', () => {

    'yours and the rule’s disagree about who guessed, not about whether');
});

group('The raise and the salary it lands on');
t('a round raise stays a round number', () => {
  /* The pair from a real letter: 2.5% on $133,021 comes to $136,346.53, and
     reading it back must say 2.5% — not the 2.500004% the rounded cents imply. */
  eq(H.raiseFor(133021, 136346.53), 2.5);
  eq(H.raiseFor(100000, 103000), 3);
  eq(H.raiseFor(100000, 100000), 0, 'no raise at all');
  eq(H.raiseFor(100000, 95000), -5, 'and a cut is a raise backwards');
});
t('a flat new salary gets the decimals it actually needs', () => {
  const p = H.raiseFor(136346.53, 145000);
  ok(p > 6.3 && p < 6.4, `about 6.35%, got ${p}`);
});
t('applying the raise back lands on the very cent that produced it', () => {
  /* The invariant the whole field rests on: type a new salary, and what gets
     stored has to reproduce it exactly — the raise is what's kept, not the
     figure you typed. */
  const pairs = [[133021, 136346.53], [136346.53, 145000], [100000, 103333],
                 [87500.5, 90125.52], [42000, 42000.01], [129776.59, 133021]];
  for (const [salary, after] of pairs) {
    const p = H.raiseFor(salary, after);
    eq(H.round2(salary * (1 + p / 100)), H.round2(after), `${salary} → ${after}`);
  }
});
t('the after-raise figure is one calculation, not seven', () => {
  /* Total comp and the bonus percentage are both built on it, so they can
     never disagree about what the base is. */
  eq(H.afterRaise({ salary: 133021.14, raisePct: 0.025 }), 136346.67);
  eq(H.afterRaise({ salary: 89000, raisePct: 0 }), 89000);
  eq(H.afterRaise(undefined), 0, 'a year with no comp record has no salary');
  eq(H.afterRaise({}), 0);
});
t('a bonus is measured against the salary the year opened on', () => {
  /* Not what the year ended on. A bonus lands with February's merit raise but
     is earned against the pay you were on before it — which is the opening
     figure, since every year opens where the last one closed. */
  eq(H.bonusBase({ salary: 133021.14, raisePct: 0.025 }), 133021.14);
  eq(H.bonusBase(undefined), 0, 'a year with no comp record has no salary');
  eq(H.bonusBase({}), 0);
  eq(H.round2(H.bonusShare(15000, H.bonusBase({ salary: 133021.14, raisePct: 0.025 })) * 100),
    11.28, 'and not the 11.00% the after-raise figure would give');
  eq(H.bonusShare(0, 89000), 0, 'a recorded nil bonus is 0%, not blank');
});
t('the percentages agree with the payroll system, to the basis point', () => {
  /* Charlie's own three, cross-checked against Workday's own Percent column.
     Each bonus is filed under the year it was PAID; Workday files it under the
     plan year it was FOR and divides by that year's ENDING salary — the same
     number, because a year opens where the last one closed. */
  const check = (openingSalary, bonus, workdayPct) =>
    eq(+(H.bonusShare(bonus, H.bonusBase({ salary: openingSalary })) * 100).toFixed(2),
      workdayPct);
  check(125358.60, 11000, 8.77);    // paid Feb 2024, for the 2023 plan year
  check(128179.17, 15000, 11.70);   // paid Feb 2025, for the 2024 plan year
  check(133021.14, 15000, 11.28);   // paid Feb 2026, for the 2025 plan year
});
t('a bonus with no salary behind it has no percentage', () => {
  /* Bonuses by year runs to years with no comp record — 2020 in the real
     history — and a percentage of an unknown salary is not a figure. */
  eq(H.bonusShare(1000, 0), null);
  eq(H.bonusShare(1000, H.bonusBase(undefined)), null);
  eq(H.bonusShare(undefined, 133021.14), null, 'and no bonus means nothing to show');
});
t('a year that picked up where the last one ended reports nothing', () => {
  /* The ordinary case, and the whole column used to read "+$0.00 (0.00%)" for
     it — which looked like arithmetic that had failed rather than a year with
     nothing to report. */
  const s = H.sinceLastYear('2026', '2025', 133021.14, 133021.14);
  eq(s.state, 'planned');
  eq(s.moved, 0);
  eq(s.against, null, 'no need to name last year when it IS last year');
});
t('a salary that did not start where planned says by how much', () => {
  const up = H.sinceLastYear('2027', '2026', 145000, 136346.67);
  eq(up.state, 'above');
  eq(up.moved, 8653.33);
  approx(up.pct * 100, 6.35, 'a promotion landed', 0.01);
  const down = H.sinceLastYear('2028', '2027', 140000, 149350);
  eq(down.state, 'below');
  eq(down.moved, -9350);
});
t('a missing year is named rather than passed off as last year', () => {
  /* 2020 is not in the table, so 2021 sits under 2019 — the column has to own
     up to which year it actually read. */
  eq(H.sinceLastYear('2021', '2019', 89000, 89000).against, '2019');
  eq(H.sinceLastYear('2022', '2021', 118450, 118450).against, null);
});
t('the first year has nothing behind it to compare with', () => {
  eq(H.sinceLastYear('2019', null, 89000, null), { state: 'first' });
});
t('no percentage is quoted against a starting point of nothing', () => {
  const s = H.sinceLastYear('2020', '2019', 50000, 0);
  eq(s.state, 'above');
  eq(s.moved, 50000);
  eq(s.pct, null, 'dividing by a zero salary would be a meaningless figure');
});
t('roundTo keeps the decimal places it is asked for', () => {
  eq(H.roundTo(2.500004, 1), 2.5);
  eq(H.roundTo(6.3466741, 6), 6.346674);
  eq(H.roundTo(1.005, 2), 1.01, 'and survives float dust like round2 does');
});

group('A per-check month opens as its checks');
const PAYCAT = { id: 'paycheck', rule: 'paycheck', perCheck: 3273.13 };
t('one part per paycheck, each the per-check amount', () => {
  eq(H.paycheckParts(PAYCAT, 2, true),
    [{ v: 3273.13, kind: 'manual' }, { v: 3273.13, kind: 'manual' }]);
  eq(H.paycheckParts(PAYCAT, 3, true).length, 3);
});
t('a half-check month puts the remainder in a part of its own', () => {
  const parts = H.paycheckParts(PAYCAT, 2.5, true);
  eq(parts.map(p => p.v), [3273.13, 3273.13, 1636.57]);
});

group('Split months');
t('a cell’s parts add up to its value and set its kind', () => {
  const s = H.coerceShape(fixtureState());
  /* May, not April: April's cash is pinned by an override, so a change there
     would be swallowed and the test would pass for the wrong reason. */
  s.years['2030'].cells['cc|2030-05'] = { v: -800, kind: 'mixed', parts: [
    { v: -500, kind: 'actual' }, { v: -300, kind: 'manual' }] };
  const c = H.computeAll(s, TODAY_FIX)['2030'];
  approx(c.cells['cc|2030-05'].v, -800, 'the engine reads the sum, not the parts');
  eq(c.cells['cc|2030-05'].kind, 'mixed');
  eq(c.cells['cc|2030-05'].parts.length, 2, 'parts survive for the editor');
  /* and the balance chain treats it like any other stored number */
  const bare = H.computeAll(H.coerceShape(fixtureState()), TODAY_FIX)['2030'];
  approx(c.balances['cash|2030-05'] - bare.balances['cash|2030-05'],
    H.round2(-800 - bare.cells['cc|2030-05'].v), '', 0.02);
});
t('a split month carries into the next year on rollover', () => {
  const s = H.coerceShape(fixtureState());
  s.years['2030'].monthCount = 18;
  s.years['2030'].cells['cc|2031-02'] = { v: -90, kind: 'mixed',
    parts: [{ v: -40, kind: 'actual' }, { v: -50, kind: 'manual' }] };
  H.rolloverYear(s, H.computeAll(s, TODAY_FIX), '2030');
  eq(s.years['2031'].cells['cc|2031-02'].parts.length, 2);
});
t('the kind a set of parts adds up to', () => {
  /* partsKind decides what the saved cell CLAIMS to be — mixed only when the
     parts genuinely disagree, and anything that isn't a manual estimate
     counts as actual. */
  eq(H.partsKind([{ v: 1, kind: 'actual' }, { v: 2, kind: 'actual' }]), 'actual');
  eq(H.partsKind([{ v: 1, kind: 'manual' }, { v: 2, kind: 'manual' }]), 'manual');
  eq(H.partsKind([{ v: 1, kind: 'actual' }, { v: 2, kind: 'manual' }]), 'mixed');
  eq(H.partsKind([{ v: 1 }, { v: 2, kind: 'wat' }]), 'actual',
    'unnamed and unknown kinds are actuals, not a third thing');
  eq(H.partsKind([]), 'actual', 'no parts claims nothing beyond actual');

/* ── Spending the retirement pot down ───────────────────────────────────────
   The projection used to climb at the assumed return for ever, straight through
   the retirement rules it draws. These pin the arithmetic that makes it bend —
   and, first of all, that the ACCUMULATION half of it did not move. */
const RET_FIX = 2030;
function potFixture(over) {
  return H.coerceShape(Object.assign({
    settings: { retirementReturnAnnual: 0.05 },
    people: [{ id: 'sam', name: 'Sam', role: 'adult', birth: '1970-04', retireAge: 65 }],
    side: { retirementAccounts: [{ name: '401(k)', type: '401k',
              amount: 500000, contribs: {} }],
            drawdown: { spend: 40000, income: [] } },
  }, over || {}));
}

group('Drawing the retirement pot down');
t('the accumulation half is exactly what it always was', () => {
  /* THE regression guard. A plan with nobody in it draws nothing down, and its
     curve must match the old `bal * (1 + r) + contribs[y]` to the cent —
     recomputed here rather than quoted, so a change to either side fails. */
  const s = potFixture({ people: [], side: {
    retirementAccounts: [{ name: '401(k)', type: '401k', amount: 500000,
      contribs: { '2031': 20000, '2032': 20000 } }],
    drawdown: { spend: 40000, income: [] } } });
  const rows = H.drawdownYears(s, RET_FIX, 25);
  const contribs = { 2031: 20000, 2032: 20000 };
  let bal = 500000;
  for (let i = 0; i <= 25; i++) {
    if (i) bal = H.round2(bal * 1.05 + (contribs[RET_FIX + i] || 0));
    approx(rows[i].close, bal, `${RET_FIX + i} matches the old formula`, 0.011);
  }
  eq(rows.every(t => t.phase === 'saving'), true, 'and nothing is drawn down');
  eq(rows.every(t => t.draw === 0), true);
  eq(H.drawdownOutlook(rows).firstDrawYear, null);
});
t('a spending target with nobody to retire draws nothing down', () => {
  const s = potFixture({ people: [
    { id: 'jo', name: 'Jo', role: 'adult', birth: '1970-04' },   // no retireAge
    { id: 'ellis', name: 'Ellis', role: 'child', birth: '2015-09' }] });
  eq(H.drawdownFrom(s, RET_FIX), null, 'nobody the plan can date');
  eq(H.drawdownYears(s, RET_FIX, 25).every(t => t.draw === 0), true);
});
t('an unset spending target draws nothing down either', () => {
  const s = potFixture({ side: { retirementAccounts: [{ name: '401(k)',
    type: '401k', amount: 500000, contribs: {} }], drawdown: { income: [] } } });
  const rows = H.drawdownYears(s, RET_FIX, 25);
  eq(rows.every(t => t.phase === 'saving'), true, 'absent is not zero-spending');
  eq(H.drawdownOutlook(rows).firstDrawYear, null);
});
t('the pot starts paying in the FIRST retirement year of the household', () => {

    { id: 'robin', name: 'Robin', role: 'adult', birth: '1974-11', retireAge: 65 }] }); // 2039
  eq(H.drawdownFrom(s, RET_FIX), 2035);

/* The 401(k) cards hold most people's contributions as a PERCENTAGE, and the
   projection read only the per-year IRA rows — so a plan with its rates filled
   in showed "Paid in —" for forty years and understated itself badly. */
function deferralFixture(over) {
  return H.coerceShape(Object.assign({
    settings: { retirementReturnAnnual: 0 },
    people: [{ id: 'sam', name: 'Sam', role: 'adult', birth: '1970-11', retireAge: 65 }],
    side: { comp: { '2030': { salary: 100000, raisePct: 0 } },
            bonuses: { '2030': 10000 },
            limits: { '2030': { pretaxPct: 0.05, bonusPct: 0.10 } },
            retirementAccounts: [{ name: '401(k)', type: '401k',
              amount: 100000, contribs: {} }],
            drawdown: { income: [] } },
  }, over || {}));
}
t('the 401(k) percentages reach the projection, not just the typed IRA rows', () => {

  const c = H.plannedContribs(s, RET_FIX, 10);

  eq(c['2034'], 6000, 'carried forward in today\'s money');
  eq(c['2035'], 5000, 'ten months of the year they retire in November');
  eq(c['2036'], undefined, 'and nothing at all once they have gone');
  eq(c['2030'], undefined, 'year zero is the balance as it stands, untouched');
});

/* The carry rule, stated once so the three tests below can't drift from it:
   the figure carried is the NEWEST typed year's, whatever it is, and it fills
   only the years with nothing typed, up to retirement. */
const iraFixture = (contribs) => deferralFixture({ side: {
  comp: { '2030': { salary: 100000, raisePct: 0 } }, bonuses: { '2030': 10000 },
  limits: {},                                     // no 401(k) rate: IRAs only here
  retirementAccounts: [{ name: 'Roth IRA', type: 'roth-ira', amount: 0,
    contribs }], drawdown: { income: [] } } });

t('an IRA carries its latest figure into the years it has nothing typed for', () => {
  const c = H.plannedContribs(iraFixture({ '2028': 6000, '2031': 7000 }), RET_FIX, 10);
  eq(c['2028'], 6000, 'a past year stands exactly as it was typed');

    'the gap after it is filled from the LATEST figure, not the older 6,000');

  /* The conservative reading, and the one a retirement projection should take:
     the last thing you said about this account is the current statement of it.

  const s = iraFixture({ '2028': 6000, '2031': 7000, '2033': 0 });
  eq(H.latestContrib(s.side.retirementAccounts[0]), 0);
  const c = H.plannedContribs(s, RET_FIX, 10);

  eq(c['2034'], undefined, 'but nothing carries past the zero');

t('an IRA says what it is worth by the time the paying-in stops', () => {
  const s = deferralFixture({ settings: { retirementReturnAnnual: 0.10 },
    side: { comp: {}, bonuses: {}, limits: {},
      retirementAccounts: [{ name: 'Roth IRA', type: 'roth-ira', amount: 1000,
        contribs: { '2031': 100 } }], drawdown: { income: [] } } });
  /* Sam retires 2035-11, so 2031..2035 are paid into (2035 at ten twelfths).
     Growth on the opening balance then the contribution on top — the same
     convention drawdownYears uses, which is the point. */
  let bal = 1000, paid = 0;
  for (const put of [100, 100, 100, 100, H.round2(100 * 10 / 12)]) {
    bal = H.round2(bal * 1.10 + put); paid = H.round2(paid + put);
  }
  const t0 = H.iraOutlook(s, RET_FIX)[0];
  eq(t0.stop, '2035-11');
  eq(t0.yearly, 100, 'the figure being carried');
  eq(t0.years, 5);
  eq(t0.projected, 4, 'four of those five years were filled in, not typed');
  approx(t0.paid, paid, 'still to pay in', 0.011);
  approx(t0.atStop, bal, 'worth by then', 0.011);
});

  const five = [

group('What the brackets say');

/* Invented rates on round thousands throughout — 10/20/30% over 10k/20k bands.
   A realistic bracket in a fixture is a shipped tax figure. */
const T10_30 = { bands: [{ upTo: 10000, rate: 0.10 }, { upTo: 20000, rate: 0.20 },
                         { upTo: null, rate: 0.30 }], deduction: 5000 };
const FLAT20 = { bands: [{ upTo: null, rate: 0.20 }], deduction: 10000 };

t('tax is a progressive sum over the bands', () => {
  eq(H.taxOn(0, T10_30), 0);
  eq(H.taxOn(5000, T10_30), 500, 'inside the first band');
  eq(H.taxOn(10000, T10_30), 1000, 'exactly on a band edge — the lower rate still');
  eq(H.taxOn(15000, T10_30), 2000, '1000 + 5000 at 20%');
  eq(H.taxOn(20000, T10_30), 3000, 'the second edge');
  eq(H.taxOn(30000, T10_30), 6000, '1000 + 2000 + 10000 at 30%');
  eq(H.taxOn(-5000, T10_30), 0, 'a negative income owes nothing');
  eq(H.taxOn(50000, { bands: [] }), 0, 'no bands, no tax');
  eq(H.taxOn(50000, null), 0, 'and no table at all is no tax either');
});

t('income above a truncated table is taxed at its top band, never at zero', () => {
  /* THE silent cliff, and the one failure this could not afford: a schedule
     somebody typed only as far as they read must not make the next dollar
     free. */
  const cut = { bands: [{ upTo: 10000, rate: 0.10 }, { upTo: 20000, rate: 0.20 }] };
  eq(H.taxOn(20000, cut), 3000, 'up to the end of the table, as normal');
  eq(H.taxOn(30000, cut), 5000, '3000 + 10000 more at the top band’s 20%');
  eq(H.taxOn(30000, cut) > H.taxOn(20000, cut), true, 'and it never goes backwards');
  /* Against the open-ended sibling: identical below the cut, and the only
     difference above it is which rate applies — not whether one does. */
  eq(H.taxOn(9000, cut), H.taxOn(9000, T10_30));
});

group('The withdrawal that pays its own tax');

/* The property that DEFINES the answer, checked rather than re-derived: enough
   comes out, and a penny less would not be.

   Measured with the solver's own UNROUNDED bill (`taxBillRaw`). Rounding the
   tax to the cent first is what the reader is shown, but it moves the net by up
   to half a penny either way — enough to make "a cent less would not reach the
   target" read as false when it is true. Round the measuring stick and you are
   testing the rounding, not the answer. */
function pinsGrossUp(spend, income, o, why) {
  const g = H.grossUpDraw(spend, income, o);
  const net = (G) => income + G - H.taxBillRaw(G, o);
  ok(net(g.draw) >= spend, `${why}: net ${net(g.draw)} reaches ${spend}`);
  if (g.draw > 0)
    ok(net(g.draw - 0.01) < spend,
      `${why}: a cent less (${net(g.draw - 0.01)}) would not`);
  return g;
}

t('with no tables the gross-up is the expression it replaces', () => {
  /* Character for character — this is what keeps a plan that never typed a
     bracket drawing exactly what it always drew. */
  for (const [spend, income] of [[40000, 0], [40000, 15000], [40000, 60000], [0, 0]])
    eq(H.grossUpDraw(spend, income, {}).draw, Math.max(0, H.round2(spend - income)),
      `${spend} spend against ${income} income`);
  eq(H.grossUpDraw(40000, 0, {}).tax, 0);
});

t('nothing spent means nothing withdrawn, even with taxable income arriving', () => {
  /* Without this a taxable income row starts draining the pot at 45. */
  const g = H.grossUpDraw(0, 50000, { federal: T10_30, tradShare: 1, taxableOther: 50000 });
  eq(g.draw, 0);
  eq(g.tax, 0);
});

t('an all-Roth pot needs no gross-up at all', () => {
  const g = pinsGrossUp(40000, 0,
    { federal: T10_30, tradShare: 0, taxableOther: 0 }, 'all Roth');
  eq(g.draw, 40000, 'none of it is taxable, so the draw is the shortfall exactly');
  eq(g.tax, 0);
});

t('spending covered by taxed income STILL needs a withdrawal', () => {
  /* The case that proves want ≠ max(0, spend − income), and the one nobody
     predicts: 60,000 arrives, 55,000 is wanted, and the old line would have
     drawn nothing while the tax bill went unpaid. */
  const o = { federal: FLAT20, tradShare: 1, taxableOther: 60000 };
  eq(Math.max(0, H.round2(55000 - 60000)), 0, 'the old expression says draw nothing');
  const g = pinsGrossUp(55000, 60000, o, 'income covered but taxed');
  eq(g.draw, 6250, 'net(6250) = 60000 + 6250 − 0.2×(60000 + 6250 − 10000) = 55000');
  eq(H.round2(60000 + g.draw - g.tax), 55000, 'and it lands exactly on the target');
});

t('the gross-up crosses a band edge without losing the target', () => {
  const o = { federal: T10_30, tradShare: 1, taxableOther: 0 };
  const g = pinsGrossUp(40000, 0, o, 'across the bands');
  ok(g.draw > 40000, 'more comes out than is spent');
  ok(g.taxable > 20000, 'and the answer really does sit above the top edge');
});

t('a state table stacks on top of the federal one', () => {
  const fedOnly = H.grossUpDraw(40000, 0, { federal: T10_30, tradShare: 1 });
  const both = pinsGrossUp(40000, 0,

    'federal and state');

  const stateOnly = pinsGrossUp(40000, 0,
    { state: { bands: [{ upTo: null, rate: 0.05 }] }, tradShare: 1 }, 'state alone');

});

t('a rate the pot can never out-earn says so rather than hanging', () => {
  /* Every dollar taxed at 100% against a fully pre-tax pot: no withdrawal ever

  const g = H.grossUpDraw(40000, 0,

t('convergence holds as a property, over a grid', () => {
  /* Stronger than any single worked example: for every combination the answer
     meets the target and a penny less does not. */
  for (const spend of [1000, 40000, 250000])
    for (const income of [0, 20000, 60000])
      for (const share of [0, 0.35, 1])
        for (const table of [T10_30, FLAT20])

t('the rate clamp is the solver’s precondition, not tidiness', () => {
  /* net'(G) = 1 − m·tradShare stays ≥ 0 only while every marginal rate does.
     coerceShape is what guarantees it, so this pins the two together. */
  const wild = H.coerceShape({ side: { tax: { federal: { '2026': { single: {
    bands: [{ upTo: 10000, rate: 5 }, { upTo: null, rate: -3 }] } } } } } });

});

     is most of the work the paste box exists to save.

t('it takes YOUR column out of a rate-by-status table', () => {
  /* A published page gives one wide table with a column per filing status, so a
     copy brings all four. Picking the wrong one is a whole schedule wrong,

     being scanned for the biggest. Invented figures; the SHAPE is the real one.
     The separate column deliberately differs from single only in its last
     closed band, which is what proves a column is really being read. */
  const wide = ['2030 tax brackets',
    'Tax rate\tSingle filers\tMarried couples filing jointly\tMarried couples filing separately\tHead of household',
    '10%\t$12,000 or less\t$24,000 or less\t$12,000 or less\t$17,000 or less',
    '22%\t$12,001 to $105,000\t$24,001 to $211,000\t$12,001 to $105,000\t$17,001 to $105,000',
    '35%\t$105,001 to $640,000\t$211,001 to $768,000\t$105,001 to $384,000\t$105,001 to $640,000',
    '37%\tOver $640,000\tOver $768,000\tOver $384,000\tOver $640,000'].join('\n');

  eq(edges('joint'), [24000, 211000, 768000, null]);
  eq(edges('separate'), [12000, 105000, 384000, null],
    'the column that differs only at the end is still read as its own');
  eq(H.parseBrackets(wide, 'single').bands.map(b => b.rate), [0.1, 0.22, 0.35, 0.37]);

group('Tax reaches the projection');

t('with no tables the drawing half is what it always was, to the cent', () => {
  /* The sibling of the accumulation guard, and the same discipline: the old
     formula is recomputed here rather than quoted. */
  const s = potFixture();
  const rows = H.drawdownYears(s, RET_FIX, 25);
  for (const r of rows) {
    eq(r.want, Math.max(0, H.round2(r.spend - r.income)), `${r.y} want`);
    eq(r.draw, Math.min(r.want, Math.max(0, H.round2(r.open + r.growth + r.contrib))),
      `${r.y} draw`);
    eq(r.short, H.round2(r.want - r.draw), `${r.y} short`);
    eq(r.close, H.round2(r.open + r.growth + r.contrib - r.draw), `${r.y} close`);
    eq(r.tax, 0, `${r.y} pays no tax`);
    eq(r.taxable, 0, `${r.y} has nothing taxable`);
  }
});

/* A pot half pre-tax and half Roth, with a federal table from 2026. */
function taxedPotFixture(over) {
  return potFixture(Object.assign({
    side: {
      retirementAccounts: [{ name: '401(k)', type: '401k-mixed', amount: 1000000,
        contribs: {}, buckets: [
          { label: 'Pre-tax', kind: 'traditional', amount: 500000 },
          { label: 'Roth', kind: 'roth', amount: 500000 }] }],
      drawdown: { spend: 40000, income: [] },
      tax: { federal: { '2026': { single: T10_30 } }, state: {} },
    },
  }, over || {}));
}

t('a table makes the withdrawal bigger than the spending target', () => {
  const plain = H.drawdownYears(potFixture({ side: {
    retirementAccounts: [{ name: '401(k)', type: '401k-mixed', amount: 1000000,
      contribs: {}, buckets: [{ label: 'Pre-tax', kind: 'traditional', amount: 500000 },
                              { label: 'Roth', kind: 'roth', amount: 500000 }] }],
    drawdown: { spend: 40000, income: [] } } }), RET_FIX, 25);
  const taxed = H.drawdownYears(taxedPotFixture(), RET_FIX, 25);
  const p = plain.find(r => r.phase === 'drawing');
  const t = taxed.find(r => r.phase === 'drawing');
  eq(p.draw, p.spend, 'without a table the draw is the target');
  ok(t.draw > t.spend, 'with one, more has to come out');
  ok(t.tax > 0, 'and the year owes something');
  /* What is left is what was planned to be spent — met and never missed. The
     draw is rounded UP to the cent deliberately, so it may land a penny over;
     landing under is the failure this is here to catch. */
  const left = H.round2(t.draw - t.tax);
  ok(left >= t.spend && left <= t.spend + 0.01,
    `left ${left} covers the ${t.spend} target without overshooting`);
});

t('the taxable share is the pot’s own mix, and the draw does not change it', () => {
  /* Drawing pro rata takes the same proportion from every pot, so the ratio is
     exactly where it started — which is the strongest argument against ever
     making this a withdrawal-order strategy. */
  const rows = H.drawdownYears(taxedPotFixture(), RET_FIX, 25);
  const drawing = rows.filter(r => r.phase === 'drawing');

t('converting a grid to a summary keeps the flows the Progress charts read', () => {
  const s = H.coerceShape(fixtureState());
  const yr = s.years['2030'];
  const flows = (obj) => {
    let inn = 0, out = 0;
    if (obj.kind === 'summary') {
      for (const i of obj.categoryTotals) {
        if (i.isBalance) continue;
        if (i.total > 0) inn += i.total; else out += i.total;
      }
    } else {
      for (const [k, cell] of Object.entries(obj.cells)) {
        if (!k.split('|')[1].startsWith('2030')) continue;
        if (cell.v > 0) inn += cell.v; else out += cell.v;
      }
    }
    return [H.round2(inn), H.round2(Math.abs(out))];
  };
  const before = flows(yr);
  const summary = H.gridToSummary(s, '2030');
  eq(summary.kind, 'summary');
  eq(flows(summary), before, 'money in and out are unchanged');
});

/* Marking a year as history: the step between a live grid and the pinned ones
   the spreadsheet import produced. A frozen year is only honest if every
   figure survives the change, so most of these compare the year with itself. */

/* The fixture's live year, entered right through, which is the only state the
   button is offered in — an unentered month still holds auto estimates, and a
   pinned year computes none. */
function enteredFixture() {
  const s = H.coerceShape(fixtureState());
  s.years['2030'].enteredThrough = '2030-06';
  return s;
}

t('freezing a year states exactly the balances it computed', () => {
  const s = enteredFixture();
  const before = H.computeAll(s, TODAY_FIX)['2030'];
  s.years['2030'] = H.gridToPinned(s, before, '2030');
  const after = H.computeAll(s, TODAY_FIX)['2030'];
  eq(s.years['2030'].model, 'pinned');
  eq(Object.keys(after.balances).sort(), Object.keys(before.balances).sort(),
    'every account keeps a figure in every month it had one');
  eq(Object.entries(after.balances).filter(([k, v]) => before.balances[k] !== v), [],
    'and not one of them moved');
  eq([...new Set(Object.values(after.balanceKinds))], ['pinned'],
    'a frozen year states them all');
});

t('a balance stated by hand is left alone, and comes back on re-opening', () => {
  const s = enteredFixture();

  s.years['2030'] = H.gridToPinned(s, H.computeAll(s, TODAY_FIX)['2030'], '2030');
  eq(s.years['2030'].overrides['cash|2030-04'].v, 12345,
    'the figure the reader stated, not the one the chain would have computed');
  eq(s.years['2030'].pinnedFrom.overrides, stated, 'and it is what re-opening restores');
  s.years['2030'] = H.pinnedToLive(s, '2030');
  eq(s.years['2030'].model, 'live');
  eq(s.years['2030'].overrides, stated, 'the freeze\'s own statements are gone');
  eq(s.years['2030'].enteredThrough, '2030-06');
  eq('pinnedFrom' in s.years['2030'], false, 'and the marker with them');
});

  eq(H.coerceTaxBands('10%'), []);
  eq(H.coerceTaxBands(undefined), []);
  eq(H.coerceTaxBands([[{ upTo: null, rate: 0.1 }]]), [], 'nor an array of arrays');
});

t('a band edge is read strictly, never through num()', () => {
  /* num() turns what it cannot read into 0 — right for an amount, a disaster
     for a band edge, because a 0 top edge is a band that taxes nothing and it
     looks exactly like a figure somebody typed. Same trap as account.rate and
     an income row's `from`. */
  eq(H.coerceTaxBands([{ upTo: 'twenty thousand', rate: 0.1 },
                       { upTo: null, rate: 0.2 }]),
     [{ upTo: null, rate: 0.2 }], 'the unreadable band is dropped, not zeroed');
  eq(H.coerceTaxBands([{ upTo: '10000', rate: 0.1 }, { upTo: null, rate: 0.2 }]),
     [{ upTo: 10000, rate: 0.1 }, { upTo: null, rate: 0.2 }],
     'a plainly numeric string is still a number');
  eq(H.coerceTaxBands([{ upTo: 10000 }]), [], 'a band with no rate is not a band');
  eq(H.coerceTaxBands([{ upTo: 10000, rate: 'x' }]), []);
  eq(H.coerceTaxBands([{ rate: 0.2 }]), [{ upTo: null, rate: 0.2 }],
     'an absent edge IS the open top band');
});

t('the open band is null, never Infinity', () => {
  /* Infinity round-trips to null through JSON anyway, so storing it would mean
     two spellings of one idea and only one of them surviving a backup. */
  const [b] = H.coerceTaxBands([{ upTo: Infinity, rate: 0.3 }]);
  eq(b, { upTo: null, rate: 0.3 });

     [{ upTo: null, rate: 0.3 }], 'and it survives the trip');
});

t('a rate is clamped to 0–1, which is the gross-up solver’s precondition', () => {
  /* Not tidiness. The bisection relies on net'(G) = 1 − m·tradShare staying
     ≥ 0, which holds only while every marginal rate does; a hand-edited 500%
     would hand it a function that runs backwards and it would converge on
     nonsense rather than fail. */
  eq(H.coerceTaxBands([{ upTo: 10000, rate: 5 }, { upTo: null, rate: -0.2 }]),
     [{ upTo: 10000, rate: 1 }, { upTo: null, rate: 0 }]);
  for (const b of H.coerceTaxBands([{ upTo: 1000, rate: 99 }, { upTo: null, rate: 3 }]))
    ok(b.rate >= 0 && b.rate <= 1, 'every stored rate is a fraction of a dollar');
});

t('bands are sorted, de-overlapped, and the open band ends the table', () => {

  eq(H.coerceTaxBands([{ upTo: null, rate: 0.3 }, { upTo: null, rate: 0.4 }]),

  eq(H.coerceTaxBands([{ upTo: -5000, rate: 0.1 }, { upTo: null, rate: 0.2 }]),

   link" is a question with a real answer. Invented figures and invented names,
   like every other fixture here. */

  const mkYear = (y) => ({
    kind: 'grid', model: 'live', startMonth: y + '-01', monthCount: 12,

    balAdjust: {}, extraNotes: [{ where: y + '!Sheet', note: 'Imported note' }],

    schema: 4,

                currency: 'USD', ptoAllowance: 30 },
    years: { '2020': mkYear('2020'), '2024': mkYear('2024'),
             '2025': mkYear('2025'), '2026': mkYear('2026') },
    goals: [{ id: 'g1', name: 'Emergency fund', target: 10000, accounts: ['cash'],
              count: 'capped', note: 'Goal note' }],

             { id: 'p2', name: 'Robin', role: 'adult', birth: '1988-09' },
             { id: 'p3', name: 'Ellis', role: 'child', birth: '2017-03' }],
    side: { portfolios: [{ id: 'pf', name: 'Brokerage',
                           rows: [{ ticker: 'AAA', shares: 10, price: 100 }] }],
            taxable: [], rothContribs: {}, k401: {}, hsa: [],
            comp: { '2020': { salary: 80000 }, '2025': { salary: 100000 },
                    '2026': { salary: 105000 } },
            bonuses: { '2020': 4000, '2026': 6000 },
            daf: [], donations: { '2020': [{ foundation: 'Old', cash: 100 }],
                                  '2026': [{ foundation: 'New', cash: 200 }] },
            limits: { '2026': {} },
            retirementAccounts: [{ name: '401(k)', kind: 'traditional', type: '401k',
              owner: 'p1', amount: 1000, contribs: { '2020': 15000, '2026': 20000 } }],
            /* Invented rates on round thousands, never a real bracket — a
               realistic-looking figure in a fixture is a shipped figure
               somebody will copy out of here one day. */
            tax: { federal: { '2020': { single: { bands: [{ upTo: 10000, rate: 0.10 },
                                                          { upTo: null, rate: 0.20 }],
                                                  deduction: 5000 } },
                              '2026': { single: { bands: [{ upTo: 20000, rate: 0.10 },
                                                          { upTo: null, rate: 0.30 }],
                                                  deduction: 10000 } } },
                   state: { '2026': { single: { bands: [{ upTo: null, rate: 0.05 }] } } } } },
    vacations: { trips: [{ id: 't0', name: 'Old', year: '2020', nights: 3, cost: 500,
                           note: 'Trip note' },
                         { id: 't1', name: 'Soon', year: '2026', nights: 4, cost: 900 },

t('every tab says what it reads, and every branch says whose it is', () => {
  /* The tables are the whole privacy model: a tab with no entry ships an empty
     card, and a branch with no owner travels without the dialog ever naming it. */
  for (const v of H.VIEWS) {
    ok(Array.isArray(H.SECTION_NEEDS[v]) && H.SECTION_NEEDS[v].length,
      v + ' has no SECTION_NEEDS entry');
    ok(H.SECTION_NEEDS[v].some(b => (H.BRANCH_OWNERS[b] || []).includes(v)),
      v + ' owns none of the branches it reads, so it can never be found to have data');
  }
  const branches = new Set();
  for (const v of H.VIEWS) for (const b of H.SECTION_NEEDS[v]) branches.add(b);
  for (const b of branches) {
    ok((H.BRANCH_OWNERS[b] || []).length, b + ' has no owning tab');
    ok(H.BRANCH_LABEL[b], b + ' has no label to name it with in the dialog');
    for (const o of H.BRANCH_OWNERS[b])
      ok(H.VIEWS.includes(o), b + ' is owned by ' + o + ', which is not a tab');
  }
});

t('a bracket table is an assumption, so the window treats it differently', () => {
  /* Two rules, and both are about the recipient's FIGURES rather than the
     length of their link. Getting either wrong hands somebody a retirement
     that quietly pays no tax. */
  const s = shareFixture();

  /* 1. The CEILING does not apply. A table dated past the newest started year
        is a projection assumption, exactly like the assumed return. */
  s.side.tax.federal['2028'] = { single: { bands: [{ upTo: null, rate: 0.40 }] } };
  const ahead = H.trimShareYearMaps(JSON.parse(JSON.stringify(s)), null, '2026');
  eq(Object.keys(ahead.side.tax.federal).sort(), ['2020', '2026', '2028'],
    'the ceiling holds back the projections, never the tables they are computed with');
  eq(Object.keys(ahead.side.limits), ['2026'], 'while the ceiling still bites elsewhere');

  /* 2. The NEWEST table always travels, whatever the cutoff. Somebody whose
        only table is dated 2020 and who sends "the last 1 year" must not hand
        over a plan with no table in it at all. */
  const old = { federal: { '2018': { single: { bands: [{ upTo: null, rate: 0.10 }] } },
                           '2020': { single: { bands: [{ upTo: null, rate: 0.20 }] } } } };
  eq(Object.keys(H.trimTaxYearMap(old.federal, '2026')), ['2020'],
    'nothing survives the cutoff, so the newest is kept anyway');
  eq(Object.keys(H.trimTaxYearMap(old.federal, '2019')), ['2020'],
    'a superseded table below the cutoff is dropped');
  eq(H.trimTaxYearMap(undefined, '2025'), {});
  eq(H.trimTaxYearMap({}, '2025'), {}, 'no tables is not the same as one to rescue');
});

/* The fixture's 2026 is entered right through December, which would make a 2027
   grid the live year — so a genuinely-not-yet-arrived year needs the marker
   pulled back first. That IS the rule being tested, so it is set out here rather
   than buried in each case. */
function fixtureWithYearAhead(enteredThrough) {
  const s = shareFixture();
  s.years['2026'].enteredThrough = enteredThrough || '2026-06';
  s.years['2027'] = { kind: 'grid', model: 'live', startMonth: '2027-01', monthCount: 12,
    enteredThrough: '', categories: [{ id: 'pay', name: 'Paycheck', rule: 'carry',
      role: 'normal', section: 'income' }], cells: {}, paychecks: {},
    seeds: { cash: 9000 }, overrides: {}, balAdjust: {}, extraNotes: [] };
  s.side.comp['2027'] = { salary: 110000 };
  s.side.retirementAccounts[0].contribs['2027'] = 21000;
  s.vacations.pto['2027'] = { used: 0 };
  return s;
}

t('a year you have built ahead is a projection, and stays out unless asked for', () => {
  const s = fixtureWithYearAhead();
  const today = '2026-08-12';
  eq(H.yearStarted(s, '2027', today), false, 'the fixture really has a year not yet arrived');
  eq(H.shareCeilingYear(s, false, today), '2026', 'the newest year that has actually begun');
  eq(H.shareCeilingYear(s, true, today), null, 'ticking the box lifts the ceiling entirely');
  eq(H.shareFutureYears(s, H.shareCeilingYear(s, false, today)), ['2027']);
  eq(H.shareFutureYears(s, null), [], 'nothing is held back when nothing is capped');
});

t('a year that has taken over is record, not a projection', () => {

});

t('the ceiling reaches every year-keyed table, same as the cutoff', () => {
  const s = fixtureWithYearAhead();
  eq(H.keepShareYear('2027', null, '2026'), false, 'newer than the ceiling');
  eq(H.keepShareYear('2026', null, '2026'), true, 'the ceiling year itself is kept');
  eq(H.keepShareYear('2027', null, null), true, 'no ceiling keeps everything');
  eq(H.keepShareYear('2023', '2024', '2026'), false, 'both ends still apply at once');
  const d = H.trimShareYearMaps(JSON.parse(JSON.stringify(s)), null, '2026');
  eq(Object.keys(d.side.comp), ['2020', '2025', '2026']);
  eq(Object.keys(d.side.retirementAccounts[0].contribs), ['2020', '2026']);
  eq(Object.keys(d.vacations.pto), ['2020', '2026']);
  eq(d.vacations.trips.map(t => t.name), ['Old', 'Soon', 'No year'],

t('the history window is measured to the newest year that has begun', () => {

t('a projection never travels without the year it is built on', () => {
  /* The bug this pins, and it made a link WORTHLESS rather than merely short: a
     year built ahead has no cells of its own — every month of it is derived from
     the year before through priorYearRun. Counting it as part of the window
     handed over a 2027 grid with 2026 cut away, and every carry, quarterly and
     average rule in it read blank. The window is history; the projections ride
     on top of it. */
  const s = fixtureWithYearAhead();
  const started = H.shareStartedYear(s, '2026-08-12');
  for (const n of [1, 2, 3]) {
    const cut = H.shareCutoffYear(s, { kind: 'year', n }, started);
    const kept = Object.keys(H.trimShareYearMap(s.years, cut, null)).sort();
    ok(kept.includes('2027'), 'projections are in when the box is ticked');
    ok(kept.includes('2026'),
      'n=' + n + ' dropped the year the 2027 plan is built on: ' + kept.join(','));
  }
  /* And the narrowest window is exactly those two — no accidental widening. */
  const cut1 = H.shareCutoffYear(s, { kind: 'year', n: 1 }, started);
  eq(Object.keys(H.trimShareYearMap(s.years, cut1, null)).sort(), ['2026', '2027']);
});

t('a tab with nothing of its own in it is not worth sending', () => {
  const s = shareFixture();
  for (const v of H.VIEWS) ok(H.sectionHasData(s, v), v + ' should have fixture data');
  /* coerceShape's own output, not a bare {}: it migrates the old fixed taxable
     and HSA lists into two NAMED but empty investment panes, so an empty plan
     arrives with a two-entry side.portfolios. Offering Investments to someone
     who has never recorded a holding is exactly the bug this pins. */
  const bare = H.coerceShape({});
  ok(H.coerceShape({}).side.portfolios.length, 'the migration really does make panes');
  for (const v of H.VIEWS) eq(H.sectionHasData(bare, v), false, v + ' on an empty plan');
  const onePane = H.coerceShape({});
  onePane.side.portfolios[0].rows = [{ ticker: 'AAA', shares: 1, price: 2 }];
  eq(H.sectionHasData(onePane, 'investments'), true, 'one holding is enough');
  /* Goals reads the budget grid, but a grid with no goals is still an empty
     Goals tab — a tab is judged on its OWN branches. */
  const noGoals = shareFixture(); noGoals.goals = [];
  eq(H.sectionHasData(noGoals, 'budget'), true);
  eq(H.sectionHasData(noGoals, 'goals'), false);
  /* A drawdown plan is Retirement's own data — somebody who has typed a

t('the cache is state, so it syncs', () => {
  /* It moved out of localStorage on 2026-08-17 for exactly one reason: the
     six-hour clock is a fact about the QUOTE, and the quote is the same on
     every device. Left local, the laptop fetched a price, the phone received
     the price (holdings are state) but not its timestamp, judged everything
     stale and spent the allowance fetching it all again. */
  eq(H.blankState().hasOwnProperty('quotes'), true, 'a fresh plan has the branch');
  eq(H.blankState().quotes, {}, 'and it starts empty');
  eq(H.coerceShape({}).quotes, {}, 'a plan that predates it gets one');
});

t('a cache entry is read strictly at the boundary', () => {
  const now = Date.now();
  /* A PRICE never goes through num(): a corrupt field turned into a
     deliberate-looking 0 is copied straight onto a holding by the write-back
     in refreshPrices, and a $0 holding is a wrong figure that looks real. */
  eq(H.coerceQuotes({ VOO: { price: 'junk', ts: now } }), {}, 'junk drops, never becomes $0');
  eq(H.coerceQuotes({ VOO: { price: 0, ts: now } }), { VOO: { price: 0, ts: now } },
    'but a real 0 is a real statement and is kept');
  eq(H.coerceQuotes({ VOO: { price: 12.5 } }), {},
    'no timestamp means no clock to measure, so the entry goes');
  eq(H.coerceQuotes({ VOO: { noQuote: true, ts: now } }), { VOO: { noQuote: true, ts: now } });
  eq(H.coerceQuotes({ VOO: { noQuote: true, price: 9, ts: now } }),
    { VOO: { noQuote: true, ts: now } },
    'a marker carries no price — "no quote for this" is not "it is worth 9"');
  eq(H.coerceQuotes({ voo: { price: 3, ts: now } }), { VOO: { price: 3, ts: now } },
    'keys are upper-cased to match what allTickers hands in');
  eq(H.coerceQuotes(null), {});
  eq(H.coerceQuotes([{ price: 1, ts: now }]), {}, 'an array is not a cache');
});

t('a clock from the future is not trusted', () => {
  /* The one field where another device's clock reaches ours. A badly-set one
     could otherwise pin a price as "fresh" for years, because freshWithin
     measures now - ts and a future stamp makes that negative. An hour of slack
     absorbs ordinary skew between two NTP-synced machines. */
  const soon = Date.now() + 5 * 60 * 1000;
  const far = Date.now() + 48 * 60 * 60 * 1000;
  eq(Object.keys(H.coerceQuotes({ VOO: { price: 1, ts: soon } })), ['VOO'],
    'ordinary skew is fine');
  eq(H.coerceQuotes({ VOO: { price: 1, ts: far } }), {}, 'a year-out clock is not');
});

t('the cache is a top-level key, which is what keeps it out of a share link', () => {
  /* buildSharePayload reads the global `state`, so it can't be called from here
     without the ambient-state trap this suite exists to avoid. What IS pinnable
     is the placement the guarantee rests on: that function assembles its payload
     from a WHITELIST of top-level keys, so anything top-level and unlisted
     cannot travel — whereas `settings` travels in full, and a cache tidied in
     there would start shipping the tickers somebody holds inside a Budget-only
     link. This fails the day it moves. */
  eq(Object.keys(H.blankState()).includes('quotes'), true, 'top level');
  eq(H.blankState().settings.hasOwnProperty('quotes'), false, 'and never a setting');
  eq(H.blankState().side.hasOwnProperty('quotes'), false,
    'nor a side branch — those are tab data, gated by SECTION_NEEDS');
});

t('a link that is not a link is refused rather than half-opened', async () => {
  const refuses = async (token, why) => {

    catch (e) { ok(!/^accepted /.test(e.message), e.message); }
  };
  await refuses('nomarker', 'a token with no format marker');
  await refuses('.abc', 'an empty marker');
  await refuses('9.abc', 'an unknown format');
  await refuses('0.' + btoa('{"nope":1}'), 'JSON that is not a payload');
  await refuses('0.' + btoa('{"sections":[],"data":{}}'), 'a payload with no tabs');

t('a link from a newer build is refused, and marked as such', async () => {
  /* buildSharePayload stamps v: SHARE_PAYLOAD_V; a higher one means a newer
     build wrote the link, and whatever that build added would be silently
     missing from a view this build drew. decodeShare refuses with
     err.newerVersion set BEFORE the shape check (a newer build may well have
     changed the shape), so the error screen can say "reload for the current
     version" instead of blaming the mail app for cutting a perfectly intact
     link in half — the Sprint Velocity pattern, mirrored. */
  const newer = { v: H.SHARE_PAYLOAD_V + 1, sections: ['budget'], data: shareFixture() };
  try {
    await H.decodeShare(await H.encodeShare(newer));
    throw new Error('accepted a payload from a newer build');
  } catch (e) {
    ok(e.newerVersion === true,
      'expected the marked newerVersion refusal, got: ' + e.message);
  }
  const same = { v: H.SHARE_PAYLOAD_V, sections: ['budget'], data: shareFixture() };
  const back = await H.decodeShare(await H.encodeShare(same));
  eq(back.sections, ['budget'], 'the current version still opens');
});

/* ── Overflow sweep rows ──────────────────────────────────────────────────────

   above a threshold — after interest, in dependency order, blank under the
   threshold. Three accounts, whole dollars, no rates unless a test sets one,
   so every landing can be asserted to the cent. Every test builds its own

group('Overflow sweep rows');

function overflowFixture() {

    schema: 5,

      { id: 'cash', name: 'Cash', rate: 0, creditTo: 'cash', hub: true },

      enteredThrough: '2025-12',

        { id: 'pay', name: 'Paycheck', role: 'normal', rule: 'none', section: 'income' },
        { id: 'tomid', name: 'To Mid-term', rule: 'overflow', role: 'normal',

          threshold: 15000 },
      ],
      cells: { 'pay|2026-01': { v: 894, kind: 'manual' } },
      paychecks: {}, seeds: { cash: 17000, mid: 10000, long: 0 },
      overrides: {}, balAdjust: {},
    } },
    goals: [], people: [], side: {}, vacations: { trips: [], pto: {} }, ui: {},
  };
}
const computeOverflow = (s) => H.computeAll(H.coerceShape(s), '2026-01-15');

t('sweeps exactly the excess and the source lands on the threshold to the cent', () => {

  approx(c.balances['cash|2026-01'], 15000, 'cash lands exactly on the threshold');
  approx(c.balances['mid|2026-01'], 12894, 'the destination receives exactly the spillover');

/* ── Local-only real-data cross-check ─────────────────────────────────────────
   Fetches the two gitignored import files. On this Mac, with a fresh import
   run, it diffs the JS engine against the spreadsheet's own cached values.
   Anywhere else (CI, the public site) the fetch 404s and the group SKIPS —
   green, because absence is the expected state there. */
group('Real data (local only)');
t('engine matches the spreadsheet where the import files exist', () => {
  if (!window.__realData) { return; }   // resolved before run() below
  const { data, expected } = window.__realData;
  const st = H.coerceShape(data);
  const computed = H.computeAll(st, new Date().toISOString().slice(0, 10));
  const liveKey = Object.keys(computed).sort().pop();
  const c = computed[liveKey];
  const bad = [];
  /* Only the live year's own months are pinned against the sheet. The grid
     runs a year past that as a PROJECTION now — the spreadsheet had those
     months typed in by hand, the app works them out from the rules, and the
     two are not meant to agree. */
  const ownYear = (key) => key.split('|')[1].startsWith(liveKey);
  /* Accounts that start partway through the year (money that used to sit in
     the "other money" list, outside the plan's arithmetic) join Total from
     their start month. The sheet's own SUM covers the original four accounts
     only, so from that month on the two totals are measuring different things
     — deliberately. Every individual account is still pinned. */
  const core = new Set(['cash', 'mid', 'long', 'bank']);
  const joined = Object.keys(st.years[liveKey].overrides || {})
    .filter(k => !core.has(k.split('|')[0]))
    .map(k => k.split('|')[1]).sort()[0];
  const skip = (key) => {
    const [id, m] = key.split('|');
    return id === 'total' && joined && m >= joined;
  };
  for (const [key, exp] of Object.entries(expected.cells)) {
    if (!ownYear(key)) continue;
    const got = c.cells[key];
    if (!got || Math.abs(got.v - exp.v) > 0.01)
      bad.push(`${key}: engine ${got ? got.v : 'missing'} vs sheet ${exp.v} (=${exp.f})`);
  }
  for (const [key, exp] of Object.entries(expected.balances)) {
    if (!ownYear(key) || skip(key)) continue;
    const got = c.balances[key];
    if (got === undefined || Math.abs(got - exp.v) > 1)
      bad.push(`${key}: engine ${got} vs sheet ${exp.v} (=${exp.f})`);
  }
  if (bad.length) throw new Error(bad.slice(0, 8).join('\n') +
    (bad.length > 8 ? `\n…and ${bad.length - 8} more` : ''));
});

/* ── Offline: the service worker ────────────────────────────────────────────
   These read sw.js as TEXT rather than exercising a live worker, and that is
   the point rather than a shortcut. The suite runs the app in a hidden iframe
   and the registration is frame-guarded, so there is no worker here to poke —
   deliberately, because a suite that installed one would start testing whatever
   code that worker had cached instead of the files on disk.

   What is worth asserting is therefore the SHAPE of the thing: that its cache
   list is only ever public files, and that it stays small and same-origin.
   Cache Storage is origin-wide, shared with Sprint Velocity and Flow Metrics,
   so "nothing private is ever cached" is the single promise holding that up. */
group('Offline — the service worker');

let SW_SRC = null, KILL_SRC = null, APP_SRC = null;
/* Loop until the source stops changing. A SINGLE pass is fooled by a comment
   that opens a second comment inside itself: one sweep closes at the first
   terminator and leaves the inner opener live. A helper that can be wrong about
   what is commented out is one that can miss a live off-origin script — which is
   the whole reason these suites read the source at all.
   (Written without quoting the character pair it is about, for the obvious
   reason: an earlier draft of this very comment embedded one and ended itself
   four lines early, turning its own remaining prose into live code.) */
const stripComments = (s) => {
  let out = s, prev;
  do { prev = out; out = out.replace(/\/\*[\s\S]*?\*\//g, '').replace(/^\s*\/\/.*$/gm, ''); }
  while (out !== prev);
  return out;
};

t('package.json and the vendored bundle name the SAME Chart.js', async () => {
  /* The manifest exists only so Dependabot has something to scan — nothing is
     ever installed from it (CI passes --omit=dev), and the bytes that ship are
     chart.min.js in this repo. That creates one specific way to end up lying:
     Dependabot cannot re-vendor a file, so a version-bump PR would raise the
     manifest to 4.5.0 while the app went on serving 4.4.1.

     This is what stops that being quiet. A manifest-only bump fails here, which
     turns the PR into the correct instruction — "a newer Chart.js exists, now
     update the FILE too, in all four repos that carry it" — rather than a
     false record. Same discipline as the theme pack's gate: a generated
     artefact has to match its source. */
  const [pkgRes, libRes] = await Promise.all([bustFetch('package.json'), bustFetch('chart.min.js')]);
  ok(pkgRes.ok, 'package.json is missing — Dependabot then scans nothing at all');
  ok(libRes.ok, 'chart.min.js is missing');
  const PKG = await pkgRes.text(), LIB = await libRes.text();
  const pinned = (PKG.match(/"chart\.js"\s*:\s*"([^"]+)"/) || [])[1];
  ok(pinned, 'package.json must declare chart.js');
  ok(/^\d+\.\d+\.\d+$/.test(pinned),
     'pin it exactly — a ^ or ~ range cannot be checked against a vendored file: ' + pinned);
  ok(LIB.includes('"' + pinned + '"'),
     'chart.min.js is not ' + pinned + ' — if this followed a Dependabot bump, the file '
     + 'still has to be re-vendored, and the sibling repos with it');
  const pkg = JSON.parse(PKG);
  eq(pkg.private, true, 'private:true, so it can never reach npm by accident');
  ok(!pkg.scripts, 'no scripts — this repo has no build step and must not grow one');
  ok(!pkg.dependencies, "the entry belongs in devDependencies, which CI's --omit=dev skips");
  ok(pkg.devDependencies && Object.keys(pkg.devDependencies).length === 2,
     'two entries: the vendored library, and the Firebase SDK the page loads by URL');
});

/* ── The tile rows ──────────────────────────────────────────────────────────
   A `.goalgrid` fills ONE line when the line has room for every tile, and
   splits into EQUAL rows when it does not — a full row with a lone tile under
   it, or a last row that stops halfway, is the shape being designed out. The
   same block is in Sprint Predictability, Flow Metrics and the starter, each
   against its own minimum tile, so this test reads alike in all four. */
t('every tile row fits the tiles it promises, and none strands a lone tile', () => {
  ok(APP_SRC, 'index.html was not read — the fetch test above must run first');
  /* Walks the container queries in the order the cascade does, keeping each
     tile count's state as it goes, and checks the promise at every width:
     the columns fit at the tile floor, no row holds a single tile, and a
     short last row is STRETCHED to finish the line rather than leaving a
     hole. The floor and the gap are read back out of the app, so raising
     either fails here instead of quietly making a row too tight. */
  {
    const CSS = APP_SRC;
    const f = CSS.match(/\.goalgrid \{ display: grid; gap: (\d+)px;[^}]*minmax\((\d+)px/);
    ok(f, 'the auto-fit fallback still states a gap and a smallest tile');
    const GAP = f ? +f[1] : 0, MIN = f ? +f[2] : 0;
    const blocks = [...CSS.matchAll(/@container tiles \(min-width: (\d+)px\) \{([\s\S]*?)\n\}/g)];
    ok(blocks.length >= 5, 'the container queries are there — ' + blocks.length + ' of them');
    const st = {};
    let checked = 0;
    for (const [, atStr, body] of blocks) {
      const at = +atStr;
      for (const chunk of body.split('}')) {
        if (chunk.indexOf('grid-') < 0) continue;
        const targets = [...chunk.matchAll(/:nth-child\((\d+)\):last-child\)(\s*>\s*(?:\*|:nth-child\(n\+(\d+)\)))?/g)];
        ok(targets.length > 0, 'every rule says which tile counts it answers');
        const tracksM = chunk.match(/grid-template-columns: (?:repeat\((\d+),|minmax)/);
        const colM = chunk.match(/grid-column: (?:span (\d+)|(auto))/);
        for (const t of targets) {
          const n = +t[1], k = t[3] ? +t[3] : null;
          const s = st[n] || (st[n] = { tracks: 1, full: 1, last: null, first: null });
          if (tracksM) s.tracks = tracksM[1] ? +tracksM[1] : 1;
          else if (colM && k) { s.last = colM[2] ? null : +colM[1]; s.first = colM[2] ? null : k; }
          else if (colM && t[2]) s.full = colM[2] ? 1 : +colM[1];
        }
      }
      for (const key of Object.keys(st)) {
        const n = +key, s = st[n], c = s.tracks / s.full;
        ok(Number.isInteger(c) && c >= 1,
           n + ' tiles: ' + s.tracks + ' tracks do not divide by a span of ' + s.full);
        ok(c * MIN + (c - 1) * GAP <= at,
           c + ' columns need ' + (c * MIN + (c - 1) * GAP) + 'px of tiles and gaps, and the '
           + 'query lets them in at ' + at + 'px');
        ok(n >= c, n + ' tiles can never fill ' + c + ' columns');
        ok(c === 1 || n % c !== 1,
           n + ' tiles across ' + c + ' columns leaves one tile alone on the last row');
        const rows = Math.ceil(n / c), lastRow = n - c * (rows - 1);
        if (lastRow === c) {
          ok(!s.last, n + ' tiles fill every row at ' + c + ' across, so nothing may be stretched');
        } else {
          ok(s.last && lastRow * s.last === s.tracks,
             n + ' tiles at ' + c + ' across leave ' + lastRow + ' on the last row, which must be '
             + 'stretched to finish the line rather than leaving a hole');
          ok(s.first === c * (rows - 1) + 1,
             'and the stretch starts at the first tile of that row');
        }
        checked++;
      }
    }
    ok(Object.keys(st).length >= 7, 'every tile count from two to eight is answered');
    ok(checked >= 40, 'and each one is checked at every width above the one it changes at');
    ok(/:has\(> \.goalgrid\) \{ container: tiles \/ inline-size; \}/.test(CSS),
       "the row's own parent is the named container — without it every query above "
       + 'matches nothing and the counts silently stop applying');
  }
});

/* ── The info dots ───────────────────────────────────────────────────────────
   Every "i" beside a figure opens the SAME dialog, and its words are looked up
   in the HELP table by key. Nothing on screen can report a key with no entry:
   the dot is drawn from the key, not from the text, so it renders and opens as
   usual — on a heading-less box with a Got It button and nothing to have got.
   The two halves are therefore pinned against each other here, in both
   directions, since the table's own note says an entry nothing renders is not
   help but a second copy waiting to drift. */
t('every info dot has words behind it', () => {
  ok(APP_SRC, 'index.html was not read — the fetch test above must run first');
  ok(H.HELP, 'the HELP table is not reaching the harness');
  /* Keys come from the source rather than the page: most dots sit on tabs this
     suite never renders, and one that is only drawn for a plan with an overflow
     row would be missed by anything that reads the DOM. */
  /* TWO call sites now. Most dots are written straight into markup as
     helpBtn('key', …); a row editor field asks for one by putting the key in
     its spec, and buildFields calls helpBtn with the variable. A scan that
     only knew the first shape would have reported `rowDue` as an entry nothing
     renders — which is the failure this test exists to catch, arriving as a
     false one. */
  const used = [...new Set([...stripComments(APP_SRC)
    .matchAll(/helpBtn\('(\w+)'|\bhelp: '(\w+)'/g)].map(m => m[1] || m[2]))];
  ok(used.length > 20, 'the scan found the dots at all — it matched ' + used.length + ' keys');
  eq(used.filter(k => !H.HELP[k]).join(', '), '',
    'every dot has an entry to open — a key with none opens an empty sheet');
  eq(Object.keys(H.HELP).filter(k => !used.includes(k)).join(', '), '',
    'and no entry sits unrendered, which is a second copy of an explanation waiting to drift');
});
