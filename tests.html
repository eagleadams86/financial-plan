/* ── What is stacking up behind a held row ───────────────────────────────── */
const AT = (map) => (m) => ({ has: !Object.prototype.hasOwnProperty.call(map, m)
  || map[m] !== 'absent', cell: map[m] && map[m] !== 'absent' ? map[m] : null });

t('unpaid periods are counted across a year boundary', () => {
  const months = ['2025-10', '2025-11', '2025-12', '2026-01', '2026-02', '2026-03',
                  '2026-04', '2026-05'];
  const out = H.outstandingDues(DUE_ROW(), months,
    AT({ '2025-10': CELL('actual') }), '2026-06-01');
  eq(out.count, 2, 'January and April, both past and neither an actual');
  eq(out.months, ['2026-01', '2026-04']);
});
t('a period that was never billed is estimated from what it last came to', () => {
  const months = ['2025-10', '2026-01', '2026-04'];
  const out = H.outstandingDues(DUE_ROW(), months,
    AT({ '2025-10': CELL('actual', -92) }), '2026-06-01');
  eq(out.count, 2);
  eq(out.total, -184, 'two blanks at the last real figure');
  eq(out.estimated, true, 'and it says the figure is a stand-in, not a total');
});
t('with nothing ever recorded the amount is NULL, never $0.00', () => {
  /* A missing denominator is never zero here. Summing blank months gives 0,
     which is a FIGURE and would be read as "nothing is owed". */
  const out = H.outstandingDues(DUE_ROW(), ['2026-01', '2026-04'], AT({}), '2026-06-01');
  eq(out.count, 2);
  eq(out.total, null);
  eq(out.estimated, true);
});
t('a month whose grid does not carry the row is skipped, not counted', () => {
  /* An imported history year has its own ids. Absent is not unpaid. */
  const out = H.outstandingDues(DUE_ROW(), ['2026-01', '2026-04'],
    AT({ '2026-01': 'absent', '2026-04': CELL('actual') }), '2026-06-01');
  eq(out.count, 0);
});
t('nothing is counted before it is due', () => {
  const out = H.outstandingDues(DUE_ROW(), ['2026-04', '2026-07', '2026-10'],
    AT({}), '2026-04-19');
  eq(out.count, 0, 'the 20th has not come round yet');
});
/* ── How far back an unpaid period may be counted ───────────────────────────
   A SCHEDULE IS STORED PER YEAR, and that is the fact this turns on: ticking
   "quarterly, the 3rd" on Water in 2026 leaves every earlier year's copy of
   that row with no `duePay` at all, while the outstanding walk is handed every
   month the plan holds. On Charlie's real file — imported history from 2012,
   water typed in Jan/Apr/Aug/Nov, a 2026 schedule that pays in Mar/Jun/Sep/Dec
   — that read as 36 unpaid quarters going back to 2012-03. There was one. */
t('a year whose copy of the row has no schedule cannot be behind on it', () => {
  const yr = (extra) => ({ categories: [{ id: 'water', name: 'Water', ...extra }] });
  ok(H.scheduledIn(yr({ duePay: 'manual' }), 'water'));
  ok(H.scheduledIn(yr({ duePay: 'auto' }), 'water'));
  ok(!H.scheduledIn(yr({}), 'water'),
    'the same row, in a year that never said when the money was owed');
  ok(!H.scheduledIn(yr({ duePay: 'sometimes' }), 'water'), 'and junk is not a schedule');
  ok(!H.scheduledIn(yr({ duePay: 'manual' }), 'gas'), 'nor is a row that is not there');
  ok(!H.scheduledIn(null, 'water'));
});
t('the outstanding walk stops where the schedule stops', () => {
  /* Two lookups over the same months, differing only in which question they
     ask about the year — the bug and the fix, side by side. */
  const months = ['2024-03', '2024-06', '2025-03', '2025-06', '2026-03', '2026-06'];
  const scheduled = { id: 'water', name: 'Water', duePay: 'manual',
                      dueMonths: [1, 4, 7, 10], dueDay: 3, duePayAhead: true };
  const years = { '2024': { categories: [{ id: 'water', name: 'Water' }] },
                  '2025': { categories: [{ id: 'water', name: 'Water' }] },
                  '2026': { categories: [scheduled] } };
  const yearOf = (mm) => years[mm.slice(0, 4)];
  const carries = (mm) => ({ has: true, cell: null });
  const asks = (mm) => ({ has: H.scheduledIn(yearOf(mm), 'water'), cell: null });
  eq(H.outstandingDues(scheduled, months, carries, '2026-08-26').count, 6,
    'every quarter back to 2024 — the row is in those grids, so the old rule '
    + 'counted them');
  const out = H.outstandingDues(scheduled, months, asks, '2026-08-26');
  eq(out.months, ['2026-03', '2026-06'], 'only the year that carries the schedule');
  eq(out.count, 2);
});
t('a row with no schedule has nothing outstanding', () => {
  eq(H.outstandingDues({ name: 'Rent' }, ['2026-01'], AT({}), '2026-06-01').count, 0);
});

/* ── Which rows may be hidden ──────────────────────────────────────────────
   TWO questions: is the cell empty, and is a bill due here? It had three shapes
   in two days — the schedule's months, then the stopped row, then the finished
   month — and a phone screenshot ended it: four blank rows reading "nothing
   recorded" underneath a line offering to hide two OTHER blank rows, with
   nothing on screen to tell them apart. Everything empty goes now, and the one
   thing that stays says why in its own footer. */
const BLANK = { v: 0, kind: 'missing' };
t('an empty row is hidden whatever the reason it is empty', () => {
  ok(H.rowHideable({ name: 'ATM' }, BLANK, '2026-05'),
    'a row that never had a schedule and simply had no money in it');
  ok(H.rowHideable({ name: 'Cash back', until: '2026-04' }, BLANK, '2026-05'),
    'a row that has stopped');
  ok(H.rowHideable(DUE_ROW(), BLANK, '2026-02'),
    'a quarterly bill in a month it does not fall in');
  ok(!H.rowHideable({ name: 'ATM' }, null, '2026-05'),
    'no cell at all is not a cell to judge');
});
t('a bill this month says is DUE stays, empty or not', () => {
  /* The one exception, and it earns it by being visible: such a row's footer
     reads "due the 20th" where a hidden one would read "nothing recorded", so
     the page answers "why that one and not this one?" on its own. Hiding it
     would take the water bill off Expenses in the months it is actually owed —
     the row the whole feature exists for — because it had not been paid. */
  ok(!H.rowHideable(DUE_ROW(), BLANK, '2026-04'), 'April is one of its months');
  ok(!H.rowHideable({ name: 'Rent', duePay: 'auto', dueDay: 1 }, BLANK, '2026-05'),
    'an autopay bill that has not gone out yet');
  ok(H.rowHideable(DUE_ROW({ until: '2026-01' }), BLANK, '2026-04'),
    'and a STOPPED bill is due nothing, ever again — no word about `until` here, '
    + '`dueOn` is null after the stop');
});
t('a figure, a note or split parts always keep a row on the page', () => {
  const r = { name: 'ATM' };
  ok(!H.rowHideable(r, { v: -40, kind: 'actual' }, '2026-02'), 'money landed');
  ok(!H.rowHideable(r, { v: 0, kind: 'actual' }, '2026-02'),
    'a STATED $0.00 is a claim somebody made, not an absence');
  ok(!H.rowHideable(r, { v: 0, kind: 'manual' }, '2026-02'),
    'an estimate you typed is still yours');
  ok(!H.rowHideable(r, { v: 0, kind: 'missing', note: 'chased the town' }, '2026-02'),
    'hiding it would take the note dot with it');
  ok(!H.rowHideable(r, { v: 0, kind: 'mixed',
      parts: [{ v: 300, kind: 'actual' }, { v: -300, kind: 'actual' }] }, '2026-02'),
    'a split month netting to zero still moved money — and the total, which is '
    + 'unchanged either way, would never have told you');
});
t('a month you have not started keeps all its rows', () => {
  /* The starter budget arrives with twelve expense rows and no figures, so
     without this the Month page a new reader opens is three headings, a $0.00
     total apiece and a button offering to show them the budget they just made. */
  const cats = [{ id: 'a' }, { id: 'b' }, { id: 'c' }];
  ok(H.monthUntouched(cats, 3), 'nothing anywhere in the month has anything in it');
  ok(!H.monthUntouched(cats, 2), 'one row has something, so the month has begun');
  ok(!H.monthUntouched(cats, 0));
  ok(!H.monthUntouched([], 0), 'a plan with no rows at all is not an untouched month');
});
t('the guard is about the MONTH, not the section', () => {
  /* It shipped per section for about an hour and Charlie spotted it: Transfers
     listing three untouched accounts in a month where Income and Expenses had
     hidden theirs — the very inconsistency the hide rule exists to remove. A
     section may now collapse to its heading, its total and a reveal line. */
  const cats = [{ id: 'pay', section: 'income' }, { id: 'rent', section: 'expense' },
                { id: 'roth', section: 'transfer' }, { id: 'mid', section: 'transfer' }];
  ok(!H.monthUntouched(cats, 2),
    'both transfer rows empty while the other two carry figures — the month has '
    + 'begun, so the empty ones go even though their whole section goes with them');
});
t('the entered marker gets no say in it any more', () => {
  /* It used to be the whole of the second half of this feature, and it was
     wrong the way an invisible rule is wrong: the same blank row hid in June
     and stayed in October, with nothing on the page to say why. */
  ok(H.rowHideable({ name: 'ATM' }, BLANK, '2026-06'));
  ok(H.rowHideable({ name: 'ATM' }, BLANK, '2026-12'),
    'a month still to come hides its blanks too, and the reveal sticks');
});
/* ── A row that has stopped ──────────────────────────────────────────────
   `cat.until` is the last month a row had money in it — the same key, shape
   and words an ACCOUNT uses to say it was closed. It is the one row field
   below `duePay` that REACHES THE ENGINE, and it has to: a stopped row that
   kept estimating would never be empty, and a row that is never empty can
   never drop off the Month page, which is the whole point of saying it
   stopped. These pin the four places it lands — the estimate gate, the
   deadlines, the hide rule and the rollover — and the one thing that beats it
   everywhere, a figure somebody typed. */
t('until is the last month the row HAD money in it, not the first without', () => {
  const r = { id: 'cb', name: 'Card cash back', rule: 'carry', until: '2026-04' };
  ok(!H.rowEnded(r, '2026-03'));
  ok(!H.rowEnded(r, '2026-04'), 'the month it stopped is still one of its months');
  ok(H.rowEnded(r, '2026-05'));
  ok(!H.rowEnded({ id: 'cb' }, '2026-05'), 'a row still in use never ends');
  ok(!H.rowEnded(r, undefined), 'and a month that is not a month is not after anything');
});
t('a stopped row places no estimate, whatever its rule says', () => {
  const r = { id: 'cb', rule: 'carry', until: '2026-04' };

/* ── A bill due at the start of next month ───────────────────────────────
   The case that makes the lead time worth having. `dueStatus` was always right
   about it — the arithmetic is date-based — but it was only ever ASKED about
   the month being read, so the 1 September rent was announced on the September
   page, which nobody opens on 25 August. The card asks about next month too;
   these pin the rule that decides what travels back. */
t('a bill due the 1st is already inside the lead from the month before', () => {
  const rent = { id: 'rent', name: 'Rent', duePay: 'manual', dueDay: 1 };
  const d = H.monthDues([rent], () => ({ v: 0, kind: 'missing' }),
    '2026-09', '2026-08-25', 7, true);
  eq(d.dues.map(x => x.status.state), ['soon']);
  eq(d.dues[0].status.days, 7, 'exactly a week, standing in the month before it');
  eq(d.dues[0].status.date, '2026-09-01');
});
t('only a deadline still to come may travel back a page', () => {

     "August's rent is 24 days late" is a fact about a page you are not on —
     and reading a month far in the past would drag every later bill onto it.
     A deadline that has not arrived cannot be late, so the filter is also the
     guard: no "is this the current month" test is needed anywhere. */
  const rent = { id: 'rent', name: 'Rent', duePay: 'manual', dueDay: 1 };
  const at = () => ({ v: 0, kind: 'missing' });
  eq(H.monthDues([rent], at, '2026-08', '2026-08-25', 7, true).dues[0].status.state,
    'late', 'August’s own bill, read on the August page');

  const rent = { id: 'rent', name: 'Rent', duePay: 'manual', dueDay: 1 };

/* ── "I pay it the month before" ──────────────────────────────────────────
   A bill due on the 3rd is one you settle a week earlier, which lands in the
   PREVIOUS month. Nothing in the figures can tell an early payer from an
   on-the-day one — a rent cell in August is one payment a month either way —
   so the row has to say, and `dueOn` is the single place the shift lives. */
const AHEAD = (extra) => Object.assign(
  { id: 'rent', name: 'Rent', duePay: 'manual', dueDay: 3, duePayAhead: true }, extra || {});

t('the money leaving in one month settles the NEXT month’s deadline', () => {
  eq(H.dueOn(AHEAD(), '2026-08'), '2026-09-03',
    'August’s money pays the bill due 3 September');
  eq(H.dueOn({ ...AHEAD(), duePayAhead: false }, '2026-08'), '2026-08-03',
    'and without it, August’s money pays August’s own');
  eq(H.dueOn(AHEAD(), '2026-12'), '2027-01-03', 'across a year end');
});
t('a consistent early payer is never late on the page they are on', () => {
  /* The failure this exists to prevent: with the deadline left in its own
     month, somebody who always pays a week early has every month read late for
     ever — the worst way a reminder can fail, because it teaches you to ignore
     it. */
  const st = (m, cell, today) => H.dueStatus(AHEAD(), m, cell, today, 7, true);
  eq(st('2026-08', null, '2026-08-25').state, 'ahead',
    'nine days out is still beyond a seven-day lead — the lead counts to the DUE date, '
    + 'so "a week before the 3rd" is the 27th of the month before');
  eq(st('2026-08', null, '2026-08-28').state, 'soon', 'six days out, in August');
  eq(st('2026-08', null, '2026-08-28').days, 6);
  eq(st('2026-08', CELL('actual', -1200), '2026-08-28').state, 'paid',
    'recorded in August, where the money actually left');
});
t('a shifted row carries its own month in the words', () => {
  /* "due the 3rd" on an August line would read as 3 August, which has been and
     gone. */
  ok(H.dueFootWords(H.dueStatus(AHEAD(), '2026-08', null, '2026-08-25', 7, true))
    .includes('Sep 2026'));
  ok(H.dueScheduleWords(AHEAD()).includes('The money leaves the month before.'));
});
t('the shift moves the WHOLE row, not just the reminder', () => {
  /* One question — "does this row's money move in month m, and against what
     deadline?" — so the hide rule, the estimate gate and the outstanding count
     all move with it rather than three of them moving and one being forgotten. */
  const q = AHEAD({ dueMonths: [1, 4, 7, 10] });   // due Jan/Apr/Jul/Oct, paid the month before
  ok(H.paysIn(q, '2026-03'), 'March money pays the April bill');
  ok(!H.paysIn(q, '2026-04'), 'April itself is not a paying month for this row');
  const out = H.outstandingDues(q, ['2026-03', '2026-04'], AT({}), '2026-06-01');
  eq(out.months, ['2026-03'], 'the period is counted in the month the money should have left');

t('a shifted row is never announced twice', () => {
  /* It is already reported in the month it PAYS, which is the month you are
     reading; the look-ahead having it too would report the month AFTER next. */
  const d = H.monthDues([AHEAD()], () => ({ v: 0, kind: 'missing' }),
    '2026-08', '2026-08-28', 7, true);
  eq(d.dues.length, 1);
  eq(d.dues[0].status.date, '2026-09-03', 'once, on the August page, about September');

t('a bad shift value is not a shift', () => {
  const c = COERCE_ROW({ id: 'r', name: 'R', section: 'expense', duePay: 'manual',

/* ── The schedule drives the estimate ─────────────────────────────────────
   Before 2026-08-25 a cycle bill's beat was measured from the last month a
   figure was TYPED into, so a bill due in January, April, July and October but
   paid late in March estimated itself into March, June, September and December
   — the row's own ticked months saying one thing and the grid another. */
const YEAR_WITH = (cat, cells) => ({ '2026': { kind: 'grid', model: 'live',
  startMonth: '2026-01', monthCount: 12, enteredThrough: '2026-01',
  categories: [cat], cells: cells || {}, paychecks: {}, seeds: {},
  overrides: {}, balAdjust: {}, extraNotes: [] } });
const CELLS_OF = (st, id) => {
  const c = H.computeAll(st, TODAY_FIX)['2026'];
  const out = {};
  for (const m of c.months) { const r = c.cells[`${id}|${m}`]; out[m] = r ? r.kind : 'none'; }
  return out;
};

t('an estimate only lands in a month the row says it falls in', () => {
  const cat = { id: 'water', name: 'Water', section: 'expense', role: 'normal',
    rule: 'carry', duePay: 'manual', dueMonths: [1, 4, 7, 10], dueDay: 20 };
  const st = { schema: 7, settings: {}, years: YEAR_WITH(cat,
    { 'water|2026-01': { v: -92, kind: 'actual' } }) };
  const kinds = CELLS_OF(H.coerceShape(st), 'water');
  eq(kinds['2026-04'], 'auto', 'April is one of its months');
  eq(kinds['2026-07'], 'auto');
  eq(kinds['2026-10'], 'auto');
  eq(kinds['2026-05'], 'missing', 'and May is not — "repeat the last month" is safe now');
  eq(kinds['2026-02'], 'missing');
});
t('the ticked months are the cycle, and a late payment cannot re-phase it', () => {
  /* The whole point. The beat used to be measured from the last month with a
     figure, so one bill paid two months late moved every future estimate with
     it — and a bill paid late is exactly what a cycle rule is most often for. */
  const cat = { id: 'water', name: 'Water', section: 'expense', role: 'normal',
    rule: 'quarterly', every: 3, duePay: 'manual', dueMonths: [1, 4, 7, 10], dueDay: 20 };
  const st = { schema: 7, settings: {}, years: YEAR_WITH(cat,
    { 'water|2026-03': { v: -56, kind: 'actual' } }) };   // January's bill, paid in March
  const kinds = CELLS_OF(H.coerceShape(st), 'water');
  eq(kinds['2026-04'], 'auto', 'still April, not June');
  eq(kinds['2026-06'], 'missing', 'the old modulo beat would have put it here');
  eq(kinds['2026-07'], 'auto');
  eq(kinds['2026-09'], 'missing');
});
t('the gate follows a shifted row into the month it pays', () => {
  const cat = { id: 'water', name: 'Water', section: 'expense', role: 'normal',
    rule: 'carry', duePay: 'manual', dueMonths: [1, 4, 7, 10], dueDay: 3,

  const st = { schema: 7, settings: {}, years: YEAR_WITH(cat,
    { 'water|2026-03': { v: -92, kind: 'actual' } }) };
  const kinds = CELLS_OF(H.coerceShape(st), 'water');
  eq(kinds['2026-06'], 'auto', 'June’s money pays the July bill');
  eq(kinds['2026-07'], 'missing', 'July itself is not when the money moves');
});
t('A PLAN WITH NO SCHEDULES COMPUTES EXACTLY WHAT IT ALWAYS DID', () => {
  /* The guard on the whole change. The gate fires only for a row that HAS a
     ticked list, so every existing plan — and the real-data cross-check that
     reads eight years of imported figures to the cent — is untouched. */
  const cat = { id: 'water', name: 'Water', section: 'expense', role: 'normal',
    rule: 'quarterly', every: 3 };
  const st = { schema: 7, settings: {}, years: YEAR_WITH(cat,

t('a typed figure is never gated, whatever the schedule says', () => {
  /* A bill that turned up in a month the schedule did not expect is a fact.

  const st = { schema: 7, settings: {}, years: YEAR_WITH(cat,

/* ── The lead time, which arrives from a share link ──────────────────────── */
t('the warning window is clamped where it is READ, not only where it is stored', () => {

  eq(H.leadDaysOf({ settings: { dueLeadDays: 0 } }), 0, 'a typed 0 is a real answer');
  eq(H.leadDaysOf({ settings: { dueLeadDays: 9e9 } }), 60);
  eq(H.leadDaysOf({ settings: { dueLeadDays: -5 } }), 0);
  eq(H.leadDaysOf({ settings: { dueLeadDays: '<script>' } }), 7);
  eq(H.leadDaysOf({ settings: { dueLeadDays: '14' } }), 14);

  /* Deleted, so blankState's own value wins through the Object.assign merge —
     setting the key to undefined would copy straight over the default. */
  const bad = H.coerceShape({ settings: { dueLeadDays: 'junk' } });

  eq(H.coerceShape({ settings: { dueLeadDays: 999 } }).settings.dueLeadDays, 60);
  eq(H.coerceShape({ settings: { dueLeadDays: 0 } }).settings.dueLeadDays, 0);

/* ── The boundary ────────────────────────────────────────────────────────── */
const COERCE_ROW = (cat) => H.coerceShape({ years: { '2026': { kind: 'grid',
  startMonth: '2026-01', monthCount: 12, categories: [cat] } } })
  .years['2026'].categories[0];

t('a schedule with no valid way of paying is not a schedule', () => {
  const c = COERCE_ROW({ id: 'water', name: 'Water', section: 'expense',

  const c = COERCE_ROW({ id: 'water', name: 'Water', section: 'expense',

t('all twelve months, or none, is spelled ABSENT', () => {
  /* One schedule must not have two spellings for a share link and a test to

     different claim from "due every month". */
  const all = COERCE_ROW({ id: 'r', name: 'R', section: 'expense', duePay: 'manual',

  ok(!('dueMonths' in all));
  const none = COERCE_ROW({ id: 'r', name: 'R', section: 'expense', duePay: 'manual',

/* ── The sample, and the years built ahead ───────────────────────────────── */
t('the sample exercises both halves of a due date', () => {
  const d = H.migrate(H.coerceShape(H.sampleState()));
  const y = Object.keys(d.years).filter(k => d.years[k].kind === 'grid').sort().pop();
  const cats = d.years[y].categories;
  const scheduled = cats.filter(c => c.duePay);
  ok(scheduled.length >= 3, 'at least three rows carry a schedule');
  ok(scheduled.some(c => c.duePay === 'auto'), 'one on autopay, which never warns');
  ok(scheduled.some(c => c.duePay === 'manual' && c.dueHold),
    'and one waiting on a bill that has not arrived — the case the feature is for');
  const water = cats.find(c => c.id === 'water');
  eq(water.dueMonths, [1, 4, 7, 10], 'quarterly, so eight months of it can be hidden');
  const billed = Object.keys(d.years[y].cells).filter(k => k.startsWith('water|'));
  eq(billed.length, 1, 'only ever billed once, so periods really do stack up behind it');
});
t('the sample leaves ONE bill unpaid, for the current month to find', () => {
  /* The demo for "still unpaid, from Jun" on the page you actually open. It
     has to be a month the entered marker has passed, so the cell resolves
     `missing` rather than an estimate, and earlier than the current one. */
  const d = H.migrate(H.coerceShape(H.sampleState()));
  const y = Object.keys(d.years).filter(k => d.years[k].kind === 'grid').sort().pop();
  const yr = d.years[y];
  const ins = yr.categories.find(c => c.id === 'insurance');
  eq(ins.duePay, 'manual', 'only a hand-paid bill is ever warned about');
  ok(!ins.dueHold, 'and not a held one — the water bill demonstrates that half');
  ok(`${y}-06` <= yr.enteredThrough, 'the marker has gone past it');
  ok(!yr.cells[`insurance|${y}-06`], 'June was never recorded');
  for (const i of [5, 7]) ok(yr.cells[`insurance|${y}-0${i}`], 'but its neighbours were');
  const months = H.yearMonthsOf(yr);
  const c = H.computeAll(d)[y];
  const out = H.outstandingDues(ins, months,
    (mm) => ({ has: H.scheduledIn(yr, 'insurance'), cell: c.cells[`insurance|${mm}`] }),

t('the sample carries a row that STOPPED, and stops it properly', () => {
  const d = H.migrate(H.coerceShape(H.sampleState()));
  const y = Object.keys(d.years).filter(k => d.years[k].kind === 'grid').sort().pop();
  const cb = d.years[y].categories.find(c => c.id === 'cash-back');
  ok(cb, 'the sample has a stopped row at all');
  eq(cb.rule, 'carry', 'and a rule that would otherwise repeat for ever');
  eq(cb.until, `${y}-04`);
  const billed = Object.keys(d.years[y].cells).filter(k => k.startsWith('cash-back|'));
  eq(billed.length, 4, 'four months of figures and nothing after \u2014 the row and its '
    + 'cells have to agree, or the demo shows a stopped row still earning');
  const c = H.computeAll(d)[y];
  eq(c.cells[`cash-back|${y}-05`].kind, 'missing', 'May estimates nothing');

    'so the Month page can drop it');

t('a row copied into next year does not SHARE its months with this one', () => {
  /* `rolloverYear` shallow-copies the categories, so an array assigned once and
     handed to every year would make one row's schedule literally the other's —
     and editing this year would silently rewrite next year. */
  const st = H.migrate(H.coerceShape(H.sampleState()));
  const y = Object.keys(st.years).filter(k => st.years[k].kind === 'grid').sort().pop();
  const next = H.rolloverYear(st, H.computeAll(st), y);
  ok(next, 'the year rolled over');
  const a = st.years[y].categories.find(c => c.id === 'water');
  const b = st.years[next].categories.find(c => c.id === 'water');
  eq(b.dueMonths, a.dueMonths, 'the schedule came with it');
  b.dueMonths.push(12);
  eq(a.dueMonths.length, 4, 'and changing one must not change the other');
});

/* ── The sample plan ────────────────────────────────────────────────────────
   The family rule: the sample IS the demo, so every tab must show something and
   a feature is not finished until the sample exercises it. These pin the pieces
   that are load-bearing — if a figure below is "tidied", one of these says which
   feature just went dark. They run against sampleState() itself, the same object
   the button loads. */
/* ── The month view can act, not just read ─────────────────────────────────
   The month lens is the PHONE lens, and until 2026-08-31 it was the one place
   you could read the plan and change nothing about it. The grid's eleven-button
   strip was deliberately NOT imported: most of it is about the YEAR, and a page
   showing one month is the wrong place to be offered "Delete 2026". Each action
   sits where it belongs instead, and the gating below is what makes the two
   month-scoped ones unambiguous on a page about one month. */
group('Acting from the month view');

const actYear = (entered, opts) => ({ kind: 'grid', model: 'live',
  enteredThrough: entered, startMonth: '2030-01', monthCount: 12,
  categories: [], cells: {}, overrides: {}, seeds: {}, balAdjust: {}, ...(opts || {}) });

t('each action belongs to exactly one month', () => {
  const yr = actYear('2030-02');   // entered through February
  eq(H.monthActionsFor(yr, '2030-03', true),
    { close: true, reopen: false }, 'March is the next un-entered month');
  eq(H.monthActionsFor(yr, '2030-02', true),
    { close: false, reopen: true }, 'February is the one that can go back');
  eq(H.monthActionsFor(yr, '2030-04', true),
    { close: false, reopen: false }, 'April offers neither — March comes first');
  /* The trap the rule exists to avoid: "is this month entered" is true of
     EVERY month at or before the marker, and re-opening January is not a thing
     `reopenMonth` can do — it only ever moves the marker back one. */
  eq(H.monthActionsFor(yr, '2030-01', true),
    { close: false, reopen: false }, 'and an earlier entered month cannot re-open');
});

t('a year with nothing left to enter offers no close', () => {
  const yr = actYear('2030-12');
  eq(H.monthActionsFor(yr, '2031-01', true).close, false,
    'December was the last month this year has');
  eq(H.monthActionsFor(yr, '2030-12', true).reopen, true, 'but it can still go back');
});

t('a year that computes nothing, or has not begun, offers neither', () => {
  eq(H.monthActionsFor(actYear('2030-02', { model: 'pinned' }), '2030-03', true),
    { close: false, reopen: false }, 'a pinned year has no estimates to freeze');
  eq(H.monthActionsFor(actYear('2030-02'), '2030-03', false),
    { close: false, reopen: false }, 'and a year that has not begun has nothing to enter');
  eq(H.monthActionsFor(null, '2030-03', true), { close: false, reopen: false },
    'no year at all is not an exception to handle at the call site');
});

t('the button says which row it adds, in the label', () => {
  /* A title never shows on a phone, and this is the phone lens — so three
     buttons reading "Add Row" would be three identical labels doing three
     different things. SECTION_LABEL is plural ("Expenses") and cannot be
     reused: a button adds one row. */
  eq(H.ADD_ROW_WORD.income, 'an Income Row');
  eq(H.ADD_ROW_WORD.expense, 'an Expense Row');
  eq(H.ADD_ROW_WORD.transfer, 'a Transfer Row');
  for (const sec of Object.keys(H.ADD_ROW_WORD))
    ok(!/s Row$/.test(H.ADD_ROW_WORD[sec]), `${sec} names ONE row, not a plural`);
});

/* ── A key in the wrong place here is INVISIBLE ─────────────────────────────
   The tests above ask whether a branch has entries in it, which is the right
   question for "did somebody empty the sample" and no question at all for the
   failure this group actually met: coerceShape is built to carry an odd shape
   rather than throw, so a misplaced or mis-scaled field doesn't fail — it
   settles to a default and the feature it was there to show quietly draws
   $0.00, "Unnamed", or nothing whatever. Six of them were live at once.
   These read the values the way their READERS do, which is the only test that
   can tell a filled-in sample from one that merely looks filled in. */
t('the per-person 401(k) figures survive as figures', () => {
  /* Nested under `by`. At the top level each person's object met num(), came
     out as `rosa: 0`, and took both Limit Check cards, the MAGI card's two
     pre-tax lines and the projection's whole "Paid in" column with it. */
  const d = H.migrate(H.coerceShape(H.sampleState()));
  const y = String(new Date().getFullYear());
  ok(d.side.limits[y].by, 'per-person limits live under `by`');
  for (const who of ['rosa', 'ben']) {
    const L = H.limitsForIn(d, y, who);
    ok(L.salary > 0, who + ' has a salary the card can show');
    ok(L.pretaxPct > 0, who + ' puts something in, or the card reads 0% of the limit');
  }
  const magi = H.magiFor(d, y);
  ok(magi.pretax > 0 && magi.hsa > 0, 'and the MAGI card has pre-tax money to subtract');
});
t('the retirement income rows are named, dated and scaled', () => {
  const d = H.migrate(H.coerceShape(H.sampleState()));
  for (const r of d.side.drawdown.income) {
    ok(r.label, 'a row without `label` renders as "Unnamed" — `name` is not the field');
    ok(typeof r.from === 'number' && r.from > 2000,
       '`from` is a YEAR: a month string only survives because parseFloat stops at the dash');
    ok(r.taxPct === undefined || r.taxPct <= 1,
       'taxPct is a SHARE — a 20 is clamped to 1 and the row claims to be taxed in full');
  }
  ok(d.side.drawdown.income.some(r => r.taxPct > 0 && r.taxPct < 1),
     'and one row is partly taxable, which is the whole point of the column');
});
t('the state label is inside side.tax, where its reader looks', () => {
  const d = H.migrate(H.coerceShape(H.sampleState()));
  ok(d.side.tax.stateLabel, 'a sibling of `tax` is a key nothing reads');

t('the rollup has the several pots it is gated on', () => {
  /* "Everything You Hold", its By Class table and the target/drift columns are
     only drawn once two pots contribute — with one it would be that pane's own
     table under a grander heading. So a sample with a single pane silently
     shows none of it, and `targets`, `classes` and `classTargets` go dark with
     it however carefully they are filled in. */
  const d = H.migrate(H.coerceShape(H.sampleState()));
  const roll = H.allHoldings(d);
  const pots = new Set(roll.rows.flatMap(r => r.pots));
  ok(pots.size >= 2, 'two pots or the rollup is not drawn at all: ' + [...pots].join(', '));
  ok(roll.rows.some(r => typeof r.target === 'number'), 'a target, so Drift has a column');
  ok(roll.rows.some(r => r.cls), 'and a class, so By Class is drawn');
});

t('the raise history shows both answers the since-last-year check has', () => {
  /* An earlier draft was $1.80 out, which rendered as "+$1.80 above plan
     (0.00%)" — a rounding fault to look at, not a feature. */
  const d = H.migrate(H.coerceShape(H.sampleState()));
  const years = Object.keys(d.side.comp).sort();
  const states = years.map((yy, i) => i === 0 ? 'first'
    : H.sinceLastYear(yy, years[i - 1], d.side.comp[yy].salary,
        H.afterRaise(d.side.comp[years[i - 1]])).state);
  ok(states.includes('planned'), 'one year picks up exactly where the last ended');
  ok(states.includes('above') || states.includes('below'), 'and one does not');
  const last = H.sinceLastYear(years[2], years[1], d.side.comp[years[2]].salary,
    H.afterRaise(d.side.comp[years[1]]));
  ok(Math.abs(last.moved) > 100, 'and the gap is legible, not a rounding artefact');
});

group('Untrusted input');
/* ── Ids are held to a shape at the boundary ────────────────────────────────
   The family rule — /^[A-Za-z0-9_-]{1,64}$/ — which this app was the last to
   apply. It is not only tidiness here: cells, overrides and balance
   adjustments are stored as `<id>|<month>`, so an id containing a bar splits at
   the wrong place when it is read back and the month becomes nonsense. */
t('every id from a restored file comes out in the family shape', () => {
  const d = H.coerceShape({
    people: [{ id: 'me|x', name: 'Charlie' }, { id: '', name: 'Sam Adams' },
             { id: 'A'.repeat(200), name: 'Long' }, { id: {}, name: 'Obj' }],
    settings: { accounts: [{ id: 'cash', name: 'Cash' },
      { id: 'sav|ings', name: 'Savings', creditTo: 'sav|ings', divTo: 'cash' }] },
    goals: [{ id: 'gl|1', name: 'Roof' }],
    years: { '2026': { kind: 'grid', categories: [{ id: 'rent|z', name: 'Rent' }] } }
  });
  const ids = [...d.people.map(p => p.id), ...d.settings.accounts.map(a => a.id),
               ...d.goals.map(g => g.id), ...d.years['2026'].categories.map(c => c.id)];
  ids.forEach(id => ok(/^[A-Za-z0-9_-]{1,64}$/.test(id), 'not in shape: ' + JSON.stringify(id)));
  eq(d.people[1].id, 'sam-adams', 'a missing id still falls back to the name');
  eq(d.people[2].id.length, 64, 'a long id is capped, not dropped');
});
t('a mangled id keeps its stem, so a backup stays readable', () => {
  const d = H.coerceShape({ settings: { accounts: [{ id: 'sav|ings', name: 'Savings' }] } });
  eq(d.settings.accounts[0].id, 'sav-ings', 'the id is re-slugged, not replaced wholesale');
});
t('references follow their target, rather than being dropped', () => {
  /* The reason the cleaner is deterministic instead of minting a fresh id: a
     reference re-slugs to the same string its target does, so the link
     survives. A random replacement would need a remap threaded through every
     referring field. */
  const d = H.coerceShape({
    people: [{ id: 'me|x', name: 'Charlie' }],
    settings: { accounts: [{ id: 'cash', name: 'Cash' },
      { id: 'sav|ings', name: 'Savings', creditTo: 'sav|ings', divTo: 'cash', owner: 'me|x' }] },
    goals: [{ id: 'gl|1', name: 'Roof', for: 'me|x', accounts: ['sav|ings'] }],
    years: { '2026': { kind: 'grid', categories: [
      { id: 'rent|z', name: 'Rent', person: 'me|x', accounts: ['sav|ings'] }] } }
  });
  const acct = d.settings.accounts[1], goal = d.goals[0];
  const cat = d.years['2026'].categories[0];
  eq(acct.creditTo, 'sav-ings', 'the account still credits itself');
  eq(acct.owner, 'me-x', 'and still has its owner');
  eq(goal.for, 'me-x', 'the goal still names the person');
  eq(goal.accounts, ['sav-ings'], 'and still names its account');
  eq(cat.person, 'me-x'); eq(cat.accounts, ['sav-ings']);
});
t('the keyed maps follow too, so no figure is orphaned', () => {
  /* The half that is easy to miss: the id is a key PREFIX. Rewriting the id
     without rewriting `<id>|<month>` would leave every cell pointing at a row
     that no longer exists — the figures would simply vanish from the grid. */
  const d = H.coerceShape({
    settings: { accounts: [{ id: 'sav|ings', name: 'Savings' }] },
    years: { '2026': { kind: 'grid', model: 'live', startMonth: '2026-01', monthCount: 3,
      categories: [{ id: 'rent|z', name: 'Rent' }, { id: 'food', name: 'Food' }],
      cells: { 'rent|z|2026-01': { v: 100 }, 'rent|z|2026-02': { v: 200 },
               'food|2026-01': { v: 9 } },
      overrides: { 'sav|ings|2026-01': { v: 5 } },
      balAdjust: { 'sav|ings|2026-02': { v: 7 } },
      seeds: { 'sav|ings': 1000 } } }
  });
  const yr = d.years['2026'];
  eq(yr.cells['rent-z|2026-01'].v, 100, 'the cell moved with its row, value intact');
  eq(yr.cells['rent-z|2026-02'].v, 200);
  eq(yr.cells['rent|z|2026-01'], undefined, 'and the broken key is gone');
  eq(yr.cells['food|2026-01'].v, 9, 'a row that was already fine is untouched');
  eq(yr.overrides['sav-ings|2026-01'].v, 5, 'overrides follow the account');
  eq(yr.balAdjust['sav-ings|2026-02'].v, 7, 'so do balance adjustments');
  eq(yr.seeds['sav-ings'], 1000, 'and the seed, which is keyed by the bare id');
});
t('a healthy plan is not touched at all', () => {
  /* The property that makes this safe to run on every load: the cleaner is
     slugJs, which is idempotent on anything already well-formed. If this ever
     fails, real plans are being rewritten on open. */
  const good = { schema: 5,
    people: [{ id: 'charlie', name: 'Charlie', role: 'adult' }],
    settings: { accounts: [{ id: 'cash', name: 'Cash', creditTo: 'cash', hub: true },
                           { id: 'mid', name: 'Savings', creditTo: 'mid' }] },
    goals: [{ id: 'roof-fund', name: 'Roof', accounts: ['mid'], for: 'charlie' }],
    years: { '2026': { kind: 'grid', model: 'live', startMonth: '2026-01', monthCount: 12,
      categories: [{ id: 'rent', name: 'Rent', section: 'expense' }],
      cells: { 'rent|2026-01': { v: -1200 } }, seeds: { cash: 500 },
      overrides: { 'cash|2026-02': { v: 10 } }, balAdjust: {} } } };
  const before = JSON.stringify(good);
  const d = H.coerceShape(JSON.parse(before));
  eq(d.people[0].id, 'charlie'); eq(d.goals[0].id, 'roof-fund');
  eq(Object.keys(d.years['2026'].cells), ['rent|2026-01'], 'no cell key moved');
  eq(Object.keys(d.years['2026'].seeds), ['cash'], 'no seed key moved');
  eq(Object.keys(d.years['2026'].overrides), ['cash|2026-02'], 'no override key moved');
  /* Idempotent: coercing an already-coerced plan changes nothing further. */
  eq(JSON.stringify(H.coerceShape(JSON.parse(JSON.stringify(d)))), JSON.stringify(d));
});
t('a __proto__ key in a restored file never becomes a prototype', () => {
  const hostile = '{"years":{},"__proto__":{"pwned":1}}';
  const guarded = JSON.parse(hostile, (k, v) => k === '__proto__' ? undefined : v);
  eq(Object.keys(guarded).includes('__proto__'), false, 'the key is dropped on parse');
  const target = {};
  Object.assign(target, guarded);
  eq(Object.getPrototypeOf(target) === Object.prototype, true, 'Object.assign left it alone');
  eq(({}).pwned, undefined, 'and nothing global was touched');
});
t('numeric fields that render unescaped are coerced to numbers', () => {
  /* shares, trip/PTO nights and PTO days reach the page WITHOUT esc(); a string
     of markup in a hand-edited or corrupted backup would otherwise execute.
     coerceShape forces them to numbers, closing the whole class of sink. */
  const evil = '<img src=x onerror=alert(1)>';
  const d = H.coerceShape({
    side: { portfolios: [{ id: 'p', name: 'P',
              rows: [{ ticker: 'X', shares: evil, price: evil }] }],
            daf: [{ ticker: 'Y', shares: evil, price: 5 }] },
    vacations: { trips: [{ id: 't', name: 'T', year: '2027', nights: evil,
                  items: [{ label: 'Air', paid: evil, credits: '1.5', due: 3 }] }],
      pto: { '2027': { allowance: evil, entries: [
              { name: 'H', nights: evil, ptoDays: evil }] } } }
  });
  const row = d.side.portfolios[0].rows[0];
  eq(typeof row.shares, 'number'); eq(row.shares, 0, 'markup shares → 0');
  eq(typeof row.price, 'number');
  eq(typeof d.side.daf[0].shares, 'number', 'the giving fund is coerced too');
  const trip = d.vacations.trips[0];
  eq(trip.nights, 0, 'markup trip nights → 0');
  eq(trip.year, 2027, 'a numeric string parses');
  eq(trip.items[0].paid, 0);
  eq(trip.items[0].credits, 1.5, 'a real figure survives as a number');
  const bucket = d.vacations.pto['2027'];
  eq(bucket.allowance, 0);
  eq(bucket.entries[0].nights, 0);
  eq(bucket.entries[0].ptoDays, 0);
});
t('grid figures from a hand-edited backup become numbers, not NaN', () => {
  /* The biggest money surface of all: cells, seeds, overrides and paychecks
     reach the engine verbatim, so one string here used to turn every
     downstream balance into NaN — and a cell's v rides into the page raw. */
  const evil = '<img src=x onerror=alert(1)>';
  const d = H.coerceShape({ years: { '2030': { kind: 'grid', model: 'live',
    startMonth: '2030-01', monthCount: 3, enteredThrough: '2030-01',
    categories: [{ id: 'rent', name: 'Rent', rule: 'none', section: 'expense' }],
    cells: { 'rent|2030-01': { v: evil, kind: 'actual' },
             'rent|2030-02': { v: '25', kind: 'wat',
               parts: [{ v: '10' }, 'junk', { v: 15, note: 'ok' }] },
             'rent|2030-03': 'not even an object' },
    seeds: { cash: 'junk', bank: '250' },
    overrides: { 'cash|2030-02': { v: '500' }, 'cash|2030-03': { v: evil } },
    paychecks: { '2030-01': evil, '2030-02': '3' } } } });
  const yr = d.years['2030'];
  eq(yr.cells['rent|2030-01'].v, 0, 'markup in a cell is only ever 0');
  eq(yr.cells['rent|2030-01'].kind, 'actual');
  eq(yr.cells['rent|2030-02'].v, 25, 'a numeric string still reads');
  eq(yr.cells['rent|2030-02'].kind, 'actual', 'an unknown kind is not a class name');
  eq(yr.cells['rent|2030-02'].parts.length, 2, 'a junk part is dropped');
  eq(yr.cells['rent|2030-02'].parts[0].v, 10);
  eq('rent|2030-03' in yr.cells, false, 'a cell that is not an object is dropped');
  eq(yr.seeds.cash, 0, 'a junk seed does not poison the chain');
  eq(yr.seeds.bank, 250);
  eq(yr.overrides['cash|2030-02'].v, 500);
  eq('cash|2030-03' in yr.overrides, false,
     'an override that states no figure states nothing');
  eq(yr.paychecks['2030-01'], 0);
  eq(yr.paychecks['2030-02'], 3);
  const c = H.computeAll(d, '2030-02-15')['2030'];
  ok(Number.isFinite(c.balances['cash|2030-01']),

  const evil = '<img src=x onerror=alert(1)>';

     removing it — these have to be deleted or every default is lost. */

t('schema 6 fills an empty strapline ONCE, and never over one you typed', () => {

     runs on every load, so a fill there could never be cleared — you would empty
     the field, reload, and it would be back. Here it happens to a plan written
     before 2026-08-22 and never again. */
  const older = H.migrate(H.coerceShape({ schema: 5, settings: {} }));
  eq(older.settings.tagline, H.DEFAULT_TAGLINE, 'an older plan gains the strapline');
  eq(older.schema, H.SCHEMA);

  eq(mine.settings.tagline, 'Our plan', 'a subtitle somebody typed is theirs — never overwritten');

  const cleared = H.migrate(H.coerceShape({ schema: H.SCHEMA, settings: { tagline: '' } }));
  eq(cleared.settings.tagline, '', 'clearing the field sticks');

/* An account's own hover text. Round numbers chosen so every figure below is
   hand-computable: Brokerage grows 12%/yr on 10,000 — 100 a month — and pays
   4%/yr quarterly, so March's dividend is one quarter's worth of the balance
   it opened on. */
function tipFixture() {
  const s = H.coerceShape({
    schema: 5,
    settings: { accounts: [
      { id: 'cash', name: 'Cash', rate: 0, creditTo: 'cash', hub: true },
      { id: 'mid', name: 'Brokerage', rate: 0.12, creditTo: 'mid',
        divRate: 0.04, divTo: 'cash', divEvery: 3 },
      { id: 'bank', name: 'Bank', rate: 0, creditTo: 'bank' },
    ] },
    years: { '2030': {
      kind: 'grid', model: 'live', startMonth: '2030-01', monthCount: 6,
      enteredThrough: '2030-01', categories: [], cells: {}, paychecks: {},
      seeds: { cash: 1000, mid: 10000, bank: 500 },
      overrides: { 'bank|2030-02': { v: 700, note: 'off the statement' } },
      balAdjust: { 'mid|2030-04': { interest: 25 }, 'mid|2030-05': { dividend: 0 } },
    } },
  });
  const yr = s.years['2030'];
  const acct = (id) => s.settings.accounts.find(a => a.id === id);
  const c = H.computeAll(s, TODAY_FIX)['2030'];
  return {
    tip: (id, m) => H.balanceTip(s, c, yr, acct(id), m),
    got: (id, m) => H.receivedInto(s, c, yr, acct(id), m),
    over: (id, ms) => H.earningsOver(s, c, yr, acct(id), ms),
  };
}

group('What a past year states that it earned');
/* A pinned year computes nothing — no chain, no rates — so interest and
   dividends exist there only where the reader typed them. These pin the whole
   round trip: what computeYear hands back, and what the readers above it make
   of it. */
function pastFixture(balAdjust) {
  const s = H.coerceShape({
    settings: { accounts: [
      { id: 'cash', name: 'Cash', hub: true, rate: 0.12, creditTo: 'cash' },
      { id: 'mid', name: 'Savings', rate: 0.12, creditTo: 'cash',
        divRate: 0.04, divTo: 'cash', divEvery: 3 }] },
    years: { '2021': { kind: 'grid', model: 'pinned', startMonth: '2021-01',
      monthCount: 3, categories: [], cells: {}, paychecks: {}, seeds: {},
      overrides: { 'mid|2021-01': { v: 10000 }, 'mid|2021-02': { v: 10050 },
                   'mid|2021-03': { v: 10100 } },
      balAdjust: balAdjust || {}, extraNotes: [] } } });
  return { s, yr: s.years['2021'], c: H.computeAll(s, TODAY_FIX)['2021'] };
}

  /* Everything Brokerage earns is swept to Cash, so March sends both — the

  const s = H.coerceShape({

t('the as-of switch is offered only where the two months differ', () => {
  /* The settled month is the year's ENTERED marker, never last calendar month:
     marking a month entered is how this app says a month is settled, and
     offering an unentered August would record the plan's own estimates as
     permanent history — the whole thing this exists to prevent. */
  const live = { kind: 'grid', model: 'live', startMonth: '2026-01', monthCount: 12,
    enteredThrough: '2026-08' };
  const st = { years: { 2026: live }, ui: {} };
  const off = H.worthAsOf(st, '2026', '2026-09');
  eq(off.canChoose, true, 'August is settled and September is not — there is a choice');
  eq(off.settled, '2026-08');
  eq(off.asOf, '2026-09', 'and the card opens on the month in progress, as it always has');
  eq(off.est, true, 'which is an estimate, and says so');
  const on = H.worthAsOf({ years: { 2026: live }, ui: { worthAsOf: 'settled' } },
    '2026', '2026-09');
  eq(on.asOf, '2026-08', 'chosen, it reads at the settled month');
  eq(on.est, false, 'where nothing is an estimate');
  eq(on.now, '2026-09', 'and it still knows which month is the current one, for the label');
});
t('a month that is itself settled has nothing to choose between', () => {
  /* One month, and it is settled — a switch offering the same month twice is a
     control that cannot do anything. `monthAhead` is the one reader for that
     question, so this cannot drift from the chart's dashed bars. */
  const entered = { kind: 'grid', model: 'live', startMonth: '2026-01', monthCount: 12,
    enteredThrough: '2026-09' };
  const both = H.worthAsOf({ years: { 2026: entered }, ui: { worthAsOf: 'settled' } },
    '2026', '2026-09');
  eq(both.canChoose, false);
  eq(both.asOf, '2026-09', 'a stale choice cannot re-date a card that has no choice');
  eq(both.est, false);
  /* Nothing entered at all is the other end: there is no settled month to
     offer, so no switch — and the estimate mark plus the card's own sentence
     are what say why the figure is a projection. */
  const fresh = H.worthAsOf({ years: { 2026: { kind: 'grid', model: 'live',
    startMonth: '2026-01', monthCount: 12 } }, ui: { worthAsOf: 'settled' } }, '2026', '2026-09');
  eq(fresh.canChoose, false);
  eq(fresh.asOf, '2026-09');
  eq(fresh.est, true, 'and every figure in it is still an estimate');
});
t('the settled month has to be one the year actually holds', () => {
  /* "Nothing entered yet" does NOT arrive here as an empty string. coerceShape
     guarantees a live year an `enteredThrough`, backfilling the month BEFORE it
     starts — so a 2026 grid reads '2025-12', which is a real-looking month this
     year has no balance for. Unguarded, the switch offered it and the card came
     back with Liquid $0.00 and a total missing every dollar of it. Found on
     screen against the sample, which is where an off-the-end month lookup shows
     up and a round-numbered fixture does not. */
  const st = H.coerceShape({ years: { 2026: { kind: 'grid', model: 'live',
    startMonth: '2026-01', monthCount: 12, cells: {}, categories: [] } },
    ui: { worthAsOf: 'settled' } });
  eq(st.years['2026'].enteredThrough, '2025-12',
    'the backfill is real — this test is worthless if that ever stops happening');
  const w = H.worthAsOf(st, '2026', '2026-09');
  eq(w.canChoose, false, 'a month the year does not hold is not a month to offer');
  eq(w.asOf, '2026-09', 'so the card stays on the month in progress');
  eq(w.est, true);
});
t('a snapshot for a closed month is dated the last day of it', () => {
  /* Where a figure stated FOR August belongs on the line — not the day the
     button happened to be pressed. Built by string arithmetic off daysInMonth,
     never a Date: a bare ISO day parses as UTC midnight and renders as the day
     before west of Greenwich. */
  eq(H.monthEndISO('2026-08'), '2026-08-31');
  eq(H.monthEndISO('2026-09'), '2026-09-30', 'a thirty-day month');

/* The bulk path for the same fault the parseMoney group pins: a file where the
   negatives are written the way a finance system prints them. Both spellings in
   ONE file, because that is how the bug showed itself — the bracketed row read
   as a negative and the row beside it, meaning exactly the same thing, did not. */
t('a file may write its negatives either way, and both are negative', () => {
  const st = H.coerceShape({ years: { '2026': { kind: 'grid', model: 'live',
    startMonth: '2026-01', monthCount: 12, enteredThrough: '2026-12',

  H.applyGridCsv(st, H.readGridCsv(
    'Section,Row,2026-01,2026-02\nExpenses,Utilities,−120.00,(130.00)'), '2026-03-01');
  eq(st.years['2026'].cells['util|2026-01'].v, -120, 'U+2212, as a statement writes it');
  eq(st.years['2026'].cells['util|2026-02'].v, -130, 'and the accounting brackets');

/* ── A row of words is not a row the plan is missing ────────────────────────
   The guard for this was written as `values[m] !== null && Number.isNaN(...)`,
   which parseMoney can never satisfy — so it never fired, and a line of prose
   in a file (a header repeated mid-export, a column the reader added) was
   ADDED to the budget as a row of its own and counted as a row gained. */
t('a row whose every column is words is skipped, not added', () => {
  const st = H.coerceShape({ years: { '2026': { kind: 'grid', model: 'live',
    startMonth: '2026-01', monthCount: 12, enteredThrough: '2026-12',
    categories: [{ id: 'rent', name: 'Rent', section: 'expense' }], cells: {} } } });
  const out = H.applyGridCsv(st, H.readGridCsv(['Section,Row,2026-01,2026-02',
    'Expenses,Rent,-50,-60',
    'Expenses,Notes for the reader,see attached,n/a'].join('\n')), '2026-03-01');
  eq(out.added, 0, 'the prose row minted no budget row');
  eq(out.skipped, 1, 'and is reported as skipped rather than gained');
  eq(st.years['2026'].categories.length, 1, 'the plan still has the one row it had');
});
t('a row of EMPTY columns still clears them — it is not a row of words', () => {
  /* The half the guard must not swallow: an export with a month blanked is a
     round trip deleting what it names, and refusing that would silently ignore
     a deletion. Empty and unreadable arrive spelled the same in `values`, which
     is why the reader tracks them apart. */
  const st = H.coerceShape({ years: { '2026': { kind: 'grid', model: 'live',
    startMonth: '2026-01', monthCount: 12, enteredThrough: '2026-12',
    categories: [{ id: 'rent', name: 'Rent', section: 'expense' }],
    cells: { 'rent|2026-01': { v: -50, kind: 'actual' },

  const out = H.applyGridCsv(st,
    H.readGridCsv('Section,Row,2026-01,2026-02\nExpenses,Rent,,'), '2026-03-01');
  eq(out.skipped, 0, 'the row is read, not skipped');
  eq(out.cleared, 2);
  eq(st.years['2026'].cells['rent|2026-01'], undefined);
  eq(st.years['2026'].cells['rent|2026-02'], undefined);
});

t('a year exported and imported comes back the same', () => {
  /* The round trip that is the whole point. Export a year, empty a copy's typed
     cells, read the file straight back in, and every figure returns. */
  const st = H.migrate(H.coerceShape(H.sampleState()));
  const y = Object.keys(st.years).filter(k => st.years[k].kind === 'grid').sort().pop();
  const C = H.computeAll(st, `${y}-08-15`);
  const csv = H.gridToCsv(st, C[y], y);
  const copy = H.migrate(H.coerceShape(JSON.parse(JSON.stringify(st))));
  copy.years[y].cells = {};
  const out = H.applyGridCsv(copy, H.readGridCsv(csv), `${y}-08-15`);
  ok(out.set > 0, 'something came back');
  eq(out.added, 0, 'every row matched by name — nothing forked into a new one');
  const before = C[y];
  const after = H.computeAll(copy, `${y}-08-15`)[y];
  for (const cat of st.years[y].categories)
    for (const m of before.months)
      eq(H.round2((after.cells[`${cat.id}|${m}`] || {}).v || 0),
         H.round2((before.cells[`${cat.id}|${m}`] || {}).v || 0),
         `${cat.name} ${m}`);
});

t('schema 7 moves what was owed onto a debt of its own, once', () => {
  const before = { schema: 6, side: { property: [
    { name: 'House', kind: 'home', value: 400000, owed: 250000 },
    { name: 'Bike', kind: 'other', value: 900 } ] } };
  const st = H.migrate(H.coerceShape(before));
  /* Read off SCHEMA rather than pinned at 7: migrate walks a plan all the way
     UP, so this figure moves every time a later step is added and asserting a
     literal would fail the next bump for no reason of its own. What this test
     is about is the property row below, not the version stamp — the stamp is
     here only to say the walk finished. */
  eq(st.schema, H.SCHEMA, 'migrated all the way to the current schema');
  eq(st.side.property[0].owed, undefined, 'the number is off the property row');
  eq(st.side.liabilities.length, 1, 'and nothing was invented for the row that owed nothing');
  const l = st.side.liabilities[0];
  eq(l.kind, 'mortgage', 'a home carries a mortgage');
  eq(l.balance, 250000);
  eq(l.securedOn, st.side.property[0].id);
  eq(l.rate, undefined, 'no rate, payment or date is invented — the reader says those');
  /* The migration must not move the number the reader already recorded. */
  eq(H.netWorthParts(st, '2030-04').property, 150900,
    'net worth is identical to the cent after the move');
  eq(H.netWorthParts(H.coerceShape(before), '2030-04').property, 150900, 'as it was before it');
  const twice = H.migrate(H.migrate(H.coerceShape(before)));
  eq(twice.side.liabilities.length, 1, 'and it happens once, not on every load');
});

/* ── Growth is not income ──────────────────────────────────────────────────
   An account's rate can produce either of two things, and the difference is
   the whole feature: interest is money, growth is an investment rising on
   paper. Both move the balance identically; only one is income. The tests
   below are arranged around the two ways this can go wrong — growth leaking
   INTO an income figure (the bug being fixed) and growth going missing from
   the balance (a new bug the fix could introduce). */
group('Growth that is not income');

/* A live year with two accounts on the same rate, differing only in what that
   rate is called. Same arithmetic, so any difference in what the app reports
   is the classification and nothing else — which is what makes this fixture
   able to prove the balances did not move. */
function growthFixture(earns) {
  return H.coerceShape({
    schema: H.SCHEMA,
    settings: { accounts: [
      { id: 'cash', name: 'Cash', rate: 0, hub: true },
      { id: 'inv', name: 'Investments', rate: 0.12, earns, creditTo: 'inv' },
    ] },
    years: { 2026: { kind: 'grid', model: 'live', startMonth: '2026-01', monthCount: 3,
      enteredThrough: '2025-12', categories: [], cells: {}, paychecks: {},
      seeds: { cash: 1000, inv: 10000 }, overrides: {}, balAdjust: {} } },
  });
}
const growthYear = (earns) => {
  const st = growthFixture(earns);
  return { st, c: H.computeYear(st, '2026', null), yr: st.years['2026'] };
};

t('the rate reports into one map or the other, never both', () => {
  const g = growthYear('growth');
  eq(g.c.growth['inv|2026-01'], 100, '1%/mo of 10,000 lands in growth');
  eq(g.c.interest['inv|2026-01'], undefined, 'and nothing at all in interest');
  const i = growthYear('interest');
  eq(i.c.interest['inv|2026-01'], 100, 'the same figure, filed the other way');
  eq(i.c.growth['inv|2026-01'], undefined, 'and nothing in growth');
});

t('classifying it moves no money at all', () => {
  const g = growthYear('growth'), i = growthYear('interest');
  /* THE assertion of this whole change. If a single balance differs, the split
     stopped being a matter of naming and started being arithmetic. */
  for (const m of ['2026-01', '2026-02', '2026-03'])
    for (const id of ['cash', 'inv', 'total'])
      eq(g.c.balances[`${id}|${m}`], i.c.balances[`${id}|${m}`],
        `${id} in ${m} is the same either way`);
});

t('growth is in no figure that counts income', () => {
  const g = growthYear('growth'), i = growthYear('interest');
  const own = ['2026-01', '2026-02', '2026-03'];
  eq(H.accountEarnings(g.c, g.yr, own).v, 0, 'not in what the accounts earned');
  ok(H.accountEarnings(i.c, i.yr, own).v > 0, 'where interest plainly is');
  eq(H.yearIncome(g.yr, g.c, '2026'), 0, 'not in the year\'s income');
  eq(H.yearFlows(g.yr, g.c, '2026').in, 0, 'not in money in');
  ok(H.yearFlows(i.yr, i.c, '2026').in > 0, 'where interest plainly is');
  /* The month page reads its own totals; income there must agree with the year. */
  eq(H.monthTotals(g.c, g.yr, '2026-01', null).income.v, 0, 'nor in the month\'s income');
});

t('it is reported instead on the account, over the same months', () => {
  const g = growthYear('growth');
  const own = ['2026-01', '2026-02', '2026-03'];
  const inv = g.st.settings.accounts[1];
  const e = H.earningsOver(g.st, g.c, g.yr, inv, own);
  eq(e.growth, H.round2(g.c.growth['inv|2026-01'] + g.c.growth['inv|2026-02']
    + g.c.growth['inv|2026-03']), 'every month of the run, added up');
  ok(e.growth > 0, 'and it is a real figure, not a rounded-away nothing');
  eq(e.interest, 0, 'never doubled into the interest half');
  const i = growthYear('interest');
  eq(H.earningsOver(i.st, i.c, i.yr, i.st.settings.accounts[1], own).growth, 0,
    'an interest account grows nothing');
});

t('NEITHER lens gives growth a row of its own', () => {
  /* Both drew one on 2026-08-31 and both came out the same day. The month
     page's sat in `.mrows`, which IS the account list, so it read as an
     account holding $88.40; the year grid's sat under Total, in a block whose
     every other line is a balance or a count, so twelve monthly flows read as
     tiny balances. Growth is said on the account that made it and nowhere
     else. The aggregate helpers went with the rows — an unread figure is the
     second copy this suite exists to prevent. */
  const g = growthYear('growth');
  eq(H.monthTotals(g.c, g.yr, '2026-01', null).grown, undefined,
    'the month is not added up with a growth figure on it');
  eq(H.accountGrowth, undefined, 'and no plan-wide growth total survives');
  eq(H.growthTip, undefined, 'nor a tip for a row that no longer exists');
  const line = H.earningLines(g.st, g.c, g.yr, g.st.settings.accounts[1], '2026-01')[0];
  ok(/^Growth .* · not income$/.test(line),
    'the account is where it is said — got: ' + line);
});

t('a stated balance offers what the month must have grown', () => {
  /* The plan expected 10,201 having grown 101; the statement says 12,000. The
     residual has one candidate on an account whose every other figure is
     already in the computed balance, so the offer is exact rather than a guess
     at the shape of the answer: 10,100 opening + 1,900 = 12,000. */
  eq(H.impliedGrowth(12000, 10201, 101), 1900, 'the growth that lands on the statement');
  eq(H.impliedGrowth(10201, 10201, 101), null, 'a month that agrees offers nothing');
  eq(H.impliedGrowth(NaN, 10201, 101), null, 'nor an empty box');
  eq(H.impliedGrowth(12000, NaN, 101), null, 'nor a month with nothing computed');
  /* A market that fell is a real month, and the engine has always taken a
     negative figure here — so it is offered rather than clamped away. */
  eq(H.impliedGrowth(9000, 10201, 101), -1100, 'a fall is offered like a rise');
  eq(H.impliedGrowth(10100, 10201, 101), 0,
    'and "it grew nothing" is a claim the reader can make');
});

t('the offer says which way the market went, in words', () => {
  /* "Grew -$6,330.00" puts the minus sign where the verb should be, and a fall
     is half of what this feature is for. */
  eq(H.growthOfferLabel(1279.42), 'Say This Month Grew $1,279.42');
  eq(H.growthOfferLabel(-6330), 'Say This Month Fell $6,330.00', 'the word carries it');
  eq(H.growthOfferLabel(0), 'Say This Month Grew Nothing', 'which is a claim, not a blank');
  eq(H.growthOfferLabel(null), '', 'and nothing offered says nothing');
});

t('taking the offer closes the gap exactly, whatever was in the box', () => {
  /* The figure is INVARIANT to the growth box: it is measured against what the
     plan computed, not against what is typed over it. So the offer cannot
     chase its own tail as the reader edits, and putting it in reconciles. */
  const [typed, computed, grown] = [12000, 10201, 101];
  const implied = H.impliedGrowth(typed, computed, grown);
  const afterwards = H.round2(computed + (implied - grown));
  eq(afterwards, typed, 'the computed balance moves onto the stated one');
  ok(/^Matches the plan exactly/.test(H.reconcileNote(typed, afterwards)),
    'so the note stops quoting a gap the reader has just explained');
});

t('a past year states its growth, and states it as growth', () => {
  /* A pinned year computes nothing, so the figure is whatever was typed — but
     WHICH map it lands in still follows the account. An investment that
     appreciates today appreciated in 2021, which is why this reads forward
     where creditTo deliberately does not. */
  const st = H.coerceShape({ schema: H.SCHEMA, settings: { accounts: [
    { id: 'inv', name: 'Investments', rate: 0.07, earns: 'growth', hub: true } ] },
    years: { 2021: { kind: 'grid', model: 'pinned', startMonth: '2021-01', monthCount: 1,
      categories: [], cells: {}, paychecks: {}, seeds: {},
      overrides: { 'inv|2021-01': { v: 5000 } },
      balAdjust: { 'inv|2021-01': { interest: 400, dividend: 30 } } } } });
  const c = H.computeYear(st, '2021', null);
  eq(c.growth['inv|2021-01'], 400, 'the stated figure is the year\'s growth');
  eq(c.interest['inv|2021-01'], undefined, 'and it is not interest');
  eq(c.dividend['inv|2021-01'], 30, 'a dividend is money whatever the rate produces');
  const yr = st.years['2021'];
  eq(H.accountEarnings(c, yr, ['2021-01']).v, 30, 'only the dividend counts as income');
  eq(H.earningsOver(st, c, yr, st.settings.accounts[0], ['2021-01']).growth, 400,
    'the growth is on the account that made it');
  eq(c.balances['inv|2021-01'], 5000, 'and the stated balance is left exactly alone');
});

t('freezing a year writes the growth down rather than losing it', () => {

group('Dragging a budget row into place');
/* The ↑↓ buttons swap two neighbours; a drag lands a row anywhere in its
   section, which `swapRows` cannot express. */
const catYear = (...ids) => ({ categories: ids.map(id => ({ id, name: id, section: 'expense' })) });
const order = (yr) => yr.categories.map(c => c.id);
t('a row moves in front of the one it was dropped on', () => {
  const yr = catYear('a', 'b', 'c', 'd');
  H.moveRowBefore([yr], 'd', 'b');
  eq(order(yr), ['a', 'd', 'b', 'c']);
});
t('moving downwards lands where it was dropped, not one short', () => {
  /* Taking the row out shifts everything below it up by one, so an index read
     before the removal is off by one on every downward move. */
  const yr = catYear('a', 'b', 'c', 'd');
  H.moveRowBefore([yr], 'a', 'd');
  eq(order(yr), ['b', 'c', 'a', 'd']);
});
t('dropping past the last row means the end', () => {
  const yr = catYear('a', 'b', 'c');
  H.moveRowBefore([yr], 'a', null);
  eq(order(yr), ['b', 'c', 'a']);
});
t('dropping a row on itself changes nothing', () => {
  const yr = catYear('a', 'b', 'c');
  H.moveRowBefore([yr], 'b', 'b');
  eq(order(yr), ['a', 'b', 'c']);
});
t('the years ahead follow, by ID and never by index', () => {
  /* They were a snapshot taken at rollover, so a row can sit at a different
     position in each — moving by index would shuffle a year that merely
     happens to be shorter. */
  const now = catYear('a', 'b', 'c', 'd');
  const next = catYear('c', 'a', 'b', 'd');
  H.moveRowBefore([now, next], 'd', 'b');
  eq(order(now), ['a', 'd', 'b', 'c']);
  eq(order(next), ['c', 'a', 'd', 'b']);
});
t('accounts move in their own single list, shared by every year', () => {
  /* An account has one place in the plan — reordering it in 2026 reorders it
     in 2019 too, unlike a budget row, which is per year. */
  const accounts = [{ id: 'cash' }, { id: 'mid' }, { id: 'venmo' }, { id: 'chase' }];
  eq(H.moveInList(accounts, 'chase', 'mid'), true);
  eq(accounts.map(a => a.id), ['cash', 'chase', 'mid', 'venmo']);
  eq(H.moveInList(accounts, 'cash', null), true, 'dropped past the last one');
  eq(accounts.map(a => a.id), ['chase', 'mid', 'venmo', 'cash']);
});
t('moving something that is not there reports it rather than guessing', () => {
  const list = [{ id: 'a' }, { id: 'b' }];
  eq(H.moveInList(list, 'nope', 'a'), false);
  eq(H.moveInList(list, 'a', 'nope'), false);
  eq(list.map(x => x.id), ['a', 'b'], 'and leaves the list exactly as it was');
});
t('a year missing either row is left completely alone', () => {
  const now = catYear('a', 'b', 'c');
  const partial = catYear('a', 'c');
  H.moveRowBefore([now, partial], 'c', 'b');
  eq(order(now), ['a', 'c', 'b']);
  eq(order(partial), ['a', 'c'], 'no row to land in front of, so nothing moved');
  const noRow = catYear('x', 'y');
  H.moveRowBefore([noRow], 'c', 'x');
  eq(order(noRow), ['x', 'y']);
});

group('Zoom');
/* CSS zoom on the root, whole percents only. The bounds are not decoration:
   below 50% the grid's figures stop being legible on any screen, and above
   200% a month column no longer fits one. */
t('a percentage is taken as a whole number, within the bounds', () => {
  eq(H.zoomPct(137), 137);
  eq(H.zoomPct('125'), 125, 'a select hands back a string');
  eq(H.zoomPct(137.4), 137, 'whole percents only');
  eq(H.zoomPct(137.6), 138);
});
t('out of range is clamped rather than refused', () => {
  eq(H.zoomPct(10), H.ZOOM_MIN, 'unreadable is not an option worth offering');
  eq(H.zoomPct(1000), H.ZOOM_MAX);
  eq(H.zoomPct(H.ZOOM_MIN), H.ZOOM_MIN, 'the bounds themselves are allowed');
  eq(H.zoomPct(H.ZOOM_MAX), H.ZOOM_MAX);
});
/* ── What a chart is measured at ────────────────────────────────────────────
   The fifth thing CSS zoom breaks, and the one that only shows as a scrollbar
   into a band of nothing. Chart.js measures its container with
   `getBoundingClientRect()` — SCREEN pixels, zoom included — and writes the
   answer back as an inline `style.width`, which is read in the element's own
   PRE-zoom pixels, so every chart came out `zoom` times too wide.
   The arithmetic is pinned here rather than the patch, because the patch needs
   a canvas, a layout and a zoom to observe and this needs none of them. The
   figures below are the ones actually measured on the Progress tab at 150%. */
t('a chart measured under zoom is put back into its own pixels', () => {
  const got = H.zoomedSize({ width: 1324, height: 441 }, 1.5);
  approx(got.width, 882.67, 'the container’s real CSS width, not its screen width');
  approx(got.height, 294);
});
t('an unzoomed page is handed back untouched, object and all', () => {
  /* This sits on the resize path of every chart in the app, and the ordinary
     page has nothing to correct — so the identity case must cost nothing and
     must not mint a new object for Chart.js to compare against. */
  const size = { width: 651, height: 260 };
  ok(H.zoomedSize(size, 1) === size, 'the same object, not a copy of it');
  ok(H.zoomedSize(size, 1.0004) === size, 'and float dust is not a zoom');
});
t('nothing to measure, or no scale to measure by, changes nothing', () => {
  /* A guard, not politeness: `getMaximumSize` can be reached before there is
     anything to size, and dividing by a zero scale would hand Chart.js an
     Infinity to lay a canvas out at. */
  eq(H.zoomedSize(null, 1.5), null);
  eq(H.zoomedSize(undefined, 1.5), undefined);
  const size = { width: 10, height: 10 };
  ok(H.zoomedSize(size, 0) === size);
  ok(H.zoomedSize(size, NaN) === size);
});
t('nonsense falls back to full size, never to zero', () => {
  eq(H.zoomPct('abc'), 100);
  eq(H.zoomPct(''), 100, 'an empty stored value is not 0%');
  eq(H.zoomPct(null), 100);
  eq(H.zoomPct(undefined), 100);
  eq(H.zoomPct(NaN), 100);
});
t('the quarter-step presets are all reachable', () => {
  for (const p of [50, 75, 100, 125, 150, 175, 200]) eq(H.zoomPct(p), p);
});

group('Which rows count as pay');
/* It guessed from the row's NAME against an English word list, so "Income" or

  eq(H.isPayRow('Income', 'none', true), true);

t('and can say it is NOT pay, which the guess cannot express', () => {
  eq(H.isPayRow('Salary', 'none', false), false,
