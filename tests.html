group('Keeping the toolbars on screen');

/* Charles asked for this on 2026-09-01: a way to pin and unpin the two rows of
   chrome — the nine view tabs, and the Budget's year/month strip — so they stay
   at the top while a long grid scrolls under them. The app header above them
   was already sticky; these two were not.

   Four decisions are pinned here because each of them is a thing a later tidy-up
   would undo without knowing it was a decision: the offsets are MEASURED and
   never written down, the rows are painted so nothing scrolls through them, they
   are layered between the grid's own sticky heading and the full-screen chart,
   and a phone pins ONE row rather than two. */

t('the two bars pin one under the other, each told where by a measured number', () => {
  ok(APP_SRC, 'index.html was not read — the fetch test above must run first');
  const css = stripComments(APP_SRC);
  const rule = (sel) => {
    const m = css.match(new RegExp(sel.replace(/[.[\]]/g, '\\$&') + '\\s*\\{([^}]*)\\}'));
    return m ? m[1] : '';
  };
  const row = rule('html[data-pin] .tabrow'), strip = rule('html[data-pin] .yearstrip');
  ok(/position: sticky/.test(row), 'the tab row sticks when the pin is on', row);
  ok(/position: sticky/.test(strip), 'and so does the year strip', strip);
  /* The whole point. The app header wraps to two or three rows on a phone and
     the tab row rewraps whenever the tabs are reordered, so there is no number
     to write down — a literal here is wrong on the first phone that opens the
     page. */
  ok(/top: var\(--tabs-top/.test(row) && /top: var\(--strip-top/.test(strip),
     'both read their offset from a property measurePinTops writes, so neither '
     + 'can be wrong when the header wraps');
  ok(!/top:\s*\d+px/.test(row) && !/top:\s*\d+px/.test(strip),
     'and neither hard-codes a height it cannot know');
});

t('a pinned bar is painted UNDER the chart overlay and OVER the grid heading', () => {
  const css = stripComments(APP_SRC);
  const z = (sel) => {
    const m = css.match(new RegExp(sel.replace(/[.#[\]]/g, '\\$&') + '\\s*\\{([^}]*)\\}'));
    const n = m && m[1].match(/z-index:\s*(\d+)/);
    return n ? +n[1] : null;
  };
  const row = z('html[data-pin] .tabrow'), strip = z('html[data-pin] .yearstrip');
  const overlay = z('#chartMaxi'), head = z('header'), gridHead = z('.grid thead th.lbl');
  /* Every figure is READ OUT of the app, so renumbering any one of them fails
     here rather than quietly re-ordering the page. */
  ok(row && strip && overlay && head && gridHead,
     'all five layers still declare a z-index', JSON.stringify({ row, strip, overlay, head, gridHead }));
  /* .gridwrap is `position: relative` with NO z-index, so it is not a stacking
     context: the grid's own sticky heading competes with these out in the root.
     Below it and the heading row paints straight over the pinned chrome. */
  ok(row > gridHead && strip > gridHead,
     'the pinned bars paint over the grid’s own sticky heading, which is not in a '
     + 'stacking context of its own', `${row}/${strip} vs ${gridHead}`);
  /* A maximised chart covers the page and .wrap is inert underneath it. Chrome
     showing through would look live and answer nothing. */
  ok(row < overlay && strip < overlay,
     'and under the full-screen chart, which covers a page nobody can click',
     `${row}/${strip} vs ${overlay}`);
  ok(overlay < head, 'the header still sits above the overlay, which is that feature’s '
     + 'whole point — "with the menu still visible"');
});

t('a pinned bar paints, in a pack colour, over the band it used to leak through', () => {
  const css = stripComments(APP_SRC);
  const rule = (sel) => {
    const m = css.match(new RegExp(sel.replace(/[.[\]]/g, '\\$&') + '\\s*\\{([^}]*)\\}'));
    return m ? m[1] : '';
  };
  const row = rule('html[data-pin] .tabrow'), strip = rule('html[data-pin] .yearstrip');
  /* .yearstrip has no background of its own at all, so unpainted the grid
     scrolled straight through it. --bg and not --bg-card: these rows sit ON the
     page and show --bg through already, so pinning changes nothing except that
     content stops showing through. */
  ok(/background: var\(--bg\)/.test(row) && /background: var\(--bg\)/.test(strip),
     'both bars are opaque in the page’s own colour');
  /* A margin is transparent, so between two pinned bars the page scrolled
     through a 20px window. Same height, owned by the bar that has to paint it. */
  ok(/margin-bottom: 0/.test(row) && /padding-bottom: \d+px/.test(row),
     'the tab row’s bottom margin became padding, so the band between the two bars '
     + 'belongs to something that paints it', row);
  ok(/margin-bottom: 0/.test(strip) && /padding-bottom: \d+px/.test(strip),
     'and the strip’s did too');
  /* Bounded by two SELECTORS, not by the section banner: the comments are
     already gone by here, so a banner is not there to slice at and the section
     silently ran to the end of the file. */
  const from = css.indexOf('.pinbtn {'), to = css.indexOf('.yearstrip { display: flex');
  const section = from >= 0 && to > from ? css.slice(from, to) : '';
  ok(section.length > 200 && section.length < 4000,
     'the pinned-toolbar section was found, and only it', section.length);
  ok(!/#[0-9a-fA-F]{3,8}\b|rgba?\(/.test(section),
     'and it mints no colour of its own — every one is a pack token');
});

t('nothing between the year strip and the window clips it', () => {
  const css = stripComments(APP_SRC);
  /* `position: sticky` is INERT if any ancestor scrolls or paints into a box of
     its own, and the strip is drawn into #views in the year lens and one level
     deeper into .tipzone in the month lens. Today none of these four declares
     anything that would break it — and .tipzone works only because nobody has
     ever written a rule for it. This is the test that keeps it that way. */
  const hazard = /(^|[\s;])(overflow|overflow-x|overflow-y|contain|transform|filter|perspective)\s*:/;
  for (const sel of ['.wrap', 'main', '#views', '.tipzone']) {
    const re = new RegExp('(^|\\})\\s*' + sel.replace(/[.#]/g, '\\$&') + '\\s*\\{([^}]*)\\}', 'm');
    const m = css.match(re);
    const body = m ? m[2] : '';
    ok(!hazard.test(body),
       sel + ' must not clip or paint into a box of its own, or the pinned strip '
       + 'silently stops sticking', body.trim());
  }
});

t('a phone pins one bar, not two', () => {
  const css = stripComments(APP_SRC);
  /* Measured on an 812pt screen: the header wraps to two or three rows, the tab
     row is about 44 and the strip becomes two stacked lines at about 84 — a
     third of the screen gone to chrome before a figure appears. The tab row
     alone buys the thing a phone reader wants, which is changing tab without
     scrolling back up. */
  const blocks = [...css.matchAll(/@media \(max-width: 700px\) \{([\s\S]*?)\n\}/g)].map(m => m[1]);
  const b = blocks.find(x => x.includes('html[data-pin]'));
  ok(b, 'the phone has a rule of its own for the pinned bars');
  ok(/html\[data-pin\] \.yearstrip \{[^}]*position: static/.test(b),
     'and it sends the year strip back to `static`, so only the tab row is held',
     (b || '').trim());
  ok(!/\.tabrow \{[^}]*position: static/.test(b),
     'the tab row stays pinned there — it is the one that earns its 44px');
});

t('paper is never pinned', () => {
  const css = stripComments(APP_SRC);
  const print = css.slice(css.indexOf('@media print'));
  /* theme.css un-sticks `header` for every app in the family and hides
     [role="tablist"], which takes the tabs with it — but the year strip is this
     app's own and genuinely prints, so the pack cannot reach it. A pinned bar
     prints ONCE, over whatever the first page starts with. */
  ok(/\.tabrow, \.yearstrip \{ position: static !important; \}/.test(print),
     'both bars are un-stuck on paper, because the pack can only reach the header');
  ok(/class="pinbtn no-print"/.test(APP_SRC),
     'and the pin button wears the pack’s own handle for app furniture');
});

t('the measurer divides by the zoom, and is re-run wherever the boxes can move', () => {
  const js = stripComments(APP_SRC);
  const fn = (name) => {
    const i = js.indexOf('function ' + name + '(');
    if (i < 0) return '';
    let d = 0, started = false;
    for (let k = i; k < js.length; k++) {
      if (js[k] === '{') { d++; started = true; }
      else if (js[k] === '}') { d--; if (started && d === 0) return js.slice(i, k + 1); }
    }
    return '';
  };
  const m = fn('measurePinTops');
  ok(m, 'measurePinTops is still a function declaration the suite can slice out');
  /* A rectangle is read in VISUAL pixels, which the zoom has already scaled;
     `top` is written in layout pixels, which it is about to scale again. The
     same correction the grid header and the maximised chart make. */
  ok(/zoomScale \|\| 1/.test(m), 'it divides every offset by the page zoom', m.slice(0, 200));
  ok(/getComputedStyle\(el\)\.position === 'sticky'/.test(js),
     'and it asks the CASCADE which rows are actually stuck, rather than copying '
     + 'the 700px breakpoint into script where the two could drift apart');
  /* render() has TWO exits, and the early one is the path that HIDES the tab
     row — which is exactly the box the second offset is measured from. */
  const r = fn('render');
  const calls = (r.match(/measurePinTops\(\)/g) || []).length;
  ok(calls >= 2, 'render() measures on BOTH its exits, the welcome-card return included',
     calls + ' call(s)');
  ok(/measurePinTops\(\)/.test(fn('applyZoom')),
     'applyZoom re-measures: the divisor changed even though no box moved');
  ok(/addEventListener\('resize', measurePinTops\)/.test(js), 'a resize re-measures');
  ok(/new ResizeObserver\(\(\) => \{ measurePinTops\(\)/.test(js),
     'and an observer catches the header and the tab row re-wrapping for reasons '
     + 'that are not a window resize — a reordered tab, a font arriving');
});

t('the pin is this device’s answer, and never travels', () => {
  const js = stripComments(APP_SRC);
  ok(/const PIN_KEY\s*=\s*'fin-pin'/.test(js), 'it lives in a localStorage key of its own');
  /* state.settings travels IN FULL in a share link, so a preference kept there
     would arrive uninvited on somebody else's screen. It describes a SCREEN,
     not a plan — the argument ZOOM_KEY already makes. */
  const payload = js.slice(js.indexOf('function buildSharePayload'));
  ok(!/pinBars|PIN_KEY/.test(payload.slice(0, 2000)),
     'and never in a share link, which carries every one of state.settings');
  ok(!/settings\.pinBars/.test(js), 'it is not in the state at all, so no backup can carry it');
});

/* IT NEEDS ITS OWN FRAME, and a real one — the suite's shared frame is 1x1px,
   so every rectangle read from it is zero and `0 >= 0` passes on a page that was
   never laid out. That is the trap this test exists to avoid, because the thing
   it checks is a COLLISION between two pieces of geometry: pinGridHeader() used
   to stop the grid's month headings at the bottom of the HEADER, and with the
   toolbars pinned they have to stop at the bottom of the lowest pinned bar or
   they slide underneath it — the one row telling you which column is which is
   the row that disappears. A CSS string cannot see that. */
t('the grid heading parks under the LOWEST pinned bar, not under the header', async () => {
  const f = document.createElement('iframe');
  f.setAttribute('data-fin-tests', '');       // or index.html busts out of the frame
  f.setAttribute('aria-hidden', 'true');
  f.style.cssText = 'position:absolute;left:-9999px;width:1280px;height:900px;border:0';
  await new Promise((resolve) => {
    f.onload = resolve;
    f.src = 'index.html?pin=' + Date.now();
    document.body.appendChild(f);
  });
  try {
    const W = f.contentWindow, D = W.document;
    W.save = () => {};
    W.confirm = () => true;
    W.alert = () => {};
    ok(typeof W.loadSample === 'function', 'the app must expose loadSample to the frame');
    W.loadSample();

    const box = (sel) => D.querySelector(sel).getBoundingClientRect();
    const settle = () => { void D.body.offsetHeight; W.pinnedShift = -1; W.pinGridHeader(); };

    /* Unpinned first, so the figures below are read against the behaviour this
       replaces rather than against nothing. */
    W.applyPin(false);
    D.documentElement.scrollTop = 700;
    settle();
    const loose = { head: box('header').bottom, th: box('.grid thead th').top };
    ok(loose.head > 0, 'the frame really laid out — a 1x1 frame reads every rectangle as 0',
       loose.head);
    ok(Math.abs(loose.th - loose.head) <= 1,
       'unpinned, the headings still park at the app header exactly as they always did',
       `${loose.th} vs ${loose.head}`);

    W.applyPin(true);
    D.documentElement.scrollTop = 700;
    settle();
    const head = box('header'), row = box('.tabrow'), strip = box('.yearstrip');
    const th = box('.grid thead th');
    /* The bars are genuinely stuck, and stacked in the right order. */
    eq(W.getComputedStyle(D.querySelector('.tabrow')).position, 'sticky',
       'the tab row is stuck');
    ok(Math.abs(row.top - head.bottom) <= 1,
       'the tab row sits exactly at the bottom of the header, with no seam',
       `${row.top} vs ${head.bottom}`);
    ok(Math.abs(strip.top - row.bottom) <= 1,
       'and the strip exactly at the bottom of the tab row',
       `${strip.top} vs ${row.bottom}`);
    /* THE COLLISION. Against the old header-only stop this lands at head.bottom
       and the headings sit behind the year chips. */
    ok(Math.abs(th.top - strip.bottom) <= 1,
       'the month headings stop at the bottom of the pinned STRIP — under the old '
       + 'header-only stop they parked on the header and hid behind the year chips',
       `${th.top} vs ${strip.bottom}`);
    ok(th.top > head.bottom + 1,
       'and emphatically not at the header, which is where they used to land',
       `${th.top} vs ${head.bottom}`);

    /* Pinning is paint and position, nothing else: no render(), so the reader
       keeps their scroll place and their focus. A copy of applyZoom would
       regress exactly this. */
    const before = D.getElementById('views').innerHTML;
    const y = D.documentElement.scrollTop;
    W.applyPin(false); W.applyPin(true);
    eq(D.getElementById('views').innerHTML === before, true,
       'toggling the pin redraws nothing — it never calls render()');
    eq(D.documentElement.scrollTop, y, 'and leaves the reader where they were');
  } finally { f.remove(); }
});

group('One chart, filling the window');

/* Charles asked for this on 2026-08-30: a button on every chart that fills the
   window with it, the way Flow Metrics has done since 2026-08-21. The phrase
   that shaped that feature — "with the menu still visible" — is the whole
   design, and it is why this is a plain overlay under a sticky header rather
   than the Fullscreen API or a modal <dialog>, both of which take the header
   away. The first assertions here are what stop a later tidy-up from quietly
   turning it into one of those.

   Since 2026-09-01 the header is not the only sticky thing up there: the tab row
   and the year strip pin too, when the reader asks for it. They are deliberately
   layered BELOW this overlay — .wrap is inert while a chart is up, so chrome
   showing through would look live and answer nothing — and the group "Keeping
   the toolbars on screen" above owns that assertion.

   IT NEEDS ITS OWN FRAME, and a real one. The suite's shared frame is 1x1px, so
   every rectangle read from it is zero and "the chart got taller" passes on a
   chart that was never laid out (the trap the sync-pin test above records). This
   one is 1280x900 with the sample plan in it. `save` and `confirm` are stubbed
   before anything is pressed, for the reason the smoke walk gives: choosing a
   tab writes, and the shared origin holds a real plan. */
t('a chart fills the window under a header that stays live', async () => {
  const f = document.createElement('iframe');
  f.setAttribute('data-fin-tests', '');       // or index.html busts out of the frame
  f.setAttribute('aria-hidden', 'true');
  f.style.cssText = 'position:absolute;left:-9999px;width:1280px;height:900px;border:0';
  await new Promise((resolve) => {
    f.onload = resolve;
    f.src = 'index.html?maxi=' + Date.now();
    document.body.appendChild(f);
  });
  try {
    const W = f.contentWindow, D = W.document;
    W.save = () => {};
    W.confirm = () => true;
    W.alert = () => {};
    ok(typeof W.loadSample === 'function', 'the app must expose loadSample to the frame');
    W.loadSample();

    const overlay = D.getElementById('chartMaxi');
    ok(overlay, 'the page carries the overlay a maximised card is moved into');
    eq(W.getComputedStyle(D.querySelector('header')).zIndex, '20',
       'the header sits on a layer of its own');
    ok(Number(W.getComputedStyle(overlay).zIndex) < 20,
       'and the overlay is painted UNDER it, so the row of controls stays visible and '
       + 'clickable', W.getComputedStyle(overlay).zIndex);
    ok(!D.querySelector('.wrap').contains(overlay),
       'the overlay is outside .wrap — which is marked inert while it is open');
    ok(overlay.tagName === 'DIV',
       'and it is a plain div: a real <dialog> is promoted to the top layer, which would '
       + 'paint over the very header this exists to keep', overlay.tagName);

    /* Progress is the tab that carries six of the fourteen charts. */
    D.getElementById('tab-goals').click();
    await new Promise((r) => setTimeout(r, 300));

    const cardOf = (id) => D.getElementById(id).closest('.card');
    const withCharts = [...D.querySelectorAll('#views .chartbox canvas')]
      .map((c) => c.closest('.card'));

    /* ── The tooltip wears the theme ────────────────────────────────────────
       Asked for on 2026-08-30, after the full-screen work: Chart.js's own
       bubble is a hard-coded 80%-black box with white text, which is legible on
       Midnight and is the wrong object on Light and Sepia. Checked here rather
       than in a frame of its own, because this one already has six real charts
       drawn in it. Flow Metrics and Sprint Predictability have shipped these
       exact six values for a long time. */
    /* Through chartIn(), not through `charts`: that is a top-level `let`, which
       — unlike a function declaration — is not a property of the frame's window,
       so the suite cannot see it. chartIn is the app's own lookup. */
    const themed = withCharts
      .map((card) => W.chartIn(card))
      .filter(Boolean)
      .map((ch) => ch.options.plugins.tooltip);
    ok(themed.length >= 6, 'the Progress tab drew charts to read the tooltip off',
       themed.length);
    ok(themed.every((t) => !/rgba\(0,\s*0,\s*0/.test(String(t.backgroundColor))),
       'not one chart is left on Chart.js\'s hard-coded black bubble',
       String((themed.find((t) => /rgba\(0/.test(String(t.backgroundColor))) || {}).backgroundColor));
    ok(themed.every((t) => t.borderWidth === 1 && t.padding === 10),
       'and every one carries the family\'s border and padding');
    const th = W.chartTooltipTheme();
    ok(themed.every((t) => t.backgroundColor === th.backgroundColor
                        && t.bodyColor === th.bodyColor),
       'all six painted from the same block, so none of them can drift alone');
    /* The merge is one level deeper than the options default above it, and this
       is why: nearly every chart here passes its own plugins.tooltip with a
       label callback in it, and a shallow assign would drop the theme. */
    ok(themed.every((t) => typeof t.callbacks.label === 'function'),
       'and every chart still has its own label callback — the theme was MERGED '
       + 'into plugins.tooltip, not assigned over it');

    /* ── Chart text is on the ramp, and in the app's own face ───────────────
       Chart text is painted onto a canvas, so it inherits nothing: every size in
       a Chart.js config is a raw number of pixels, which is the one thing the
       rem ramp exists to stop the page containing. Until 2026-08-30 every chart
       here ran at Chart.js's built-in 12px in Chart.js's built-in Helvetica —
       off the ramp entirely, and in a typeface the page is not set in. */
    const ramp = W.fsPx('xs');
    ok(ramp > 0, 'the frame resolves the chrome step to pixels', ramp);
    eq(W.Chart.defaults.font.size, ramp, 'the chart default is the ramp\'s xs step:');
    eq(W.Chart.defaults.font.family, W.getComputedStyle(D.body).fontFamily,
       'and the face is the one the page is set in, not Chart.js\'s Helvetica:');
    ok(themed.every((t) => t.bodyFont.size === ramp && t.titleFont.size === ramp),
       'and every tooltip is drawn at it — the default has to be set BEFORE the '
       + 'chart is constructed, because Chart.js copies it in at that moment',
       JSON.stringify(themed.map((t) => t.bodyFont.size)));
    ok(themed.every((t) => t.bodyFont.family === W.Chart.defaults.font.family),
       'in the same face');
    ok(withCharts.length >= 6, 'the sample plan draws the whole Progress tab', withCharts.length);
    eq(D.querySelectorAll('#views .chart-max').length, withCharts.length,
       'every card that draws a chart carries a button, and nothing else does');
    /* The COMPUTED DISPLAY, never the `hidden` property. `.chart-max` declares
       `display: flex`, and an author rule beats the browser's own
       `[hidden] { display: none }` whatever their specificities — so the
       attribute read true while the button sat there on screen. That is exactly
       how a folded card came to offer a button that did nothing (Charles,
       2026-08-30), and an assertion on `.hidden` is deaf to it. */
    const shown = (btn) => W.getComputedStyle(btn).display !== 'none';
    ok([...D.querySelectorAll('#views .chart-max')].every(shown),
       'and every one of them is on offer, because every one has a chart under it');

    /* The button is in the heading BAND, not floating over the card's top-right
       corner where the siblings put theirs: here that corner IS the fold
       control. `margin-left: auto` is what holds it at the far end, well clear
       of the ⓘ beside the words. */
    const spend = cardOf('spendChart');
    const btn = spend.querySelector('.chart-max');
    eq(btn.parentElement.tagName + '.' + btn.parentElement.className, 'H2.boxhead',
       'the button hangs off the heading band');
    /* Measured, not read off `margin-left`: getComputedStyle resolves `auto` to
       the px it worked out to, so asserting the declaration would be asserting
       the layout engine's arithmetic instead of where the button ended up. */
    const bandRight = btn.closest('h2').getBoundingClientRect().right;
    const inFromEdge = bandRight - btn.getBoundingClientRect().right;
    ok(inFromEdge >= 0 && inFromEdge <= 24,
       'pushed to the far end of the band', Math.round(inFromEdge) + 'px in from the edge');
    /* And well clear of the ⓘ, which stays beside the words it explains. Where
       the Money Goes is one of the headings that carries both. */
    const dotted = cardOf('mixChart');
    const dot = dotted.querySelector(':scope > h2 .tile-help');
    ok(dot, 'Where the Money Goes carries an info dot as well as the new button');
    ok(dot.getBoundingClientRect().right
         < dotted.querySelector('.chart-max').getBoundingClientRect().left - 40,
       'with real space between the two, so neither is mistaken for the other at a glance',
       Math.round(dotted.querySelector('.chart-max').getBoundingClientRect().left
                  - dot.getBoundingClientRect().right) + 'px apart');

    /* ── A REAL press, not a synthetic one ──────────────────────────────────
       THIS is the assertion that would have caught the bug Charles found within
       the hour on 2026-08-30: pressing the button folded the card instead of
       filling the window. `btn.click()` is blind to it, because that makes the
       BUTTON the event's target. A real pointer lands on the `<path>` inside
       the icon; the handler then rewrites that icon, which DETACHES the path the
       click landed on; the event carries on bubbling to the heading band, whose
       fold handler asks `e.target.closest('button')` whether the press belonged
       to a control, and a detached node has no ancestors, so the answer is null
       and the band folds the card.

       Two guards, and both are asserted, because either alone would leave the
       other free to rot: the icon takes `pointer-events: none`, so what a
       pointer actually hits is the button, and the handler stops the click, so
       the band never sees a press that was not its own. The press below is
       driven the way a browser drives one — ask what is under the middle of the
       button, and dispatch on that. */
    const pressTarget = (card) => {
      const b = card.querySelector('.chart-max');
      b.scrollIntoView({ block: 'center' });
      const r = b.getBoundingClientRect();
      return D.elementFromPoint(Math.round(r.left + r.width / 2),
                                Math.round(r.top + r.height / 2));
    };
    const eoy = cardOf('eoyChart');
    ok(pressTarget(eoy) === eoy.querySelector('.chart-max'),
       'what a pointer hits in the middle of the button IS the button — the icon takes '
       + 'pointer-events: none, so rewriting it mid-click cannot orphan the target',
       (pressTarget(eoy) || {}).tagName);
    /* And the worst case anyway: a click that really did start on the path. */
    eoy.querySelector('.chart-max svg path')
       .dispatchEvent(new W.MouseEvent('click', { bubbles: true }));
    await new Promise((r) => setTimeout(r, 200));
    ok(W.maxiCard() === eoy, 'a press on the icon itself fills the window');
    ok(!eoy.classList.contains('boxshut'),
       'and does NOT fold the card — the click stops at the button, so the heading band '
       + 'that folds it never sees a press that was not its own');
    W.closeMaxi();
    await new Promise((r) => setTimeout(r, 150));
    ok(!eoy.classList.contains('boxshut'), 'and the card is still open on the page');

    /* Moved, not copied. A second canvas up here would leave every redraw — a
       theme change, a zoom change — painting the one nobody is looking at. */
    const home = { parent: spend.parentElement,
                   at: [...spend.parentElement.children].indexOf(spend) };
    const live = W.chartIn(spend);
    ok(live, 'the card has a live Chart.js instance behind it');
    btn.click();
    await new Promise((r) => setTimeout(r, 200));
    ok(spend.parentElement === overlay, 'pressing it moves the card into the overlay');
    ok(W.maxiCard() === spend, 'and the app knows which card is up');
    ok(W.chartIn(spend) === live, 'the same chart instance — the card was moved, not copied');
    ok(live.canvas === spend.querySelector('canvas'),
       'and it still owns the canvas that is now on screen');
    ok(overlay.classList.contains('open'), 'the overlay is showing');
    ok(D.querySelector('.wrap').inert, 'the page underneath is out of the tab order');
    ok(D.body.classList.contains('maxi-open'), 'and it is not scrolling behind the chart');
    eq(W.getComputedStyle(D.documentElement).getPropertyValue('--maxi-top').trim(),
       Math.round(D.querySelector('header').getBoundingClientRect().height) + 'px',
       'the overlay starts exactly where the header ends — measured, never guessed');
    ok(/Leave full screen/.test(btn.getAttribute('aria-label')),
       'the button now says how to get out', btn.getAttribute('aria-label'));

    /* THE CHART ACTUALLY GOT BIGGER. Without this the whole group could pass on
       a card that was moved into a box with no height — the 1x1-frame failure,
       written as an assertion. */
    const boxH = spend.querySelector('.chartbox').getBoundingClientRect().height;
    ok(boxH > 400, 'and the chart box fills what is left of the window', Math.round(boxH));

    btn.click();
    await new Promise((r) => setTimeout(r, 200));
    ok(spend.parentElement === home.parent, 'pressing it again puts the card back');
    eq([...spend.parentElement.children].indexOf(spend), home.at,
       'in the same place on the tab it came from');
    eq(D.querySelectorAll('.chart-slot').length, 0, 'and the placeholder is cleared away');
    ok(W.maxiCard() === null, 'nothing is maximised');
    ok(!D.querySelector('.wrap').inert, 'the page is reachable again');
    ok(!D.body.classList.contains('maxi-open'), 'and scrolling again');

    /* Escape is the second way out; a click on the backdrop is the third, and is
       this app's rule for every dialog — which is why the overlay keeps a margin
       round the card for that click to land on. */
    btn.click();
    await new Promise((r) => setTimeout(r, 150));
    D.dispatchEvent(new W.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    ok(W.maxiCard() === null, 'Escape closes it');
    ok(Number(W.getComputedStyle(overlay).paddingTop.replace('px', '')) > 0,
       'and there is a margin round the card for a click-outside to land on');

    /* …but not while a dialog is open on top of it. A ⓘ pressed on a maximised
       chart is exactly that case, and Escape there belongs to the dialog. */
    btn.click();
    await new Promise((r) => setTimeout(r, 150));
    const help = D.getElementById('helpDialog');
    help.showModal();
    D.dispatchEvent(new W.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    ok(W.maxiCard() === spend, 'Escape with a dialog open leaves the chart up');
    help.close();
    W.closeMaxi();

    /* A card that carries a table under its chart shows the CHART. Four of the
       fourteen do, and letting forty rows of spending push the bars into a strip
       would answer the opposite question to the one that was asked. */
    const mix = cardOf('mixChart');
    mix.querySelector('.chart-max').click();
    await new Promise((r) => setTimeout(r, 200));
    eq(W.getComputedStyle(mix.querySelector('.tablewrap')).display, 'none',
       'the table under Where the Money Goes stays on the page it came from');
    ok(mix.querySelector('.chartbox').getBoundingClientRect().height > 400,
       'so the bars get the window');
    W.closeMaxi();
    await new Promise((r) => setTimeout(r, 150));
    eq(W.getComputedStyle(mix.querySelector('.tablewrap')).display, 'block',
       'and it is back the moment the window comes down');

    /* ── The two things this app has to do that its siblings do not ──────────
       render() replaces the whole of #views, so a maximised card would be
       orphaned and its placeholder thrown away with the markup around it.
       Changing the ZOOM re-renders, and the zoom picker is in the header that
       deliberately stays live over a maximised chart — so this is the ordinary
       path, not an edge case. */
    const flow = cardOf('flowChart');
    flow.querySelector('.chart-max').click();
    await new Promise((r) => setTimeout(r, 200));
    const beforeZoom = W.chartIn(W.maxiCard());
    const zoomSel = D.getElementById('zoomSel');
    zoomSel.value = '150';
    zoomSel.dispatchEvent(new W.Event('change', { bubbles: true }));
    await new Promise((r) => setTimeout(r, 400));
    ok(W.maxiCard(), 'a re-render under a maximised chart leaves it up');
    eq(W.maxiCard().querySelector('canvas').id, 'flowChart',
       'showing the same chart, found again by its canvas id');
    ok(W.chartIn(W.maxiCard()) !== beforeZoom,
       'and it is the REBUILT chart — the card up here is the one being drawn into, '
       + 'which is the whole reason the card is moved rather than copied');
    eq(D.querySelectorAll('.chart-slot').length, 1,
       'with exactly one placeholder holding its seat, not one per render');
    /* The overlay is pinned to the header's measured height, and the two are in
       different units once the page is zoomed: a rectangle is read in visual
       pixels, `top` is written in layout pixels. Getting that wrong leaves a
       band of page showing under the menu, or the menu covered. */
    const gap = Math.abs(D.querySelector('header').getBoundingClientRect().bottom
                       - overlay.getBoundingClientRect().top);
    ok(gap <= 1, 'and it still starts exactly where the header ends at 150% zoom',
       gap.toFixed(2) + 'px out');
    zoomSel.value = '100';
    zoomSel.dispatchEvent(new W.Event('change', { bubbles: true }));
    await new Promise((r) => setTimeout(r, 400));

    /* The theme picker is in the header this overlay leaves live, so a tooltip
       that did not follow it would be visible from up here. Light is the case
       that matters: the old bubble was near-black on a paper-coloured card. */
    const themeSel = D.getElementById('themeSel');
    const wasTheme = themeSel.value;
    themeSel.value = 'light';
    themeSel.dispatchEvent(new W.Event('change', { bubbles: true }));
    await new Promise((r) => setTimeout(r, 500));
    const lightChart = W.chartIn(cardOf('eoyChart'));
    const lightTip = lightChart && lightChart.options.plugins.tooltip;
    ok(lightTip, 'a chart is drawn on the Light theme');
    eq(lightTip.backgroundColor, W.chartTooltipTheme().backgroundColor,
       'the tooltip repaints with the theme picker:');
    ok(!/#0|rgba\(0/.test(String(lightTip.backgroundColor)),
       'and is not a slab of near-black on a paper-coloured card',
       String(lightTip.backgroundColor));
    themeSel.value = wasTheme;
    themeSel.dispatchEvent(new W.Event('change', { bubbles: true }));
    await new Promise((r) => setTimeout(r, 500));

    /* The header stays live, so the case that must not be left standing is the
       chart going away underneath it. Changing tab from up there is how anybody
       would meet it. */
    ok(W.maxiCard(), 'still up at 100% again');
    D.getElementById('tab-comp').click();
    await new Promise((r) => setTimeout(r, 400));
    ok(W.maxiCard() === null,
       'a tab with no such chart on it brings the window down rather than holding an '
       + 'orphaned card up');
    ok(!D.querySelector('.wrap').inert, 'with the page handed back');
    eq(D.querySelectorAll('.chart-slot').length, 0, 'and no placeholder left behind');

    /* The other thing that changes what is drawable without re-rendering: a card
       folded up to its heading has its canvas inside a display:none body. The
       maximised card's own heading is on screen up there, fold control and all,
       so this is reachable from inside the overlay. */
    const comp = cardOf('compChart');
    comp.querySelector('.chart-max').click();
    await new Promise((r) => setTimeout(r, 200));
    ok(W.maxiCard() === comp, 'the raises chart fills the window');
    W.maxiCard().querySelector('.box-toggle').click();
    await new Promise((r) => setTimeout(r, 200));
    ok(W.maxiCard() === null, 'folding it from up there brings the window down with it');
    ok(comp.classList.contains('boxshut'), 'and the card is folded on the page it went back to');
    ok(!shown(comp.querySelector('.chart-max')),
       'a folded card offers no button: there is nothing under it to fill a window with, '
       + 'and a button that does nothing is worse than no button');
    eq(Math.round(comp.querySelector('.chart-max').getBoundingClientRect().width), 0,
       'and it takes no room on the heading band it has gone from');
    comp.querySelector('.box-toggle').click();
    await new Promise((r) => setTimeout(r, 200));
    ok(shown(comp.querySelector('.chart-max')), 'and unfolding it offers the button again');

    /* A card folded before the page was even drawn — `ui.collapsed` restores it
       on load, and that path never goes through setBoxShut at all. */
    comp.querySelector('.box-toggle').click();
    await new Promise((r) => setTimeout(r, 200));
    W.render();
    await new Promise((r) => setTimeout(r, 300));
    const redrawn = cardOf('compChart');
    ok(redrawn.classList.contains('boxshut'), 'it is still folded after a re-render');
    ok(!shown(redrawn.querySelector('.chart-max')),
       'and its button is still gone — the rule has to hold on the drawing path too, '
       + 'not only on the press that folded it');
    redrawn.querySelector('.box-toggle').click();
    await new Promise((r) => setTimeout(r, 200));

    /* ── On a phone the card's own paragraph is the thing in the way ─────────
       The frame is narrowed rather than a second one booted: a media query is
       evaluated against the FRAME's viewport, so this is the real rule firing,
       not a string found in the source. Money In vs Money Out is the worst
       case — six lines of sub AND a switch under it — and without this rule
       pressing the button on a 375px screen gives back a chart barely taller
       than the one already on the page. */
    f.style.width = '380px';
    f.style.height = '760px';
    await new Promise((r) => setTimeout(r, 250));
    D.getElementById('tab-goals').click();
    await new Promise((r) => setTimeout(r, 350));
    const narrow = cardOf('flowChart');
    narrow.querySelector('.chart-max').click();
    await new Promise((r) => setTimeout(r, 300));
    eq(W.getComputedStyle(narrow.querySelector(':scope > .card-body > .sub')).display, 'none',
       'the sub goes at phone width, where it costs a third of the window');
    ok(narrow.querySelector('.checkline'),
       'the switch stays: it redraws the chart you are looking at');
    ok(W.getComputedStyle(narrow.querySelector('.checkline')).display !== 'none',
       'and it is still on screen');
    ok(narrow.querySelector('.chartbox').getBoundingClientRect().height > 240,
       'and the chart gets what the paragraph was using',
       Math.round(narrow.querySelector('.chartbox').getBoundingClientRect().height));
    W.closeMaxi();
  } finally { f.remove(); }
});

t('a chart’s own tooltip settings survive the theme being merged in', () => {
  ok(APP_SRC, 'index.html was not read — the fetch test above must run first');
  const src = stripComments(APP_SRC);
  /* MERGED, and the order is the assertion: the theme is the base and the
     chart's own object is assigned OVER it, so a `caretSize` set beside a wide
     chart still wins and a `label` callback is never replaced. Written the other
     way round, every chart in the app would lose its callback. */
  ok(src.includes('plugins.tooltip = Object.assign(chartTooltipTheme(), plugins.tooltip || {})'),
    'the theme is the base and the chart\'s own tooltip options are assigned over it');
  ok(/function chartTooltipTheme\(\)/.test(src),
    'and the six values live in one function, not copied per chart');
  for (const tok of ['--surface-alt', '--text-primary', '--text-secondary', '--border-strong']) {
    ok(src.includes(`cssVar('${tok}')`), `${tok} is read from the pack, not invented`);
  }
  ok(!/backgroundColor: '#|backgroundColor: 'rgba/.test(src),
    'and no chart hard-codes a tooltip colour of its own');
});

t('a reader’s own default text size reaches the charts', () => {
  ok(APP_SRC, 'index.html was not read — the fetch test above must run first');
  const src = stripComments(APP_SRC);
  /* The point of fsPx over a hard-coded number: it resolves the step against the
     LIVE root font size, so a reader who has set their browser's default to 20px
     gets bigger axis ticks along with everything else. A literal would pin chart
     text to itself while the rest of the page followed them. */
  ok(/function fsPx\(step\)/.test(src), 'the app resolves a --fs-* step to pixels');
  ok(src.includes("getComputedStyle(document.documentElement).fontSize"),
    'against the live root font size, not a 16 assumed in the source');
  ok(src.includes("Chart.defaults.font.size = fsPx('xs')"),
    'and hands it to Chart.js as the default for every chart');
  ok(src.includes('Chart.defaults.font.family = getComputedStyle(document.body).fontFamily'),
    'with the face the page is set in');
  /* THE PAGE ZOOM MUST NOT BE APPLIED HERE, and this is the assertion that says
     so: `zoom` scales the whole document, canvas included, so a 13px label comes
     out at 19.5 at 150% exactly as the body text beside it does. Dividing by
     zoomScale would make chart text the one thing that refuses to zoom. */
  ok(!/fsPx\([^)]*\)\s*[*/]\s*zoomScale/.test(src),
    'and the page zoom is NOT applied to it — the whole document is already scaled');
});

/* ── Walking the charts on this tab without coming back down ─────────────────
   Charles, 2026-09-03: arrows beside the leave-full-screen button that step
   through the charts on the screen you came from. Here that screen is `#views`,
   which this app rewrites wholesale for each tab — so the walk can never step
   into a tab the reader is not looking at, and Progress is the tab with six
   charts on it.

   THEY SIT IN THE BAND, not in the overlay, and that divergence is the thing
   this test guards. The siblings float their arrows over the card's top-right
   corner; here that corner is the FOLD CONTROL, so the pair travels with the
   maximised card and the focus is put back by hand after a step. Two things
   follow, and both are asserted below: a press must not reach the band's fold
   handler, and the arrow that was pressed must still have the keyboard.

   ITS OWN FRAME, at a real size, for the same reason the test above has one. */
t('the arrows walk the charts on the tab without coming back down', async () => {
  const f = document.createElement('iframe');
  f.setAttribute('data-fin-tests', '');       // or index.html busts out of the frame
  f.setAttribute('aria-hidden', 'true');
  f.style.cssText = 'position:absolute;left:-9999px;width:1280px;height:900px;border:0';
  await new Promise((resolve) => {
    f.onload = resolve;
    f.src = 'index.html?walk=' + Date.now();
    document.body.appendChild(f);
  });
  try {
    const W = f.contentWindow, D = W.document;
    W.save = () => {};
    W.confirm = () => true;
    W.alert = () => {};
    W.loadSample();
    await new Promise((r) => setTimeout(r, 400));

    const shown = (el) => W.getComputedStyle(el).display !== 'none';
    const nameUp = () => W.maxiName(W.maxiCard());

    /* Looked up by id EVERY time until the card is up, because until then there
       is nothing to look up: the nav is not in the document at all. */
    ok(!D.getElementById('maxiNav'),
       'the arrows are nowhere on the page while nothing is filling the window');

    D.getElementById('tab-goals').click();
    await new Promise((r) => setTimeout(r, 500));
    const cards = [...D.querySelectorAll('#views .card')]
      .filter(c => c.querySelector('.chartbox canvas'));
    ok(cards.length > 2, 'the Progress tab draws several charts, so there is a walk',
       cards.length);
    eq(D.querySelectorAll('#views .chart-max').length, cards.length,
       'and the arrows are not counted as chart buttons — still one of those per chart');

    cards[0].querySelector(':scope > h2 > .chart-max').click();
    await new Promise((r) => setTimeout(r, 300));
    /* From here the three are the SAME elements wherever the nav is mounted —
       one nav, moved from band to band, which is what lets the focus be handed
       back to the very button that was pressed. */
    const nav = D.getElementById('maxiNav');
    const nextArrow = D.getElementById('maxiNext');
    const prevArrow = D.getElementById('maxiPrev');
    ok(nav && nav.closest('.card') === W.maxiCard(),
       'the arrows come up INSIDE the maximised card, in its heading band — this '
       + 'card\u2019s top-right corner is its fold control, so a cluster floating over '
       + 'it would sit on a control');
    ok(nav.nextElementSibling === W.maxiCard().querySelector(':scope > h2 > .chart-max'),
       'immediately left of the ⤢ they belong with');
    ok(shown(nav), 'and they are showing');
    eq(W.maxiGroup().length, cards.length, 'every chart on the tab is on the walk');
    ok(/Next chart — /.test(nextArrow.getAttribute('aria-label')),
       'the arrow names the chart it lands on, not just a direction',
       nextArrow.getAttribute('aria-label'));

    /* ── A REAL press ───────────────────────────────────────────────────────
       `btn.click()` makes the button the target and is blind to what folded a
       card in this very app on the day full screen shipped: a pointer lands on
       the `<path>` inside an icon, and the band's fold handler asks what was
       clicked. `pointer-events: none` on the icon is what makes the button the
       smallest thing under the pointer, and the handler stops the click there. */
    const r = nextArrow.getBoundingClientRect();
    const hit = D.elementFromPoint(Math.round(r.left + r.width / 2),
                                   Math.round(r.top + r.height / 2));
    ok(hit === nextArrow,
       'what a pointer hits in the middle of the arrow IS the arrow',
       hit && hit.tagName + '.' + hit.className);

    const svgWas = nextArrow.firstElementChild;
    nextArrow.focus();
    hit.dispatchEvent(new W.MouseEvent('click', { bubbles: true }));
    await new Promise((r2) => setTimeout(r2, 250));
    ok(W.maxiCard() === cards[1], 'Next steps to the chart beside it');
    ok(!W.maxiCard().classList.contains('boxshut'),
       'and the press never reached the band\u2019s fold handler');
    ok(D.getElementById('views').contains(cards[0]),
       'the one that was up is back in its own seat');
    eq(D.querySelectorAll('.chart-slot').length, 1,
       'with exactly one placeholder held — the seat of whatever is up now');
    ok(D.activeElement === nextArrow,
       'the arrow still has the keyboard — the nav MOVED to another card\u2019s band, '
       + 'which drops the focus unless it is put back by hand');
    ok(nextArrow.firstElementChild === svgWas,
       'and the arrow itself was never rebuilt under the pointer');
    ok(D.getElementById('chartMaxi').classList.contains('open')
       && D.querySelector('.wrap').inert,
       'the window did not come down and go back up — same window, different chart');

    for (let i = 1; i < cards.length; i++) nextArrow.click();
    await new Promise((r2) => setTimeout(r2, 250));
    ok(W.maxiCard() === cards[0], 'the last chart steps forward to the first');
    prevArrow.click();
    await new Promise((r2) => setTimeout(r2, 250));
    ok(W.maxiCard() === cards[cards.length - 1], 'and the first steps back to the last');

    /* ── AND THE BAND DOES NOT MOVE WHILE YOU WALK ──────────────────────────
       Reported 2026-09-03: stepping between charts, the right-hand edge and the
       buttons in the band shifted by a few pixels from one chart to the next.
       The overlay is a flex ROW, so the card's automatic minimum size is its
       MIN-CONTENT width, and a Chart.js canvas carries a width in its own style
       attribute — a card that arrives remembering a wider box keeps it and hangs
       over the padding, taking the ⤢ and the arrows with it. It arrives
       remembering one because maximising takes a card OUT of #views and the page
       below reflows: a sibling goes full width, and does it with no scrollbar
       (`body.maxi-open`), which at this frame's width is eight pixels wider than
       the window has room for. `min-width: 0` on the maximised card is the fix,
       and this is the assertion that would have caught it — measured on every
       chart of the walk rather than on one, because it is the DIFFERENCE between
       them that a reader sees. */
    const ovBox = D.getElementById('chartMaxi');
    const innerRight = Math.round(ovBox.getBoundingClientRect().right
      - parseFloat(W.getComputedStyle(ovBox).paddingRight));
    ok(innerRight > 1000,
       'the frame really laid the overlay out — a window measured at nothing '
       + 'would agree with every card about everything', innerRight);
    const drift = [];
    for (let i = 0; i < cards.length; i++) {
      const up = W.maxiCard();
      const right = Math.round(up.getBoundingClientRect().right);
      if (right !== innerRight) drift.push(W.maxiName(up) + ' at ' + right);
      nextArrow.click();
      await new Promise((r2) => setTimeout(r2, 250));
    }
    ok(drift.length === 0,
       'every chart on the walk fills the window to the very same edge, so the '
       + 'band of buttons above it never moves',
       drift.join('; ') + ' \u2014 want ' + innerRight);

    /* Folding a sibling calls syncMaxiButtons without a render, and a folded card
       is one the reader has put away — so it comes off the walk at once. */
    const upNow = W.maxiCard();
    const victim = cards.find(c => c !== upNow);
    const wasLong = W.maxiGroup().length;
    victim.querySelector('.box-toggle').click();
    await new Promise((r2) => setTimeout(r2, 350));
    eq(W.maxiGroup().length, wasLong - 1, 'a folded card drops out of the walk');
    ok(W.maxiGroup().indexOf(victim) < 0, 'and it is the folded one that has gone');
    victim.querySelector('.box-toggle').click();
    await new Promise((r2) => setTimeout(r2, 350));
    eq(W.maxiGroup().length, wasLong, 'unfolding it puts it back');

    /* A render throws #views away and rebuilds it; maxiResume puts the card back
       BY CANVAS ID, and attachMaxi has to bring the arrows back into the NEW
       band with it — the old one went out with the old markup. */
    const upWas = nameUp();
    W.render();
    await new Promise((r2) => setTimeout(r2, 500));
    eq(nameUp(), upWas, 'a re-render leaves the same chart filling the window');
    ok(nav.closest('.card') === W.maxiCard(),
       'and the arrows came back into the rebuilt card\u2019s band with it');
    ok(shown(nav), 'still showing');

    /* BY NAME from here on, not by the element: the render above threw #views
       away, so every card captured before it is a node that has gone. */
    const keyFrom = nameUp();
    D.dispatchEvent(new W.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
    await new Promise((r2) => setTimeout(r2, 250));
    ok(nameUp() !== keyFrom, 'Right steps to the next chart', nameUp());
    D.dispatchEvent(new W.KeyboardEvent('keydown', { key: 'ArrowLeft', bubbles: true }));
    await new Promise((r2) => setTimeout(r2, 250));
    eq(nameUp(), keyFrom, 'and Left steps back');
    const picker = D.querySelector('header select');
    picker.dispatchEvent(new W.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
    await new Promise((r2) => setTimeout(r2, 250));
    eq(nameUp(), keyFrom,
       'an arrow pressed in a header picker is the picker\u2019s, not the walk\u2019s');

    /* ── …and so is one pressed in a RADIO GROUP ───────────────────────────
       Form controls were the obvious half of that rule and the ARIA roles were
       the half that bit. The Net Worth card carries its "as of" pair INSIDE the
       card, so it is still on screen and still reachable while that card fills
       the window — and Right both moved the month and stepped the chart. Nothing
       about a `<button role="radio">` is an <input>. */
    W.closeMaxi();
    await new Promise((r2) => setTimeout(r2, 250));
    D.getElementById('tab-goals').click();
    await new Promise((r2) => setTimeout(r2, 450));
    const worth = [...D.querySelectorAll('#views .card')]
      .find(c => /Net Worth/.test(c.textContent) && c.querySelector('.asofswitch'));
    ok(!!worth, 'the Net Worth card carries an as-of pair');
    worth.querySelector(':scope > h2 > .chart-max').click();
    await new Promise((r2) => setTimeout(r2, 350));
    const heldUp = nameUp();
    const onNow = D.querySelector('#chartMaxi .vswitch[aria-checked="true"]').dataset.asof;
    const other = D.querySelector(`#chartMaxi .vswitch:not([data-asof="${onNow}"])`);
    other.focus();
    other.dispatchEvent(new W.KeyboardEvent('keydown',
      { key: onNow === 'now' ? 'ArrowLeft' : 'ArrowRight', bubbles: true }));
    await new Promise((r2) => setTimeout(r2, 500));
    eq(nameUp(), heldUp,
       'an arrow in the as-of pair leaves the chart where it was');
    ok(D.querySelector('#chartMaxi .vswitch[aria-checked="true"]').dataset.asof !== onNow,
       'and moves the month, which is whose arrow it was');
    W.closeMaxi();

    W.closeMaxi();
    await new Promise((r2) => setTimeout(r2, 300));
    eq(D.querySelectorAll('.chart-slot').length, 0, 'closing leaves no placeholder behind');
    ok(!D.getElementById('maxiNav'), 'and takes the arrows off the page with it');

    /* A tab with one chart has nothing to walk, and says so by showing nothing
       rather than looping a single card back onto itself. */
    D.getElementById('tab-comp').click();
    await new Promise((r2) => setTimeout(r2, 500));
    const solo = D.querySelector('#views .chartbox canvas').closest('.card');
    solo.querySelector(':scope > h2 > .chart-max').click();
    await new Promise((r2) => setTimeout(r2, 300));
    eq(W.maxiGroup().length, 1, 'the Compensation tab draws one chart');
    ok(!shown(D.getElementById('maxiNav')), 'so there are no arrows on it');
    /* ── And the ⤢ keeps the far end of the band ────────────────────────────
       Reported by Charles within the hour on 2026-09-03: with no arrows showing,
       the button jumped from the end of the band to sit against the heading. A
       hidden element is still a SIBLING — `display: none` takes it out of the
       flex layout, not out of the selector — so `.maxi-nav + .chart-max` went on
       matching and the button handed its `margin-left: auto` to a nav that was
       not there to take it. Read off the RECTANGLE, not the rule: the margin is
       what moved, and only geometry can see where the button ended up. */
    const soloBand = W.maxiCard().querySelector(':scope > h2');
    const soloBtn = soloBand.querySelector(':scope > .chart-max');
    const bandBox = soloBand.getBoundingClientRect();
    const btnBox = soloBtn.getBoundingClientRect();
    ok(bandBox.right - btnBox.right < 24,
       'the ⤢ still sits at the FAR END of the band when there are no arrows beside it',
       Math.round(bandBox.right - btnBox.right) + 'px from the end');
    const soloTitle = W.maxiCard().querySelector('.box-title').getBoundingClientRect();
    ok(btnBox.left - soloTitle.right > 40,
       'and not shoved up against the heading it is nothing to do with',
       Math.round(btnBox.left - soloTitle.right) + 'px of gap');
    W.closeMaxi();
  } finally { f.remove(); }
});

/* ── Nothing runs off the side of a phone ────────────────────────────────────
   Reported by Charles on 2026-09-03: the Net Worth card's "as of" pair ran past
   the right edge of its card at phone width. The pair carries a month AND what
   that month is — "Aug 2026 · settled", "Sep 2026 · this month" — 360px of
   nowrap text against a 305px card body, and nothing in it could shrink.

   THE SWEEP IS THE TEST, not the one control. A width that overflows is a class
   of bug, not an instance: it arrives whenever a label gets longer or a control
   gains a word, and it is invisible on the desktop where the work is done. The
   sweep found exactly one offender across every tab, which is what made the fix
   a one-line answer instead of a hunt.

   Anything inside a box that scrolls sideways ON PURPOSE is not an offender —
   the budget grid is twelve months wide and always will be. */
t('nothing runs off the side of a phone', async () => {
  const f = document.createElement('iframe');
  f.setAttribute('data-fin-tests', '');       // or index.html busts out of the frame
  f.setAttribute('aria-hidden', 'true');
  f.style.cssText = 'position:absolute;left:-9999px;width:375px;height:812px;border:0';
  await new Promise((resolve) => {
    f.onload = resolve;
    f.src = 'index.html?narrow=' + Date.now();
    document.body.appendChild(f);
  });
  try {
    const W = f.contentWindow, D = W.document;
    W.save = () => {};
    W.confirm = () => true;
    W.alert = () => {};
    W.loadSample();
    await new Promise((r) => setTimeout(r, 400));

    const tabs = [...D.querySelectorAll('.tabs [role="tab"]')].filter(t => !t.hidden);
    ok(tabs.length > 3, 'there are tabs to walk', tabs.length);

    const over = [];
    for (const tab of tabs) {
      tab.click();
      await new Promise((r) => setTimeout(r, 400));
      const vw = D.documentElement.clientWidth;
      for (const el of D.querySelectorAll('#views *')) {
        const b = el.getBoundingClientRect();
        if (b.width === 0 || b.right <= vw + 1) continue;
        let inScroller = false;
        for (let p = el.parentElement; p && p !== D.body; p = p.parentElement) {
          const ox = W.getComputedStyle(p).overflowX;
          if (ox === 'auto' || ox === 'scroll') { inScroller = true; break; }
        }
        if (!inScroller) {
          over.push(tab.textContent.trim() + ' → ' + el.tagName.toLowerCase()
                    + '.' + String(el.className || '').split(' ')[0]);
        }
      }
    }
    eq([...new Set(over)].slice(0, 8), [],
       'every tab fits the width of a phone, unless it is in a box that scrolls sideways '
       + 'on purpose');

    /* And what the fix actually does, at the one place it fires. */
    D.getElementById('tab-goals').click();
    await new Promise((r) => setTimeout(r, 400));
    const row = D.querySelector('.asofrow');
    const sw = row.querySelector('.asofswitch');
    const dot = row.querySelector('.tile-help');
    const seg = [...sw.querySelectorAll('.vswitch')];
    const swBox = sw.getBoundingClientRect();
    ok(swBox.height > 44, 'the pair STACKS when the line will not hold it',
       Math.round(swBox.height) + 'px tall');
    eq(Math.round(seg[0].getBoundingClientRect().width),
       Math.round(seg[1].getBoundingClientRect().width),
       'and the two segments take the same width as each other');
    ok(parseFloat(W.getComputedStyle(sw).borderRadius) < swBox.height / 2,
       'the frame stops being a pill — two rows inside a stadium is a lozenge whose '
       + 'ends curve through the buttons', W.getComputedStyle(sw).borderRadius);
    ok(Math.abs(dot.getBoundingClientRect().top - swBox.top) < swBox.height,
       'and the ⓘ stays BESIDE the pair rather than stranded on a line of its own — '
       + 'a help dot under a control reads as explaining whatever comes next');

    /* Wide again: the desktop shape is untouched. The frame is resized rather
       than a second one booted, so this is the real rule firing at a real width. */
    f.style.width = '1280px';
    await new Promise((r) => setTimeout(r, 400));
    const wideBox = D.querySelector('.asofswitch').getBoundingClientRect();
    ok(wideBox.height < 44, 'with room, the pair is one line again',
       Math.round(wideBox.height) + 'px tall');
    ok(parseFloat(W.getComputedStyle(D.querySelector('.asofswitch')).borderRadius)
       > wideBox.height / 2,
       'and a pill again — the frame is what says these two are alternatives');
  } finally { f.remove(); }
});

/* A two-account plan with one grid year, for the audit groups below. */
function auditPlan(year, extra) {
  const st = H.coerceShape({
    schema: H.SCHEMA,
    settings: { accounts: [
      { id: 'cash', name: 'Cash', rate: 0, creditTo: 'cash', hub: true },
      { id: 'mid', name: 'Savings', rate: 0, creditTo: 'mid' } ] },
    years: {}, goals: [], people: [], side: {}, ui: {}
  });
  Object.assign(st, extra || {});
  if (year) st.years = year;
  return H.migrate(H.coerceShape(st));
}
function auditYear(y, entered, categories, cells, seeds) {
  return { kind: 'grid', model: 'live', startMonth: `${y}-01`, monthCount: 12,
           enteredThrough: entered, categories, cells: cells || {}, paychecks: {},
           seeds: seeds || { cash: 5000 }, overrides: {}, balAdjust: {}, extraNotes: [] };
}

group('A dropped sync listener is re-opened (2026-09-01 audit)');

group('A figure changed is a figure shown (2026-09-02)');
/* ── Rounding is the same on both sides of zero ─────────────────────────────
   `Math.round` breaks a tie towards +∞, so the identical half-dollar went up as
   income and down as an expense — and the row that got the smaller figure was
   always the expense. This moves figures: a same-month row on exactly −$100.50
   read −$100 before today and reads −$101 now. */
t('a half-dollar rounds away from zero whichever side it is on', () => {
  eq(H.roundToDollar(100.5), 101, 'up, as it always did');
  eq(H.roundToDollar(-100.5), -101, 'and DOWN by the same half — Math.round gave -100');
  eq(H.roundToDollar(100.49), 100);
  eq(H.roundToDollar(-100.49), -100);
  eq(H.roundToDollar(-1741.72), -1742, 'the figure that started all this');
  /* -0 formats as "-$0.00", so a helper that can return one is a trap for
     whatever reuses it next. */
  ok(Object.is(H.roundToDollar(-0.4), 0), 'and nothing rounds to negative zero');

});

/* ── Parentheses are a minus sign ───────────────────────────────────────────
   Every statement and export writes a negative that way, and parseMoney
   stripped them with the currency symbol — so a pasted "(500)" arrived as
   +$500. Not a refusal and not a warning: the right number pointing the wrong
   way, in an app where the sign IS what a transfer means. */
t('a bracketed figure is a negative one', () => {
  eq(H.parseMoney('(500)'), -500);
  eq(H.parseMoney(' ($1,234.56) '), -1234.56, 'through the formatting too');
  eq(H.parseMoney('(-500)'), -500, 'a minus already inside them is not flipped back');
  eq(H.parseMoney('-$500'), -500, 'the ordinary spelling is untouched');
  eq(H.parseMoney('$1,234.56'), 1234.56);
  eq(H.parseMoney('500'), 500, 'and a bare figure is still positive');
  eq(H.parseMoney('a(500)b'), 500, 'the brackets have to wrap the WHOLE figure — a stray '
    + 'one is not the accounting form');
  eq(H.parseMoney(''), null);
  eq(H.parseMoney('()'), null, 'brackets round nothing are still nothing');
});
/* ── And a minus is not always U+002D ───────────────────────────────────────
   The same fault one paste further out: the strip keeps ASCII only, so the
   MINUS SIGN a statement PDF writes was deleted rather than read and −200 in a
   transfer row arrived as +200. Every character below is a hyphen or a minus by
   its own Unicode name; the two dashes that are sentence punctuation are held
   against the opposite assertion, because reading "Rent — $500" as a negative
   would be a new wrong answer rather than a fixed one. */
t('a typographic minus is still a minus', () => {
  eq(H.parseMoney('−5'), -5, 'U+2212 MINUS SIGN — what a PDF or a typeset table writes');
  eq(H.parseMoney('−$1,234.56'), -1234.56, 'through the formatting too');
  eq(H.parseMoney('‐5'), -5, 'U+2010 HYPHEN');
  eq(H.parseMoney('‑5'), -5, 'U+2011 NON-BREAKING HYPHEN');
  eq(H.parseMoney('‒5'), -5, 'U+2012 FIGURE DASH');
  eq(H.parseMoney('－5'), -5, 'U+FF0D FULLWIDTH HYPHEN-MINUS — a phone keyboard');
  eq(H.parseMoney('﹣5'), -5, 'U+FE63 SMALL HYPHEN-MINUS');
  eq(H.parseMoney('-5'), -5, 'the ordinary spelling is untouched');
  eq(H.parseMoney('5'), 5, 'and a bare figure is still positive');
  eq(H.parseMoney('–5'), 5, 'the EN DASH is not in the list: it separates a range');
  eq(H.parseMoney('— $500'), 500, 'nor the EM DASH, which follows a label');
  eq(H.parseMoney('−'), null, 'a sign with no figure is still nothing');
});

group('What the grid says about where a figure came from (2026-09-02)');
/* ── The paycheck count names its own source ────────────────────────────────
   `resolvePaychecks` has always had three answers — the month's own figure, the
   same month a year ago, else two — and the grid's hover tested only the first,
   so every month without a figure of its own said "Estimated from the same
   month last year". Including the ones where last year had none either and it
   fell through to two: in the app's own sample plan that is eleven months of
   twelve, each showing a 2 that nothing supplied but a default, under a
   sentence naming a source that does not exist.
   It is the count a `paycheck` row MULTIPLIES BY, so this is not decoration —
   two a month is 24 a year against a fortnightly 26. The three-way answer and
   the three sentences are pinned together here, because the failure was
   precisely that one knew something the other did not. */
t('the paycheck count says which of the three answers it is', () => {
  const yr = { paychecks: { '2030-02': 3 } };
  const prior = { paychecks: { '2029-03': 2.5 } };
  const out = H.resolvePaychecks(yr, ['2030-01', '2030-02', '2030-03'], prior);
  eq(out.counts['2030-02'], 3, 'its own figure wins');
  eq(out.source['2030-02'], 'entered');
  eq(out.counts['2030-03'], 2.5, 'else the same month a year ago');
  eq(out.source['2030-03'], 'lastyear');
  eq(out.counts['2030-01'], H.PAYCHECKS_DEFAULT, 'else the default');
  eq(out.source['2030-01'], 'assumed', 'and it says so — this is the one that used to '
    + 'claim it came from last year');
});
t('a year with no history at all is assumed, never attributed', () => {
  /* The first year of a plan has no prior, which is the commonest way to meet
     the third branch — and the one where the old sentence was furthest from
     true, since there was no last year to have estimated from. */
  const out = H.resolvePaychecks({ paychecks: {} }, ['2030-01', '2030-02'], undefined);
  eq(Object.values(out.source), ['assumed', 'assumed']);
  eq(Object.values(out.counts), [H.PAYCHECKS_DEFAULT, H.PAYCHECKS_DEFAULT]);
});
t('an inherited assumption is still an assumption, however many years along', () => {
  /* The tail of the same fault, and it only shows up in the SECOND year built
     ahead: the prior year's RESOLVED counts are what get read, so last year's
     own default arrives here as a perfectly ordinary figure. Without the source
     travelling with it, a plan where nobody has ever typed a count would say
     "from the same month last year" in every year after the first, about a
     chain that rests on nothing. */
  const first = H.resolvePaychecks({ paychecks: {} }, ['2030-01'], undefined);
  const second = H.resolvePaychecks({ paychecks: {} }, ['2031-01'],
    { paychecks: first.counts, paycheckSource: first.source });
  eq(second.counts['2031-01'], H.PAYCHECKS_DEFAULT, 'the figure does come from last year');
  eq(second.source['2031-01'], 'assumed', 'but last year was guessing too, and saying '
    + '"from last year" would launder a default into a source');
  /* A REAL count still propagates as one, so the fix does not flatten the
     middle answer into the last: this is the case the middle branch exists for. */
  const real = H.resolvePaychecks({ paychecks: { '2030-01': 3 } }, ['2030-01'], undefined);
  const after = H.resolvePaychecks({ paychecks: {} }, ['2031-01'],
    { paychecks: real.counts, paycheckSource: real.source });
  eq(after.counts['2031-01'], 3);
  eq(after.source['2031-01'], 'lastyear', 'a figure somebody typed still reads as one a '
    + 'year later');
});
t('each answer has words, and the assumed one names the figure', () => {
  const tips = H.PAYCHECK_SOURCE_TIP;
  for (const k of ['entered', 'lastyear', 'assumed'])
    ok(tips[k], k + ' has something to say on hover');
  ok(tips.assumed.includes(String(H.PAYCHECKS_DEFAULT)),
     'the assumed one says WHAT was assumed — a reader paid fortnightly can only know '
     + 'the claim is wrong if they can see it');
  ok(/click/i.test(tips.assumed), 'and that the cell takes an answer');
  ok(!/last year/i.test(tips.assumed),
     'and does not attribute it to a year that supplied nothing');
});
t('the grid reads the source rather than re-deriving it', () => {

group('Fixes from the 2026-09-03 audit');
/* Each of these is a bug the 2026-09-03 audit reproduced headless in the code
   that had shipped the day before. Every test here was written first and proven
   to fail against the unfixed page — the commit that fixed it quotes the red row.
   They need a REAL frame for the same reason the full-screen group does: they
   are geometry and focus, and neither exists in the suite's 1x1 frame. */
async function auditFrame(width, height, tag) {
  const f = document.createElement('iframe');
  f.setAttribute('data-fin-tests', '');       // or index.html busts out of the frame
  f.setAttribute('aria-hidden', 'true');
  f.style.cssText = `position:absolute;left:-9999px;width:${width}px;height:${height}px;border:0`;
  await new Promise((resolve) => {
    f.onload = resolve;
    f.src = 'index.html?' + tag + '=' + Date.now();
    document.body.appendChild(f);
  });
  const W = f.contentWindow;
  W.save = () => {};
  W.confirm = () => true;
  W.alert = () => {};
  W.loadSample();
  await new Promise((r) => setTimeout(r, 400));
  return { f, W, D: W.document };
}

/* ── Fix 1: an arrow key must not drop the keyboard on the page underneath ──
   maxiStep() hands the focus back to the ARROW that was pressed, and only to
   that: open a chart with the ⤢ (which is what gets the focus on opening) and
   press Right, and the element that had it was the OLD card's ⤢ — which the
   step has just carried back into the inert page. The browser lets go of it,
   activeElement is <body>, and the next Tab starts from the top of a page the
   reader cannot see. The rule in one sentence: a step lands focus on the arrow
   that pressed it, or on the new card's ⤢, never on the page underneath. */
t('a step by arrow key lands the focus inside the window, never on the page underneath', async () => {
  const { f, W, D } = await auditFrame(1280, 900, 'stepfocus');
  try {
    D.getElementById('tab-goals').click();
    await new Promise((r) => setTimeout(r, 500));
    const cards = [...D.querySelectorAll('#views .card')]
      .filter(c => c.querySelector('.chartbox canvas'));
    ok(cards.length > 2, 'the Progress tab draws several charts, so there is a walk',
       cards.length);
    const ov = D.getElementById('chartMaxi');

    /* Opened with the ⤢, the way a keyboard reader opens it. */
    cards[0].querySelector(':scope > h2 > .chart-max').click();
    await new Promise((r) => setTimeout(r, 300));
    ok(W.maxiCard() === cards[0], 'the first chart is up');
    ok(ov.contains(D.activeElement), 'and its ⤢ holds the focus — the starting point');

    D.dispatchEvent(new W.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
    await new Promise((r) => setTimeout(r, 300));
    ok(W.maxiCard() === cards[1], 'Right steps to the chart beside it');
    const a = D.activeElement;
    ok(a && a !== D.body && a.isConnected && ov.contains(a),
       'after a step by arrow key the focus is INSIDE the window — a keyboard reader '
       + 'must not be dropped on the inert page underneath',
       a ? (a === D.body ? 'body' : a.tagName + '.' + a.className) : 'null');
    ok(a === W.maxiCard().querySelector(':scope > h2 > .chart-max'),
       'and it is the NEW card’s ⤢ — no arrow was pressed, so there is no arrow to '
       + 'give it back to');

    /* The other half of the rule still holds: an arrow that was pressed keeps it. */
    const nextArrow = D.getElementById('maxiNext');
    nextArrow.focus();
    nextArrow.click();
    await new Promise((r) => setTimeout(r, 300));
    ok(W.maxiCard() === cards[2], 'the button steps on');
    ok(D.activeElement === nextArrow,
       'and a step BUTTON that had the focus keeps it, as it did before');

    /* Left, from the arrow: it still holds the key, so a further key step
       leaves it where it is rather than jumping to the ⤢. */
    D.dispatchEvent(new W.KeyboardEvent('keydown', { key: 'ArrowLeft', bubbles: true }));
    await new Promise((r) => setTimeout(r, 300));
    ok(W.maxiCard() === cards[1], 'Left steps back');
    ok(D.activeElement === nextArrow,
       'and the arrow that already held the focus was not taken off it');
    W.closeMaxi();
  } finally { f.remove(); }
});


async function run() {
  w = document.getElementById('app').contentWindow;
  /* A frame that never got the app is a SETUP problem — the folder isn't being
     served, so index.html came back 404 — and without this every test throws
     "Cannot read properties of undefined" in turn, which reads like the app is
     catastrophically broken. Say the one thing that fixes it instead. */
  if (!w || !w.__finTestHooks) {
    const s = document.getElementById('summary');
    s.className = 'bad';
    s.textContent = 'The hidden frame never loaded index.html — is this folder being served?';
    document.getElementById('out').innerHTML =
      '<tr><td class="msg" style="white-space:normal;font-family:inherit;font-size:13px">' +
      'Run <code>cd ~/claude-financial-plan &amp;&amp; python3 -m http.server 8016</code> and open ' +
      '<code>http://localhost:8016/tests.html</code>.</td></tr>';
    return;
  }
  H = w.__finTestHooks;
  const out = document.getElementById('out');
  let pass = 0, fail = 0;
  for (const item of TESTS) {
    if (item.group) {
      const tr = document.createElement('tr');
      tr.className = 'group';
      tr.innerHTML = '<td colspan="3"></td>';
      tr.firstChild.textContent = item.group;
      out.appendChild(tr);
      continue;
    }
    const tr = document.createElement('tr');
    const st = document.createElement('td'); st.className = 'st';
    const name = document.createElement('td'); name.textContent = item.name;
    const msg = document.createElement('td'); msg.className = 'msg';
    try {
      await item.fn();
      tr.className = 'pass'; st.textContent = '✓'; pass++;
    } catch (e) {
      tr.className = 'fail'; st.textContent = '✕'; msg.textContent = e.message; fail++;
    }
    tr.appendChild(st); tr.appendChild(name); tr.appendChild(msg);
    out.appendChild(tr);
  }
  /* The floor — see EXPECTED at the top of this file. Written as a row of its
     own so it reads like any other failure, and counted into `fail` so the
     summary goes red and CI's `All N tests pass` check does not match. */
  if (pass + fail < EXPECTED) {
    const tr = document.createElement('tr');
    tr.className = 'fail';
    const st = document.createElement('td'); st.className = 'st'; st.textContent = '\u2715';
    const name = document.createElement('td');
    name.textContent = 'the suite ran only ' + (pass + fail) + ' of at least '
      + EXPECTED + ' tests';
    const msg = document.createElement('td'); msg.className = 'msg';
    msg.textContent = 'tests have gone missing rather than failed, so a green result here '
      + 'would cover a fraction of the suite. If they were retired on purpose, lower '
      + 'EXPECTED to match.';
    tr.appendChild(st); tr.appendChild(name); tr.appendChild(msg);
    out.appendChild(tr);
    fail++;
  }
  const s = document.getElementById('summary');
  s.textContent = fail === 0 ? `All ${pass} tests pass` : `${fail} of ${pass + fail} tests FAILED`;
  s.className = fail === 0 ? 'ok' : 'bad';
  document.title = (fail === 0 ? '✓ ' : '✕ ') + document.title;
}

/* ── The localhost gate ─────────────────────────────────────────────────────
   The suite itself is read-only, but booting the app in the iframe is not
   neutral off localhost: GitHub Pages serves this file at
   /financial-plan/tests.html, and on that origin the invisible frame is a real
   session — a signed-in browser would start Firestore sync traffic, or raise a
   which-copy dialog nobody can see. So the iframe is created here or not at
   all. file:// has no hostname, so it fails the includes() and lands in the
   else branch, where location.protocol tells it apart from a published copy —
   it gets its own message (browsers block file:// iframes, so the suite can't
   run there anyway) rather than being sent down the iframe branch to blame
   the app for a frame that never loaded. Ported from Team Dashboard's gate;
   same shape in Sprint Velocity, PAPTrack and Golf Handicap. */
const LOCAL_HOSTS = ['localhost', '127.0.0.1', '[::1]'];

if (LOCAL_HOSTS.includes(location.hostname)) {
  const frame = document.createElement('iframe');
  frame.id = 'app';
  /* index.html's sync module checks for this attribute and stays off — without
     it, an origin that had ever signed in would start real sync traffic. */
  frame.setAttribute('data-fin-tests', '');
  frame.setAttribute('title', 'app under test');
  frame.setAttribute('aria-hidden', 'true');
  frame.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;border:0;left:-9999px';
  frame.src = 'index.html' + BUST;    /* set before append: one load event, the real one */
  document.body.appendChild(frame);
} else {
  /* Two reasons to be here, needing different sentences: a published copy
     (where booting the app would start a live, possibly signed-in session) and a
     file:// copy off disk (where it simply cannot work — browsers block file://
     frames). Both end at the same instruction. */
  const onDisk = location.protocol === 'file:';
  const s = document.getElementById('summary');
  s.className = 'bad';
  s.textContent = onDisk
    ? 'Not run from a file — this page needs a local server.'
    : 'Not run here — this page only works on localhost.';
  document.getElementById('out').innerHTML =
    '<tr><td class="msg" style="white-space:normal;font-family:inherit;font-size:13px">' +
    (onDisk
      ? 'The suite boots the real app in a hidden frame, and a browser blocks that frame '
        + 'when the page is opened straight off disk — so the tests would have nothing to run '
        + 'against. Serve the folder instead:'
      : 'The suite boots the real app in a hidden frame, which on <strong>'
        + location.hostname.replace(/[<&]/g, '') + '</strong> would start a live session — '
        + 'including cloud sync, if this browser has signed in. It only runs on '
        + '<code>localhost</code>, against a copy served from the repo folder:') + '<br><br>' +
    '<code>cd ~/claude-financial-plan &amp;&amp; python3 -m http.server 8016</code><br>' +
    'then open <code>http://localhost:8016/tests.html</code>.<br><br>' +
    'Nothing has been changed by opening this page — ' +
    '<a href="index.html">back to Financial Plan</a>.' +
    '</td></tr>';
}
  showLatestRun();
</script>
