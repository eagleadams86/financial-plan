<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money Map — tests</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* Dev-only page: pins the pure functions in index.html. It loads the real app
     in a hidden same-origin iframe and calls its functions directly, so what's
     tested is exactly what ships — no copies, no build step. Serve over
     http://localhost (python3 -m http.server 8016); file:// iframes are blocked
     in some browsers. Nothing here writes localStorage or calls save().
     Every fixture is SYNTHETIC — invented round numbers, never real data. The
     one exception is the local-only block at the end, which fetches the
     gitignored import JSONs when they exist on this machine and silently
     skips when they don't (which is always, in CI and on the public site). */
  body { background: var(--bg); color: var(--text-primary); margin: 0;
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--text-muted); font-size: 12.5px; margin: 0 0 18px; }
  #summary { font-weight: 600; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px;
             border: 1px solid var(--border); background: var(--surface); }
  #summary.ok  { color: var(--ok);  border-color: var(--ok); }
  #summary.bad { color: var(--err); border-color: var(--err); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  td.st { width: 28px; font-weight: 700; }
  tr.pass td.st { color: var(--ok); }
  tr.fail td.st { color: var(--err); }
  tr.fail td.msg { color: var(--err); }
  .msg { color: var(--text-muted); font-size: 12px; white-space: pre-wrap; }
  .group td { padding-top: 16px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
              text-transform: uppercase; color: var(--text-muted); border-bottom-color: var(--border-strong); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Money Map — pure-function tests</h1>
  <p class="sub">Runs against the real <code>index.html</code> in a hidden iframe. Read-only: nothing is saved.</p>
  <div id="summary">Loading app…</div>
  <table><tbody id="out"></tbody></table>
</div>
<iframe id="app" src="index.html" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none" title="app under test"></iframe>

<script>
'use strict';
const TESTS = [];
function group(name) { TESTS.push({ group: name }); }
function t(name, fn) { TESTS.push({ name, fn }); }

function fmt(v) { return JSON.stringify(v); }
function eq(actual, expected, note) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  if (a !== e) throw new Error((note ? note + ': ' : '') + 'expected ' + e + ', got ' + a);
}
function approx(actual, expected, note, eps) {
  if (typeof actual !== 'number' || Math.abs(actual - expected) > (eps ?? 0.005))
    throw new Error((note ? note + ': ' : '') + 'expected ≈' + expected + ', got ' + fmt(actual));
}
function ok(cond, note) { if (!cond) throw new Error(note || 'expected truthy'); }

let w, H;   // app window + its __finTestHooks

/* ── Date helpers ─────────────────────────────────────────────────────────── */
group('Date helpers');
t('monthAdd walks forward across a year end', () => {
  eq(H.monthAdd('2026-11', 1), '2026-12');
  eq(H.monthAdd('2026-12', 1), '2027-01');
  eq(H.monthAdd('2026-01', 23), '2027-12');
});
t('monthAdd walks backward across a year start', () => {
  eq(H.monthAdd('2026-01', -1), '2025-12');
  eq(H.monthAdd('2026-03', -12), '2025-03');
});
t('monthDiff is the signed distance in months', () => {
  eq(H.monthDiff('2026-01', '2026-07'), 6);
  eq(H.monthDiff('2026-07', '2026-01'), -6);
  eq(H.monthDiff('2025-11', '2026-02'), 3);
});
t('monthLabel renders a short month + 2-digit year', () => {
  eq(H.monthLabel('2026-01'), 'Jan 26');
  eq(H.monthLabel('2027-12'), 'Dec 27');
});

/* ── Money ────────────────────────────────────────────────────────────────── */
group('Money');
t('round2 rounds to cents and survives float dust', () => {
  eq(H.round2(1.005), 1.01);
  eq(H.round2(-79.98999999999999), -79.99);
  eq(H.round2(0.1 + 0.2), 0.3);
});
t('fmtMoney renders US dollars', () => {
  eq(H.fmtMoney(1234.5), '$1,234.50');
  eq(H.fmtMoney(-42), '-$42.00');
});

/* ── State boundary ───────────────────────────────────────────────────────── */
group('State boundary');
t('coerceShape forces every collection to the right type', () => {
  const d = H.coerceShape({ years: 'junk', goals: 'nope', side: 7, vacations: null });
  eq(typeof d.years, 'object');
  eq(Array.isArray(d.goals), true);
  eq(Array.isArray(d.side.taxable), true);
  eq(Array.isArray(d.vacations.trips), true);
});
t('coerceShape repairs a damaged grid year without dropping it', () => {
  const d = H.coerceShape({ years: { '2026': { kind: 'grid', cells: 'junk', monthCount: 999 } } });
  const y = d.years['2026'];
  eq(typeof y.cells, 'object');
  eq(y.monthCount, 36, 'month count clamps');
  eq(y.startMonth, '2026-01', 'missing start month defaults to January');
});
t('an unknown year kind falls back to summary', () => {
  const d = H.coerceShape({ years: { '2014': { kind: 'wat' } } });
  eq(d.years['2014'].kind, 'summary');
  eq(Array.isArray(d.years['2014'].categoryTotals), true);
});
t('migrate passes a current-schema state through untouched', () => {
  const s = H.blankState();
  eq(H.migrate(s), s);
});
t('blankState carries the spreadsheet constants', () => {
  const s = H.blankState();
  approx(s.settings.midTermRateAnnual, 0.03);
  approx(s.settings.longTermRateAnnual, 0.07);
  eq(s.settings.ptoAllowance, 32);
});

/* ── Formula engine (synthetic fixture) ───────────────────────────────────────
   A hand-computed 6-month live year. Invented round numbers only. */
function fixtureState() {
  const s = {
    schema: 1,
    settings: { midTermRateAnnual: 0.03, longTermRateAnnual: 0.07, ptoAllowance: 32 },
    years: {
      '2029': {          // prior year, pinned — feeds the same-month rule
        kind: 'grid', model: 'pinned', startMonth: '2029-01', monthCount: 12,
        categories: [{ id: 'electric', name: 'Electric', role: 'normal', rule: 'none' }],
        cells: { 'electric|2029-10': { v: -80.4, kind: 'actual' } },
        paychecks: {}, seeds: {}, overrides: {}
      },
      '2030': {
        kind: 'grid', model: 'live', startMonth: '2030-01', monthCount: 6,
        enteredThrough: '2030-03',
        categories: [
          { id: 'paycheck', name: 'Paycheck', role: 'normal', rule: 'paycheck', perCheck: 1000 },
          { id: 'dividends', name: 'Dividends', role: 'normal', rule: 'dividends' },
          { id: 'cc', name: 'Credit Card', role: 'normal', rule: 'avg' },
          { id: 'internet', name: 'Internet', role: 'normal', rule: 'carry' },
          { id: 'electric', name: 'Electric', role: 'normal', rule: 'samemonth' },
          { id: 'midt', name: 'Mid-term transfers', role: 'midTransfer', rule: 'none' },
          { id: 'longt', name: 'Long-term transfers', role: 'longTransfer', rule: 'none' },
          { id: 'bankt', name: 'Bank transfers', role: 'bankTransfer', rule: 'none' },
          { id: 'zelle', name: 'Zelle', role: 'zelle', rule: 'none' },
          { id: 'char', name: 'Charitable', role: 'charitable', rule: 'none' },
        ],
        cells: {
          'paycheck|2030-01': { v: 2000, kind: 'actual' },
          'paycheck|2030-02': { v: 2000, kind: 'actual' },
          'paycheck|2030-03': { v: 3000, kind: 'actual' },
          'cc|2030-01': { v: -900, kind: 'actual' },
          'cc|2030-02': { v: -1100, kind: 'actual' },
          'cc|2030-03': { v: -1000, kind: 'actual' },
          'internet|2030-01': { v: -50, kind: 'actual' },
          'midt|2030-02': { v: -500, kind: 'actual' },   // 500 INTO mid-term
          'zelle|2030-04': { v: 25, kind: 'manual' },
          'char|2030-04': { v: -60, kind: 'manual' },
          'cc|2030-05': { v: -1234, kind: 'manual' },    // manual beats auto
        },
        paychecks: { '2030-01': 2, '2030-02': 2, '2030-03': 3, '2030-04': 2,
                     '2030-05': 3.5, '2030-06': 2 },
        seeds: { cash: 10000, mid: 1000, long: 1200, bank: 300 },
        overrides: { 'long|2030-01': { v: 1200 }, 'cash|2030-04': { v: 12345 } }
      }
    },
    goals: [
      { id: 'g1', name: 'Emergencies', source: 'cashBank', target: 5000, targetDate: '2030-12-01' },
      { id: 'g2', name: 'Renovations', source: 'midCapped', target: 1200, targetDate: '2031-06-01' },
      { id: 'g3', name: 'New Car', source: 'midOverflow', target: 9000, targetDate: '2033-06-01' },
      { id: 'g4', name: 'Retire', source: 'long', target: 90000, targetDate: '2040-01-01' },
    ],
    side: {}, vacations: { trips: [], pto: {} }, ui: {}
  };
  return s;
}
const TODAY_FIX = '2030-04-15';   // engine time is injected, so tests are stable

function computeFixture() {
  return H.computeAll(H.coerceShape(fixtureState()), TODAY_FIX);
}

group('Formula engine — rules');
t('paycheck rule multiplies per-check by that month count (incl. the 3.5 case)', () => {
  const c = computeFixture()['2030'];
  approx(c.cells['paycheck|2030-04'].v, 2000, 'April: 1000 × 2');
  approx(c.cells['paycheck|2030-05'].v, 3500, 'May: 1000 × 3.5');
  eq(c.cells['paycheck|2030-04'].kind, 'auto');
});
t('trailing average uses stored months before the estimate, so it does not drift', () => {
  const c = computeFixture()['2030'];
  approx(c.cells['cc|2030-04'].v, -1000, 'April: mean of the Jan..Mar actuals');
  approx(c.cells['cc|2030-06'].v, -1058.5,
    'June adds the May manual but ignores the auto April');
});
t('a manual estimate beats the auto rule', () => {
  const c = computeFixture()['2030'];
  eq(c.cells['cc|2030-05'].kind, 'manual');
  approx(c.cells['cc|2030-05'].v, -1234);
});
t('carry repeats the nearest earlier stored value', () => {
  const c = computeFixture()['2030'];
  approx(c.cells['internet|2030-04'].v, -50);
  approx(c.cells['internet|2030-06'].v, -50);
});
t('same-month-last-year reaches into the prior year and rounds', () => {
  const s = H.coerceShape(fixtureState());
  s.years['2030'].monthCount = 12;   // reach October, 12 months after 2029-10
  const c = H.computeAll(s, TODAY_FIX)['2030'];
  eq(c.cells['electric|2030-10'].kind, 'auto');
  approx(c.cells['electric|2030-10'].v, -80, 'ROUND(-80.4, 0)');
  eq(c.cells['electric|2030-05'].kind, 'missing', 'no May 2029 to copy — stays blank');
});
t('a blank month inside the entered range counts as zero and is flagged', () => {
  const c = computeFixture()['2030'];
  eq(c.cells['dividends|2030-02'].kind, 'missing');
  approx(c.cells['dividends|2030-02'].v, 0);
});
t('dividends read last month’s cash + mid balances at rate/12', () => {
  const c = computeFixture()['2030'];
  // March balances: cash = 10000+2000+2000-900-1100-50-500 (midt) +3000-1000 = 13450
  //                 mid  = 1000 + 500 = 1500
  approx(c.balances['cash|2030-03'], 13450);
  approx(c.balances['mid|2030-03'], 1500);
  approx(c.cells['dividends|2030-04'].v, H.round2(0.03 / 12 * (12345 + 1500)) ,
    'April divs read the PINNED April cash? No — March', 100);
  approx(c.cells['dividends|2030-04'].v, H.round2(0.03 / 12 * (13450 + 1500)));
});

group('Formula engine — balances');
t('the four-account chain matches the spreadsheet formulas', () => {
  const c = computeFixture()['2030'];
  approx(c.balances['bank|2030-04'], 325, 'bank + zelle');
  approx(c.balances['mid|2030-02'], 1500, 'mid grows by the negative transfer');
  // long April: (long Mar − 0) × (1 + .07/12) + charitable(-60)
  const longMar = c.balances['long|2030-03'];
  approx(c.balances['long|2030-04'], H.round2(longMar * (1 + 0.07 / 12) - 60), '', 0.02);
});
t('a balance override pins that month and later months chain from it', () => {
  const c = computeFixture()['2030'];
  approx(c.balances['cash|2030-04'], 12345, 'pinned');
  eq(c.balanceKinds['cash|2030-04'], 'pinned');
  const aprFlows = c.cells['paycheck|2030-05'].v + c.cells['dividends|2030-05'].v
    + c.cells['cc|2030-05'].v + c.cells['internet|2030-05'].v;
  approx(c.balances['cash|2030-05'], H.round2(12345 + aprFlows), 'May chains from the pin', 0.02);
});
t('total is the sum of the four accounts', () => {
  const c = computeFixture()['2030'];
  const m = '2030-03';
  approx(c.balances[`total|${m}`],
    H.round2(c.balances[`cash|${m}`] + c.balances[`mid|${m}`]
      + c.balances[`long|${m}`] + c.balances[`bank|${m}`]));
});

group('Goals');
t('each source maps to its balance, with caps and overflow', () => {
  const s = H.coerceShape(fixtureState());
  const computed = H.computeAll(s, TODAY_FIX);
  const goals = H.computeGoals(s, computed, TODAY_FIX);
  const c = computed['2030'];
  const cur = '2030-04';
  eq(goals[0].saved, 5000, 'cashBank capped at target');
  eq(goals[1].saved, 1200, 'mid capped at its target');
  approx(goals[2].saved, c.balances[`mid|${cur}`] - 1200, 'overflow above the cap');
  approx(goals[3].saved, c.balances[`long|${cur}`], 'long uncapped');
});
t('monthly requirement divides the gap by the months left', () => {
  const s = H.coerceShape(fixtureState());
  const goals = H.computeGoals(s, H.computeAll(s, TODAY_FIX), TODAY_FIX);
  eq(goals[0].monthsLeft, 8, 'Apr 2030 → Dec 2030');
  approx(goals[0].monthlyReq, 0, 'already at target');
});

group('Sections & quarterly rule');
t('coerceShape infers sections: roles → transfer, sign → income/expense', () => {
  const d = H.coerceShape({ years: { '2030': { kind: 'grid', startMonth: '2030-01',
    monthCount: 6,
    categories: [
      { id: 'pay', name: 'Pay', role: 'normal', rule: 'none' },
      { id: 'rent', name: 'Rent', role: 'normal', rule: 'none' },
      { id: 'move', name: 'Move', role: 'midTransfer', rule: 'none' },
      { id: 'picked', name: 'Picked', role: 'normal', rule: 'none', section: 'income' },
    ],
    cells: { 'pay|2030-01': { v: 500, kind: 'actual' },
             'rent|2030-01': { v: -900, kind: 'actual' },
             'picked|2030-01': { v: -5, kind: 'actual' } } } } });
  const cats = d.years['2030'].categories;
  eq(cats[0].section, 'income', 'positive sum');
  eq(cats[1].section, 'expense', 'negative sum');
  eq(cats[2].section, 'transfer', 'transfer role wins');
  eq(cats[3].section, 'income', 'a hand-picked section is never re-guessed');
});
t('the old name/rate maps become an account list, once', () => {
  const d = H.coerceShape({ settings: { accountNames: { mid: 'House fund' },
    accountRates: { mid: 0.05 } } });
  const mid = d.settings.accounts.find(a => a.id === 'mid');
  eq(mid.name, 'House fund');
  approx(mid.rate, 0.05);
  eq(d.settings.accounts.find(a => a.id === 'cash').name, 'Cash', 'missing keys fall back');
  eq(d.settings.accounts.find(a => a.id === 'cash').hub, true, 'cash is the hub');
  eq(d.settings.accountNames, undefined, 'the old maps are gone, so a rename sticks');
  eq(d.settings.accountRates, undefined);
});
t('a per-account interest rate compounds that account monthly', () => {
  const raw = fixtureState();
  raw.settings.accountRates = { mid: 0.12 };   // 1%/month, coerce fills the rest
  const s = H.coerceShape(raw);
  approx(s.settings.accounts.find(a => a.id === 'long').rate, 0.07,
    'legacy long rate carried over');
  const c = H.computeAll(s, TODAY_FIX)['2030'];
  approx(c.balances['mid|2030-01'], 1010, 'seed 1000 × 1.01');
  approx(c.balances['mid|2030-02'], 1525.1, '(1010 + the 500 moved in) × 1.01');
  approx(c.balances['mid|2030-03'], 1540.35, 'keeps compounding', 0.01);
});
t('quarterly rule repeats on the 3-month beat and stays blank between', () => {
  const s = H.coerceShape(fixtureState());
  s.years['2030'].categories.push({ id: 'water', name: 'Water', role: 'normal',
    rule: 'quarterly', section: 'expense' });
  s.years['2030'].cells['water|2030-03'] = { v: -56, kind: 'actual' };
  const c = H.computeAll(s, TODAY_FIX)['2030'];
  eq(c.cells['water|2030-04'].kind, 'missing', 'one month after: blank');
  eq(c.cells['water|2030-05'].kind, 'missing', 'two months after: blank');
  approx(c.cells['water|2030-06'].v, -56, 'three months after: repeats');
  eq(c.cells['water|2030-06'].kind, 'auto');
});
t('the cycle length is configurable per row', () => {
  const s = H.coerceShape(fixtureState());
  s.years['2030'].categories.push({ id: 'ins', name: 'Insurance', role: 'normal',
    rule: 'quarterly', every: 2, section: 'expense' });
  s.years['2030'].cells['ins|2030-02'] = { v: -90, kind: 'actual' };
  const c = H.computeAll(s, TODAY_FIX)['2030'];
  eq(c.cells['ins|2030-05'].kind, 'missing', 'odd month: blank');
  approx(c.cells['ins|2030-04'].v, -90, 'two months after: repeats');
  approx(c.cells['ins|2030-06'].v, -90, 'four months after: repeats');
});
t('the interest rule takes a per-row rate, falling back to the old setting', () => {
  const s = H.coerceShape(fixtureState());
  s.years['2030'].categories.push({ id: 'divs2', name: 'HYSA interest',
    role: 'normal', rule: 'dividends', rate: 0.12, section: 'income' });
  const c = H.computeAll(s, TODAY_FIX)['2030'];
  const base = c.balances['cash|2030-03'] + c.balances['mid|2030-03'];
  approx(c.cells['divs2|2030-04'].v, H.round2(0.12 / 12 * base), 'row rate wins', 0.02);
  approx(c.cells['dividends|2030-04'].v, H.round2(0.03 / 12 * base),
    'a row without its own rate keeps the old 3%', 0.02);
});
t('the six old 401k fields migrate into the generic account list once', () => {
  const d = H.coerceShape({ side: { k401: { pretax: 100, raa: 50, rollover: 200,
    match: 25, roth: 80, rothIra: 40 } } });
  const a = d.side.retirementAccounts;
  eq(a.length, 6);
  eq(a[0].name, '401k pre-tax');
  eq(a[0].kind, 'traditional');
  eq(a[4].kind, 'roth');
  eq(Object.keys(d.side.k401).length, 0, 'source emptied so it cannot re-migrate');
  // deleting everything must not resurrect the old figures
  const again = H.coerceShape(JSON.parse(JSON.stringify(
    Object.assign(d, { side: Object.assign(d.side, { retirementAccounts: [] }) }))));
  eq(again.side.retirementAccounts.length, 0);
});

group('Year rollover');
t('rollover copies rules, keeps overlap manuals, seeds December balances', () => {
  const s = H.coerceShape(fixtureState());
  s.years['2030'].monthCount = 18;   // grid reaches into 2031 like the real sheet
  s.years['2030'].cells['cc|2031-02'] = { v: -777, kind: 'manual' };
  s.years['2030'].paychecks['2031-03'] = 3;
  const computed = H.computeAll(s, TODAY_FIX);
  const created = H.rolloverYear(s, computed, '2030');
  eq(created, '2031');
  const ny = s.years['2031'];
  eq(ny.model, 'live');
  eq(ny.monthCount, 12);
  eq(ny.enteredThrough, '2030-12', 'nothing entered yet');
  eq(ny.categories.length, s.years['2030'].categories.length);
  eq(ny.cells['cc|2031-02'].v, -777, 'overlap manual came along');
  eq(ny.paychecks['2031-03'], 3);
  approx(ny.seeds.cash, computed['2030'].balances['cash|2030-12'], 'seeded from Dec');
  eq(H.rolloverYear(s, computed, '2030'), null, 'no double rollover');
});
t('the old year is untouched by a rollover', () => {
  const s = H.coerceShape(fixtureState());
  const before = JSON.stringify(s.years['2030']);
  H.rolloverYear(s, H.computeAll(s, TODAY_FIX), '2030');
  eq(JSON.stringify(s.years['2030']), before);
});

group('Accounts');
t('the legacy roles compute identically to the fixed four-account chain', () => {
  /* The engine used to hard-code cash/mid/long/bank and five role names. It
     iterates a list now — this pins that the defaults still produce exactly
     the old numbers, including the one asymmetry that matters: a bank
     pass-through lands BEFORE that account's growth, a charitable payment
     AFTER it. */
  const s = H.coerceShape(fixtureState());
  const c = H.computeAll(s, TODAY_FIX)['2030'];
  const yr = s.years['2030'];
  const rate = (id) => s.settings.accounts.find(a => a.id === id).rate;
  const priorOf = (id, m) => c.balances[`${id}|${H.monthAdd(m, -1)}`] ?? (yr.seeds[id] || 0);
  const flowsAt = (m) => {
    const f = { all: 0, mid: 0, long: 0, bank: 0, zelle: 0, char: 0 };
    for (const cat of yr.categories) {
      const v = c.cells[`${cat.id}|${m}`].v;
      if (cat.id === 'char') { f.char += v; continue; }
      if (cat.id === 'zelle') { f.zelle += v; continue; }
      f.all += v;
      if (cat.id === 'midt') f.mid += v;
      if (cat.id === 'longt') f.long += v;
      if (cat.id === 'bankt') f.bank += v;
    }
    return f;
  };
  for (const m of ['2030-02', '2030-03', '2030-05', '2030-06']) {
    const f = flowsAt(m);
    const g = (id) => 1 + rate(id) / 12;
    approx(c.balances[`cash|${m}`], H.round2(priorOf('cash', m) * g('cash') + f.all),
      `cash ${m}`, 0.02);
    approx(c.balances[`mid|${m}`], H.round2((priorOf('mid', m) - f.mid) * g('mid')),
      `mid ${m}`, 0.02);
    approx(c.balances[`long|${m}`],
      H.round2((priorOf('long', m) - f.long) * g('long') + f.char), `long ${m}`, 0.02);
    approx(c.balances[`bank|${m}`],
      H.round2((priorOf('bank', m) - f.bank + f.zelle) * g('bank')), `bank ${m}`, 0.02);
  }
});
t('legacy role names become role + target, and migrating twice changes nothing', () => {
  const once = H.coerceShape(fixtureState());
  const cats = once.years['2030'].categories;
  const by = (id) => cats.find(c => c.id === id);

t('interest can be paid into a different account', () => {
  const withRate = () => {

  const s = withRate();
  s.settings.accounts.find(a => a.id === 'long').creditTo = 'cash';
  const c = H.computeAll(s, TODAY_FIX)['2030'];

  const swept = c.interest['long|2030-01'] + c.interest['long|2030-02'];

t('a __proto__ key in a restored file never becomes a prototype', () => {

  const target = {};

group('Year lifecycle');
t('converting a grid to a summary keeps the flows History charts read', () => {
  const s = H.coerceShape(fixtureState());
  const yr = s.years['2030'];
  const flows = (obj) => {
    let inn = 0, out = 0;
    if (obj.kind === 'summary') {
      for (const i of obj.categoryTotals) {
        if (i.isBalance) continue;
        if (i.total > 0) inn += i.total; else out += i.total;
      }
    } else {
      for (const [k, cell] of Object.entries(obj.cells)) {
        if (!k.split('|')[1].startsWith('2030')) continue;
        if (cell.v > 0) inn += cell.v; else out += cell.v;
      }
    }
    return [H.round2(inn), H.round2(Math.abs(out))];
  };
  const before = flows(yr);
  const summary = H.gridToSummary(s, '2030');
  eq(summary.kind, 'summary');
  eq(flows(summary), before, 'money in and out are unchanged');
});

/* ── Local-only real-data cross-check ─────────────────────────────────────────
   Fetches the two gitignored import files. On this Mac, with a fresh import
   run, it diffs the JS engine against the spreadsheet's own cached values.
   Anywhere else (CI, the public site) the fetch 404s and the group SKIPS —
   green, because absence is the expected state there. */
group('Real data (local only)');
t('engine matches the spreadsheet where the import files exist', () => {
  if (!window.__realData) { return; }   // resolved before run() below
  const { data, expected } = window.__realData;
  const st = H.coerceShape(data);
  const computed = H.computeAll(st, new Date().toISOString().slice(0, 10));
  const liveKey = Object.keys(computed).sort().pop();
  const c = computed[liveKey];
  const bad = [];
  /* Only the live year's own months are pinned against the sheet. The grid
     runs a year past that as a PROJECTION now — the spreadsheet had those
     months typed in by hand, the app works them out from the rules, and the
     two are not meant to agree. */
  const ownYear = (key) => key.split('|')[1].startsWith(liveKey);
  /* Accounts that start partway through the year (money that used to sit in
     the "other money" list, outside the plan's arithmetic) join Total from
     their start month. The sheet's own SUM covers the original four accounts
     only, so from that month on the two totals are measuring different things
     — deliberately. Every individual account is still pinned. */
  const firstSince = st.settings.accounts.map(a => a.since).filter(Boolean).sort()[0];
  const skip = (key) => {
    const [id, m] = key.split('|');
    return id === 'total' && firstSince && m >= firstSince;
  };
  for (const [key, exp] of Object.entries(expected.cells)) {
    if (!ownYear(key)) continue;
    const got = c.cells[key];
    if (!got || Math.abs(got.v - exp.v) > 0.01)
      bad.push(`${key}: engine ${got ? got.v : 'missing'} vs sheet ${exp.v} (=${exp.f})`);
  }
  for (const [key, exp] of Object.entries(expected.balances)) {
    if (!ownYear(key) || skip(key)) continue;
    const got = c.balances[key];
    if (got === undefined || Math.abs(got - exp.v) > 1)
      bad.push(`${key}: engine ${got} vs sheet ${exp.v} (=${exp.f})`);
  }
  if (bad.length) throw new Error(bad.slice(0, 8).join('\n') +
    (bad.length > 8 ? `\n…and ${bad.length - 8} more` : ''));
});

/* ── Runner ───────────────────────────────────────────────────────────────── */
window.addEventListener('load', async () => {
  /* The real-data files are gitignored; a 404 here is the normal state in CI
     and on the public site, and the cross-check test skips itself. */
  try {
    const [d, e] = await Promise.all([
      fetch('financial-plan-data.json'), fetch('expected-2026.json')]);
    if (d.ok && e.ok)
      window.__realData = { data: await d.json(), expected: await e.json() };
  } catch (_) { /* no local files — skip */ }

  const frame = document.getElementById('app');
  const start = () => setTimeout(run, 150); // let the app's boot script finish
  if (frame.contentDocument && frame.contentDocument.readyState === 'complete'
      && frame.contentWindow.__finTestHooks) start();
  else frame.addEventListener('load', start, { once: true });
});

function run() {
  w = document.getElementById('app').contentWindow;
  H = w.__finTestHooks;
  const out = document.getElementById('out');
  let pass = 0, fail = 0;
  for (const item of TESTS) {
    if (item.group) {
      const tr = document.createElement('tr');
      tr.className = 'group';
      tr.innerHTML = '<td colspan="3"></td>';
      tr.firstChild.textContent = item.group;
      out.appendChild(tr);
      continue;
    }
    const tr = document.createElement('tr');
    const st = document.createElement('td'); st.className = 'st';
    const name = document.createElement('td'); name.textContent = item.name;
    const msg = document.createElement('td'); msg.className = 'msg';
    try {
      item.fn();
      tr.className = 'pass'; st.textContent = '✓'; pass++;
    } catch (e) {
      tr.className = 'fail'; st.textContent = '✕'; msg.textContent = e.message; fail++;
    }
    tr.appendChild(st); tr.appendChild(name); tr.appendChild(msg);
    out.appendChild(tr);
  }
  const s = document.getElementById('summary');
  s.textContent = fail === 0 ? `All ${pass} tests pass` : `${fail} of ${pass + fail} tests FAILED`;
  s.className = fail === 0 ? 'ok' : 'bad';
  document.title = (fail === 0 ? '✓ ' : '✕ ') + document.title;
}
