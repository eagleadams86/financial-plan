/* ── The one credential in the dialog is marked up as one ───────────────────
   That the key never leaves the browser is pinned above, in "the price key is
   unreachable from anything that leaves the browser", and nothing here loosens
   it. What is pinned HERE is the consequence of that decision: if the app will
   not carry the key between devices — and on 2026-08-26 it was decided it never
   will — then the browser's own password manager has to, and a manager only
   offers to keep a field it can recognise as a credential. Every line of that
   is markup the hooks cannot reach, because the dialog is built from a spec at
   open time, so it is held against the source instead. */
t('the price key field asks the password manager to carry it', () => {
  ok(APP_SRC, 'index.html was not read — the fetch test above must run first');
  const src = stripComments(APP_SRC);
  ok(/\{ key: 'priceApiKey', label: 'Twelve Data key', type: 'password',/.test(src),
     'the field is a password field, not the text box it used to be — masked on '
     + 'screen, and the one thing a manager looks for before offering to save');
  ok(/password: 'password' \}\[f\.type\] \|\| 'text'/.test(src),
     'and buildFields knows the type: an unknown one falls through to a text box, so '
     + 'the spec above would go on rendering exactly what it used to and say nothing');
  const attrs = src.slice(src.indexOf("if (f.type === 'password') {"),
                          src.indexOf("} else if (f.type === 'password') {"));
  ok(/input\.autocomplete = f\.autocomplete \|\| 'current-password'/.test(attrs),
     'current-password, so the manager offers to FILL the key you already have — '
     + 'new-password makes Safari offer to invent one instead, which is not a key '
     + 'Twelve Data has ever heard of');
  ok(/input\.name = f\.name \|\| f\.key/.test(attrs),
     'and it is named: a nameless field gives a manager nothing to key its entry on');
  ok(/input\.spellcheck = false/.test(attrs)
     && /setAttribute\('autocapitalize', 'off'\)/.test(attrs)
     && /setAttribute\('autocorrect', 'off'\)/.test(attrs),
     'iOS is told to leave it alone — left to itself it capitalises the first letter '
     + 'of a 32-character key and autocorrects the rest, and the only report of that '
     + 'arrives later as "Twelve Data rejected the API key"');
  const branch = src.slice(src.indexOf("} else if (f.type === 'password') {"));
  const body = branch.slice(0, branch.indexOf('} else cell.appendChild(input);'));
  ok(/rename\('Show'\);/.test(body) && /rename\(shown \? 'Show' : 'Hide'\)/.test(body),
     'a masked key you cannot read back is a typo you cannot find, so the box carries '
     + 'a Show button that says what it will do next');
  ok(/aria-label', `\$\{word\} \$\{f\.label\}`/.test(body),
     'and the button says WHICH field it will show — with the visible word first, so '
     + 'voice control still matches on the word it can actually see');
  ok(/btn\.type = 'button'/.test(body),
     'and it is a plain button — a default submit would save the whole dialog every '
     + 'time you looked at the key');
  ok(/row\.className = 'field-row'/.test(body),
     'in the same row wrapper the action fields use, so it sits under its input like '
     + 'every other button in this dialog rather than inventing a second arrangement');
  /* Reported 2026-08-26 from a real Safari save: the prompt filed the key under
     the field NEXT DOOR as its username. Preferences is one <form>, so every
     text box in it was a candidate, and a password-only form that names no
     account gets whatever is nearest — which changes the day somebody reorders
     the dialog. */
  ok(/account\.autocomplete = 'username'/.test(body)
     && /account\.value = f\.account \|\| f\.label/.test(body),
     'the field names its own account, so the manager files the key under something '
     + 'chosen rather than under whichever box happens to sit beside it');
  ok(/holder\.className = 'sr-only'/.test(body) && !/account\.hidden = true/.test(body),
     'clipped rather than display:none — a manager may skip a hidden field, and a '
     + 'skipped one puts us straight back to guessing');
  ok(/holder\.appendChild\(account\)/.test(body) && !/account\.className = 'sr-only'/.test(body),
     'and the clip is on a WRAPPER: on the input it lost to `.field-row > input`, which '
     + 'sized the 1px field to 20x40 — invisible, and still a real 40px of the column');
  ok(/account\.readOnly = true/.test(body) && /account\.tabIndex = -1/.test(body)
     && /account\.setAttribute\('aria-hidden', 'true'\)/.test(body),
     'and nothing can type in it, tab to it or hear it — it is bookkeeping for the '
     + 'browser, not a field anybody fills in');
  const css = stripComments(APP_SRC);
  const cap = css.match(/([^}]*)\{ max-width: 320px; \}/);
  ok(cap && /input\[type="password"\]/.test(cap[1]),
     'and a password box is capped at 320px like every other box in a dialog — that '
     + 'figure was MEASURED on this very field, a 32-character key held whole, so '
     + 'changing its type must not drop it out of the rule that exists for it');
});
/* A body is an array of paragraphs, and a paragraph an array of runs — a plain
   string, or { b } for bold. `flat` is what the reader ends up seeing. */
const helpText = (h) => h.body.map((para) =>
  para.map((run) => (typeof run === 'string' ? run : run.b)).join('')).join('\n\n');
t('no info window opens half written', () => {
  const entries = Object.entries(H.HELP);
  eq(entries.filter(([, h]) => !h.title || !h.title.trim()).map(([k]) => k).join(', '), '',
    'each one is headed — the dialog has no fallback title');
  /* 120 characters is well under the shortest real entry (about 200) and well
     over a heading restated as a sentence, which is what a stub looks like. */
  eq(entries.filter(([, h]) => helpText(h).trim().length < 120).map(([k]) => k).join(', '), '',
    'and each one explains something — a stub is worse than no dot, having been asked for');
  /* The bodies are written as one string per line, joined with +. Miss the
     space at a join and two words run together; leave one at both ends of a
     join and the sentence gets a gap the reader can see. A run boundary is the
     same trap by another route — b('…') sitting flush against the word before
     it, or with a space at both ends of the seam. */
  const paraText = (para) => para.map((r) => (typeof r === 'string' ? r : r.b)).join('');
  eq(entries.filter(([, h]) => h.body.some((para) => / {2}/.test(paraText(para))))
    .map(([k]) => k).join(', '), '',
    'with no doubled space, which is a + join or a run seam given the space twice');
});
t('every body is paragraphs of runs, and every run is text', () => {
  /* The shape IS the safety property: renderHelpBody walks this with
     createElement and textContent, so there is no path by which any of it is
     parsed as markup. A body that arrived as a bare string would still render
     — as one paragraph of characters — which is exactly the silent kind of
     wrong worth a test. */
  const entries = Object.entries(H.HELP);
  eq(entries.filter(([, h]) => !Array.isArray(h.body) || !h.body.length).map(([k]) => k).join(', '),
    '', 'a body is an array of paragraphs');
  const badRun = entries.filter(([, h]) => h.body.some((para) =>
    !Array.isArray(para) || !para.length
    || para.some((run) => typeof run !== 'string'
      && !(run && typeof run.b === 'string' && run.b.length))));
  eq(badRun.map(([k]) => k).join(', '), '',
    "a paragraph is an array of runs, and a run is a string or b('…')");
  /* No angle brackets anywhere: nothing here is trying to be markup, and if a
     body ever starts to, this is where it is caught rather than in the DOM. */
  eq(entries.filter(([, h]) => /[<>]/.test(helpText(h))).map(([k]) => k).join(', '), '',
    'and no run reaches for a tag — this renderer would print it as characters');
});
t('no entry is so long the window it opens has to scroll', () => {
  /* THE CEILING, and it was measured rather than picked (2026-08-27). At the
     66ch measure the prose runs about 0.35px of height per character, so a
     3,539-character entry stands 1,249px tall — which is taller than the
     window can be on any screen under about 1,300px, and `monthDue` was
     exactly that. The window then scrolls, and a scrolling help sheet is one
     whose second half nobody reads.
     2,600 is the height a 950px-tall window can show (that window gives the
     text 914px, and `max-height: calc(100vh - 32px)` is where the number comes
     from). It is a CEILING on one entry, not a budget for the table: the fix
     when an entry reaches it is to split it in two and hang the second half
     off the heading that asks for it, which is what the due block did. Making
     the window wider is the other way out and it is the wrong one — the 66ch
     measure would have to go to 106ch to fit that entry, which is a 128-
     character line, and the measure exists precisely to prevent that. */
  const entries = Object.entries(H.HELP);
  const long = entries.map(([k, h]) => [k, helpText(h).length])
    .filter(([, n]) => n > 2600).map(([k, n]) => k + ' (' + n + ')');
  eq(long.join(', '), '',
    'an entry over 2,600 characters — it will open a window that scrolls, and '
    + 'the answer is a second dot beside the second heading, not a wider window');
});

t('the help sheet is as wide as its text, not the common width', () => {

     change to any of them belongs in all five. */

    'and the reading measure is what it is sized to — remove it and the window '
    + 'grows to the full 1100px, at about 150 characters a line. The type is in '

t('EVERY dialog closes on a backdrop click, bar the one documented exception', () => {
  /* Enumerated from the markup rather than listed here, and that is the whole
     point of the test: a dialog added later is covered the day it is added.
     compareDialog was missing from the registration list until 2026-08-23 —
     read-only, one Close button, nothing about it that wanted an exception —
     and a hand-written list would have gone on agreeing with itself.
     The lottery portfolio's help window shipped with the same gap on the same
     day, which is why every suite in the family now checks it this way. */
  const ids = [...stripHtmlComments(APP_SRC).matchAll(/<dialog id="(\w+)"/g)].map((m) => m[1]);
  ok(ids.length >= 8, 'the dialogs were found — ' + ids.length);
  /* THE ONE DOCUMENTED EXCEPTION, family-wide: "which copy of your data?" has
     no safe default, so it must be answered rather than dismissed. */
  const exempt = ['syncChoiceDialog'];
  const at = APP_SRC.indexOf('closeOnBackdropClick(F(id))');
  const list = APP_SRC.slice(APP_SRC.lastIndexOf('[', at), at);
  eq(ids.filter((id) => !exempt.includes(id) && !list.includes("'" + id + "'")).join(', '), '',
    'a dialog you cannot dismiss by clicking off it');
  eq(exempt.filter((id) => list.includes("'" + id + "'")).join(', '), '',
    'and the exception is still excluded — it must be answered, not dismissed');
});
t('and the handler needs both the press and the release outside', () => {
  /* Not `e.target === this` on its own: a click on the backdrop reports the
     dialog as the target, but so does one on the dialog's own 20px of padding.
     Requiring the press too is what stops a selection dragged out of a field
     from throwing the edit away. */
  const fn = (APP_SRC.match(/function closeOnBackdropClick\(dlg\) \{[\s\S]*?\n\}/) || [''])[0];
  ok(fn, 'the helper is missing');
  ok(/getBoundingClientRect\(\)/.test(fn) && /e\.clientX < r\.left/.test(fn),
    'the pointer is tested against the box, not just the target');
  ok(/startedOutside && outside\(e\)/.test(fn),
    'and both the press and the release have to land outside');
});
t('every dialog closes on a click off it, bar the one documented exception', () => {
  /* EVERY dialog closes on a click off it, and this tests the BEHAVIOUR rather
     than the registration list. A source scan only ever proves an id is on a
     list; it cannot see a dialog wired through a variable, and a hand-written
     list checked by a hand-written test agrees with itself forever. Both of
     those bit on 2026-08-23 — the lottery portfolio's help window had no
     handler at all and Money Map's compare window was simply left off the list.
     Far outside rather than a few pixels: the app runs in a 1px frame here, so
     the dialog's box is degenerate and only an unambiguous point is safe. What
     this cannot check at 1px is the padding case — a click just INSIDE the
     frame must NOT close it — so that one is verified by hand in a browser. */
  const EXEMPT = ['syncChoiceDialog'];
  const dialogs = [...w.document.querySelectorAll('dialog')];
  ok(dialogs.length >= 2, 'the dialogs were found — ' + dialogs.length);
  const stuck = [], leaky = [];
  for (const d of dialogs) {
    if (d.open) d.close();
    d.showModal();
    for (const type of ['pointerdown', 'mousedown', 'click']) {
      const E = type === 'pointerdown' ? w.PointerEvent : w.MouseEvent;
      d.dispatchEvent(new E(type, { clientX: -1000, clientY: -1000,
        bubbles: true, cancelable: true }));
    }
    const closed = !d.open;
    d.close();
    if (EXEMPT.includes(d.id)) { if (closed) leaky.push(d.id); }
    else if (!closed) stuck.push(d.id);
  }
  eq(stuck.join(', '), '', 'a dialog you cannot dismiss by clicking off it');
  /* THE ONE DOCUMENTED EXCEPTION, family-wide: "which copy of your data?" has
     no safe default, so it must be answered rather than dismissed. */
  eq(leaky.join(', '), '', 'and the exception must still refuse to be dismissed');
});

/* ── The footer every public page in this account carries ────────────────────
   The privacy policy, the repo under the label "How it works", and the
   authorship line. The APP's footer has had all three for a while; privacy.html
   carried none of them until 2026-08-21, and it is a public page reached by a
   link in that very footer — so somebody who follows it lands on a document
   with no way back to what it documents and no statement of who wrote it. The
   privacy link itself is deliberately absent: you are standing on that page. */
t('the privacy page carries the family footer', async () => {
  const res = await bustFetch('privacy.html');
  ok(res.ok, 'privacy.html is missing — the app footer links straight at it');
  const src = await res.text();
  ok(/>How it works</.test(src),
    'privacy.html must carry the repo link, labelled "How it works" family-wide');
  ok(/MIT licensed/.test(src),
    'and the authorship line every public page in the family has');
  /* Comments stripped FIRST, and the footer matched by its CLASS. The notes
     beside both elements name them in prose — and one of those notes is in the
     <style> block, which an HTML-comment strip does not reach — so a bare
     /<main>/ or a bare '<footer' would pass on a page that had lost the element
     and kept the comment explaining it, which is the one way this could rot. */
  const bare = stripHtmlComments(src);
  /* Matched by the WRAPPER's class, never by a bare '<footer'. A bare match
     passes on the prose in the <style> block's own comment, which an
     HTML-comment strip does not reach. `class="foot"` served that purpose on the
     element itself until 2026-08-23, when every page in the family moved to
     Sprint Predictability's footer treatment; `.footnotes` serves it now — and
     it is load-bearing rather than decorative, because `footer` is a flex ROW
     and without the wrapper the lines lay out side by side. */
  ok(/<div class="footnotes">/.test(bare),
    'the footer is a real <footer> — a contentinfo landmark, not a styled paragraph');
  ok(/<main>/.test(bare),
    'and the policy sits in <main>, or contentinfo would be the only landmark on the page');
  ok(bare.indexOf('</main>') < bare.indexOf('<div class="footnotes">'),
    'with main CLOSED before it: a <footer> inside main is not contentinfo at all');
  ok(!/href="privacy\.html"/.test(src),
    'and NOT a privacy link, which on the privacy page points at itself');
  /* The wording here has moved twice and the second move is the good one. It
     had no account of an ordinary visit at all, while a network trace showed
     Google's code being fetched on every one. That was corrected on 2026-08-21,
     and then on 2026-08-22 the APP was changed so the strong sentence could be
     true: nothing of Google's is fetched until the sign-in button is reached
     for, or unless this browser already holds a session. So this pins the strong
     claim AND the honest caveat, because a policy that promised "never without
     asking" and quietly skipped the already-signed-in case would be the same
     kind of wrong again. */
  ok(/[Oo]nly when you ask for it/.test(src),
    'the policy must say Google’s code is fetched only when asked for');
  ok(/already signed in on this device/.test(src),
    'and must still own the one case where it loads on its own — a browser that '
    + 'already holds a session, which is the only way staying signed in can work');
  ok(/signing out stops the requests/i.test(src),
    'and say that signing out stops the requests, not just the syncing');
  /* The two hosts, as a NAMED LIST of things the prose has to mention, rather
     than a boolean over two literals. It reads as what it is — a documentation
     requirement — and it is also the shape that stops a scanner misreading it.
     Written inline, either spelling trips a URL-validation heuristic: as a
     regex it is js/regex/missing-regexp-anchor, and as .includes() it is
     js/incomplete-url-substring-sanitization. Both were reported here and in
     two sibling repos. Nothing on this line validates a URL — there is no URL,
     only a policy document being searched for a word — so neither alert was
     ever a vulnerability, and the fix is to say plainly what is being asked. */
  for (const host of HOSTS_THE_POLICY_MUST_NAME) {
    ok(src.indexOf(host) !== -1,
      'the policy must name ' + host + ', so the claim is checkable against a network trace');
  }
  ok(!/loads? on (every|each) visit(?![\s\S]{0,80}until August)/i.test(src),
    'the every-visit wording is back, but the app no longer does that — one of '
    + 'the two is now wrong');
});

t('Google\u2019s code is fetched when it is asked for, not on every visit', () => {
  /* The change this pins (2026-08-22): Google's code is no longer fetched on
     every visit. init() used to run unconditionally at the foot of the sync
     module, so firebase-app/auth/firestore and the sign-in client were
     downloaded before anyone had touched anything — which is what made the
     privacy policy's old wording false. Now the boot branch asks
     shouldBootSync(), and a browser that has never signed in loads nothing
     until the button is reached for.

     Read as TEXT, like the service-worker group above and for the same reason:
     the suite must not boot a real session to find out. What is worth asserting
     is the SHAPE — that the unconditional call is gone, that the flag is written
     on every auth report including the null one, and that the click path can
     still get the SDK for somebody who never hovers. */
  const code = stripComments(APP_SRC);
  ok(!/^\s*init\(\)\.catch/m.test(code),
    'init() is being called unconditionally again — that is the eager load this removed');
  ok(/function shouldBootSync\(\)/.test(code),
    'the boot decision must go through shouldBootSync()');
  ok(/if \(shouldBootSync\(\)\)/.test(code), 'and the boot branch must ask it');
  ok(/const SYNC_LIVE = 'fin-sync-live'/.test(code),
    'the flag this app records the answer in must keep its key');
  ok(/localStorage\.setItem\(SYNC_LIVE, u \? '1' : '0'\)/.test(code),
    "the flag must be written on EVERY auth report — the null one is what makes "
    + 'signing out stop the requests rather than just the syncing');
  ok(/localStorage\.getItem\(LEGACY_SYNC_UID\) !== null/.test(code),
    'a browser that signed in before this shipped must still be recognised, once, '
    + 'from the legacy fin-sync-uid marker');
  for (const ev of ['pointerenter', 'pointerdown', 'focus'])
    ok(code.includes("'" + ev + "'"),
      'the SDK is warmed on ' + ev + ', which fires before click — without it the '
      + 'sign-in popup is opened outside the gesture and browsers block it');
  ok(/async function onClick\(\)/.test(code) && /await ensureInit\(\)/.test(code),
    'and the click path must be able to load it itself, for somebody who tabs '
    + 'straight to the button and presses Enter');
  ok(/function ensureInit\(\)/.test(code) && /if \(!initPromise\)/.test(code),
    'ensureInit must be idempotent, or a hover and a click start two Firebase apps');
});

t('the worker touches nothing cross-origin', () => {
  /* Guarded before the negations below. Every assertion in this test is a NOT,
     and a NOT over an empty string passes — so a file that failed to load would
     report green here while proving nothing. The test that reads the file says
     so too, but its failure does not stop this one printing a tick. */
  ok(SW_SRC, 'sw.js did not load — the negations below would all pass on an empty string');
  const code = stripComments(SW_SRC);
  ok(!/https?:\/\//.test(code),
    'sw.js names an off-origin URL in executable code — it must only ever see this origin');
  /* No CSP applies to a worker on Pages, so these are not merely untidy here. */
  for (const bad of ['eval(', 'importScripts(', 'new Function('])
    ok(!code.includes(bad), `sw.js uses ${bad} — it runs with no CSP, so it must not`);
});

t('the worker deletes only its own caches', () => {
  const code = stripComments(SW_SRC);
  /* Cache Storage is origin-wide: an unguarded "delete every cache that is not
     mine" on activate would wipe a future Sprint Velocity or Flow Metrics one. */
  ok(/startsWith\(PREFIX\)/.test(code) || /startsWith\('fin-shell-'\)/.test(code),
    'the activate handler must guard caches.delete with this app\'s prefix');
});

t('the worker is network-first, so cached code needs a failed network', () => {
  const code = stripComments(SW_SRC);
  ok(/Promise\.race/.test(code) && /cache\.match/.test(code),
    'expected the network-first race with a cache fallback');
  /* The tell for cache-first is answering from the cache before the network is
     tried at all. If that ever appears, the staleness argument has to be had
     again — see the reasoning at the top of sw.js. */
  ok(!/caches\.match\(req\)\s*\.then\(\s*\(?r\)?\s*=>\s*r\s*\|\|/.test(code),
    'this looks cache-first — the whole design rests on network-first');
  /* An answered-but-failed network is the third case: a transient 404/500 from
     Pages inside the race window must not beat a good cached shell. */
  ok(/!res\.ok && cached/.test(code),
    'a same-origin error reply with a cached copy in hand must serve the cache');
  /* The bug this line exists for was in all six workers from the day they
     shipped: a bare `fetch(req)` keeps the cache mode of the request the page
     made, so an ordinary reload was answered by the browser's own HTTP cache
     and the fresh deploy sitting on Pages went unseen for its `max-age`. */
  ok(/fetch\(req, \{ cache: 'no-cache' \}\)/.test(code),
    'the serving fetch must opt out of the HTTP cache, or network-first is a name only');
  ok(!/fetch\(req\)/.test(code),
    'a bare fetch(req) is the bug \u2014 it inherits the page request\u2019s cache mode');
});

t('a missing shell file can be repaired without a new worker version', () => {
  const code = stripComments(SW_SRC);
  /* install fires ONCE per script version, so a cache evicted later would never

  ok(/addEventListener\(\s*'message'/.test(code) && /'shell-check'/.test(code),
    'the worker must accept a shell-check message so the page can repair the cache');
  ok(/if \(reg\.active\) reg\.active\.postMessage\(\{ type: 'shell-check' \}\)/.test(APP_SRC),
    'the page must ask for a shell check on load');
  /* addAll is all-or-nothing: one 404 and there is no offline at all, silently. */
  ok(!/addAll/.test(code),
    'addAll rejects the whole precache on a single 404 — fetch entries one by one');
  ok(/e\.waitUntil\(topUp\(\)/.test(code), 'install must fill the cache via topUp');
});

t('the message handler accepts only its own signal', () => {

/* ── Offline: a plan from the future ────────────────────────────────────────
   The other half of the offline change. Cached code can be a build behind, and
   sync can hand that build a plan a newer one wrote. */
group('Offline — a plan from a newer build');

t('migrate cannot help with a newer schema, which is why the guard exists', () => {
  /* Every gate in migrate() is a `<`, so a future plan passes straight through
     untouched — no error, no downgrade, just fields this build has never heard
     of being rendered by code that predates them. This test is here to fail
     loudly if someone ever "fixes" migrate to clamp the number instead, which
     would hide the problem rather than catch it. */
  const future = H.migrate({ schema: 99 });
  eq(future.schema, 99, 'migrate must leave a newer schema alone, not clamp it');
});

t('a blank plan is stamped with the schema this build understands', () => {
  eq(H.blankState().schema, H.SCHEMA);
});

t('the halt fires above the current schema and not at or below it', () => {
  /* The comparison the guard makes, asserted directly — an off-by-one here
     would either halt on every ordinary load or never halt at all. */
  const halts = (s) => (s || 1) > H.SCHEMA;
  ok(!halts(H.SCHEMA), 'must not halt on a plan this build wrote');
  ok(!halts(H.SCHEMA - 1), 'must not halt on an older plan — that is migrate\'s job');
  ok(!halts(undefined), 'a plan with no schema at all is old, not new');
  ok(halts(H.SCHEMA + 1), 'must halt on a plan from a newer build');
});

t('the halt refuses to write and takes the sync module down with it', () => {
  /* It reuses finViewOnly rather than inventing a second flag, so the promise
     is only as good as that flag still being the write chokepoint. */
  ok(/window\.finViewOnly = true;/.test(APP_SRC),
    'haltForNewerData must set finViewOnly, the existing no-write guard');
  ok(/!window\.finViewOnly && !inTestHarness/.test(APP_SRC),
    'the sync module must still refuse to start under finViewOnly');
  ok(/haltForNewerData\(peek\.schema\)/.test(APP_SRC), 'load() must call the guard');
  /* Outside the try whose catch returns blankState(), or that catch swallows the
     halt and hands back a blank plan the app would then save over the real one.
     Anchored on the catch itself rather than on `try {`, because the guard's own
     one-line try for the peek would otherwise match first. */
  const guardAt = APP_SRC.indexOf('haltForNewerData(peek.schema)');
  const tryAt = APP_SRC.indexOf('try {\n    const raw = localStorage.getItem(STORAGE_KEY);');
  ok(guardAt > -1, 'load() must call haltForNewerData');
  ok(tryAt > -1, "load()'s main try block has moved — recheck this test");
  ok(guardAt < tryAt,
    'the guard must run BEFORE the try whose catch returns a blank state');
});

t('the Restore path refuses a backup from a newer build', () => {
  /* The handler is FileReader UI all the way down, so pin the source the way
     the halt tests above do: the same (schema || 1) > SCHEMA comparison, and
     it must sit BEFORE the coerceShape that would strip the very fields that
     make the file newer. */
  const at = APP_SRC.indexOf('safeParse(reader.result)');
  ok(at > -1, 'the restore handler has moved — recheck this test');
  const body = APP_SRC.slice(at, at + 2500);
  const guard = body.search(/\(rawParsed\.schema \|\| 1\) > SCHEMA/);
  const coerce = body.indexOf('migrate(coerceShape(rawParsed))');
  ok(guard > -1, 'the restore handler must refuse a schema newer than this build');
  ok(coerce > -1, 'the restore handler must still coerce the raw parse — has it moved?');
  ok(guard < coerce, 'the refusal must come before coerceShape sees the file');
});

t('finAdopt halts on a plan from a newer build instead of adopting it', () => {
  /* Not exercised live, deliberately: the real finAdopt writes this browser's
     fin-state and the halt THROWS with its card drawn over the frame, which
     would take the rest of the suite down with it. Pinned as source instead:
     the guard, the verbatim store, then the halt — all before coerceShape. */
  const at = APP_SRC.indexOf('window.finAdopt =');
  ok(at > -1, 'finAdopt has moved — recheck this test');
  const body = APP_SRC.slice(at, APP_SRC.indexOf('window.finCounts'));
  const guard = body.search(/\(\(incoming && incoming\.schema\) \|\| 1\) > SCHEMA/);
  const store = body.indexOf('JSON.stringify(incoming)');
  const halt = body.indexOf('haltForNewerData(incoming.schema)');
  const coerce = body.indexOf('migrate(coerceShape(incoming');
  ok(guard > -1, 'finAdopt must refuse a schema newer than this build');
  ok(store > guard && store < halt && halt > -1,
    'the newer plan must be stored VERBATIM before the halt — coercion would lose its fields');
  ok(coerce > -1 && halt < coerce,
    'the halt must fire before coerceShape ever sees the newer plan');
});

/* ── Runner ───────────────────────────────────────────────────────────────── */
window.addEventListener('load', async () => {
  /* No iframe means the localhost gate below refused; its message is showing. */
  if (!document.getElementById('app')) return;
  /* The real-data files are gitignored; a 404 here is the normal state in CI
     and on the public site, and the cross-check test skips itself. */
  try {
    const [d, e] = await Promise.all([
      bustFetch('financial-plan-data.json'), bustFetch('expected-2026.json')]);
    if (d.ok && e.ok)
      window.__realData = { data: await d.json(), expected: await e.json() };
  } catch (_) { /* no local files — skip */ }

  const frame = document.getElementById('app');
  const start = () => setTimeout(run, 150); // let the app's boot script finish
  if (frame.contentDocument && frame.contentDocument.readyState === 'complete'
      && frame.contentWindow.__finTestHooks) start();
  else frame.addEventListener('load', start, { once: true });
});


/* ── The scorecard, where the suite itself can't run ─────────────────────────
   Refusing to run and then saying nothing about whether the tests pass is half
   an answer: the question someone opens this page to ask is "is it green?".
   The same suite runs headless in CI on every push, so ask GitHub how that went
   and show it here. Nothing is booted and nothing is stored — it is one public,
   unauthenticated read of a workflow's run list.
─────────────────────────────────────────────────────────────────────────── */
function showLatestRun() {
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = 3;
  td.style.cssText = 'font-size:14px;line-height:1.6;padding:12px 16px';
  td.textContent = 'Checking the latest CI run…';
  tr.appendChild(td);
  document.getElementById('out').appendChild(tr);

  fetch('https://api.github.com/repos/eagleadams86/financial-plan/actions/workflows/tests.yml/runs?branch=main&per_page=1')
    .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
    .then((d) => {
      const run = d && d.workflow_runs && d.workflow_runs[0];
      if (!run) { td.textContent = 'No CI runs found for this repository yet.'; return; }
      const done = run.status === 'completed';
      const okRun = run.conclusion === 'success';
      tr.className = !done ? '' : (okRun ? 'pass' : 'fail');
      const when = run.updated_at ? new Date(run.updated_at).toLocaleString() : '';
      const sha = String(run.head_sha || '').slice(0, 7);
      /* Only ever build an <a> when the API really did hand back a GitHub https
         URL — the same guard the app uses for any URL out of an API. */
      const url = String(run.html_url || '');
      td.textContent = (!done ? '⏳ The latest run is still going'
        : okRun ? '✓ The full suite passed in CI' : '✕ The suite FAILED in CI')
        + (when ? ' — ' + when : '') + (sha ? ' · commit ' + sha : '') + '. ';
      if (/^https:\/\/github\.com\//.test(url)) {
        const a = document.createElement('a');
        a.href = url; a.rel = 'noopener noreferrer';
        a.textContent = 'Open the run for the full scorecard';
        td.appendChild(a);
      }
    })
    .catch(() => { td.textContent = 'Could not reach GitHub to check the latest CI run.'; });
}

/* Async because a handful of tests are: the share-link encode/decode goes
   through CompressionStream, which is promise-based. `await` on an ordinary
   return value is a no-op, so every synchronous test is untouched. */
/* ── Select-on-focus versus a number field’s spin arrows ──────────────────────
   Clicking a box selects what is in it, which takes cancelling the mouseup —
   that is what would otherwise place the caret and collapse the selection.
   Chrome’s number spinner ALSO ends its press on the mouseup’s default action:
   it repeats while an arrow is held down and stops when the release is allowed
   through. Cancelling it there left ONE click on a down arrow running the value
   all the way to its minimum (found in Flow Metrics, 2026-08-21).

   Press, focus and release are all dispatched by hand, for two reasons: a
   synthetic press never reaches the browser’s own spin button, and focus()
   inside a frame nobody is looking at sets activeElement without firing focusin
   until the frame is focused. So what a real click looks like is not observable
   from here — but the DECISION the guard makes is, and the decision is the part
   that was wrong. The value moving between the press and the release means a
   spin, and a spin has no caret to protect. Same block in every app in the
   family, so it is pinned in every suite. */
function spinProbe(appWin, setUp) {
  const box = appWin.document.createElement('input');
  box.type = 'number'; box.value = '14'; box.min = '1';
  appWin.document.body.appendChild(box);
  try {
    setUp(box);
    const up = new appWin.MouseEvent('mouseup', { bubbles: true, cancelable: true });
    box.dispatchEvent(up);
    return up.defaultPrevented;
  } finally {
    /* Releases the pointer flag as a real release would; without it the next
       probe would inherit a press that never ended. */
    box.dispatchEvent(new appWin.PointerEvent('pointerup', { bubbles: true }));
    box.remove();
  }
}
function spinFocusIn(appWin, el) { el.dispatchEvent(new appWin.FocusEvent('focusin', { bubbles: true })); }
function spinPress(appWin, el)   { el.dispatchEvent(new appWin.PointerEvent('pointerdown', { bubbles: true })); }

group('Select-on-focus versus a number field’s spin arrows');
t('a plain click keeps the select-all — the caret placement is cancelled', () => {
  ok(spinProbe(w, (box) => { spinPress(w, box); spinFocusIn(w, box); }));
});
t('a spin press is let through, so the browser stops repeating on the release', () => {
  eq(spinProbe(w, (box) => { spinPress(w, box); spinFocusIn(w, box); box.value = '13'; }), false);
});
t('a click on the label still selects, exactly as before', () => {
  ok(spinProbe(w, (box) => {
    /* No press on the box of its own to compare against, so the value as it
       stands at focus stands in and that path is left as it was. */
    const lab = w.document.createElement('label');
    w.document.body.appendChild(lab);
    spinPress(w, lab); spinFocusIn(w, box); lab.remove();
  }));
});
t('a focus with no press behind it guards nothing — a Tab has no caret to place', () => {
  eq(spinProbe(w, (box) => { spinFocusIn(w, box); }), false);
});

/* ── The grid tooltip on a phone ────────────────────────────────────────────
   A tap on iOS raises a synthetic mousemove and THEN a click, which is how the
   month view's tooltips came to flash and vanish: the move put the tip up and
   the click took it straight back down. Nothing shorter than the whole sequence
   tells the fixed behaviour from the broken one — both put the tip up, and only
   one of them still has it a click later — so the probe replays all of it.

   The box is built by hand rather than rendered: `wireGridTip` takes one for
   exactly this, and a real month view would need a whole plan behind it to say
   the same thing. What matters is the CONTRACT the wiring reads off the markup
   — a `.mrow[data-cat]` opens an editor, a `.mrow.derived` opens nothing — and
   that is two attributes, not a budget. */
function tipProbe(appWin, html) {
  const box = appWin.document.createElement('div');
  box.className = 'tipzone';
  box.innerHTML = html;
  appWin.document.body.appendChild(box);
  appWin.__finTestHooks.wireGridTip(box);
  return box;
}
function tipTeardown(appWin, box) {
  appWin.__finTestHooks.hideGridTip();
  box.remove();
}
/* Every event a finger raises on iOS, in the order WebKit sends them. */
function tapWithFinger(appWin, el) {
  const r = el.getBoundingClientRect();
  const at = { bubbles: true, cancelable: true, composed: true,
    clientX: Math.round(r.left + 2), clientY: Math.round(r.top + 2) };
  const touch = Object.assign({ pointerType: 'touch', pointerId: 1, isPrimary: true }, at);
  el.dispatchEvent(new appWin.PointerEvent('pointerdown', touch));
  el.dispatchEvent(new appWin.PointerEvent('pointerup', touch));
  el.dispatchEvent(new appWin.MouseEvent('mousemove', at));
  el.dispatchEvent(new appWin.MouseEvent('mousedown', at));
  el.dispatchEvent(new appWin.MouseEvent('mouseup', at));
  el.dispatchEvent(new appWin.MouseEvent('click', at));
}
const DERIVED_ROW = '<div class="mrow derived" data-tip="earned: $1.00">Interest</div>';
const EDITOR_ROW = '<div class="mrow" data-cat="c1" data-m="2026-01" data-year="2026"'
  + ' data-tip="$2.00 · actual">Rent</div>';
const PLAIN_BIT = '<p class="sub">nothing to say</p>';

group('The grid tooltip on a phone');
t('a tap on a line that opens nothing leaves the tip up — the click it raised does not undo it', () => {
  const box = tipProbe(w, DERIVED_ROW);
  const tip = w.document.getElementById('gridTip');
  try {
    tapWithFinger(w, box.querySelector('.derived'));
    eq(tip.hidden, false, 'the tip is still up after the whole tap');
    eq(tip.textContent, 'earned: $1.00');
  } finally { tipTeardown(w, box); }
});
t('a tap on a line that opens an editor shows no tip at all — the dialog is the answer', () => {
  const box = tipProbe(w, EDITOR_ROW);
  const tip = w.document.getElementById('gridTip');
  try {
    tapWithFinger(w, box.querySelector('.mrow'));
    eq(tip.hidden, true);
  } finally { tipTeardown(w, box); }
});
t('the next tap anywhere else takes a held tip down', () => {
  const box = tipProbe(w, DERIVED_ROW + PLAIN_BIT);
  const tip = w.document.getElementById('gridTip');
  try {
    tapWithFinger(w, box.querySelector('.derived'));
    eq(tip.hidden, false, 'up, before anything else is tapped');
    tapWithFinger(w, box.querySelector('.sub'));
    eq(tip.hidden, true);
  } finally { tipTeardown(w, box); }
});
t('a finger DRAGGING over the grid paints no tips — scrolling is not hovering', () => {

  const tip = w.document.getElementById('gridTip');
  try {

    el.dispatchEvent(new w.PointerEvent('pointermove', { bubbles: true, cancelable: true,
      composed: true, pointerType: 'touch', pointerId: 1, isPrimary: true,
      clientX: Math.round(r.left + 2), clientY: Math.round(r.top + 2) }));
    eq(tip.hidden, true);
  } finally { tipTeardown(w, box); }
});
t('a mouse passing over still gets the tip that follows it', () => {
  const box = tipProbe(w, DERIVED_ROW);

    el.dispatchEvent(new w.PointerEvent('pointermove', { bubbles: true, cancelable: true,
      composed: true, pointerType: 'mouse', pointerId: 2, isPrimary: true,
      clientX: Math.round(r.left + 2), clientY: Math.round(r.top + 2) }));
    eq(tip.hidden, false);
    eq(tip.textContent, 'earned: $1.00');

t('which lines answer a tap with an editor is read off the markup, not the class name', () => {

group('The sync button holds the header still');
/* ── The render smoke walk ──────────────────────────────────────────────────
   Everything else in this file calls a pure function or reads index.html as
   text. That covers the engine, the tax tables and the boundaries very well and
   leaves the LARGEST part of the app — the render layer — never executed at
   all: a coverage run on 2026-08-27 put renderMonthView (35KB), gridCard
   (27KB), openCellEditor (16KB), buildFields, renderGiving, renderRetirement
   and 208 others at zero. Nine tabs, and nothing here had ever drawn one. A
   throw in any of them would have shipped green.

   So this walks the plan the way a person does: load the sample plan, visit
   every tab, read the Budget through BOTH lenses — the year grid and the month
   page are two different renderers over one tab, so a walk that saw only the
   grid would leave the larger of the two undrawn — and press every button that
   is not destructive. Anything the frame throws while that happens is recorded.
   It cannot tell a right figure from a wrong one, which is what the eight
   hundred tests around it are for; it is the difference between "the arithmetic
   is right" and "the app runs".

   NOTHING IT DOES CAN WRITE. `save()` and `confirm()` are top-level function
   declarations in a classic script, so they are properties of the frame's
   window and are replaced with a no-op and a yes before anything is pressed.
   That matters more here than the read-only rule usually does: choosing a tab
   calls save(), the sample plan IS a state, and an unstubbed walk would have
   written an invented household over the reader's real one on the shared
   origin. The backup and the comparison in the finally are the proof rather
   than the intention.

   AND IT CARRIES data-fin-tests. Without it index.html busts out of the frame —
   the anti-clickjacking guard — and sends tests.html itself to the app. */
t('the app actually runs — every tab drawn, both budget lenses, every window opened', async () => {
  const before = localStorage.getItem('fin-state');
  const f = document.createElement('iframe');
  f.setAttribute('data-fin-tests', '');
  f.setAttribute('aria-hidden', 'true');
  f.style.cssText = 'position:absolute;left:-9999px;width:1360px;height:1800px;border:0';
  try {
    await new Promise((resolve) => { f.onload = resolve; f.src = 'index.html?smoke=' + Date.now(); document.body.appendChild(f); });
    const wf = f.contentWindow, df = wf.document;
    ok(typeof wf.loadSample === 'function', 'the app must expose loadSample to the frame');

    const errs = [];
    wf.addEventListener('error', (e) => errs.push(String(e.message)));
    wf.addEventListener('unhandledrejection', (e) => errs.push('unhandled rejection: ' + e.reason));

    let saves = 0;
    wf.save = () => { saves++; };            // counted, not merely silenced
    wf.confirm = () => true;
    wf.alert = () => {};
    wf.loadSample();

    const drawn = {};
    const views = df.getElementById('views');
    const lenLeft = () => (views ? views.textContent.trim().length : 0);

    const tabs = [...df.querySelectorAll('.tab')].filter((t) => !t.hidden);
    ok(tabs.length >= 8, 'the sample plan should light up the whole tab row', tabs.length);
    tabs.forEach((tab) => {
      /* `tab.click()` reports detail 0, which the app reads as a KEYBOARD
         activation — the pointer path runs on pointerup, off the bar. Either
         way it lands in selectTab. */
      tab.click();
      /* A view that drew NOTHING is the failure this is really looking for: a
         render that threw half way leaves the panel present and empty, which no
         "did it throw" check on its own would notice. */
      drawn['tab:' + tab.dataset.view] = lenLeft();
    });

    /* Back to the Budget, then through the mode switch both ways. The two
       lenses are two renderers over one tab — see the Year/Month note in
       CLAUDE.md — so this is the only way the month page is ever drawn. */
    const budget = df.getElementById('tab-budget');
    ok(budget, 'the Budget tab is still where the walk expects it');
    budget.click();
    ['month', 'year'].forEach((mode) => {
      const btn = df.querySelector('.vswitch[data-mode="' + mode + '"]');
      if (!btn) { errs.push('no ' + mode + ' lens button in the budget strip'); return; }
      btn.click();
      drawn['lens:' + mode] = lenLeft();
    });

    /* One grid cell, and one row heading. The cell editor is the biggest single
       renderer in the app after the two budget lenses and it opens from a click
       on a `td.cell` rather than from any button, so a walk that pressed only
       buttons never drew it — which is exactly how it sat at zero while eight
       hundred tests passed around it. */
    budget.click();
    const yearLens = df.querySelector('.vswitch[data-mode="year"]');
    if (yearLens) yearLens.click();
    const cell = df.querySelector('td.cell[data-cat]');
    ok(cell, 'the sample plan drew a budget grid with an editable cell in it');
    if (cell) {
      cell.click();
      const ed = [...df.querySelectorAll('dialog')].find((d) => d.open);
      drawn['window:cellEditor'] = ed ? ed.textContent.trim().length : 0;
      if (ed) { try { ed.close(); } catch (e) { /* already shut */ } }
    }

    /* Every button the app is showing, except the ones that destroy something.
       This is what opens the windows through their REAL openers — a dialog
       opened by showModal alone is empty in exactly the way a broken one is. */
    const closeAll = () => df.querySelectorAll('dialog[open]').forEach((d) => { try { d.close(); } catch (e) { /* already shut */ } });
    /* The list is a SNAPSHOT and the app redraws as it is walked, so each button
       is re-checked at the moment it is pressed rather than trusted from when it
       was collected. Without that the walk presses controls the app has already
       taken off the screen — a detached button still runs its handler — and
       reports the resulting throw as an app bug. It did: switching to a SUMMARY
       year correctly removes "Mark <month> entered", and the walk went on to
       press the removed one and blamed markMonthEntered for the TypeError. */
    const live = (b) => b.isConnected && b.offsetParent !== null && !b.disabled;
    const buttons = [...df.querySelectorAll('button')].filter(live);
    let opened = 0;
    buttons.forEach((b) => {
      if (!live(b)) return;
      if (/delete|clear|remove|erase|reset|start again/i.test(b.textContent || '')) return;
      b.click();
      const dlg = [...df.querySelectorAll('dialog')].find((d) => d.open);
      if (dlg) {
        opened++;
        const len = dlg.textContent.trim().length;
        if (!drawn['window:' + dlg.id] || len > drawn['window:' + dlg.id]) drawn['window:' + dlg.id] = len;
      }
      closeAll();
    });

    eq(errs.length, 0, 'the frame threw during the walk: ' + errs.join(' | '));
    Object.keys(drawn).forEach((k) => ok(drawn[k] > 0, k + ' rendered no text at all', drawn[k]));
    ok(drawn['lens:month'] > 0 && drawn['lens:year'] > 0, 'both budget lenses drew');
    ok(opened >= 3, 'pressing the app’s own buttons should have opened several windows', opened);
    Object.keys(drawn).filter((k) => k.indexOf('window:') === 0).forEach((k) =>
      ok(drawn[k] > 40, k + ' opened with nothing in it', drawn[k]));
    ok(saves > 0, 'sanity: the walk really did reach code that would have written, '
      + 'so the stub is doing work rather than sitting unused', saves);
  } finally {
    f.remove();
    /* The proof, not the intention: read the key back and compare. A stub that
       stopped working would show up here as a changed plan rather than as a
       comment nobody re-checked. */
    const after = localStorage.getItem('fin-state');
    eq(after, before, 'the walk wrote to the reader’s own saved plan');
  }
});

t('it is pinned WIDER than its own widest label', async () => {
  /* The one control in the row whose label changes: "☁️ Sign In to Sync" becomes
     a first name the moment Firebase reports who you are, and without a floor
     every control to its right slides sideways on every refresh.

     The floor was 125px and had QUIETLY STOPPED COVERING THE LABEL: that number
     was taken at an older font size, and the pack moved to a 16px rem ramp on
     2026-08-22 while it stayed put. The label measures ~130px now, so the pin
     was five short and the header slid ~5px on a narrow screen again — the exact
     bug it exists to prevent, back without a word. Golf Handicap carried the
     same 125 and the same fault. A magic number cannot notice the type ramp
     changing underneath it; this can, because it MEASURES.

     IT NEEDS ITS OWN FRAME. The suite's frame is 1x1px and its sync button is
     `display: none` — Firebase cannot run here — so every width read from it is
     0, and `0 <= 125` passes on the very bug this is written to catch. That is
     what the first draft of this test did. The guard below is what makes a
     repeat impossible to miss. */
  const f = document.createElement('iframe');
  /* WITHOUT data-fin-tests THE APP NAVIGATES THE WHOLE PAGE AWAY. index.html
     busts out of any frame that does not carry it — the anti-clickjacking guard
     at the top of the file — and the first draft of this test, missing the
     attribute, sent tests.html itself to index.html mid-run. The suite reported
     "SUMMARY: undefined" because there was no longer a summary element to read:
     the guard worked exactly as designed. */
  f.setAttribute('data-fin-tests', '');
  f.setAttribute('aria-hidden', 'true');
  f.style.cssText = 'position:absolute;left:-9999px;width:1280px;height:800px;border:0';
  await new Promise((resolve) => {
    f.onload = resolve;
    f.src = 'index.html?syncpin=' + Date.now();
    document.body.appendChild(f);
  });
  try {
    const D = f.contentWindow, btn = D.document.getElementById('syncBtn');
    ok(btn, 'the header carries a sync button');
    btn.hidden = false;              // Firebase cannot run here; the row is still measurable
    const pin = parseFloat(D.getComputedStyle(btn).minWidth);
    ok(pin > 0, 'and it has a min-width floor at all', D.getComputedStyle(btn).minWidth);
    /* The three labels the sync module actually writes. The signed-in one is a
       FIRST name by design, so it is the short case, not the wide one. */
    const widths = ['☁️ Sign In to Sync', '☁️ Charlie', '⚠️ Not syncing'].map((label) => {
      btn.textContent = label;
      return { label, px: btn.getBoundingClientRect().width };
    });
    ok(widths.every((x) => x.px > 40),
      'the button was actually laid out and measured — a 0 here means nothing below '
        + 'this line proves anything, which is how the first draft passed',
      widths.map((x) => x.px.toFixed(1)).join(', '));
    const widest = widths.reduce((a, b) => (b.px > a.px ? b : a));
    ok(widest.px <= pin,
      'the widest label this button ever paints has to fit inside the floor, or the row '
        + 'moves when sign-in resolves — \u201c' + widest.label + '\u201d needs '
        + widest.px.toFixed(2) + 'px against a ' + pin + 'px pin');
  } finally { f.remove(); }
});

group('How a chart answers a hover');

/* The family rule is that a LINE hovers by column and a bar is its own target.
   It was written here per chart TYPE — "bar charts keep intersect" — and that
   answers the wrong question for a chart that draws both. Two did. On Giving,
   the amount and the two percentages could never be read together: the bar gave
   the dollars and whichever percentage was nearer, and the empty space in the
   column gave nothing. On Spending the average line is drawn with
   `pointRadius: 0`, so there was no mark anywhere on it to intersect and its
   tooltip could not be summoned at all.

   So the rule is restated as a question about the COLUMN rather than the chart:
   if a line is drawn in it, the column answers. Swept over every chart the app
   draws rather than pinned to those two, because the next combo chart is the
   one nobody will re-check. Resolved options, not source: Chart.js fills in its
   own defaults before anyone can read them, and what the reader gets is what it
   resolved. (A scatter would need its own answer — a dot IS its own target, the
   way Flow Metrics has it — and there are none here; add one and this fails,
   which is the moment to decide.) */
t('a chart that draws a line answers by column; one that does not keeps the default',
  async () => {
  const f = document.createElement('iframe');
  f.setAttribute('data-fin-tests', '');       // or index.html busts out of the frame
  f.setAttribute('aria-hidden', 'true');
  f.style.cssText = 'position:absolute;left:-9999px;width:1280px;height:900px;border:0';
  await new Promise((resolve) => {
    f.onload = resolve;
    f.src = 'index.html?hover=' + Date.now();
    document.body.appendChild(f);
  });
  try {
    const W = f.contentWindow, D = W.document;
    W.save = () => {};
    W.confirm = () => true;
    W.alert = () => {};
    W.loadSample();

    /* Every tab, because a chart is only built once its tab has been shown. */
    const TABS = ['tab-budget', 'tab-goals', 'tab-vacations', 'tab-giving',
                  'tab-investments', 'tab-retirement', 'tab-household',
                  'tab-comp', 'tab-tax'];
    const seen = new Map();
    for (const id of TABS) {
      const tab = D.getElementById(id);
      ok(tab, 'the app still has ' + id + ' — this list is what makes the sweep complete');
      tab.click();
      await new Promise((r) => setTimeout(r, 250));
      D.querySelectorAll('canvas').forEach((cv) => {
        const c = W.Chart.getChart(cv);
        if (!c) return;
        const o = c.options.interaction || {};
        seen.set(cv.id, {
          kinds: c.data.datasets.map((d) => d.type || c.config.type),
          mode: o.mode, intersect: o.intersect });
      });
    }
    ok(seen.size >= 10, 'the sweep has to actually FIND the charts, or every '
      + 'assertion below passes over an empty list', seen.size);

    const wrong = [];
    for (const [id, c] of seen) {
      const drawsLine = c.kinds.includes('line');
      const byColumn = c.mode === 'index' && c.intersect === false;
      /* Undefined is what a chart that says nothing resolves to for `mode`
         until Chart.js is asked — read from the instance it is 'nearest'. */
      const isDefault = (c.mode === undefined || c.mode === 'nearest')
        && c.intersect !== false;
      if (drawsLine && !byColumn) {
        wrong.push(id + ' draws a line (' + c.kinds.join('+') + ') but hovers '
          + c.mode + '/intersect:' + c.intersect);
      } else if (!drawsLine && !isDefault) {
        wrong.push(id + ' draws no line (' + c.kinds.join('+') + ') but hovers '
          + c.mode + '/intersect:' + c.intersect);
      }
    }
    eq(wrong, [], 'these charts answer a hover the wrong way');

    /* The two that were wrong, named, so the reason this test exists survives
       a future sweep that finds nothing. */
    const giving = seen.get('givingChart'), spend = seen.get('spendChart');
    ok(giving, 'the Giving tab still draws givingChart');
    eq([giving.mode, giving.intersect], ['index', false],
      'Giving: the amount and both percentages are one year read together');
    ok(spend, 'the Progress tab still draws spendChart');
    eq([spend.mode, spend.intersect], ['index', false],
      'Spending: the average line has no points to hit, so the column has to answer');
  } finally { f.remove(); }
});

/* ── Pack rule 3: the colour goes in the edge ───────────────────────────────
   A chart bar is a tint fill plus a full-strength outline. This app has drawn its
   STATUS and ACCENT bars that way for a long time — `--ok-bg`, `--err-bg` and
   `--accent-bg` are the pack's own ready-made tints — but the bars coloured from
   the CATEGORICAL ramp had no `--series-N-bg` to reach for and stayed flat and
   edgeless. Closed 2026-09-03 with `tintOf`, ported from Sprint Velocity.

   The sweep is the part worth having: pinning the three that were fixed would
   miss the fourth chart somebody adds next year, and `borderWidth: 0` is exactly
   what that mistake looks like. */
t('a bar fill is the series colour mixed toward the card, and junk passes through', () => {
  const card = w.getComputedStyle(w.document.documentElement)
    .getPropertyValue('--surface').trim();
  const chan = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  eq(H.tintOf('#ff0000', 0), 'rgb(255,0,0)', 'nothing mixed in is the colour itself');
  eq(H.tintOf('#ff0000', 1), `rgb(${chan(card).join(',')})`, 'all the way in is the card');
  /* Mixed toward the CARD rather than toward white, which is the one constant
     that covers all four themes — so the assertion has to be "between", not a
     literal. */
  const mid = H.tintOf('#ff0000', H.BAR_TINT_SOLID).match(/\d+/g).map(Number);
  const from = [255, 0, 0], to = chan(card);
  ok(mid.every((v, i) => v >= Math.min(from[i], to[i]) && v <= Math.max(from[i], to[i])),
     'and the fill lands between the two on every channel, whatever the theme',
     mid.join(','));
  ok(H.BAR_TINT_SOLID < H.BAR_TINT,
     'a SOLID series keeps more of its colour than a textured one — it has nothing '
     + 'but its outline, and at .68 it washed out on the white Light card');
  eq(H.tintOf('nonsense', .45), 'nonsense',
     'junk passes through rather than being turned into a colour');
});
