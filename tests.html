<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<!-- Every page on the shared origin ships a CSP (the family security rule) —
     this one is published on GitHub Pages beside the app, so it is as much a
     page on the origin as index.html is. It needs: its own inline script and
     styles, the same-origin stylesheet, connect-src 'self' for the local-only
     fixture fetches plus api.github.com for the CI-scorecard line, and
     frame-src 'self' for the harness iframe (whose content is then governed
     by index.html's own CSP, not this one). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self' https://api.github.com; frame-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financial Plan — Tests</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* Dev-only page: pins the pure functions in index.html. It loads the real app
     in a hidden same-origin iframe and calls its functions directly, so what's
     tested is exactly what ships — no copies, no build step. Serve over
     http://localhost (python3 -m http.server 8016); file:// iframes are blocked
     in some browsers. Nothing here writes localStorage or calls save() — but
     GitHub Pages publishes this file next to the app, and on that origin merely
     BOOTING the app in the iframe is a live session: if this browser has ever
     signed in there, the sync module would start real Firestore traffic — or
     raise a which-copy dialog nobody can see — inside an invisible frame. So
     the gate at the foot of the script only creates the iframe on localhost,
     and the iframe carries data-fin-tests, which index.html checks so the sync
     module never initialises inside the harness (the family rule from Team
     Dashboard and its siblings).
     Every fixture is SYNTHETIC — invented round numbers, never real data. The
     one exception is the local-only block at the end, which fetches the
     gitignored import JSONs when they exist on this machine and silently
     skips when they don't (which is always, in CI and on the public site). */
  body { background: var(--bg); color: var(--text-primary); margin: 0;
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--text-muted); font-size: 12.5px; margin: 0 0 18px; }
  #summary { font-weight: 600; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px;
             border: 1px solid var(--border); background: var(--surface); }
  #summary.ok  { color: var(--ok);  border-color: var(--ok); }
  #summary.bad { color: var(--err); border-color: var(--err); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  td.st { width: 28px; font-weight: 700; }
  tr.pass td.st { color: var(--ok); }
  tr.fail td.st { color: var(--err); }
  tr.fail td.msg { color: var(--err); }
  .msg { color: var(--text-muted); font-size: 12px; white-space: pre-wrap; }
  .group td { padding-top: 16px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
              text-transform: uppercase; color: var(--text-muted); border-bottom-color: var(--border-strong); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Financial Plan — Pure-Function Tests</h1>
  <p class="sub">Runs against the real <code>index.html</code> in a hidden iframe. Read-only: nothing is saved.</p>
  <div id="summary">Loading app…</div>
  <table><tbody id="out"></tbody></table>
</div>
<!-- The app iframe is NOT in the markup: the localhost gate at the foot of the
     script creates it, or refuses to. Booting the app is itself the first thing
     that must not happen off localhost, so the gate has to come first — the
     family rule from Team Dashboard; don't put the iframe back here. -->

<script>
'use strict';

/* One cache-buster for this run, on the hidden frame AND on every fetch of a
   file this repo serves. The two are different caches and they can disagree: on
   2026-08-22 the lottery repo's suite reported all-green against a page three
   features out of date, because its source-level tests were reading the file
   off the server while its frame ran a copy the browser had cached. Nothing
   errored and nothing looked wrong — the new code was simply never run. A suite
   that can pass against a build which exists nowhere is worse than no suite,
   because it turns "untested" into "verified".

   `no-store` as well as the query, since a query alone is only a hint. The
   `api.github.com` call is deliberately left alone: somebody else's endpoint,
   not a file we serve. */
const BUST = '?t=' + Date.now();
/* The hosts the privacy policy has to name, so a reader can check the claim
   against a network trace. A list, because that is what the assertion below is
   really iterating — and because a bare hostname literal sitting inside an
   inline string test is what makes a scanner read a prose search as a URL
   check. See the note at the assertion. */
const HOSTS_THE_POLICY_MUST_NAME = ['gstatic', 'accounts.google.com'];

const bustFetch = (f, init) => fetch(f + BUST, Object.assign({ cache: 'no-store' }, init || {}));

const TESTS = [];
function group(name) { TESTS.push({ group: name }); }
function t(name, fn) { TESTS.push({ name, fn }); }

function fmt(v) { return JSON.stringify(v); }
function eq(actual, expected, note) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  if (a !== e) throw new Error((note ? note + ': ' : '') + 'expected ' + e + ', got ' + a);
}
function approx(actual, expected, note, eps) {
  if (typeof actual !== 'number' || Math.abs(actual - expected) > (eps ?? 0.005))
    throw new Error((note ? note + ': ' : '') + 'expected ≈' + expected + ', got ' + fmt(actual));
}
/* `detail` is the value that FAILED, not more prose: `ok(w <= pin, 'it fits',
   w + 'px')` says what was expected and then shows what was actually there.
   Every suite in the family takes three arguments now (2026-08-26). It was two
   here, and a call site passing a third had its diagnostic silently dropped —
   the assertion still failed correctly, it just refused to say what it saw.
   CodeQL's js/superfluous-trailing-arguments caught it three separate times in
   one day, in three different repos, which is what settled the signature. */
function ok(cond, note, detail) {
  if (cond) return;
  throw new Error((note || 'expected truthy')
    + (detail === undefined ? '' : ' \u2014 got ' + detail));
}
/* ── The completeness floor ─────────────────────────────────────────────────
   "Everything that ran passed" is only half an answer. Nothing above counts the
   tests, so a group deleted by accident — or a `PAGES.forEach` that ends up
   iterating nothing — takes its tests out of the suite silently, and the page
   and CI both go on reporting green over whatever is left. CI checks the words
   `All N tests pass` and has never cared what N is.

   This is what makes the count itself an assertion. It is the number the suite
   registers today, so ADDING a test never fails the build; removing one does,
   which is the moment to ask whether it should have gone. Lower it deliberately
   when a test is deliberately retired. */
const EXPECTED = 937;
/* HTML comments explain things by naming them — including the very elements
   these assertions look for, and one of those notes lives in a <style> block a
   strip does not reach. So the comments come out before the page is matched
   against, or the prose passes the test it is describing.

   Looped until the string stops changing, rather than a single .replace(). One
   pass over a multi-character delimiter can leave a NEW opener behind that the
   pass already went past — `<` `!--` `<` `!--` `--` `>` collapses to a live
   `<` `!--` on the way out — so a single pass is only as good as the input is
   well-formed. CodeQL's js/incomplete-multi-character-sanitization flagged
   exactly this. The stakes are low (this reads local repo files to assert on
   them, it does not sanitize anything a browser will render) but a test that
   can be fooled about what is commented out is a test that can miss a live
   off-origin script, so it is worth doing properly. Same helper, same wording,
   in every sibling repo’s suite. */
const stripHtmlComments = (s) => {
  let out = String(s), prev;
  do { prev = out; out = out.replace(/<!--[\s\S]*?-->/g, ''); } while (out !== prev);
  return out;
};


let w, H;   // app window + its __finTestHooks

/* ── Date helpers ─────────────────────────────────────────────────────────── */
group('Date helpers');
t('monthAdd walks forward across a year end', () => {
  eq(H.monthAdd('2026-11', 1), '2026-12');
  eq(H.monthAdd('2026-12', 1), '2027-01');
  eq(H.monthAdd('2026-01', 23), '2027-12');
});
t('monthAdd walks backward across a year start', () => {
  eq(H.monthAdd('2026-01', -1), '2025-12');
  eq(H.monthAdd('2026-03', -12), '2025-03');
});
t('monthDiff is the signed distance in months', () => {
  eq(H.monthDiff('2026-01', '2026-07'), 6);
  eq(H.monthDiff('2026-07', '2026-01'), -6);
  eq(H.monthDiff('2025-11', '2026-02'), 3);
});
t('monthLabel renders a short month + 2-digit year', () => {
  eq(H.monthLabel('2026-01'), 'Jan 26');
  eq(H.monthLabel('2027-12'), 'Dec 27');
});
t('monthLabelFull keeps the century, for a month written into a sentence', () => {
  eq(H.monthLabelFull('2026-01'), 'Jan 2026');
  eq(H.monthLabelFull('2033-09'), 'Sep 2033');
});

/* ── Money ────────────────────────────────────────────────────────────────── */
group('Money');
t('round2 rounds to cents and survives float dust', () => {
  eq(H.round2(1.005), 1.01);
  eq(H.round2(-79.98999999999999), -79.99);
  eq(H.round2(0.1 + 0.2), 0.3);
});
t('fmtMoney renders US dollars', () => {
  eq(H.fmtMoney(1234.5), '$1,234.50');
  eq(H.fmtMoney(-42), '-$42.00');
});

/* ── State boundary ───────────────────────────────────────────────────────── */
group('State boundary');
t('coerceShape forces every collection to the right type', () => {
  const d = H.coerceShape({ years: 'junk', goals: 'nope', side: 7, vacations: null,
                            people: 'nobody' });
  eq(typeof d.years, 'object');
  eq(Array.isArray(d.goals), true);
  eq(Array.isArray(d.side.taxable), true);
  eq(Array.isArray(d.vacations.trips), true);
  eq(Array.isArray(d.people), true);
});
t('coerceShape repairs a damaged grid year without dropping it', () => {
  const d = H.coerceShape({ years: { '2026': { kind: 'grid', cells: 'junk', monthCount: 999 } } });
  const y = d.years['2026'];
  eq(typeof y.cells, 'object');
  eq(y.monthCount, 36, 'month count clamps');
  eq(y.startMonth, '2026-01', 'missing start month defaults to January');
});
t('an unknown year kind falls back to summary', () => {
  const d = H.coerceShape({ years: { '2014': { kind: 'wat' } } });
  eq(d.years['2014'].kind, 'summary');
  eq(Array.isArray(d.years['2014'].categoryTotals), true);
});
t('migrate passes a current-schema state through untouched', () => {
  const s = H.blankState();
  /* Snapshot BEFORE the call: migrate returns the same object it was handed,
     so comparing its return against `s` compared a reference with itself and
     could never catch a mutation. */
  const before = JSON.stringify(s);
  eq(JSON.stringify(H.migrate(s)), before, 'nothing added, moved or dropped');
});
/* ── A brand-new plan opens with one person in it ────────────────────────────
   Added 2026-08-22, on Charles's call, the same default Golf Handicap's "Me"
   golfer has always been: the Household tab greeting a first-time reader with
   "No One Here Yet" asks them to declare something the app can already assume,
   and every "whose is this?" select needs a name in the list before it can be
   answered.

   The split between the two builders is the whole point of these tests, and
   getting it wrong is silent: blankState() is the base of
   `Object.assign(blankState(), parsed, …)` in every load, import, restore and
   share path, so a person put THERE is handed to any backup that predates the
   household — and an adult appearing in a plan that had none re-keys the 401(k)
   cards from `undefined` to that id, so the reader watches their contribution
   limits come back empty from a restore that was supposed to be lossless. */
t('a new plan has one adult called Me, and blankState still has nobody', () => {
  const fresh = H.newPlanState();
  eq(fresh.people.length, 1, 'a brand-new plan starts with exactly one person');
  eq(fresh.people[0].name, 'Me');
  eq(fresh.people[0].role, 'adult');
  eq(fresh.people[0].id, 'me',
     'the id is what slugJs would mint from the name, so a second person really '
     + 'called Me gets me-2 from person.save exactly as they always would');
  eq(fresh.people[0].birth, undefined,
     'NO birth month: every age, retirement year and 18th birthday is worked out '
     + 'from it, so a guessed one would print a wrong date as the app\u2019s own answer');
  eq(H.blankState().people.length, 0,
     'blankState() must stay empty — it is the base of every load, import, restore '
     + 'and share merge, and a person in it reaches backups that predate the household');
});
t('a new plan has only the two accounts the starter budget actually uses', () => {
  /* DEFAULT_ACCOUNTS carries four because those ids are the spreadsheet model's
     reserved ones and coerceShape still rebuilds all four for a backup that predates
     the account list. Only two of them appear anywhere on a fresh plan: the starter
     rows move money through the hub and transfer to Savings, and nothing they create
     ever touches Investments or Other bank — so those two sat in Who Owns What at
     $0.00 with no counterpart on any other tab. */
  const fresh = H.newPlanState();
  eq(fresh.settings.accounts.map(a => a.id), ['cash', 'mid']);
  eq(fresh.settings.accounts.filter(a => a.hub).length, 1,
     'the hub has to survive the trim — every ordinary row moves money through it');
  eq(H.blankState().settings.accounts.map(a => a.id), ['cash', 'mid', 'long', 'bank'],
     'and blankState() keeps all four, because coerceShape rebuilds from it for any '
     + 'backup saved before accounts became a list');
});
/* ── How a transfer row is named ───────────────────────────────────────
   A transfer row's figure is what the move did to the HUB, so the money lands in
   the account the row names when the number is NEGATIVE. "To savings" therefore
   read as its own opposite on every month it did the thing it exists for — and
   it was the starter budget's only transfer row, which makes it the first figure
   a new plan is ever likely to be given. Both plans we ship name the row for the
   account now and leave the direction to the sign.

   Pinned here because nothing on screen can report it: a backwards name renders,
   computes and totals exactly like a right one. */
const DIRECTION_WORD = /^(to|from|into|out of)\b/i;
t('neither plan we ship names a transfer row for a direction', () => {
  const starter = H.STARTER_CATEGORIES.filter(([, , , sec]) => sec === 'transfer');
  ok(starter.length, 'the starter budget still has a transfer row to check at all');
  eq(starter.map(([name]) => name).filter(n => DIRECTION_WORD.test(n)).join(', '), '',
     'the starter row is named for the account — the sign says which way it went');
  const sample = H.migrate(H.coerceShape(H.sampleState()));
  const rows = Object.values(sample.years)
    .flatMap(yr => (yr.categories || []).filter(c => (c.section || 'expense') === 'transfer'));
  ok(rows.length >= 3, 'and the sample still holds transfer rows, its sweep included');
  eq(rows.filter(c => DIRECTION_WORD.test(c.name)).map(c => c.name).join(', '), '',
     'nor does the sample — each one carries the account’s own name');
  ok(rows.some(c => c.rule === 'overflow' && /\bto\b/i.test(c.name)),
     'while the sweep keeps its "to": an overflow rule only ever runs one way, which '
     + 'is the one time a name cannot end up contradicting the figure under it');
});
t('and the sample moves money OUT through them, which is what the negative is', () => {
  const d = H.migrate(H.coerceShape(H.sampleState()));
  const vals = Object.values(d.years).flatMap(yr => Object.entries(yr.cells || {})
    .filter(([k]) => k.startsWith('to-savings|') || k.startsWith('to-college|'))
    .map(([, c]) => c.v));
  ok(vals.length >= 8, 'the sample states these months rather than leaving them estimated');
  eq(vals.filter(v => v >= 0).length, 0,
     'and every one of them is negative — a positive figure on these rows would take '
     + 'money OUT of Savings and the 529, which is exactly what the old name taught');
});
t('and both plans we ship name a transfer row for an account they really hold', () => {
  /* The other half of dropping the direction word: the name has to be the
     account's, or a row called Savings pointing at the brokerage is a worse lie
     than "To savings" ever was. */
  const d = H.migrate(H.coerceShape(H.sampleState()));
  const names = new Map(d.settings.accounts.map(a => [a.id, a.name]));
  const rows = Object.values(d.years)
    .flatMap(yr => (yr.categories || []).filter(c => (c.section || 'expense') === 'transfer'))
    .filter(c => c.rule !== 'overflow');
  ok(rows.length >= 2, 'there are typed transfer rows to check');
  eq(rows.filter(c => c.name !== names.get(c.transferTo)).map(c => c.name).join(', '), '',
     'each names the account it moves money to, word for word');
  const starter = H.STARTER_CATEGORIES.find(([, , role]) => role.startsWith('transfer:'));
  const to = starter[2].split(':')[1];
  eq(starter[0], H.newPlanState().settings.accounts.find(a => a.id === to).name,
     'and the starter row is named for the account a fresh plan actually starts with');
});
t('and both of them belong to the person the plan starts with', () => {
  /* "Not said yet — click one to say whose it is" is the app asking a household of
     one to answer a question with a single possible answer. */
  const fresh = H.newPlanState();
  const me = fresh.people[0].id;
  eq(fresh.settings.accounts.map(a => a.owner), [me, me]);
  ok(fresh.people.some(p => p.id === me),
     'an owner must name somebody who exists, or coerceShape sweeps it back off');
});
t('a restored plan that predates the household does not gain one', () => {
  /* The failure the split exists to prevent, walked end to end: a backup with no
     `people` key at all, merged the way load() and restore() merge. */
  const parsed = H.coerceShape({ schema: H.SCHEMA, years: {}, settings: {} });
  const merged = Object.assign(H.blankState(), parsed, {
    settings: Object.assign(H.blankState().settings, parsed.settings || {}),
    side: Object.assign(H.blankState().side, parsed.side || {}),
    ui: Object.assign(H.blankState().ui, parsed.ui || {})
  });
  eq(merged.people.length, 0,
     'an old backup came back with somebody in it — that re-keys the 401(k) cards '
     + 'off undefined and empties the reader\u2019s contribution limits');
});
t('blankState carries the spreadsheet constants', () => {
  const s = H.blankState();
  approx(s.settings.midTermRateAnnual, 0.03);
  eq(s.settings.longTermRateAnnual, undefined,
     'gone: nothing has read it since accounts became a list, and a setting no '
     + 'code consults should not ride along in every backup');
  approx((s.settings.accounts.find(a => a.id === 'long') || {}).rate, 0.07,
     'the 7% lives on the Investments account itself, where it is editable');
  eq(s.settings.ptoAllowance, 32);
  /* The strapline every sibling app carries, prefilled 2026-08-22 and still a
     Preference: it is a DEFAULT, not a hardcoded name, and clearing the field
     sticks because '' is a string that survives coerceShape. Read off the app's
     own constant rather than repeated here — the markup carries a third copy,
     and two of the three drifting silently is exactly the failure this catches. */
  eq(s.settings.tagline, H.DEFAULT_TAGLINE,
     'a fresh plan wears the family strapline');
  ok(/Money Map/.test(H.DEFAULT_TAGLINE), 'and it names this app: ' + H.DEFAULT_TAGLINE);
  eq(Array.isArray(s.people), true, 'a fresh plan has an empty household');
  eq(s.people.length, 0);
  eq(s.settings.filingStatus, 'single',
     'what the old fixed MAGI figure already meant — changing it would move a real answer');
});
t('a plan from before the household arrives with an empty one, nothing invented', () => {
  /* Schema 3 is the version that predates people. It must come forward with an
     empty list rather than a guessed household, and — the load-bearing half —
     its accounts must NOT be stamped with an owner. */
  const d = H.migrate(H.coerceShape({
    schema: 3,
    settings: { accounts: [{ id: 'cash', name: 'Cash', hub: true }, { id: 'mid', name: 'Savings' }] },
    years: { '2026': { kind: 'grid', startMonth: '2026-01', monthCount: 12 } }
  }));
  eq(d.schema, H.SCHEMA, 'and it comes forward to the current schema');
  eq(d.people, []);
  eq(d.settings.filingStatus, 'single');
  eq(d.settings.accounts.every(a => a.owner === undefined), true,
     'migration never guesses who owns an account');
});

/* ── Formula engine (synthetic fixture) ───────────────────────────────────────
   A hand-computed 6-month live year. Invented round numbers only. */
function fixtureState() {
  const s = {
    schema: 1,
    settings: { midTermRateAnnual: 0.03, longTermRateAnnual: 0.07, ptoAllowance: 32 },
    years: {
      '2029': {          // prior year, pinned — feeds the same-month rule
        kind: 'grid', model: 'pinned', startMonth: '2029-01', monthCount: 12,
        categories: [{ id: 'electric', name: 'Electric', role: 'normal', rule: 'none' }],
        cells: { 'electric|2029-10': { v: -80.4, kind: 'actual' } },
        paychecks: {}, seeds: {}, overrides: {}
      },
      '2030': {
        kind: 'grid', model: 'live', startMonth: '2030-01', monthCount: 6,
        enteredThrough: '2030-03',
        categories: [
          { id: 'paycheck', name: 'Paycheck', role: 'normal', rule: 'paycheck', perCheck: 1000 },
          { id: 'dividends', name: 'Dividends', role: 'normal', rule: 'dividends' },
          { id: 'cc', name: 'Credit Card', role: 'normal', rule: 'avg' },
          { id: 'internet', name: 'Internet', role: 'normal', rule: 'carry' },
          { id: 'electric', name: 'Electric', role: 'normal', rule: 'samemonth' },
          { id: 'midt', name: 'Mid-term transfers', role: 'midTransfer', rule: 'none' },
          { id: 'longt', name: 'Long-term transfers', role: 'longTransfer', rule: 'none' },
          { id: 'bankt', name: 'Bank transfers', role: 'bankTransfer', rule: 'none' },
          { id: 'zelle', name: 'Zelle', role: 'zelle', rule: 'none' },
          { id: 'char', name: 'Charitable', role: 'charitable', rule: 'none' },
        ],
        cells: {
          'paycheck|2030-01': { v: 2000, kind: 'actual' },
          'paycheck|2030-02': { v: 2000, kind: 'actual' },
          'paycheck|2030-03': { v: 3000, kind: 'actual' },
          'cc|2030-01': { v: -900, kind: 'actual' },
          'cc|2030-02': { v: -1100, kind: 'actual' },
          'cc|2030-03': { v: -1000, kind: 'actual' },
          'internet|2030-01': { v: -50, kind: 'actual' },
          'midt|2030-02': { v: -500, kind: 'actual' },   // 500 INTO mid-term
          'zelle|2030-04': { v: 25, kind: 'manual' },
          'char|2030-04': { v: -60, kind: 'manual' },
          'cc|2030-05': { v: -1234, kind: 'manual' },    // manual beats auto
        },
        paychecks: { '2030-01': 2, '2030-02': 2, '2030-03': 3, '2030-04': 2,
                     '2030-05': 3.5, '2030-06': 2 },
        seeds: { cash: 10000, mid: 1000, long: 1200, bank: 300 },
        overrides: { 'long|2030-01': { v: 1200 }, 'cash|2030-04': { v: 12345 } }
      }
    },
    goals: [
      { id: 'g1', name: 'Emergencies', source: 'cashBank', target: 5000, targetDate: '2030-12-01' },
      { id: 'g2', name: 'Renovations', source: 'midCapped', target: 1200, targetDate: '2031-06-01' },
      { id: 'g3', name: 'New Car', source: 'midOverflow', target: 9000, targetDate: '2033-06-01' },
      { id: 'g4', name: 'Retire', source: 'long', target: 90000, targetDate: '2040-01-01' },
    ],
    side: {}, vacations: { trips: [], pto: {} }, ui: {}
  };
  return s;
}
const TODAY_FIX = '2030-04-15';   // engine time is injected, so tests are stable

function computeFixture() {
  return H.computeAll(H.coerceShape(fixtureState()), TODAY_FIX);
}

/* The shape a rolled-over year arrives in: rules copied from the year before,
   no cells of its own, entered through the December before it. Every
   backward-looking rule has to keep working across that boundary or the whole
   year reads as blank. */
function projectNextYear(s, categories, cells, paychecks) {
  s.years['2031'] = {
    kind: 'grid', model: 'live', startMonth: '2031-01', monthCount: 12,
    enteredThrough: '2030-12',
    categories, cells: cells || {}, paychecks: paychecks || {},
    seeds: {}, overrides: {}
  };

group('Accounts');
t('the legacy roles compute identically to the fixed four-account chain', () => {
  /* The engine used to hard-code cash/mid/long/bank and five role names. It
     iterates a list now — this pins that the defaults still produce exactly
     the old numbers, including the one asymmetry that matters: a bank
     pass-through lands BEFORE that account's growth, a charitable payment
     AFTER it. */
  const s = H.coerceShape(fixtureState());
  const c = H.computeAll(s, TODAY_FIX)['2030'];
  const yr = s.years['2030'];
  const rate = (id) => s.settings.accounts.find(a => a.id === id).rate;
  const priorOf = (id, m) => c.balances[`${id}|${H.monthAdd(m, -1)}`] ?? (yr.seeds[id] || 0);
  const flowsAt = (m) => {
    const f = { all: 0, mid: 0, long: 0, bank: 0, zelle: 0, char: 0 };
    for (const cat of yr.categories) {
      const v = c.cells[`${cat.id}|${m}`].v;
      if (cat.id === 'char') { f.char += v; continue; }
      if (cat.id === 'zelle') { f.zelle += v; continue; }
      f.all += v;
      if (cat.id === 'midt') f.mid += v;
      if (cat.id === 'longt') f.long += v;
      if (cat.id === 'bankt') f.bank += v;
    }
    return f;
  };
  for (const m of ['2030-02', '2030-03', '2030-05', '2030-06']) {
    const f = flowsAt(m);
    const g = (id) => 1 + rate(id) / 12;
    approx(c.balances[`cash|${m}`], H.round2(priorOf('cash', m) * g('cash') + f.all),
      `cash ${m}`, 0.02);
    approx(c.balances[`mid|${m}`], H.round2((priorOf('mid', m) - f.mid) * g('mid')),
      `mid ${m}`, 0.02);
    approx(c.balances[`long|${m}`],
      H.round2((priorOf('long', m) - f.long) * g('long') + f.char), `long ${m}`, 0.02);
    approx(c.balances[`bank|${m}`],
      H.round2((priorOf('bank', m) - f.bank + f.zelle) * g('bank')), `bank ${m}`, 0.02);
  }
});

t('a corrected interest or dividend lands in the account it is paid into', () => {
  /* What a correction is FOR: the money moves, so the balance it moves into
     has to move with it — on the account itself when it keeps its earnings,
     and on the far account when they are swept there. Nothing may pin the
     month in place; a pinned balance would swallow the correction whole. */
  const sweep = () => {
    const s = H.coerceShape(fixtureState());
    const long = s.settings.accounts.find(a => a.id === 'long');
    long.creditTo = 'bank'; long.divRate = 0.04; long.divTo = 'bank'; long.divEvery = 1;
    return s;
  };
  const bare = H.computeAll(sweep(), TODAY_FIX)['2030'];
  const s = sweep();
  s.years['2030'].balAdjust['long|2030-02'] = { interest: 500, dividend: 900 };
  const c = H.computeAll(s, TODAY_FIX)['2030'];
  const extra = (500 - bare.interest['long|2030-02']) + (900 - bare.dividend['long|2030-02']);
  approx(c.balances['bank|2030-02'] - bare.balances['bank|2030-02'], extra,
    'the far account gains exactly what the correction added', 0.02);
  approx(c.balances['bank|2030-03'] - bare.balances['bank|2030-03'], extra,
    'and every later month carries it', 0.02);
  approx(c.balances['long|2030-02'], bare.balances['long|2030-02'],
    'the paying account is untouched — it earned it, it just did not keep it', 0.02);
  /* the same correction, kept at home */
  const home = H.coerceShape(fixtureState());
  home.settings.accounts.find(a => a.id === 'mid').rate = 0.12;
  const grown = H.computeAll(home, TODAY_FIX)['2030'];
  home.years['2030'].balAdjust['mid|2030-02'] = { interest: 40 };
  const fixed = H.computeAll(home, TODAY_FIX)['2030'];
  approx(fixed.balances['mid|2030-02'],
    H.round2(grown.balances['mid|2030-02'] - grown.interest['mid|2030-02'] + 40),
    'an account that keeps its interest shows the corrected figure', 0.02);
  ok(fixed.balances['mid|2030-02'] !== grown.balances['mid|2030-02'],
    'and not the rate the correction replaced');
});

  const one = (over) => {

/* ── Owner subtotals ────────────────────────────────────────────────────────

   subtotal you can't add up is worse than none), and it says what it is made
   of, like every other added-up figure in the grid. */
group('Owner subtotals');
function ownedFixture() {
  const s = H.coerceShape(fixtureState());
  s.people = [{ id: 'sam', name: 'Sam', role: 'adult' },
              { id: 'ellis', name: 'Ellis', role: 'child' }];
  const by = (id) => s.settings.accounts.find(a => a.id === id);
  by('cash').owner = 'joint';
  by('mid').owner = 'sam';
  by('long').owner = 'ellis';
  /* 'bank' is left unassigned on purpose — the case that would silently break
     the adding-up if unowned accounts were dropped instead of bucketed. */
  return s;
}
t('every account lands in a bucket, and the buckets reach Total', () => {
  const s = ownedFixture();
  const c = H.computeAll(s, TODAY_FIX)['2030'];
  for (const m of ['2030-01', '2030-04', '2030-06']) {
    const sub = H.ownerSubtotals(s, c, m);
    const sum = H.round2(Object.values(sub).reduce((t, b) => t + b.v, 0));
    eq(sum, c.balances[`total|${m}`], m + ': the subtotals reach Total');
  }
});
t('an account nobody has claimed gathers in its own bucket', () => {

/* ── Two earners ────────────────────────────────────────────────────────────
   The 401(k) elective-deferral limit is PER PERSON; the Roth MAGI check is per
   HOUSEHOLD and depends on how you file. Two opposite scopings, which is why

/* `limitsFor` reads the app's live state, so these swap it IN MEMORY and put
   it back afterwards. Nothing calls save(), so localStorage is never written —
   the suite stays read-only, which matters because the iframe is a real
   session pointed at the reader's own data. */
function withState(patch, fn) {
  const s = w.finGet();
  const keep = { people: s.people, side: s.side, settings: s.settings };
  try {
    const d = H.coerceShape(JSON.parse(JSON.stringify(patch)));
    s.people = d.people;
    s.side = d.side;
    /* Over a BLANK settings, never the reader's own: merging the patch over
       the live settings let any real key the patch didn't name (compPerson,
       say) survive into the "fixture" — the ambient-state leak this harness
       exists to refuse. */
    s.settings = Object.assign({}, H.blankState().settings, d.settings);
    return fn();
  } finally {
    s.people = keep.people; s.side = keep.side; s.settings = keep.settings;
  }
}

/* ── Restoring a backup ─────────────────────────────────────────────────────
   The one failure mode of putting people at the top level is that a merge site
   forgets them and a restore silently drops the household. `load()`, the
   Restore button and the cloud adopt all merge the same way — name `settings`,
   `side` and `ui` (which need their defaults filling in) and let everything
   else ride through the spread. This reproduces that merge exactly, so if
   anyone ever adds `people` to the wrong side of it, this fails. */
group('A restored file keeps the household');
const restoreMerge = (incoming) => {
  const parsed = H.migrate(H.coerceShape(incoming));
  return Object.assign(H.blankState(), parsed, {
    settings: Object.assign(H.blankState().settings, parsed.settings || {}),
    side: Object.assign(H.blankState().side, parsed.side || {}),
    ui: Object.assign(H.blankState().ui, parsed.ui || {})
  });
};
t('people, owners and tags all survive the round trip', () => {
  const s = restoreMerge({
    schema: 4,
    people: [{ id: 'sam', name: 'Sam', role: 'adult', birth: '1984-07', retireAge: 65 },
             { id: 'ellis', name: 'Ellis', role: 'child', birth: '2015-09' }],
    settings: { accounts: [{ id: 'cash', name: 'Cash', hub: true, owner: 'joint' },
                           { id: 'mid', name: 'Savings', owner: 'ellis' }] },
    goals: [{ id: 'g', name: 'College', accounts: ['mid'], count: 'capped', for: 'ellis' }],
    years: { '2026': { kind: 'grid', startMonth: '2026-01', monthCount: 12 } }
  });
  eq(s.people.length, 2, 'the household came back');
  eq(s.people[1].birth, '2015-09');
  eq(s.settings.accounts.find(a => a.id === 'mid').owner, 'ellis', 'and so did the owners');
  eq(s.goals[0].for, 'ellis');
});
t('a file with no household comes back with an empty one, not undefined', () => {
  /* `undefined` here is what would make `peopleOf` throw further down. */
  const s = restoreMerge({ years: { '2026': { kind: 'grid', startMonth: '2026-01' } } });
  eq(Array.isArray(s.people), true);
  eq(s.people.length, 0);
});

});

        '2025': [{ foundation: 'a', cash: -1000 }],
        '2026': [{ foundation: 'b', cash: -2000 }],
      },
    },
    years: { '2026': { kind: 'grid', categories: [
      { id: 'paycheck', name: 'Paycheck', rule: 'paycheck', section: 'income' },
    ], cells: { 'paycheck|2026-01': { v: 50000 } } } },
  };
  const stats = H.givingStats(st, {});
  eq(stats.map(s => s.y), ['2025', '2026'], 'oldest first');
  eq(stats[0].grossPct, null, '2025 has no comp record');
  eq(stats[0].takePct, null, 'and no year in the workbook at all');
  eq(stats[1].given, 2000);
  eq(stats[1].grossPct, 0.02);
  eq(stats[1].takePct, 0.04);
});
t('a year with no donations in it is not on the chart', () => {
  const st = { side: { comp: {}, bonuses: {},
    donations: { '2025': [{ cash: -100 }], '2026': [] } }, years: {} };
  eq(H.givingStats(st, {}).map(s => s.y), ['2025']);
});
t('every meter is drawn against one ceiling', () => {
  /* Otherwise each year's bar is full and no two of them compare. */
  eq(H.givingCeiling([{ grossPct: 0.021, takePct: 0.044 },
    { grossPct: 0.031, takePct: 0.067 }]), 0.07, 'rounded up to a whole percent');
  eq(H.givingCeiling([{ grossPct: 0.004, takePct: 0.009 }]), 0.05,
    'and never so small that modest giving fills the bar');
  eq(H.givingCeiling([{ grossPct: null, takePct: null }]), 0.05,
    'nothing to scale to');
});
t('the ceiling holds the PROJECTED shares too', () => {
  /* The projected figure is the biggest number on the tab. Scaling to the
     actual ones only would run its meter off the end of the bar. */
  eq(H.givingCeiling([{ grossPct: 0.031, takePct: 0.041, projGrossPct: 0.052,
    projTakePct: 0.088 }]), 0.09);
});

group('Giving still planned, in a year still running');
t('planned out of pocket is deposits and cash gifts, never a grant', () => {
  /* Exactly the rule givenOutOfPocket follows, for exactly the reason: the
     dollar behind a planned grant left the account when its deposit did, so
     projecting with it would count that deposit twice. */
  eq(H.plannedOutOfPocket([
    { funding: 1000, pending: true },
    { grant: -1000, pending: true },
    { grant: -2000, pending: true },
    { cash: -250, pending: true },
  ]), 1250);
});
t('a donation already made is not still planned', () => {
  eq(H.plannedOutOfPocket([{ funding: 5000 }, { funding: 1000, pending: true }]), 1000);
  eq(H.givenOutOfPocket([{ funding: 5000 }, { funding: 1000, pending: true }]), 5000,
    'and the two halves do not overlap');
});
t('a running year projects to what it is heading for', () => {
  const st = { side: {
    comp: { '2026': { salary: 100000, raisePct: 0 } }, bonuses: {},
    donations: { '2026': [
      { foundation: 'Fund', funding: 5000 },
      { foundation: 'Fund', funding: 1000, pending: true },
      { foundation: 'A Cause', grant: -1000, pending: true },
    ] } },
    years: { '2026': { kind: 'grid', categories: [
      { id: 'paycheck', name: 'Paycheck', rule: 'paycheck', section: 'income' },
    ], cells: { 'paycheck|2026-01': { v: 60000 } } } } };
  const t26 = H.givingStats(st, {}, '2026-08-18')[0];
  eq(t26.given, 5000, 'what has actually gone is untouched');
  eq(t26.grossPct, 0.05, 'and so is the share it is at');
  eq(t26.planned, 1000, 'the planned GRANT is not in here');
  eq(t26.projected, 6000);
  eq(t26.projGrossPct, 0.06);
  eq(t26.projTakePct, 0.1);
  ok(t26.running, 'and the year knows it is still going');
});
t('a year that is over gets no projection, however stale the row in it', () => {
  /* A planned donation left in a finished year is a plan that was never
     carried out. Projecting from it would be a claim about a year nobody can
     change now. */
  const st = { side: { comp: {}, bonuses: {}, donations: { '2024': [
    { foundation: 'Fund', funding: 3000 },
    { foundation: 'Fund', funding: 1000, pending: true },
  ] } }, years: {} };
  const t24 = H.givingStats(st, {}, '2026-08-18')[0];
  eq(t24.given, 3000);
  eq(t24.planned, 1000, 'still counted, so the sub can name it');
  eq(t24.projected, null, 'but nothing is projected from it');
  eq(t24.projGrossPct, null);
  eq(t24.running, false);
});
t('a running year with nothing planned projects nothing rather than itself', () => {
  /* projected === given would put a fourth tile on the card saying exactly
     what the first one just said. Absent is what keeps the tab as it was for
     everybody who does not plan giving ahead. */
  const st = { side: { comp: {}, bonuses: {},
    donations: { '2026': [{ foundation: 'Fund', funding: 5000 }] } }, years: {} };
  const t26 = H.givingStats(st, {}, '2026-08-18')[0];
  eq(t26.planned, 0);
  eq(t26.projected, null);
  ok(t26.running, 'running all the same');
});
t('a projected share is a dash wherever the actual one is', () => {
  /* Nothing here invents a denominator, and a projection is not a reason to
     start: no comp record is no comp record. */
  const st = { side: { comp: {}, bonuses: {}, donations: { '2026': [
    { foundation: 'Fund', funding: 5000 },
    { foundation: 'Fund', funding: 1000, pending: true },
  ] } }, years: {} };
  const t26 = H.givingStats(st, {}, '2026-08-18')[0];
  eq(t26.projected, 6000, 'the dollars still project');
  eq(t26.grossPct, null);
  eq(t26.projGrossPct, null, 'the share does not');
  eq(t26.takePct, null);
  eq(t26.projTakePct, null);
});
group('Cloning a year of giving forward');
t('a clone lands in the first year with nothing in it', () => {
  /* Not from + 1. Dropping a second copy on a year that already holds a plan
     would double every figure in it, silently. */
  const don = { '2025': [{ cash: -100 }], '2026': [{ cash: -100 }],
    '2027': [{ cash: -100 }] };
  eq(H.nextUnplannedYear(don, '2026'), '2028');
  eq(H.nextUnplannedYear(don, '2024'), '2028', 'walks past every year that has one');
  eq(H.nextUnplannedYear(don, '2027'), '2028');
  eq(H.nextUnplannedYear({}, '2026'), '2027', 'nothing anywhere: straight next year');
});
t('an emptied bucket counts as unplanned', () => {
  /* coerceShape prunes these on load, but deleting the last row of a year
     empties one mid-session, and an empty year is an empty year. */
  eq(H.nextUnplannedYear({ '2027': [] }, '2026'), '2027');
});
t('a year key that is not a number has no next year', () => {
  eq(H.nextUnplannedYear({ 'sometime': [{ cash: -1 }] }, 'sometime'), null);
});
t('a date moves year and keeps its day', () => {
  eq(H.reDate('2026-02-13', '2027'), '2027-02-13');
  eq(H.reDate('2026-12-01', '2029'), '2029-12-01', 'more than one year forward');
});
t('29 February lands on the 28th, never in March', () => {
  /* Rolling into 1 March would move a gift to another month to preserve a
     day-of-year nobody chose. */
  ok(H.isLeapYear(2028) && !H.isLeapYear(2027), 'the fixture years are what I think');
  eq(H.reDate('2028-02-29', '2027'), '2027-02-28');
  eq(H.reDate('2028-02-29', '2032'), '2032-02-29', 'leap to leap keeps the day');
  eq(H.isLeapYear(2100), false, 'a century is not a leap year');
  eq(H.isLeapYear(2000), true, 'but every fourth one is');
});
t('a dateless donation stays dateless', () => {
  eq(H.reDate('', '2027'), '');
  eq(H.reDate(undefined, '2027'), '');
  eq(H.reDate('2026', '2027'), '', 'a year alone is not a date');
});
t('everything comes across, and all of it lands Planned', () => {
  /* Last year's intentions are as much the shape of a year's giving as its
     receipts, so the planned rows are cloned too — as planned rows. */
  const st = { side: { donations: { '2026': [
    { date: '2026-02-13', foundation: 'Fidelity Charitable', cause: 'DAF Funding',
      funding: 5000, deductible: true },
    { date: '2026-05-10', foundation: 'Roswell Park Alliance', event: 'Ride for Roswell',
      cause: 'Cancer', grant: -1000, note: 'team page' },
    { date: '2026-11-25', foundation: 'Together for Youth', cause: 'Kids',
      grant: -1000, pending: true },
  ] } } };
  const out = H.cloneDonationsForward(st, '2026');
  eq(out.to, '2027');
  eq(out.count, 3);
  const rows = st.side.donations['2027'];
  eq(rows.length, 3);
  ok(rows.every(r => r.pending === true), 'every copy is Planned');
  eq(rows.map(r => r.date), ['2027-02-13', '2027-05-10', '2027-11-25']);
  eq(rows[0].funding, 5000);
  eq(rows[0].deductible, true, 'a deposit meant to repeat is meant to be deductible');
  eq(rows[1].event, 'Ride for Roswell');
  eq(rows[1].note, 'team page');
  eq(rows[2].grant, -1000, 'a row that was only planned is cloned as one');
});
t('the source year is not touched', () => {
  const st = { side: { donations: { '2026': [
    { date: '2026-02-13', foundation: 'Fund', funding: 5000, deductible: true }] } } };
  H.cloneDonationsForward(st, '2026');
  const src = st.side.donations['2026'][0];
  eq(src.date, '2026-02-13');
  eq(!!src.pending, false, 'what you gave is still what you gave');
});
t('a clone counts towards the projection and towards nothing given', () => {
  /* The whole reason every copy lands planned: it must not be able to inflate
     a figure of record, only say where the year is heading. */
  const st = { side: { comp: {}, bonuses: {}, donations: { '2026': [
    { date: '2026-02-13', foundation: 'Fund', funding: 5000 }] } }, years: {} };
  H.cloneDonationsForward(st, '2026');
  const t27 = H.givingStats(st, {}, '2026-08-18').find(r => r.y === '2027');
  eq(t27.given, 0, 'nothing has been given in 2027');
  eq(t27.planned, 5000);
  eq(t27.projected, 5000, 'it is all projection');
});
t('cloning twice makes two plans, never one doubled', () => {
  const st = { side: { donations: { '2026': [
    { date: '2026-02-13', foundation: 'Fund', funding: 5000 }] } } };
  eq(H.cloneDonationsForward(st, '2026').to, '2027');
  eq(H.cloneDonationsForward(st, '2026').to, '2028', 'the second lands further on');
  eq(st.side.donations['2027'].length, 1);
  eq(st.side.donations['2028'].length, 1);
});
t('a year with nothing in it clones nothing', () => {
  eq(H.cloneDonationsForward({ side: { donations: { '2026': [] } } }, '2026'), null);
  eq(H.cloneDonationsForward({ side: { donations: {} } }, '2026'), null);
});
t('deleting a year takes the BUCKET, not just its rows', () => {
  /* An emptied bucket left behind would ride along in a backup taken before
     the next reload and bring the card back on restore — dropDonation's rule. */
  const st = { side: { donations: { '2026': [{ cash: -100 }, { cash: -200 }],
    '2027': [{ cash: -50 }] } } };
  eq(H.dropDonationYear(st, '2026'), 2, 'the count removed');
  eq('2026' in st.side.donations, false, 'the key is gone, not left empty');
  eq(st.side.donations['2027'].length, 1, 'and no other year is touched');
});
t('deleting a year that has nothing in it is null, not 0', () => {
  /* Absent, so the caller can tell "I deleted none" from "there was nothing
     there" and skip the toast rather than announcing an edit that never was. */
  eq(H.dropDonationYear({ side: { donations: {} } }, '2026'), null);
  eq(H.dropDonationYear({ side: { donations: { '2026': [] } } }, '2026'), null);
});
t('a deleted year is off the chart and out of every total', () => {
  const st = { side: { comp: {}, bonuses: {}, donations: {
    '2025': [{ cash: -100 }], '2026': [{ cash: -900 }] } }, years: {} };
  H.dropDonationYear(st, '2026');
  eq(H.givingStats(st, {}, '2026-08-18').map(r => r.y), ['2025']);
});
t('a cloned year can be deleted again, and the clone target moves back', () => {
  /* The round trip: clone, think better of it, delete, and the button is
     offering the same year again rather than skipping past a hole. */
  const st = { side: { donations: { '2026': [
    { date: '2026-02-13', foundation: 'Fund', funding: 5000 }] } } };
  eq(H.cloneDonationsForward(st, '2026').to, '2027');
  eq(H.nextUnplannedYear(st.side.donations, '2026'), '2028');
  eq(H.dropDonationYear(st, '2027'), 1);
  eq(H.nextUnplannedYear(st.side.donations, '2026'), '2027', 'back where it was');
});

t('a year of the future is running, not finished', () => {
  /* Giving planned for next year is the most forward-looking thing on the tab
     and would be the easiest to drop by testing `=== thisYear`. */
  const st = { side: { comp: {}, bonuses: {}, donations: { '2027': [
    { foundation: 'Fund', funding: 2000, pending: true },
  ] } }, years: {} };
  const t27 = H.givingStats(st, {}, '2026-08-18')[0];
  eq(t27.given, 0);
  eq(t27.projected, 2000);
  ok(t27.running);
});

group('A month with a note is marked as one');
t('a note on a split amount earns the dot, same as a note on the cell', () => {
  /* The reported bug: annotating one of the amounts and nothing else left the
     grid showing no dot at all, so the note was invisible until you happened
     to open that cell. */
  ok(H.hasNote({ v: 700, parts: [{ v: 700, note: 'Rich - MBAir' }] }),
    'one part, noted, no note on the cell itself');
  ok(H.hasNote({ v: -60, parts: [{ v: -30, note: 'part one' }, { v: -30 }] }),
    'one of several parts');
  ok(H.hasNote({ v: -50, note: 'a main note' }), 'the cell’s own note still counts');
  ok(H.hasNote({ v: -50, note: 'both', parts: [{ v: -50, note: 'and a part' }] }));
});
t('a month with nothing written on it is not marked', () => {
  eq(H.hasNote({ v: -70, parts: [{ v: -70 }] }), false, 'split, but nothing said');
  eq(H.hasNote({ v: -70 }), false);
  eq(H.hasNote({ v: -70, note: '' }), false, 'an empty note is not a note');
  eq(H.hasNote(undefined), false, 'a month with no cell at all');
});

group('A year’s notes, gathered');
function notesState() {
  return H.coerceShape({
    settings: { accounts: [{ id: 'cash', name: 'Cash (SPAXX)', hub: true }] },
    years: {
      '2030': { kind: 'grid', model: 'live', startMonth: '2030-01', monthCount: 12,
        enteredThrough: '2030-12',
        categories: [{ id: 'rent', name: 'Rent', note: 'renews in June' },
                     { id: 'food', name: 'Food' }],
        cells: {
          'rent|2030-03': { v: -900, kind: 'actual', note: 'escrow shortage' },
          'food|2030-02': { v: -300, kind: 'actual' },          // no note
          'food|2030-05': { v: -250, kind: 'mixed', note: 'two shops',
            parts: [{ v: -150, kind: 'actual', note: 'weekly' },
                    { v: -100, kind: 'actual' }] },             // one part noted
        },
        paychecks: {}, seeds: {},
        overrides: { 'cash|2030-01': { v: 500, note: 'off the statement' } } },
      '2031': { kind: 'grid', model: 'live', startMonth: '2031-01', monthCount: 12,
        categories: [{ id: 'rent', name: 'Rent' }], cells: { 'rent|2031-01': { v: -900 } },
        paychecks: {}, seeds: {}, overrides: {} },
      '2029': { kind: 'summary', categoryTotals: [
        { name: 'Income', total: 30000, note: 'the raise landed late' },
        { name: 'Rent', total: -9000 }],
        extraNotes: [{ where: '2029!Rent', note: 'from the old sheet' }] },
    } });
}
t('every kind of note is collected', () => {
  const n = H.notesOfYear(notesState(), '2030');
  eq(n.map(x => x.where), ['Rent', 'Cash (SPAXX)', 'Rent', 'Food', 'Food'],
    'the row or account it is on — the account named, not its id');
  eq(n.map(x => x.m), [undefined, '2030-01', '2030-03', '2030-05', '2030-05'],
    'a row note belongs to no month and leads; the rest are chronological');
  eq(n.map(x => x.note), ['renews in June', 'off the statement', 'escrow shortage',
    'two shops', 'weekly']);
});
t('the month and the split amount are kept off the label', () => {
  /* They are rendered by the month heading and a suffix, so the collector
     hands them over separately rather than baked into one string. */
  const n = H.notesOfYear(notesState(), '2030');
  const part = n.find(x => x.note === 'weekly');
  eq(part.extra, '-$150.00', 'the split amount says which part of the month');
  eq(n.find(x => x.note === 'escrow shortage').extra, undefined,
    'a whole-cell note has no amount to add');
  ok(!n.some(x => /30$|Jan|Mar|May/.test(x.where)), 'no month in any label');
});
t('a cell or part without a note contributes nothing', () => {
  const n = H.notesOfYear(notesState(), '2030');
  ok(!n.some(x => x.m === '2030-02'), 'the unnoted February cell is absent');
  ok(!n.some(x => x.extra === '-$100.00'), 'and so is the unnoted part');
});
t('a year with no notes gathers nothing, so the section is not drawn', () => {
  eq(H.notesOfYear(notesState(), '2031'), []);
});
t('a summary year gathers its row notes and its imported ones', () => {
  const n = H.notesOfYear(notesState(), '2029');
  eq(n.map(x => x.where), ['Income', 'Rent'],
    'and the sheet prefix is dropped — the heading already says the year');
  eq(n.map(x => x.note), ['the raise landed late', 'from the old sheet']);
});
t('a year key holding regex metacharacters still gathers notes', () => {
  /* Year keys come out of a restored file and are kept verbatim. The sheet
     prefix on an imported note used to be stripped with a RegExp built from
     the key, so a key like "(" threw mid-render and blanked the Budget tab. */
  const s = H.coerceShape({ years: { '(': { kind: 'summary',
    categoryTotals: [], extraNotes: [{ where: '(!Rent', note: 'kept' },
                                     { where: 'Other', note: 'also kept' }] } } });
  eq(H.notesOfYear(s, '(').map(x => x.where), ['Rent', 'Other'],
    'the prefix is stripped and nothing throws');
});
t('a note knows the cell it belongs to, so it can be opened', () => {
  const n = H.notesOfYear(notesState(), '2030');
  eq(n.find(x => x.note === 'escrow shortage').edit, 'cat');
  eq(n.find(x => x.note === 'escrow shortage').id, 'rent');
  eq(n.find(x => x.note === 'off the statement').edit, 'bal');
  eq(n.find(x => x.note === 'renews in June').edit, 'row');
  const imported = H.notesOfYear(notesState(), '2029')
    .find(x => x.note === 'from the old sheet');
  eq(imported.edit, undefined, 'an imported note has no cell to go back to');
});

t('a month page takes only the notes tied to that month', () => {
  /* What monthNotes() filters on, held against the same gatherer the year card
     reads — one collector, two lenses, so the two lists cannot disagree about
     what a note is. A ROW note carries no month: it explains the row, not a
     month, so it is left off rather than repeated under all twelve, and the
     year card is where those are read. */
  const st = notesState();
  const forMonth = (m) => H.notesOfYear(st, '2030').filter((n) => n.m === m);
  eq(forMonth('2030-03').map((x) => x.note), ['escrow shortage']);
  eq(forMonth('2030-05').map((x) => x.note), ['two shops', 'weekly'],
     'a split month brings the note on the cell AND the one on the amount, which is '
     + 'two lines about one figure and right both times');
  eq(forMonth('2030-01').map((x) => x.note), ['off the statement'],
     'a note written on a stated balance is a note on that month');
  eq(forMonth('2030-02'), [],
     'and a month with nothing written on it draws no card at all');
  ok(!H.notesOfYear(st, '2030').some((n) => n.note === 'renews in June' && n.m),
     'the row note has no month on it, so no month page can claim it');
});

group('Which summary rows are money that moved');
/* The shape the old bi-weekly sheets have: detail rows, then a closing block
   of balances and derived totals, with the income line often sitting inside
   that block. Invented figures, real row names. */
const namesOf = (items, flow, want) =>
  items.filter((_, i) => flow[i] === want).map(i => i.name);
t('the closing block of balances is not money that moved', () => {
  const items = [{ name: 'Mortgage', total: -9000 }, { name: 'NYSEG', total: -600 },
    { name: 'Income', total: 30000 }, { name: 'Checking', total: 500 },
    { name: 'Savings', total: 1200 }, { name: 'All Accounts', total: 1700 }];
  const flow = H.summaryRowIsFlow(items);
  eq(namesOf(items, flow, true), ['Mortgage', 'NYSEG', 'Income'],
    'the income line counts — it is the year’s money in');
  eq(namesOf(items, flow, false), ['Checking', 'Savings', 'All Accounts']);
});
t('an income line inside the block does not end it', () => {
  /* 2013's shape: the balances come first, then Expenses, then Income. */
  const items = [{ name: 'Mortgage', total: -9000 }, { name: 'Other', total: 400 },
    { name: 'Checking', total: 340 }, { name: 'Total', total: 665 },
    { name: 'Expenses', total: -30000 }, { name: 'Income', total: 30500 }];
  const flow = H.summaryRowIsFlow(items);
  eq(namesOf(items, flow, true), ['Mortgage', 'Other', 'Income']);
  eq(namesOf(items, flow, false), ['Checking', 'Total', 'Expenses']);
});
t('a derived total never counts, wherever it sits', () => {
  /* It restates rows already counted — including it would double the year. */
  const items = [{ name: 'NYSEG', total: -600 }, { name: 'Fixed Expenses', total: -600 },
    { name: 'Net Income', total: 700 }, { name: 'Monthly', total: 100 }];
  const flow = H.summaryRowIsFlow(items);
  eq(namesOf(items, flow, true), ['NYSEG', 'Net Income']);
});
t('a detail row sharing a balance’s name still counts', () => {
  /* "Savings" and "Cash" appear twice in a year — once as money moved into
     them, once as what they closed at. Only the closing one is the balance. */
  const items = [{ name: 'Cash', total: -700 }, { name: 'Savings', total: 1650 },
    { name: 'Income', total: 31000 }, { name: 'Checking', total: 900 },
    { name: 'Savings', total: 1950 }];
  const flow = H.summaryRowIsFlow(items);
  eq(namesOf(items, flow, true), ['Cash', 'Savings', 'Income']);
  eq(flow[4], false, 'the last Savings is the closing balance');
});
t('any "Total …" row is a closing figure, whatever it was renamed to', () => {
  /* Matching a list of exact names meant renaming "Monthly" to "Total Cash"
     turned it back into a flow and added it to the year's income. */
  for (const name of ['Total', 'Total savings', 'Total online', 'Total Cash',
                      'Total +/- 1 Month']) {
    const items = [{ name: 'Rent', total: -800 }, { name: name, total: 90 }];
    eq(H.summaryRowIsFlow(items), [true, false], name);
  }
});
t('a year with no closing block keeps every row', () => {
  const items = [{ name: 'Rent', total: -1000 }, { name: 'Paycheck', total: 4000 }];
  eq(H.summaryRowIsFlow(items), [true, true]);
});
t('the reclassification runs once and then leaves you alone', () => {
  const year = () => ({ kind: 'summary', categoryTotals: [
    { name: 'Mortgage', total: -9000, isBalance: true },
    { name: 'Checking', total: 500, isBalance: true }] });
  const first = H.migrate(H.coerceShape({ schema: 1, years: { '2015': year() } }));
  eq(first.years['2015'].categoryTotals[0].isBalance, undefined, 'Mortgage is a flow now');
  eq(first.years['2015'].categoryTotals[1].isBalance, true);
  eq(first.schema, H.SCHEMA, 'and it comes forward to the current schema');
  /* now flip one by hand, as the row editor would, and load again */
  first.years['2015'].categoryTotals[0].isBalance = true;

}

/* ── The month view ─────────────────────────────────────────────────────────
   The Budget's second lens. Nothing it draws is computed here — every figure
   comes out of the same computed year the grid reads — so what is worth pinning
   is the three pure pieces between the engine and the page: which months the
   plan holds, which grid year a month is read from, and what one month adds up
   to. The last test in the group is the one that matters most: it holds the
   month view's own arithmetic against the grid's subtotals over the whole
   sample plan, because two lenses on one object disagreeing is the only way
   this feature can be wrong without anything looking broken. */
group('The month view');
function monthYear(entered) {
  return { kind: 'grid', model: 'live', enteredThrough: entered || '2030-02',
    startMonth: '2030-01', monthCount: 12,
    categories: [
      { id: 'pay', name: 'Paycheck', section: 'income', role: 'normal' },
      { id: 'rent', name: 'Rent', section: 'expense', role: 'normal' },
      /* Internal: the far side is an account the plan tracks. */
      { id: 'sweep', name: 'To savings', section: 'transfer',
        role: 'transfer', transferTo: 'mid' },
      /* External: filed under Transfers, but the money really leaves — the
         Roth IRA case the flow bars already know about. */
      { id: 'roth', name: 'Roth IRA', section: 'transfer', role: 'normal' },
    ],
    cells: {}, overrides: {}, seeds: {}, balAdjust: {} };
}
const MONTH_COMPUTED = {
  months: ['2030-01', '2030-02'],
  cells: {
    'pay|2030-01': { v: 4000, kind: 'actual' },
    'rent|2030-01': { v: -1500, kind: 'actual' },
    'sweep|2030-01': { v: -1000, kind: 'actual' },
    'roth|2030-01': { v: -500, kind: 'actual' },
    'pay|2030-02': { v: 4000, kind: 'auto' },
  },
  interest: { 'cash|2030-01': 25 },
  dividend: {},
  balances: { 'total|2030-01': 9000, 'total|2030-02': 11000 },
  balanceKinds: { 'total|2030-01': 'actual', 'total|2030-02': 'actual' },
  paychecks: {},
};

       offers 2030-01 as well and the two must not both appear. */
    '2029': { kind: 'grid', startMonth: '2029-01', monthCount: 13 },
    '2030': { kind: 'grid', startMonth: '2030-01', monthCount: 12 },
  } };
  const all = H.planMonths(st);
  eq(all.length, 24, 'twelve of 2029 and twelve of 2030 — the shared month once');
  eq(all[0], '2029-01');
  eq(all[all.length - 1], '2030-12');
  eq(all.filter(m => m === '2030-01').length, 1);
});
t('a summary year offers no months at all', () => {
  /* A year folded into totals has none to look at, which is why the view sends
     the reader back to the grid rather than drawing an empty month. */
  eq(H.planMonths({ years: { '2015': { kind: 'summary', categoryTotals: [] } } }), []);
});
t('a month is read from its own calendar year, not from a tail reaching it', () => {
  const st = { years: {
    '2029': { kind: 'grid', startMonth: '2029-01', monthCount: 13 },

t('a month only a projection tail reaches is read from that year', () => {

  eq(H.yearOfMonth(st, '2030-02'), '2029');

  /* A grid year need not start in January. Reading "2030" off the month and
     stopping there would hand back a year that holds no such month. */
  const st = { years: { '2030': { kind: 'grid', startMonth: '2030-03', monthCount: 4 } } };
  eq(H.yearOfMonth(st, '2030-01'), null);
  eq(H.yearOfMonth(st, '2030-04'), '2030');

t('money in adds what the accounts themselves earned', () => {
  const t1 = H.monthTotals(MONTH_COMPUTED, monthYear(), '2030-01', null);
  approx(t1.income.v, 4025, '4000 of pay + 25 of interest');
  approx(t1.rows.v, 4000, 'the rows on their own are still reported');
  approx(t1.earned.v, 25);
});
t('no transfer counts against what was left over, wherever it went', () => {
  /* THE RULE THIS VIEW GOT WRONG FOR A DAY. `net` used to add the transfers
     whose far side was not a tracked account, on the reasoning that the money
     had left — and the first real month it met held a $7,500 Roth IRA
     contribution, so a month that earned more than it spent and saved seven and
     a half thousand was reported as a hole of that size, in red. Expenses means

  const t1 = H.monthTotals(MONTH_COMPUTED, monthYear(), '2030-01', null);
  approx(t1.out.v, 1500, 'money out is the expense rows, and neither transfer is one');
  approx(t1.net.v, 2525, '4025 in less 1500 of rent — and nothing else');
  approx(t1.internal.v, -1000, 'the sweep is still reported…');
  approx(t1.external.v, -500, '…and so is the Roth row, which net simply does not read');
  approx(t1.transfer.v, -1500, 'the section total counts both, and the Moved tile shows it');
});
t('the Moved tile and the Transfers total are the same number', () => {
  /* They were computed differently AND signed differently, which is what got
     asked about. The tile draws `transfer` now, untouched — so this test is the
     pairing, and it fails the moment either side grows an opinion of its own. */
  const t1 = H.monthTotals(MONTH_COMPUTED, monthYear(), '2030-01', null);
  approx(t1.transfer.v, H.round2(t1.internal.v + t1.external.v),
    'the two halves are exactly the whole');
});
t('the closing total is the engine’s, and the change is against the month before', () => {
  const feb = H.monthTotals(MONTH_COMPUTED, monthYear(), '2030-02', null);
  approx(feb.closing, 11000);
  approx(feb.opening, 9000);
  approx(feb.change, 2000);
  const jan = H.monthTotals(MONTH_COMPUTED, monthYear(), '2030-01', null);
  eq(jan.change, undefined, 'no month before it computed, so no claim is made');
  eq(jan.opening, undefined, 'and not zero, which would say the accounts were empty');
});

  const jan = H.monthTotals(MONTH_COMPUTED, monthYear(), '2030-01', prior);

});
t('every figure says what it is made of', () => {
  const jan = H.monthTotals(MONTH_COMPUTED, monthYear(), '2030-01', null);
  eq(jan.income.kind, 'actual');
  eq(jan.net.kind, 'actual');
  const feb = H.monthTotals(MONTH_COMPUTED, monthYear(), '2030-02', null);
  eq(feb.income.kind, 'auto', 'February’s pay is the rule’s guess');
  eq(feb.expense.kind, 'missing', 'and nothing is recorded against it');
  eq(feb.net.kind, 'auto');
});
t('the bars mark the months still to come', () => {
  const st = { years: { '2030': monthYear('2030-01') } };
  const pts = H.monthNetPoints(st, { '2030': MONTH_COMPUTED }, '2030');
  eq(pts.map(p => p.m), ['2030-01', '2030-02']);
  eq(pts.map(p => p.ahead), [false, true]);
  approx(pts[0].v, 2525);
});
t('a finished year has no months still to come', () => {
  /* Nothing in a pinned year is projected — every figure in it was read off a
     statement — so none of its bars may be drawn as an estimate. */
  const yr = Object.assign(monthYear(), { model: 'pinned' });
  const pts = H.monthNetPoints({ years: { '2030': yr } }, { '2030': MONTH_COMPUTED }, '2030');
  eq(pts.map(p => p.ahead), [false, false]);
});
t('monthTitle writes the month out in full', () => {
  eq(H.monthTitle('2030-01'), 'January 2030');
  eq(H.monthTitle('2026-09'), 'September 2026');
});
t('every month of the sample plan agrees with the grid’s own subtotals', () => {
  /* THE TEST THIS GROUP EXISTS FOR. Two lenses on one object, and the failure
     mode is silent: both pages look right and one of them is quietly adding a
     row the other leaves out. So the month view's arithmetic is measured
     against the grid's, month by month, over the whole demo plan — which is the
     one fixture that carries an overflow sweep, a pass-through, dividends on a
     brokerage and a pinned balance all at once. */
  const st = H.migrate(H.coerceShape(H.sampleState()));
  const C = H.computeAll(st, '2026-08-24');
  const bad = [];
  for (const y of Object.keys(st.years)) {
    const yr = st.years[y];
    if (yr.kind !== 'grid') continue;
    const c = C[y], prior = C[String(+y - 1)] || null;
    const sum = (sec, m) => H.round2((yr.categories || [])
      .filter(cat => (cat.section || 'expense') === sec)
      .reduce((s, cat) => s + ((c.cells[`${cat.id}|${m}`] || { v: 0 }).v), 0));
    for (const m of c.months) {
      const mt = H.monthTotals(c, yr, m, prior);
      const earned = H.accountEarnings(c, yr, [m]).v;
      if (Math.abs(mt.income.v - H.round2(sum('income', m) + earned)) > 0.005)
        bad.push(`${m} income`);
      if (Math.abs(mt.expense.v - sum('expense', m)) > 0.005) bad.push(`${m} expenses`);
      if (Math.abs(H.round2(mt.internal.v + mt.external.v) - sum('transfer', m)) > 0.005)
        bad.push(`${m} transfers split`);
      if (mt.closing !== c.balances[`total|${m}`]) bad.push(`${m} closing total`);
    }
  }
  eq(bad.join(', '), '', 'the month view and the grid add the same month up the same way');
  ok(Object.keys(C).length >= 1, 'and the sample really did compute a grid year');
});

group('Spending, year by year');

/* ── Due dates ──────────────────────────────────────────────────────────────
   A budget row can say WHEN its money is owed — a day of the month, and which
   months it falls in. None of it reaches the engine, so every test here is over
   a pure function with its "today" and its lead time passed in; nothing reads a
   clock and nothing reads the app's ambient state. */
group('Due dates');

const DUE_ROW = (extra) => Object.assign(
  { id: 'water', name: 'Water', section: 'expense', role: 'normal',
    duePay: 'manual', dueMonths: [1, 4, 7, 10], dueDay: 20 }, extra || {});
const CELL = (kind, v) => ({ v: v === undefined ? -92 : v, kind });

t('a month is as long as it really is, leap years included', () => {
  eq(H.daysInMonth(2024, 2), 29, 'a leap February');
  eq(H.daysInMonth(2025, 2), 28);
  eq(H.daysInMonth(1900, 2), 28, '1900 is not a leap year — the century rule');
  eq(H.daysInMonth(2000, 2), 29, '2000 is — the four-hundred rule');
  eq(H.daysInMonth(2026, 4), 30);
  eq(H.daysInMonth(2026, 12), 31);
});
t('the day count between two dates is arithmetic, not a Date', () => {
  eq(H.daysBetween('2026-08-25', '2026-09-01'), 7);
  eq(H.daysBetween('2026-02-27', '2026-03-01'), 2, 'across a non-leap February');
  eq(H.daysBetween('2024-02-27', '2024-03-01'), 3, 'and across a leap one');
  eq(H.daysBetween('2026-12-31', '2027-01-01'), 1, 'across a year end');
  eq(H.daysBetween('2026-09-01', '2026-08-25'), -7, 'backwards is negative');
});
t('an absent month list means every month, never none', () => {
  eq(H.dueMonthsOf({ duePay: 'manual' }).length, 12);
  eq(H.dueMonthsOf(DUE_ROW()), [1, 4, 7, 10]);
});
t('the day is clamped to the month it lands in', () => {
  const r = { duePay: 'manual', dueDay: 31 };
  eq(H.dueOn(r, '2024-02'), '2024-02-29', 'the 31st of a leap February is the 29th');
  eq(H.dueOn(r, '2025-02'), '2025-02-28');
  eq(H.dueOn(r, '2026-04'), '2026-04-30');
  eq(H.dueOn(r, '2026-05'), '2026-05-31');
});
t('with no fixed day the deadline is the end of the month', () => {
  eq(H.dueOn({ duePay: 'manual' }, '2026-02'), '2026-02-28');
  eq(H.dueOn({ duePay: 'manual' }, '2026-04'), '2026-04-30');
});
t('a row with no schedule, or a month it does not fall in, has no deadline', () => {
  eq(H.dueOn({ name: 'Rent' }, '2026-04'), null, 'no duePay is no schedule');
  eq(H.dueOn(DUE_ROW(), '2026-02'), null, 'February is not one of its months');
  eq(H.dueOn(DUE_ROW(), '2026-04'), '2026-04-20');
});

/* ── The verdict ─────────────────────────────────────────────────────────── */
const ST = (cat, m, cell, today, lead, live) =>
  H.dueStatus(cat, m, cell, today, lead === undefined ? 7 : lead, live !== false);

t('the four states either side of the deadline', () => {
  const r = DUE_ROW();
  eq(ST(r, '2026-04', null, '2026-03-01').state, 'ahead', 'well clear of it');
  eq(ST(r, '2026-04', null, '2026-04-15').state, 'soon', 'inside the lead');
  eq(ST(r, '2026-04', null, '2026-04-15').days, 5, 'and says how many days');
  eq(ST(r, '2026-04', null, '2026-04-20').state, 'due', 'the day itself');
  eq(ST(r, '2026-04', null, '2026-05-02').state, 'late');
  eq(ST(r, '2026-04', null, '2026-05-02').days, 12, 'days late is POSITIVE');
});
t('a lead of zero warns on the day and not before', () => {
  /* A typed 0 is a real answer, the ptoAllowance case — it must not be read as
     "unset" and quietly become seven. */
  const r = DUE_ROW();
  eq(ST(r, '2026-04', null, '2026-04-19', 0).state, 'ahead');
  eq(ST(r, '2026-04', null, '2026-04-20', 0).state, 'due');
});
t('a future month can never read late', () => {
  const r = DUE_ROW();
  for (const lead of [0, 7, 60])
    eq(ST(r, '2026-10', null, '2026-04-01', lead).state, 'ahead',
      'October is ahead of April at every lead — lead ' + lead);
});
t('an actual figure is the app’s word for paid, and mixed is not', () => {
  const r = DUE_ROW();
  eq(ST(r, '2026-04', CELL('actual'), '2026-06-01').state, 'paid',
    'it happened, months ago or not');
  eq(ST(r, '2026-04', CELL('mixed'), '2026-06-01').state, 'late',
    'a split month with one part still an estimate has not finished happening');
  eq(ST(r, '2026-04', CELL('auto'), '2026-06-01').state, 'late');
  eq(ST(r, '2026-04', CELL('missing', 0), '2026-06-01').state, 'late');
});
t('AN ENTERED MONTH WITH A BLANK CELL IS STILL LATE', () => {
  /* The regression that would gut the feature. An entered month with no stored
     cell resolves `missing`, not `actual` — so a "the month is entered, so it
     is paid" short-cut would announce that the bill was paid in exactly the
     case this feature exists for: October closed, the water bill never came,
     the row blank. Everything the marker genuinely settles arrives here as an
     `actual` already. */
  eq(ST(DUE_ROW(), '2026-04', { v: 0, kind: 'missing' }, '2026-08-01').state, 'late');
});
t('history has no reminders at all', () => {
  /* A pinned year states its balances and every category cell in it resolves
     `missing`; measuring one against today would put four figures of days-late
     on every scheduled row of 2021. */
  eq(ST(DUE_ROW(), '2021-04', { v: 0, kind: 'missing' }, '2026-08-01', 7, false), null);
});
t('paid beats held, and held beats autopay', () => {
  const held = DUE_ROW({ dueHold: '2026-12' });
  eq(ST(held, '2026-04', CELL('actual'), '2026-08-01').state, 'paid',
    'paid is a fact; held is only a request for quiet');

/* ── The words ───────────────────────────────────────────────────────────── */
t('a row with no fixed day never counts down to a date it invented', () => {
  /* Its deadline is the month's last day, which the app chose. Printing "due in
     6 days" against that is the app inventing a deadline and then counting down

  const r = DUE_ROW({ duePay: 'auto' });
  eq(H.dueFootWords(ST(r, '2026-04', null, '2026-04-01')), 'autopay, the 20th');
  eq(H.dueFootWords(ST(r, '2026-04', CELL('actual'), '2026-05-01')),

});
t('the whole schedule reads as a sentence for the row label', () => {
  eq(H.dueScheduleWords(DUE_ROW()),
    'Due Jan, Apr, Jul and Oct on the 20th, paid by hand.');
  eq(H.dueScheduleWords({ duePay: 'auto', dueDay: 1 }),

  eq(H.dueScheduleWords({ duePay: 'manual', dueMonths: [6] }),

  ok(H.dueScheduleWords(DUE_ROW({ dueHold: '2026-10' })).endsWith(
    'Reminders paused until Oct 2026.'));

});
t('ordinals read the way English does', () => {
  eq([1, 2, 3, 4, 11, 12, 13, 21, 22, 23, 31].map(H.ordinal).join(' '),
    '1st 2nd 3rd 4th 11th 12th 13th 21st 22nd 23rd 31st');
