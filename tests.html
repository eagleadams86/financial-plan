<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financial Plan — Tests</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* Dev-only page: pins the pure functions in index.html. It loads the real app
     in a hidden same-origin iframe and calls its functions directly, so what's
     tested is exactly what ships — no copies, no build step. Serve over
     http://localhost (python3 -m http.server 8016); file:// iframes are blocked
     in some browsers. Nothing here writes localStorage or calls save() — but
     GitHub Pages publishes this file next to the app, and on that origin merely
     BOOTING the app in the iframe is a live session: if this browser has ever
     signed in there, the sync module would start real Firestore traffic — or
     raise a which-copy dialog nobody can see — inside an invisible frame. So
     the gate at the foot of the script only creates the iframe on localhost,
     and the iframe carries data-fin-tests, which index.html checks so the sync
     module never initialises inside the harness (the family rule from Team
     Dashboard and its siblings).
     Every fixture is SYNTHETIC — invented round numbers, never real data. The
     one exception is the local-only block at the end, which fetches the
     gitignored import JSONs when they exist on this machine and silently
     skips when they don't (which is always, in CI and on the public site). */
  body { background: var(--bg); color: var(--text-primary); margin: 0;
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--text-muted); font-size: 12.5px; margin: 0 0 18px; }
  #summary { font-weight: 600; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px;
             border: 1px solid var(--border); background: var(--surface); }
  #summary.ok  { color: var(--ok);  border-color: var(--ok); }
  #summary.bad { color: var(--err); border-color: var(--err); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  td.st { width: 28px; font-weight: 700; }
  tr.pass td.st { color: var(--ok); }
  tr.fail td.st { color: var(--err); }
  tr.fail td.msg { color: var(--err); }
  .msg { color: var(--text-muted); font-size: 12px; white-space: pre-wrap; }
  .group td { padding-top: 16px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
              text-transform: uppercase; color: var(--text-muted); border-bottom-color: var(--border-strong); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Financial Plan — Pure-Function Tests</h1>
  <p class="sub">Runs against the real <code>index.html</code> in a hidden iframe. Read-only: nothing is saved.</p>
  <div id="summary">Loading app…</div>
  <table><tbody id="out"></tbody></table>
</div>
<!-- The app iframe is NOT in the markup: the localhost gate at the foot of the
     script creates it, or refuses to. Booting the app is itself the first thing
     that must not happen off localhost, so the gate has to come first — the
     family rule from Team Dashboard; don't put the iframe back here. -->

<script>
'use strict';
const TESTS = [];
function group(name) { TESTS.push({ group: name }); }
function t(name, fn) { TESTS.push({ name, fn }); }

function fmt(v) { return JSON.stringify(v); }
function eq(actual, expected, note) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  if (a !== e) throw new Error((note ? note + ': ' : '') + 'expected ' + e + ', got ' + a);
}
function approx(actual, expected, note, eps) {
  if (typeof actual !== 'number' || Math.abs(actual - expected) > (eps ?? 0.005))
    throw new Error((note ? note + ': ' : '') + 'expected ≈' + expected + ', got ' + fmt(actual));
}
function ok(cond, note) { if (!cond) throw new Error(note || 'expected truthy'); }

let w, H;   // app window + its __finTestHooks

/* ── Date helpers ─────────────────────────────────────────────────────────── */
group('Date helpers');
t('monthAdd walks forward across a year end', () => {
  eq(H.monthAdd('2026-11', 1), '2026-12');
  eq(H.monthAdd('2026-12', 1), '2027-01');
  eq(H.monthAdd('2026-01', 23), '2027-12');
});
t('monthAdd walks backward across a year start', () => {
  eq(H.monthAdd('2026-01', -1), '2025-12');
  eq(H.monthAdd('2026-03', -12), '2025-03');
});
t('monthDiff is the signed distance in months', () => {
  eq(H.monthDiff('2026-01', '2026-07'), 6);
  eq(H.monthDiff('2026-07', '2026-01'), -6);
  eq(H.monthDiff('2025-11', '2026-02'), 3);
});
t('monthLabel renders a short month + 2-digit year', () => {
  eq(H.monthLabel('2026-01'), 'Jan 26');
  eq(H.monthLabel('2027-12'), 'Dec 27');
});
t('monthLabelFull keeps the century, for a month written into a sentence', () => {
  eq(H.monthLabelFull('2026-01'), 'Jan 2026');
  eq(H.monthLabelFull('2033-09'), 'Sep 2033');
});

/* ── Money ────────────────────────────────────────────────────────────────── */
group('Money');
t('round2 rounds to cents and survives float dust', () => {
  eq(H.round2(1.005), 1.01);
  eq(H.round2(-79.98999999999999), -79.99);
  eq(H.round2(0.1 + 0.2), 0.3);
});
t('fmtMoney renders US dollars', () => {
  eq(H.fmtMoney(1234.5), '$1,234.50');
  eq(H.fmtMoney(-42), '-$42.00');
});

/* ── State boundary ───────────────────────────────────────────────────────── */
group('State boundary');
t('coerceShape forces every collection to the right type', () => {
  const d = H.coerceShape({ years: 'junk', goals: 'nope', side: 7, vacations: null,
                            people: 'nobody' });
  eq(typeof d.years, 'object');
  eq(Array.isArray(d.goals), true);
  eq(Array.isArray(d.side.taxable), true);
  eq(Array.isArray(d.vacations.trips), true);
  eq(Array.isArray(d.people), true);
});
t('coerceShape repairs a damaged grid year without dropping it', () => {
  const d = H.coerceShape({ years: { '2026': { kind: 'grid', cells: 'junk', monthCount: 999 } } });
  const y = d.years['2026'];
  eq(typeof y.cells, 'object');
  eq(y.monthCount, 36, 'month count clamps');
  eq(y.startMonth, '2026-01', 'missing start month defaults to January');
});
t('an unknown year kind falls back to summary', () => {
  const d = H.coerceShape({ years: { '2014': { kind: 'wat' } } });
  eq(d.years['2014'].kind, 'summary');
  eq(Array.isArray(d.years['2014'].categoryTotals), true);
});
t('migrate passes a current-schema state through untouched', () => {
  const s = H.blankState();
  eq(H.migrate(s), s);
});
t('blankState carries the spreadsheet constants', () => {
  const s = H.blankState();
  approx(s.settings.midTermRateAnnual, 0.03);
  eq(s.settings.longTermRateAnnual, undefined,
     'gone: nothing has read it since accounts became a list, and a setting no '
     + 'code consults should not ride along in every backup');
  approx((s.settings.accounts.find(a => a.id === 'long') || {}).rate, 0.07,
     'the 7% lives on the Investments account itself, where it is editable');
  eq(s.settings.ptoAllowance, 32);
  eq(s.settings.tagline, '', 'and a fresh plan is nobody’s in particular');
  eq(Array.isArray(s.people), true, 'a fresh plan has an empty household');
  eq(s.people.length, 0);
  eq(s.settings.filingStatus, 'single',
     'what the old fixed MAGI figure already meant — changing it would move a real answer');
});
t('a plan from before the household arrives with an empty one, nothing invented', () => {
  /* Schema 3 is the version that predates people. It must come forward with an
     empty list rather than a guessed household, and — the load-bearing half —
     its accounts must NOT be stamped with an owner. */
  const d = H.migrate(H.coerceShape({
    schema: 3,
    settings: { accounts: [{ id: 'cash', name: 'Cash', hub: true }, { id: 'mid', name: 'Savings' }] },
    years: { '2026': { kind: 'grid', startMonth: '2026-01', monthCount: 12 } }
  }));
  eq(d.schema, 5);
  eq(d.people, []);
  eq(d.settings.filingStatus, 'single');
  eq(d.settings.accounts.every(a => a.owner === undefined), true,
     'migration never guesses who owns an account');
});

/* ── Formula engine (synthetic fixture) ───────────────────────────────────────
   A hand-computed 6-month live year. Invented round numbers only. */
function fixtureState() {
  const s = {
    schema: 1,
    settings: { midTermRateAnnual: 0.03, longTermRateAnnual: 0.07, ptoAllowance: 32 },
    years: {
      '2029': {          // prior year, pinned — feeds the same-month rule
        kind: 'grid', model: 'pinned', startMonth: '2029-01', monthCount: 12,
        categories: [{ id: 'electric', name: 'Electric', role: 'normal', rule: 'none' }],
        cells: { 'electric|2029-10': { v: -80.4, kind: 'actual' } },
        paychecks: {}, seeds: {}, overrides: {}
      },
      '2030': {
        kind: 'grid', model: 'live', startMonth: '2030-01', monthCount: 6,
        enteredThrough: '2030-03',
        categories: [
          { id: 'paycheck', name: 'Paycheck', role: 'normal', rule: 'paycheck', perCheck: 1000 },
          { id: 'dividends', name: 'Dividends', role: 'normal', rule: 'dividends' },
          { id: 'cc', name: 'Credit Card', role: 'normal', rule: 'avg' },
          { id: 'internet', name: 'Internet', role: 'normal', rule: 'carry' },
          { id: 'electric', name: 'Electric', role: 'normal', rule: 'samemonth' },
          { id: 'midt', name: 'Mid-term transfers', role: 'midTransfer', rule: 'none' },
          { id: 'longt', name: 'Long-term transfers', role: 'longTransfer', rule: 'none' },
          { id: 'bankt', name: 'Bank transfers', role: 'bankTransfer', rule: 'none' },
          { id: 'zelle', name: 'Zelle', role: 'zelle', rule: 'none' },
          { id: 'char', name: 'Charitable', role: 'charitable', rule: 'none' },
        ],
        cells: {
          'paycheck|2030-01': { v: 2000, kind: 'actual' },
          'paycheck|2030-02': { v: 2000, kind: 'actual' },
          'paycheck|2030-03': { v: 3000, kind: 'actual' },
          'cc|2030-01': { v: -900, kind: 'actual' },
          'cc|2030-02': { v: -1100, kind: 'actual' },
          'cc|2030-03': { v: -1000, kind: 'actual' },
          'internet|2030-01': { v: -50, kind: 'actual' },
          'midt|2030-02': { v: -500, kind: 'actual' },   // 500 INTO mid-term
          'zelle|2030-04': { v: 25, kind: 'manual' },
          'char|2030-04': { v: -60, kind: 'manual' },
          'cc|2030-05': { v: -1234, kind: 'manual' },    // manual beats auto
        },
        paychecks: { '2030-01': 2, '2030-02': 2, '2030-03': 3, '2030-04': 2,
                     '2030-05': 3.5, '2030-06': 2 },
        seeds: { cash: 10000, mid: 1000, long: 1200, bank: 300 },
        overrides: { 'long|2030-01': { v: 1200 }, 'cash|2030-04': { v: 12345 } }
      }
    },
    goals: [
      { id: 'g1', name: 'Emergencies', source: 'cashBank', target: 5000, targetDate: '2030-12-01' },
      { id: 'g2', name: 'Renovations', source: 'midCapped', target: 1200, targetDate: '2031-06-01' },
      { id: 'g3', name: 'New Car', source: 'midOverflow', target: 9000, targetDate: '2033-06-01' },
      { id: 'g4', name: 'Retire', source: 'long', target: 90000, targetDate: '2040-01-01' },
    ],
    side: {}, vacations: { trips: [], pto: {} }, ui: {}
  };
  return s;
}
const TODAY_FIX = '2030-04-15';   // engine time is injected, so tests are stable

function computeFixture() {
  return H.computeAll(H.coerceShape(fixtureState()), TODAY_FIX);
}

/* The shape a rolled-over year arrives in: rules copied from the year before,
   no cells of its own, entered through the December before it. Every
   backward-looking rule has to keep working across that boundary or the whole
   year reads as blank. */
function projectNextYear(s, categories, cells, paychecks) {
  s.years['2031'] = {
    kind: 'grid', model: 'live', startMonth: '2031-01', monthCount: 12,
    enteredThrough: '2030-12',
    categories, cells: cells || {}, paychecks: paychecks || {},
    seeds: {}, overrides: {}
  };
  return H.computeAll(H.coerceShape(s), TODAY_FIX);
}
const PAYROW = () => [{ id: 'paycheck', name: 'Paycheck', role: 'normal',
  rule: 'paycheck', perCheck: 1000 }];

group('Formula engine — rules');
t('paycheck rule multiplies per-check by that month count (incl. the 3.5 case)', () => {
  const c = computeFixture()['2030'];
  approx(c.cells['paycheck|2030-04'].v, 2000, 'April: 1000 × 2');
  approx(c.cells['paycheck|2030-05'].v, 3500, 'May: 1000 × 3.5');
  eq(c.cells['paycheck|2030-04'].kind, 'auto');
});
t('trailing average uses stored months before the estimate, so it does not drift', () => {
  const c = computeFixture()['2030'];
  approx(c.cells['cc|2030-04'].v, -1000, 'April: mean of the Jan..Mar actuals');
  approx(c.cells['cc|2030-06'].v, -1058.5,
    'June adds the May manual but ignores the auto April');
});
t('a manual estimate beats the auto rule', () => {
  const c = computeFixture()['2030'];
  eq(c.cells['cc|2030-05'].kind, 'manual');
  approx(c.cells['cc|2030-05'].v, -1234);
});
t('carry repeats the nearest earlier stored value', () => {
  const c = computeFixture()['2030'];
  approx(c.cells['internet|2030-04'].v, -50);
  approx(c.cells['internet|2030-06'].v, -50);
});
t('carry crosses the year boundary — a projected year opens at last December', () => {
  const c = projectNextYear(fixtureState(), [
    { id: 'internet', name: 'Internet', role: 'normal', rule: 'carry' },
    { id: 'newrow', name: 'Never recorded', role: 'normal', rule: 'carry' },
  ])['2031'];
  eq(c.cells['internet|2031-01'].kind, 'auto');
  approx(c.cells['internet|2031-01'].v, -50, 'January picks up the last figure from 2030');
  approx(c.cells['internet|2031-12'].v, -50, 'and it holds all year');
  eq(c.cells['newrow|2031-03'].kind, 'missing',
    'a row with no history anywhere stays blank rather than estimating $0');
});
t('a carried figure typed into the new year beats the year before it', () => {
  const c = projectNextYear(fixtureState(),
    [{ id: 'internet', name: 'Internet', role: 'normal', rule: 'carry' }],
    { 'internet|2031-02': { v: -65, kind: 'manual' } })['2031'];
  approx(c.cells['internet|2031-01'].v, -50, 'before the new figure, the old one');
  approx(c.cells['internet|2031-03'].v, -65, 'after it, the new one');
});
t('average so far falls back to last year while the new year has no months', () => {
  const c = projectNextYear(fixtureState(), [
    { id: 'cc', name: 'Credit Card', role: 'normal', rule: 'avg' },
    { id: 'newrow', name: 'Never recorded', role: 'normal', rule: 'avg' },
  ])['2031'];
  // 2030's six resolved months: -900, -1100, -1000, -1000, -1234, -1058.50
  approx(c.cells['cc|2031-01'].v, -1048.75, 'the mean of everything 2030 held');
  approx(c.cells['cc|2031-09'].v, -1048.75, 'steady until a real month lands');
  eq(c.cells['newrow|2031-03'].kind, 'missing', 'nothing to average anywhere: blank');
});
t('one month typed into the projected year takes the average back over', () => {
  const c = projectNextYear(fixtureState(),
    [{ id: 'cc', name: 'Credit Card', role: 'normal', rule: 'avg' }],
    { 'cc|2031-01': { v: -600, kind: 'manual' } })['2031'];
  approx(c.cells['cc|2031-02'].v, -600,
    'back to meaning "the months so far", exactly as it does mid-year');
});
t('a cycle bill keeps its beat across the year boundary', () => {
  const water = { id: 'water', name: 'Water', role: 'normal',
    rule: 'quarterly', section: 'expense' };
  const s = fixtureState();
  s.years['2030'].categories.push({ ...water });
  s.years['2030'].cells['water|2030-03'] = { v: -56, kind: 'actual' };
  const c = projectNextYear(s, [{ ...water }])['2031'];
  eq(c.cells['water|2031-01'].kind, 'missing', 'off the beat: blank');
  approx(c.cells['water|2031-03'].v, -56, 'the Mar/Jun/Sep/Dec beat carries on');
  approx(c.cells['water|2031-12'].v, -56);
  eq(c.cells['water|2031-11'].kind, 'missing');
});
t('an annual bill lands in the same month a year later, not in January', () => {
  const domain = { id: 'domain', name: 'Domain renewal', role: 'normal',
    rule: 'quarterly', every: 12, section: 'expense' };
  const s = fixtureState();
  s.years['2030'].categories.push({ ...domain });
  s.years['2030'].cells['domain|2030-02'] = { v: -18, kind: 'actual' };
  const c = projectNextYear(s, [{ ...domain }])['2031'];
  eq(c.cells['domain|2031-01'].kind, 'missing');
  approx(c.cells['domain|2031-02'].v, -18, 'February again — the anchor is a month');
  eq(c.cells['domain|2031-03'].kind, 'missing');
});
t('a projected year inherits last year’s paycheck pattern, not a flat two', () => {
  /* 2030 is paid 2, 2, 3, 2, 3.5, 2. Assuming two every month would quietly
     drop a fortnight's pay out of every year built ahead. */
  const all = projectNextYear(fixtureState(), PAYROW());
  eq(all['2031'].paychecks['2031-03'], 3, 'March had three last year, so it does again');
  eq(all['2031'].paychecks['2031-05'], 3.5);
  eq(all['2031'].paychecks['2031-09'], 2, 'a month last year never reached: two');
  approx(all['2031'].cells['paycheck|2031-05'].v, 3500);
  approx(all['2031'].cells['paycheck|2031-09'].v, 2000);
});
t('a paycheck count typed into the projected year wins', () => {
  const all = projectNextYear(fixtureState(), PAYROW(), null, { '2031-05': 2 });
  eq(all['2031'].paychecks['2031-05'], 2, 'the three-check month moved, and you said so');
  approx(all['2031'].cells['paycheck|2031-05'].v, 2000);
});
t('a first year with nothing behind it assumes two a month', () => {
  /* The fresh-start case: no history to read, so the old default stands. */
  const s = fixtureState();
  delete s.years['2029'];
  s.years['2030'].paychecks = {};
  const c = H.computeAll(H.coerceShape(s), TODAY_FIX)['2030'];
  eq(c.paychecks['2030-04'], 2);
  approx(c.cells['paycheck|2030-04'].v, 2000);
});
t('a second year ahead keeps the pattern rather than resetting to two', () => {
  const s = fixtureState();
  projectNextYear(s, PAYROW());
  s.years['2032'] = {
    kind: 'grid', model: 'live', startMonth: '2032-01', monthCount: 12,
    enteredThrough: '2031-12',
    categories: PAYROW(), cells: {}, paychecks: {}, seeds: {}, overrides: {}
  };
  const c = H.computeAll(H.coerceShape(s), TODAY_FIX)['2032'];
  eq(c.paychecks['2032-05'], 3.5, 'read through 2031, which read it from 2030');
  approx(c.cells['paycheck|2032-05'].v, 3500);
});
t('a second year built ahead fills in off the projection behind it', () => {
  /* 2032's only history is 2031, which is nothing but estimates. Reading them
     is what stops the far year going blank, and it can't drift: the mean of a
     year of one mean is that mean. */
  const s = fixtureState();
  const cats = () => [
    { id: 'internet', name: 'Internet', role: 'normal', rule: 'carry' },
    { id: 'cc', name: 'Credit Card', role: 'normal', rule: 'avg' },
  ];
  projectNextYear(s, cats());
  s.years['2032'] = {
    kind: 'grid', model: 'live', startMonth: '2032-01', monthCount: 12,
    enteredThrough: '2031-12',
    categories: cats(), cells: {}, paychecks: {}, seeds: {}, overrides: {}
  };
  const c = H.computeAll(H.coerceShape(s), TODAY_FIX)['2032'];
  approx(c.cells['internet|2032-06'].v, -50);
  approx(c.cells['cc|2032-06'].v, -1048.75);
});
t('same-month-last-year reaches into the prior year and rounds', () => {
  const s = H.coerceShape(fixtureState());
  s.years['2030'].monthCount = 12;   // reach October, 12 months after 2029-10
  const c = H.computeAll(s, TODAY_FIX)['2030'];
  eq(c.cells['electric|2030-10'].kind, 'auto');
  approx(c.cells['electric|2030-10'].v, -80, 'ROUND(-80.4, 0)');
  eq(c.cells['electric|2030-05'].kind, 'missing', 'no May 2029 to copy — stays blank');
});
t('a blank month inside the entered range counts as zero and is flagged', () => {
  const c = computeFixture()['2030'];
  eq(c.cells['dividends|2030-02'].kind, 'missing');
  approx(c.cells['dividends|2030-02'].v, 0);
});
t('dividends read last month’s cash + mid balances at rate/12', () => {
  const c = computeFixture()['2030'];
  // March balances: cash = 10000+2000+2000-900-1100-50-500 (midt) +3000-1000 = 13450
  //                 mid  = 1000 + 500 = 1500
  approx(c.balances['cash|2030-03'], 13450);
  approx(c.balances['mid|2030-03'], 1500);
  approx(c.cells['dividends|2030-04'].v, H.round2(0.03 / 12 * (12345 + 1500)) ,
    'April divs read the PINNED April cash? No — March', 100);
  approx(c.cells['dividends|2030-04'].v, H.round2(0.03 / 12 * (13450 + 1500)));
});

group('Formula engine — balances');
t('the four-account chain matches the spreadsheet formulas', () => {
  const c = computeFixture()['2030'];
  approx(c.balances['bank|2030-04'], 325, 'bank + zelle');
  approx(c.balances['mid|2030-02'], 1500, 'mid grows by the negative transfer');
  // long April: (long Mar − 0) × (1 + .07/12) + charitable(-60)
  const longMar = c.balances['long|2030-03'];
  approx(c.balances['long|2030-04'], H.round2(longMar * (1 + 0.07 / 12) - 60), '', 0.02);
});
t('the earliest year still opens at its seeds, with no year behind it', () => {
  /* Nothing sits before the oldest grid year, so its seeds are the only
     opening balances it has — a workbook of one year is every fresh import. */
  const s = fixtureState();
  delete s.years['2029'];
  const c = H.computeAll(H.coerceShape(s), TODAY_FIX)['2030'];
  const both = computeFixture()['2030'];
  approx(c.balances['bank|2030-01'], 300, 'seeded, not zero');
  approx(c.balances['mid|2030-02'], 1500, 'and the chain carries on from there');
  approx(c.balances['cash|2030-01'], both.balances['cash|2030-01'],
    'the year behind it never fed this one anyway — dropping it changes nothing');
});
t('a balance override pins that month and later months chain from it', () => {
  const c = computeFixture()['2030'];
  approx(c.balances['cash|2030-04'], 12345, 'pinned');
  eq(c.balanceKinds['cash|2030-04'], 'pinned');
  const aprFlows = c.cells['paycheck|2030-05'].v + c.cells['dividends|2030-05'].v
    + c.cells['cc|2030-05'].v + c.cells['internet|2030-05'].v;
  approx(c.balances['cash|2030-05'], H.round2(12345 + aprFlows), 'May chains from the pin', 0.02);
});
t('a balance is an actual once its month is entered, not once the date passes', () => {
  /* The fixture is entered through March and TODAY_FIX sits in April, so April
     is the case that matters: part-lived, every category cell in it still an
     estimate, and the balance chained off them an estimate too. */
  const c = computeFixture()['2030'];
  eq(c.balanceKinds['mid|2030-03'], 'actual', 'March is entered');
  eq(c.balanceKinds['total|2030-03'], 'actual');

group('Accounts');
t('the legacy roles compute identically to the fixed four-account chain', () => {
  /* The engine used to hard-code cash/mid/long/bank and five role names. It
     iterates a list now — this pins that the defaults still produce exactly
     the old numbers, including the one asymmetry that matters: a bank
     pass-through lands BEFORE that account's growth, a charitable payment
     AFTER it. */
  const s = H.coerceShape(fixtureState());
  const c = H.computeAll(s, TODAY_FIX)['2030'];
  const yr = s.years['2030'];
  const rate = (id) => s.settings.accounts.find(a => a.id === id).rate;
  const priorOf = (id, m) => c.balances[`${id}|${H.monthAdd(m, -1)}`] ?? (yr.seeds[id] || 0);
  const flowsAt = (m) => {
    const f = { all: 0, mid: 0, long: 0, bank: 0, zelle: 0, char: 0 };
    for (const cat of yr.categories) {
      const v = c.cells[`${cat.id}|${m}`].v;
      if (cat.id === 'char') { f.char += v; continue; }
      if (cat.id === 'zelle') { f.zelle += v; continue; }
      f.all += v;
      if (cat.id === 'midt') f.mid += v;
      if (cat.id === 'longt') f.long += v;
      if (cat.id === 'bankt') f.bank += v;
    }
    return f;
  };
  for (const m of ['2030-02', '2030-03', '2030-05', '2030-06']) {
    const f = flowsAt(m);
    const g = (id) => 1 + rate(id) / 12;
    approx(c.balances[`cash|${m}`], H.round2(priorOf('cash', m) * g('cash') + f.all),
      `cash ${m}`, 0.02);
    approx(c.balances[`mid|${m}`], H.round2((priorOf('mid', m) - f.mid) * g('mid')),
      `mid ${m}`, 0.02);
    approx(c.balances[`long|${m}`],
      H.round2((priorOf('long', m) - f.long) * g('long') + f.char), `long ${m}`, 0.02);
    approx(c.balances[`bank|${m}`],
      H.round2((priorOf('bank', m) - f.bank + f.zelle) * g('bank')), `bank ${m}`, 0.02);
  }
});

  s.years['2030'].balAdjust['long|2030-02'] = { interest: 0, dividend: 100 };
  const c = H.computeAll(s, TODAY_FIX)['2030'];
  const earned = H.round2(c.balances['long|2030-01'] * 0.07 / 12);
  approx(c.balances['long|2030-02'], H.round2(plain - earned + 100), '', 0.02);
  approx(c.interest['long|2030-02'], 0, 'the override is what the editor shows');
  approx(c.dividend['long|2030-02'], 100, 'and so is the dividend one');

t('a corrected interest or dividend lands in the account it is paid into', () => {
  /* What a correction is FOR: the money moves, so the balance it moves into
     has to move with it — on the account itself when it keeps its earnings,
     and on the far account when they are swept there. Nothing may pin the
     month in place; a pinned balance would swallow the correction whole. */
  const sweep = () => {
    const s = H.coerceShape(fixtureState());
    const long = s.settings.accounts.find(a => a.id === 'long');
    long.creditTo = 'bank'; long.divRate = 0.04; long.divTo = 'bank'; long.divEvery = 1;
    return s;
  };
  const bare = H.computeAll(sweep(), TODAY_FIX)['2030'];
  const s = sweep();
  s.years['2030'].balAdjust['long|2030-02'] = { interest: 500, dividend: 900 };
  const c = H.computeAll(s, TODAY_FIX)['2030'];
  const extra = (500 - bare.interest['long|2030-02']) + (900 - bare.dividend['long|2030-02']);
  approx(c.balances['bank|2030-02'] - bare.balances['bank|2030-02'], extra,
    'the far account gains exactly what the correction added', 0.02);
  approx(c.balances['bank|2030-03'] - bare.balances['bank|2030-03'], extra,
    'and every later month carries it', 0.02);
  approx(c.balances['long|2030-02'], bare.balances['long|2030-02'],
    'the paying account is untouched — it earned it, it just did not keep it', 0.02);
  /* the same correction, kept at home */
  const home = H.coerceShape(fixtureState());
  home.settings.accounts.find(a => a.id === 'mid').rate = 0.12;
  const grown = H.computeAll(home, TODAY_FIX)['2030'];
  home.years['2030'].balAdjust['mid|2030-02'] = { interest: 40 };
  const fixed = H.computeAll(home, TODAY_FIX)['2030'];
  approx(fixed.balances['mid|2030-02'],
    H.round2(grown.balances['mid|2030-02'] - grown.interest['mid|2030-02'] + 40),
    'an account that keeps its interest shows the corrected figure', 0.02);

/* ── Two earners ────────────────────────────────────────────────────────────
   The 401(k) elective-deferral limit is PER PERSON; the Roth MAGI check is per
   HOUSEHOLD and depends on how you file. Two opposite scopings, which is why
   the limits record grew a `by` map rather than being reshaped. The pin that
   matters most is the first one: a single-earner plan's answers must not have
   moved a penny. */
group('Two earners');
/* `limitsFor` reads the app's live state, so these swap it IN MEMORY and put
   it back afterwards. Nothing calls save(), so localStorage is never written —
   the suite stays read-only, which matters because the iframe is a real
   session pointed at the reader's own data. */
function withState(patch, fn) {
  const s = w.finGet();
  const keep = { people: s.people, side: s.side, settings: s.settings };
  try {
    const d = H.coerceShape(JSON.parse(JSON.stringify(patch)));
    s.people = d.people;
    s.side = d.side;
    s.settings = Object.assign({}, keep.settings, d.settings);
    return fn();
  } finally {
    s.people = keep.people; s.side = keep.side; s.settings = keep.settings;
  }
}
const EARNERS = {
  people: [{ id: 'sam', name: 'Sam', role: 'adult' },
           { id: 'robin', name: 'Robin', role: 'adult' },
           { id: 'ellis', name: 'Ellis', role: 'child' }],
  side: { comp: { '2030': { salary: 100000, raisePct: 0 } },
          bonuses: { '2030': 10000 },
          limits: { '2030': { pretaxPct: 0.1, bonusPct: 0.1, hsaPretax: 4000,
                              k401Limit: 23000, magiLimit: 200000, magiPhaseOut: 10000,
                              by: { robin: { salary: 60000, bonus: 0, pretaxPct: 0.05,
                                             bonusPct: 0, hsaPretax: 0 } } } } }
};
t('limitsFor with one argument is exactly what it always was', () => {
  /* The non-regression pin. A plan with no household and no `by` must get the
     same object out of the same call. */
  withState({ people: [], side: { comp: { '2030': { salary: 100000, raisePct: 0 } },
    bonuses: { '2030': 10000 },
    limits: { '2030': { pretaxPct: 0.1, bonusPct: 0.1, hsaPretax: 4000 } } } }, () => {
    const L = H.limitsFor('2030');
    eq(L.salary, 100000, 'still borrows the comp salary');
    eq(L.bonus, 10000, 'still borrows the bonus');
    approx(L.pretaxPct, 0.1);
    eq(L.hsaPretax, 4000);
    eq(L.k401Limit, 24500, 'and still falls back to the built-in limit');
  });
});
t('the flat record belongs to the person the Comp tab is about', () => {
  /* Naming your household must not empty a calculator you had filled in. */
  withState(EARNERS, () => {
    const flat = H.limitsFor('2030');
    const sam = H.limitsFor('2030', 'sam');
    eq(sam.salary, flat.salary, 'Sam inherits the figures typed before there was a household');
    eq(sam.bonus, flat.bonus);
    approx(sam.pretaxPct, flat.pretaxPct);
  });
});
t('a second earner reads their own figures, and borrows nobody else’s salary', () => {
  withState(EARNERS, () => {
    const robin = H.limitsFor('2030', 'robin');
    eq(robin.salary, 60000, 'their own, not the Comp tab’s');
    eq(robin.bonus, 0, 'and not the household bonus either');
    approx(robin.pretaxPct, 0.05);
  });
});
t('the year’s limits are shared, because they are a fact about the year', () => {
  withState(EARNERS, () => {
    for (const id of [undefined, 'sam', 'robin']) {
      const L = H.limitsFor('2030', id);

      eq(L.magiLimit, 200000);

    }

});
t('swapping the state back leaves the reader’s own plan untouched', () => {
  /* The guard on the guard: these tests run inside a real session. */
  const before = JSON.stringify(w.finGet().people);

});

               'pay2|2030-01': { v: 2000, kind: 'actual' }, 'pay2|2030-02': { v: 2000, kind: 'actual' },
               'rent|2030-01': { v: -1500, kind: 'actual' } } } } });
  const c = H.computeAll(s, '2030-02-15')['2030'];

  eq(H.takeHomePay(s, c, '2030', 'sam'), 6000);

t('filing status names itself and never sets a threshold', () => {
  eq(H.FILING_LABEL.single, 'single filer');

/* ── Restoring a backup ─────────────────────────────────────────────────────
   The one failure mode of putting people at the top level is that a merge site
   forgets them and a restore silently drops the household. `load()`, the
   Restore button and the cloud adopt all merge the same way — name `settings`,
   `side` and `ui` (which need their defaults filling in) and let everything
   else ride through the spread. This reproduces that merge exactly, so if
   anyone ever adds `people` to the wrong side of it, this fails. */
group('A restored file keeps the household');
const restoreMerge = (incoming) => {
  const parsed = H.migrate(H.coerceShape(incoming));
  return Object.assign(H.blankState(), parsed, {
    settings: Object.assign(H.blankState().settings, parsed.settings || {}),
    side: Object.assign(H.blankState().side, parsed.side || {}),
    ui: Object.assign(H.blankState().ui, parsed.ui || {})
  });
};
t('people, owners and tags all survive the round trip', () => {
  const s = restoreMerge({
    schema: 4,
    people: [{ id: 'sam', name: 'Sam', role: 'adult', birth: '1986-04', retireAge: 65 },
             { id: 'ellis', name: 'Ellis', role: 'child', birth: '2015-09' }],
    settings: { accounts: [{ id: 'cash', name: 'Cash', hub: true, owner: 'joint' },
                           { id: 'mid', name: 'Savings', owner: 'ellis' }] },
    goals: [{ id: 'g', name: 'College', accounts: ['mid'], count: 'capped', for: 'ellis' }],
    years: { '2026': { kind: 'grid', startMonth: '2026-01', monthCount: 12 } }
  });
  eq(s.people.length, 2, 'the household came back');
  eq(s.people[1].birth, '2015-09');
  eq(s.settings.accounts.find(a => a.id === 'mid').owner, 'ellis', 'and so did the owners');
  eq(s.goals[0].for, 'ellis');
});
t('a file with no household comes back with an empty one, not undefined', () => {
  /* `undefined` here is what would make `peopleOf` throw further down. */
  const s = restoreMerge({ years: { '2026': { kind: 'grid', startMonth: '2026-01' } } });
  eq(Array.isArray(s.people), true);
  eq(s.people.length, 0);
});
t('an empty copy still counts a household as data', () => {
  /* finHasData decides the first-sign-in "which copy?" dialog. Someone who has
     named their family and nothing else must not be treated as empty. */
  ok(w.finHasData({ people: [{ id: 'sam', name: 'Sam' }] }),
     'a plan that is only a household is not an empty one');
  ok(!w.finHasData({ people: [], years: {}, goals: [] }));
  eq(w.finCounts({ people: [{ id: 'a' }, { id: 'b' }] }).people, 2);
});

group('The imported free-form rows are gone');
t('the archive keys are dropped on load, so a backup stops carrying them', () => {
  const d = H.coerceShape({ side: {
    retirement: { '2025': [['401k', '12000']] },
    rothLimit: { '2025': [['MAGI', '150000']] },
    donations: { '2025': [{ foundation: 'x', cash: 100 }] } } });
  eq('retirement' in d.side, false);
  eq('rothLimit' in d.side, false);
  ok(!/"retirement":|"rothLimit":/.test(JSON.stringify(d)), 'nowhere in an export');
});
t('the retirement data that matters is untouched', () => {
  /* `retirementAccounts` is the real list and reads nothing like the archive
     key it sits beside — worth pinning that the cull took the right one. */
  const d = H.coerceShape({ side: {
    retirement: { '2025': [['junk']] },
    retirementAccounts: [{ id: 'r1', name: '401k', kind: 'traditional', balance: 1000 }],
    limits: { '2025': { salary: 100000 } } } });
  eq(d.side.retirementAccounts.length, 1);
  eq(d.side.retirementAccounts[0].name, '401k');
  eq(Object.keys(d.side.limits), ['2025']);
});

group('Sections stay as you left them');
t('a section you opened is remembered, and one you closed is forgotten', () => {
  eq(H.withSection(null, 'notes', true), '["notes"]');
  eq(H.withSection('["notes"]', 'imported', true), '["notes","imported"]');
  eq(H.withSection('["notes","imported"]', 'notes', false), '["imported"]');
  eq(H.withSection('["notes"]', 'notes', false), '[]');
});
t('opening the same section twice records it once', () => {
  eq(H.withSection('["notes"]', 'notes', true), '["notes"]');
});
t('closing one that was never open is not an error', () => {
  eq(H.withSection('[]', 'notes', false), '[]');
});
t('a corrupt setting leaves everything closed rather than throwing', () => {
  /* It is written by the page but read back from storage another tab, an
     extension or a stray hand could have touched. Drawing the page must not
     depend on it being well formed. */
  for (const junk of ['not json', '{"notes":true}', 'null', '5', '""'])
    eq([...H.parseOpen(junk)], [], junk);
  eq([...H.parseOpen('["notes",5,{"x":1},"imported"]')], ['notes', 'imported'],
    'and a list part rubbish keeps only the names');
  eq([...H.parseOpen(null)], []);
});

group('The order of the tabs');
t('an arrangement is kept, and anything missing is added on the end', () => {
  eq(H.tabOrder({ tabOrder: ['history', 'giving'] }).slice(0, 2), ['history', 'giving']);
  eq(H.tabOrder({ tabOrder: ['history', 'giving'] }).length, H.VIEWS.length,
    'a tab left out of a stored order still appears');
  eq(new Set(H.tabOrder({ tabOrder: ['history'] })).size, H.VIEWS.length, 'each exactly once');
});
t('rubbish in a stored order is ignored rather than drawn', () => {
  eq(H.tabOrder({ tabOrder: ['nope', 'budget', 'budget', 42, null] })[0], 'budget');
  eq(H.tabOrder({ tabOrder: ['nope'] }), H.VIEWS, 'nothing usable falls back to the default');
  eq(H.tabOrder({}), H.VIEWS);
  eq(H.tabOrder(undefined), H.VIEWS);
  eq(H.tabOrder({ tabOrder: 'budget,goals' }), H.VIEWS, 'a string is not an order');
});
t('normalising an order is settled in one pass', () => {
  const once = H.tabOrder({ tabOrder: ['giving', 'nope', 'giving'] });
  eq(H.tabOrder({ tabOrder: once }), once);
});
t('an order saved before the Household tab existed picks it up', () => {
  /* The real upgrade path: someone who had dragged their tabs before this
     version shipped. No migration writes it — tabOrder appends it. */
  const before = ['budget', 'goals', 'retirement', 'comp', 'investments',
                  'vacations', 'giving', 'history'];
  const after = H.tabOrder({ tabOrder: before });
  ok(after.includes('household'), 'the new tab turns up');
  eq(after.slice(0, 2), ['budget', 'goals'], 'and the arrangement is kept');
});
t('coerceShape survives a full payload without throwing', () => {
  /* It runs inside `let state = load()`, whose catch turns ANY throw into a
     blank state — the workbook silently comes up empty. A helper it calls that
     is declared later in the file does exactly that, so this pins that the
     whole pass completes. */
  const d = H.coerceShape({ ui: { tabOrder: ['history'] },
    years: { '2026': { kind: 'grid', model: 'live', startMonth: '2026-01', monthCount: 12,
      categories: [{ id: 'r', name: 'Rent' }], cells: { 'r|2026-01': { v: -100 } } } },
    side: { donations: { '2026': [{ foundation: 'x', cash: -5 }] } } });
  eq(Object.keys(d.years), ['2026'], 'the year is still there');
  eq(d.ui.tabOrder[0], 'history', 'and the order came through');
});

group('Donations and the giving fund');
t('an emptied year is not a year', () => {
  /* An emptied bucket drew a whole card with a $0 summary and no rows — what
     was left behind when a donation moved to the year its date fell in. */
  const d = H.coerceShape({ side: { donations: {
    '2026': [{ foundation: 'Cradle Beach', grant: -1000 }],
    '2025': [] } } });
  eq(Object.keys(d.side.donations), ['2026']);
});
t('a bucket that is not a list becomes one rather than breaking the page', () => {
  const d = H.coerceShape({ side: { donations: { '2026': 'rubbish', '2025': null } } });
  eq(d.side.donations, {}, 'and empties itself out of existence');
});
t('a planned donation is stored as one and keeps its flag', () => {
  const d = H.coerceShape({ side: { donations: { '2026': [
    { foundation: 'Pets Alive WNY', grant: -1000, pending: true },
    { foundation: 'Cradle Beach', grant: -1000 }] } } });
  eq(d.side.donations['2026'][0].pending, true);
  eq(d.side.donations['2026'][1].pending, undefined, 'absent means it has happened');
});
t('the giving fund shows itself only where there is one', () => {
  /* Decided once from the data, like the paycheck rule: nobody who has a fund
     has to find the switch, and nobody who hasn't is shown a section on one. */
  const on = (side) => H.coerceShape({ side }).settings.givingFund;
  eq(on({ daf: [{ name: 'VOO', shares: 5 }], donations: {} }), true, 'a holding in it');
  eq(on({ daf: [], donations: { '2026': [{ foundation: 'x', grant: -1000 }] } }), true,
    'a grant out of it');
  eq(on({ daf: [], donations: { '2026': [{ foundation: 'x', funding: 5000 }] } }), true,
    'a deposit into it');
  eq(on({ daf: [], donations: { '2026': [{ foundation: 'x', cash: -50 }] } }), false,
    'cash gifts alone are not a fund');
  eq(on({ daf: [], donations: {} }), false);
});
t('a choice already made is never overruled', () => {
  const off = H.coerceShape({ settings: { givingFund: false },
    side: { daf: [{ name: 'VOO', shares: 5 }], donations: {} } });
  eq(off.settings.givingFund, false, 'turned off despite holding one');
  const on = H.coerceShape({ settings: { givingFund: true }, side: { daf: [], donations: {} } });
  eq(on.settings.givingFund, true, 'turned on before there is anything in it');
});

group('Giving as a share of income');
t('a grant out of the fund is not counted a second time', () => {
  /* The dollar was given the day it went INTO the fund. Adding the grant that
     later takes it out to a cause would double every percentage on the tab. */
  eq(H.givenOutOfPocket([
    { foundation: 'Fidelity Charitable', funding: 5000 },
    { foundation: 'Cradle Beach', grant: -1000 },
    { foundation: 'Pets Alive', grant: -2000 },
  ]), 5000);
});
t('a cash gift counts whichever sign it was typed with', () => {
  /* Real backups hold both: +1000 one year, −1000 the next. */
  eq(H.givenOutOfPocket([{ cash: 1000 }, { cash: -500 }]), 1500);
});
t('a donation you have only planned is not money given', () => {
  eq(H.givenOutOfPocket([
    { cash: -100 }, { cash: -900, pending: true }]), 100);
});
t('gross income is the salary after the raise plus the bonus', () => {
  const st = { side: { comp: { '2026': { salary: 100000, raisePct: 0.03 } },
    bonuses: { '2026': 10000 } }, years: {} };
  eq(H.grossIncome(st, '2026'), 113000);
  eq(H.grossIncome(st, '2025'), null, 'no comp record, no denominator');
});
t('a year with a bonus but no salary has no gross to measure against', () => {
  /* The bonus alone would be a nonsense denominator and would report giving
     as a preposterous share of income. A dash says more. */
  const st = { side: { comp: {}, bonuses: { '2026': 10000 } }, years: {} };
  eq(H.grossIncome(st, '2026'), null);
});
t('take-home is the pay rows only', () => {
  /* A tax refund and a dividend are money in, but they are not pay — folding
     them in would understate every percentage measured against them. */
  const st = { side: {}, years: { '2026': { kind: 'grid', categories: [
    { id: 'paycheck', name: 'Paycheck', rule: 'paycheck', section: 'income' },
    { id: 'tax-return', name: 'Tax Return', rule: 'none', section: 'income' },
    { id: 'dividends', name: 'Dividends', rule: 'none', section: 'income' },
  ], cells: {
    'paycheck|2026-01': { v: 3000 }, 'paycheck|2026-02': { v: 3000 },
    'tax-return|2026-04': { v: 2000 }, 'dividends|2026-03': { v: 50 },
  } } } };
  eq(H.takeHomePay(st, null, '2026'), 6000);
});
t('a row named like pay qualifies without carrying the paycheck rule', () => {
  /* Every history year's rows have rule "none" — the name is all there is. */
  const st = { side: {}, years: { '2025': { kind: 'grid', categories: [
    { id: 'paycheck', name: 'Paycheck', rule: 'none', section: 'income' },
  ], cells: { 'paycheck|2025-01': { v: 4000 } } } } };
  eq(H.takeHomePay(st, null, '2025'), 4000);
});
t('a year with nothing that looks like pay says so rather than reading zero', () => {
  const st = { side: {}, years: { '2026': { kind: 'grid',
    categories: [{ id: 'other', name: 'Other', rule: 'none', section: 'income' }],
    cells: { 'other|2026-01': { v: 900 } } } } };
  eq(H.takeHomePay(st, null, '2026'), null);
});
t('take-home reads the COMPUTED cells, so a year still running counts its projection', () => {
  /* Reading only what is typed in would divide a year of giving by two months
     of pay, and report a share of income several times the truth. */
  const st = { side: {}, years: { '2026': { kind: 'grid', categories: [
    { id: 'paycheck', name: 'Paycheck', rule: 'paycheck', section: 'income' },
  ], cells: { 'paycheck|2026-01': { v: 3000 } } } } };
  const computed = { cells: {
    'paycheck|2026-01': { v: 3000 }, 'paycheck|2026-02': { v: 3000 },
    'paycheck|2026-03': { v: 3000 } } };
  eq(H.takeHomePay(st, computed, '2026'), 9000);
});
t('a summary year adds up its pay rows, balances left out', () => {
  const st = { side: {}, years: { '2019': { kind: 'summary', categoryTotals: [
    { name: 'Paycheck', total: 48000 },
    { name: 'Giving', total: -500 },
    { name: 'Savings', total: 1000, isBalance: true },
  ] } } };
  eq(H.takeHomePay(st, null, '2019'), 48000);
});
t('the two percentages, and a dash where there is nothing to divide by', () => {
  const st = {
    side: {
      comp: { '2026': { salary: 100000, raisePct: 0 } },
      bonuses: {},
      donations: {
        '2025': [{ foundation: 'a', cash: -1000 }],
        '2026': [{ foundation: 'b', cash: -2000 }],
      },
    },
    years: { '2026': { kind: 'grid', categories: [
      { id: 'paycheck', name: 'Paycheck', rule: 'paycheck', section: 'income' },
    ], cells: { 'paycheck|2026-01': { v: 50000 } } } },
  };
  const stats = H.givingStats(st, {});
  eq(stats.map(s => s.y), ['2025', '2026'], 'oldest first');
  eq(stats[0].grossPct, null, '2025 has no comp record');
  eq(stats[0].takePct, null, 'and no year in the workbook at all');
  eq(stats[1].given, 2000);
  eq(stats[1].grossPct, 0.02);
  eq(stats[1].takePct, 0.04);
});
t('a year with no donations in it is not on the chart', () => {
  const st = { side: { comp: {}, bonuses: {},
    donations: { '2025': [{ cash: -100 }], '2026': [] } }, years: {} };
  eq(H.givingStats(st, {}).map(s => s.y), ['2025']);
});
t('every meter is drawn against one ceiling', () => {
  /* Otherwise each year's bar is full and no two of them compare. */
  eq(H.givingCeiling([{ grossPct: 0.021, takePct: 0.044 },
    { grossPct: 0.031, takePct: 0.067 }]), 0.07, 'rounded up to a whole percent');
  eq(H.givingCeiling([{ grossPct: 0.004, takePct: 0.009 }]), 0.05,
    'and never so small that modest giving fills the bar');
  eq(H.givingCeiling([{ grossPct: null, takePct: null }]), 0.05,
    'nothing to scale to');
});

group('A month with a note is marked as one');
t('a note on a split amount earns the dot, same as a note on the cell', () => {
  /* The reported bug: annotating one of the amounts and nothing else left the
     grid showing no dot at all, so the note was invisible until you happened
     to open that cell. */
  ok(H.hasNote({ v: 700, parts: [{ v: 700, note: 'Rich - MBAir' }] }),
    'one part, noted, no note on the cell itself');
  ok(H.hasNote({ v: -60, parts: [{ v: -30, note: 'part one' }, { v: -30 }] }),
    'one of several parts');
  ok(H.hasNote({ v: -50, note: 'a main note' }), 'the cell’s own note still counts');
  ok(H.hasNote({ v: -50, note: 'both', parts: [{ v: -50, note: 'and a part' }] }));
});
t('a month with nothing written on it is not marked', () => {
  eq(H.hasNote({ v: -70, parts: [{ v: -70 }] }), false, 'split, but nothing said');
  eq(H.hasNote({ v: -70 }), false);
  eq(H.hasNote({ v: -70, note: '' }), false, 'an empty note is not a note');
  eq(H.hasNote(undefined), false, 'a month with no cell at all');
});

group('A year’s notes, gathered');
function notesState() {
  return H.coerceShape({
    settings: { accounts: [{ id: 'cash', name: 'Cash (SPAXX)', hub: true }] },
    years: {
      '2030': { kind: 'grid', model: 'live', startMonth: '2030-01', monthCount: 12,
        enteredThrough: '2030-12',
        categories: [{ id: 'rent', name: 'Rent', note: 'renews in June' },
                     { id: 'food', name: 'Food' }],
        cells: {
          'rent|2030-03': { v: -900, kind: 'actual', note: 'escrow shortage' },
          'food|2030-02': { v: -300, kind: 'actual' },          // no note
          'food|2030-05': { v: -250, kind: 'mixed', note: 'two shops',
            parts: [{ v: -150, kind: 'actual', note: 'weekly' },
                    { v: -100, kind: 'actual' }] },             // one part noted
        },
        paychecks: {}, seeds: {},
        overrides: { 'cash|2030-01': { v: 500, note: 'off the statement' } } },
      '2031': { kind: 'grid', model: 'live', startMonth: '2031-01', monthCount: 12,
        categories: [{ id: 'rent', name: 'Rent' }], cells: { 'rent|2031-01': { v: -900 } },
        paychecks: {}, seeds: {}, overrides: {} },
      '2029': { kind: 'summary', categoryTotals: [
        { name: 'Income', total: 30000, note: 'the raise landed late' },
        { name: 'Rent', total: -9000 }],
        extraNotes: [{ where: '2029!Rent', note: 'from the old sheet' }] },
    } });
}
t('every kind of note is collected', () => {
  const n = H.notesOfYear(notesState(), '2030');
  eq(n.map(x => x.where), ['Rent', 'Cash (SPAXX)', 'Rent', 'Food', 'Food'],
    'the row or account it is on — the account named, not its id');
  eq(n.map(x => x.m), [undefined, '2030-01', '2030-03', '2030-05', '2030-05'],
    'a row note belongs to no month and leads; the rest are chronological');
  eq(n.map(x => x.note), ['renews in June', 'off the statement', 'escrow shortage',
    'two shops', 'weekly']);
});
t('the month and the split amount are kept off the label', () => {
  /* They are rendered by the month heading and a suffix, so the collector
     hands them over separately rather than baked into one string. */
  const n = H.notesOfYear(notesState(), '2030');
  const part = n.find(x => x.note === 'weekly');
  eq(part.extra, '-$150.00', 'the split amount says which part of the month');
  eq(n.find(x => x.note === 'escrow shortage').extra, undefined,
    'a whole-cell note has no amount to add');
  ok(!n.some(x => /30$|Jan|Mar|May/.test(x.where)), 'no month in any label');
});
t('a cell or part without a note contributes nothing', () => {
  const n = H.notesOfYear(notesState(), '2030');
  ok(!n.some(x => x.m === '2030-02'), 'the unnoted February cell is absent');
  ok(!n.some(x => x.extra === '-$100.00'), 'and so is the unnoted part');
});
t('a year with no notes gathers nothing, so the section is not drawn', () => {
  eq(H.notesOfYear(notesState(), '2031'), []);
});
t('a summary year gathers its row notes and its imported ones', () => {
  const n = H.notesOfYear(notesState(), '2029');
  eq(n.map(x => x.where), ['Income', 'Rent'],
    'and the sheet prefix is dropped — the heading already says the year');
  eq(n.map(x => x.note), ['the raise landed late', 'from the old sheet']);
});
t('a year key holding regex metacharacters still gathers notes', () => {
  /* Year keys come out of a restored file and are kept verbatim. The sheet
     prefix on an imported note used to be stripped with a RegExp built from
     the key, so a key like "(" threw mid-render and blanked the Budget tab. */
  const s = H.coerceShape({ years: { '(': { kind: 'summary',
    categoryTotals: [], extraNotes: [{ where: '(!Rent', note: 'kept' },
                                     { where: 'Other', note: 'also kept' }] } } });
  eq(H.notesOfYear(s, '(').map(x => x.where), ['Rent', 'Other'],
    'the prefix is stripped and nothing throws');
});
t('a note knows the cell it belongs to, so it can be opened', () => {
  const n = H.notesOfYear(notesState(), '2030');
  eq(n.find(x => x.note === 'escrow shortage').edit, 'cat');
  eq(n.find(x => x.note === 'escrow shortage').id, 'rent');
  eq(n.find(x => x.note === 'off the statement').edit, 'bal');
  eq(n.find(x => x.note === 'renews in June').edit, 'row');
  const imported = H.notesOfYear(notesState(), '2029')
    .find(x => x.note === 'from the old sheet');
  eq(imported.edit, undefined, 'an imported note has no cell to go back to');
});

group('Which summary rows are money that moved');
/* The shape the old bi-weekly sheets have: detail rows, then a closing block
   of balances and derived totals, with the income line often sitting inside
   that block. Invented figures, real row names. */
const namesOf = (items, flow, want) =>
  items.filter((_, i) => flow[i] === want).map(i => i.name);
t('the closing block of balances is not money that moved', () => {
  const items = [{ name: 'Mortgage', total: -9000 }, { name: 'NYSEG', total: -600 },
    { name: 'Income', total: 30000 }, { name: 'Checking', total: 500 },
    { name: 'Savings', total: 1200 }, { name: 'All Accounts', total: 1700 }];
  const flow = H.summaryRowIsFlow(items);
  eq(namesOf(items, flow, true), ['Mortgage', 'NYSEG', 'Income'],
    'the income line counts — it is the year’s money in');
  eq(namesOf(items, flow, false), ['Checking', 'Savings', 'All Accounts']);
});
t('an income line inside the block does not end it', () => {
  /* 2013's shape: the balances come first, then Expenses, then Income. */
  const items = [{ name: 'Mortgage', total: -9000 }, { name: 'Other', total: 400 },
    { name: 'Checking', total: 340 }, { name: 'Total', total: 665 },
    { name: 'Expenses', total: -30000 }, { name: 'Income', total: 30500 }];
  const flow = H.summaryRowIsFlow(items);
  eq(namesOf(items, flow, true), ['Mortgage', 'Other', 'Income']);
  eq(namesOf(items, flow, false), ['Checking', 'Total', 'Expenses']);
});
t('a derived total never counts, wherever it sits', () => {
  /* It restates rows already counted — including it would double the year. */
  const items = [{ name: 'NYSEG', total: -600 }, { name: 'Fixed Expenses', total: -600 },
    { name: 'Net Income', total: 700 }, { name: 'Monthly', total: 100 }];
  const flow = H.summaryRowIsFlow(items);
  eq(namesOf(items, flow, true), ['NYSEG', 'Net Income']);
});
t('a detail row sharing a balance’s name still counts', () => {
  /* "Savings" and "Cash" appear twice in a year — once as money moved into
     them, once as what they closed at. Only the closing one is the balance. */
  const items = [{ name: 'Cash', total: -700 }, { name: 'Savings', total: 1650 },
    { name: 'Income', total: 31000 }, { name: 'Checking', total: 900 },
    { name: 'Savings', total: 1950 }];
  const flow = H.summaryRowIsFlow(items);
  eq(namesOf(items, flow, true), ['Cash', 'Savings', 'Income']);
  eq(flow[4], false, 'the last Savings is the closing balance');
});
t('any "Total …" row is a closing figure, whatever it was renamed to', () => {
  /* Matching a list of exact names meant renaming "Monthly" to "Total Cash"
     turned it back into a flow and added it to the year's income. */
  for (const name of ['Total', 'Total savings', 'Total online', 'Total Cash',
                      'Total +/- 1 Month']) {
    const items = [{ name: 'Rent', total: -800 }, { name: name, total: 90 }];
    eq(H.summaryRowIsFlow(items), [true, false], name);
  }
});
t('a year with no closing block keeps every row', () => {
  const items = [{ name: 'Rent', total: -1000 }, { name: 'Paycheck', total: 4000 }];
  eq(H.summaryRowIsFlow(items), [true, true]);
});
t('the reclassification runs once and then leaves you alone', () => {
  const year = () => ({ kind: 'summary', categoryTotals: [
    { name: 'Mortgage', total: -9000, isBalance: true },
    { name: 'Checking', total: 500, isBalance: true }] });
  const first = H.migrate(H.coerceShape({ schema: 1, years: { '2015': year() } }));

group('Money in vs money out');

     liquidity climbs faster than the budget rows alone explain. */
  const yr = { kind: 'grid', model: 'live' };

    interest: { 'cash|2030-01': 25.5, 'long|2030-01': 100 },

t('interest that went backwards counts as money out', () => {

group('Past-year balance rows become accounts');
function historyState() {
  const bal = (id, name) => ({ id, name, role: 'normal', rule: 'none', isBalance: true });
  const yr = (start, cats, cells) => ({ kind: 'grid', model: 'pinned',
    startMonth: `${start}-01`, monthCount: 12, categories: cats, cells,
    paychecks: {}, seeds: {}, overrides: {} });
  return { settings: { accounts: [{ id: 'cash', name: 'Cash (SPAXX)', rate: 0, hub: true }] },
    years: {
      '2020': yr(2020, [bal('checking', 'Checking'), bal('brokerage', 'Brokerage')],
        { 'checking|2020-01': { v: 1000, kind: 'actual' },
          'checking|2020-02': { v: 1100, kind: 'actual' },
          'brokerage|2020-12': { v: 5000, kind: 'actual' } }),
      /* the same name a year later — one account, not two */
      '2021': yr(2021, [bal('checking', 'Checking')],
        { 'checking|2021-06': { v: 1200, kind: 'actual' } }),
      /* a row named for an account that already exists folds into it */
      '2022': yr(2022, [bal('cash', 'Cash')],
        { 'cash|2022-03': { v: 2500, kind: 'actual' } }),
    } };
}
t('a balance row becomes an account holding stated balances', () => {
  const d = H.coerceShape(historyState());
  eq(d.years['2020'].categories, [], 'the rows are gone');
  eq(d.years['2020'].cells, {}, 'and so are their cells');
  eq(d.years['2020'].overrides['checking|2020-01'], { v: 1000 });
  eq(d.years['2020'].overrides['brokerage|2020-12'], { v: 5000 });
  ok(d.settings.accounts.some(a => a.id === 'checking' && a.name === 'Checking'));
});
t('one account per name, however many years it spans', () => {
  const d = H.coerceShape(historyState());
  eq(d.settings.accounts.filter(a => a.id === 'checking').length, 1);
  eq(d.years['2021'].overrides['checking|2021-06'], { v: 1200 },
    'the later year states the same account');
});
t('a row named for an account you still have folds into it', () => {
  const d = H.coerceShape(historyState());
  eq(d.settings.accounts.filter(a => a.id === 'cash').length, 1);
  eq(d.years['2022'].overrides['cash|2022-03'], { v: 2500 });
  eq(d.settings.accounts.find(a => a.id === 'cash').until, undefined,
    'and it stays open, because it is an account you still hold');
});
t('an account built from history is closed at its last figure', () => {
  /* Otherwise its closing balance rides forward for ever: a live year opens
     each account on the prior December, and history is all prior Decembers. */
  const d = H.coerceShape(historyState());
  const by = (id) => d.settings.accounts.find(a => a.id === id);
  eq(by('checking').until, '2021-06', 'the last month ANY year states, not the first year’s');
  eq(by('brokerage').until, '2020-12');
});
t('a closed account is left out of a later year entirely', () => {
  const s = H.coerceShape(historyState());
  s.years['2023'] = { kind: 'grid', model: 'live', startMonth: '2023-01', monthCount: 12,
    enteredThrough: '2022-12', categories: [], cells: {}, paychecks: {},
    seeds: {}, overrides: { 'cash|2023-01': { v: 9000 } } };
  const c = H.computeAll(s, '2023-06-15')['2023'];
  eq(c.balances['checking|2023-01'], undefined, 'a bank you left in 2021 is not in 2023');
  eq(c.balances['brokerage|2023-01'], undefined);
  approx(c.balances['total|2023-01'], 9000, 'and Total is only what you actually hold');
});
t('a pinned year states its balances rather than chaining them', () => {
  const c = H.computeAll(H.coerceShape(historyState()), '2026-08-10')['2020'];
  approx(c.balances['checking|2020-01'], 1000);
  eq(c.balanceKinds['checking|2020-01'], 'pinned');
  eq(c.balances['checking|2020-03'], undefined,
    'no carry-forward — a past year holds only what it states');
  approx(c.balances['total|2020-01'], 1000, 'Total adds up the month’s stated figures');
  approx(c.balances['total|2020-12'], 5000, 'December: only the brokerage has one');
});
t('converting twice changes nothing', () => {
  const once = H.coerceShape(historyState());
  const twice = H.coerceShape(JSON.parse(JSON.stringify(once)));
  eq(JSON.stringify(twice), JSON.stringify(once));
});

t('a bonus stored on a comp year moves into Bonuses by year, once', () => {

});
t('where both copies exist the Bonuses table wins', () => {

     the copy nobody kept up to date. */
  const d = H.coerceShape({ side: {
    comp: { '2026': { salary: 100000, raisePct: 0.03, bonus: 9000 } },

  eq('bonus' in d.side.comp['2026'], false);

t('a bonus recorded for a year with no comp record is left alone', () => {

  eq(d.side.bonuses, { '2020': 1000 });
});
t('the total comp figure reads the bonus the table shows', () => {

t('PTO dates read out of the old free-text box, once', () => {

group('Untrusted input');
t('a __proto__ key in a restored file never becomes a prototype', () => {
  const hostile = '{"years":{},"__proto__":{"pwned":1}}';
  const guarded = JSON.parse(hostile, (k, v) => k === '__proto__' ? undefined : v);
  eq(Object.keys(guarded).includes('__proto__'), false, 'the key is dropped on parse');
  const target = {};
  Object.assign(target, guarded);
  eq(Object.getPrototypeOf(target) === Object.prototype, true, 'Object.assign left it alone');
  eq(({}).pwned, undefined, 'and nothing global was touched');
});
t('numeric fields that render unescaped are coerced to numbers', () => {
  /* shares, trip/PTO nights and PTO days reach the page WITHOUT esc(); a string
     of markup in a hand-edited or corrupted backup would otherwise execute.
     coerceShape forces them to numbers, closing the whole class of sink. */
  const evil = '<img src=x onerror=alert(1)>';
  const d = H.coerceShape({
    side: { portfolios: [{ id: 'p', name: 'P',
              rows: [{ ticker: 'X', shares: evil, price: evil }] }],
            daf: [{ ticker: 'Y', shares: evil, price: 5 }] },
    vacations: { trips: [{ id: 't', name: 'T', year: '2027', nights: evil,
                  items: [{ label: 'Air', paid: evil, credits: '1.5', due: 3 }] }],
      pto: { '2027': { allowance: evil, entries: [
              { name: 'H', nights: evil, ptoDays: evil }] } } }
  });
  const row = d.side.portfolios[0].rows[0];
  eq(typeof row.shares, 'number'); eq(row.shares, 0, 'markup shares → 0');
  eq(typeof row.price, 'number');
  eq(typeof d.side.daf[0].shares, 'number', 'the giving fund is coerced too');
  const trip = d.vacations.trips[0];
  eq(trip.nights, 0, 'markup trip nights → 0');
  eq(trip.year, 2027, 'a numeric string parses');
  eq(trip.items[0].paid, 0);
  eq(trip.items[0].credits, 1.5, 'a real figure survives as a number');
  const bucket = d.vacations.pto['2027'];
  eq(bucket.allowance, 0);
  eq(bucket.entries[0].nights, 0);
  eq(bucket.entries[0].ptoDays, 0);
});
t('money maps from a hand-edited backup become numbers, not $NaN', () => {
  /* These all render through fmtMoney/toFixed, so a string is never markup —
     but NaN poisons every total it reaches. Coerced like the unescaped
     fields; an entry that isn't a figure at all is dropped, since absence
     already means "nothing recorded" and the limits have defaults. */
  const d = H.coerceShape({ side: {
    comp: { '2030': { salary: '90000', raisePct: 'x' } },
    bonuses: { '2030': '5000', '2031': '' },
    limits: { '2030': { salary: '90000', k401Limit: '' } },
    retirementAccounts: [{ name: 'R', type: '401k', amount: '12000',
      contribs: { '2030': '1000' } }],
    donations: { '2030': [{ foundation: 'F', funding: '250' }] } } });
  eq(d.side.comp['2030'].salary, 90000);
  eq(d.side.comp['2030'].raisePct, 0, 'not a figure at all → 0');
  eq(d.side.bonuses['2030'], 5000);
  eq(d.side.bonuses['2031'], undefined, 'an empty bonus is dropped, not $0');
  eq(d.side.limits['2030'].salary, 90000);
  eq(d.side.limits['2030'].k401Limit, undefined, 'an empty limit falls back to the default');
  eq(d.side.retirementAccounts[0].amount, 12000);
  eq(d.side.retirementAccounts[0].contribs['2030'], 1000);
  eq(d.side.donations['2030'][0].funding, 250);
});
t('markup in a year key survives coerceShape as data, not as markup', () => {
  const evil = '<img src=x onerror=alert(1)>';
  const d = H.coerceShape({ years: { [evil]: { kind: 'summary', categoryTotals: [] } } });
  ok(Object.keys(d.years).includes(evil), 'kept verbatim as a key');
  /* esc() is what stands between that key and the page — pin its behaviour */
  const escaped = evil.replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  eq(escaped.indexOf('<'), -1, 'no angle bracket survives escaping');
});

group('Investment panes');

group('Reconciling a stated balance');
/* The dialog always showed the computed figure and then silently took whatever
   was typed over it, so a correction and a mistyped digit looked identical. */
t('a balance that agrees says so — that is the check passing', () => {
  const s = H.reconcileNote(38.11, 38.11);
  eq(/^Matches the plan exactly/.test(s), true, s);
  eq(s.includes('$38.11'), true);
});
t('a gap is named, with its size and direction', () => {
  const more = H.reconcileNote(50.51, 38.11);
  eq(more.startsWith('$12.40 more than the plan expects'), true, more);
  eq(more.includes('$38.11'), true, 'and says what the plan expected');
  const less = H.reconcileNote(25.71, 38.11);
  eq(less.startsWith('$12.40 less than the plan expects'), true, less);
});
t('cents are respected — float dust is not a discrepancy', () => {
  eq(/^Matches/.test(H.reconcileNote(0.1 + 0.2, 0.3)), true,
     '0.1 + 0.2 must not read as a third of a cent out');
});
t('nothing to compare against says nothing at all', () => {
  eq(H.reconcileNote(null, 38.11), '', 'an empty box is not a discrepancy');
  eq(H.reconcileNote(38.11, undefined), '', 'a pinned history year computes nothing');
  eq(H.reconcileNote(NaN, 38.11), '');
});

group('Why an account shows no balance');

t('anything else is genuinely not tracked yet', () => {

group('Which rows count as pay');
/* It guessed from the row's NAME against an English word list, so "Income" or
   "Stipend" got a dash on the Giving tab and the only cure was renaming your
   budget to suit the code. */
t('the guess still works for a plan that predates the tick', () => {

  eq(H.isPayRow('Salary', 'none', undefined), true);
  eq(H.isPayRow('Stipend', 'none', undefined), false, 'the guess is only a guess');

group('Closing an account');
/* Until now `until` could only be written by the spreadsheet importer, so
   anybody else's closed account carried its last balance forward for ever. */
const withBalances = (months) => ({ settings: { accounts: [
    { id: 'cash', name: 'Cash', hub: true }, { id: 'old', name: 'Old Bank' }] },
  years: { '2026': { kind: 'grid', startMonth: '2026-01', monthCount: 12, categories: [],
    cells: {}, seeds: {}, overrides: Object.fromEntries(
      months.map(m => [`old|${m}`, { v: 10 }])) } } });
t('a figure recorded after the closing month is what blocks it', () => {
  const st = withBalances(['2026-03', '2026-09']);
  eq(H.statedAfter(st, 'old', '2026-06'), ['2026-09'],
     'September would be hidden by closing in June');
  eq(H.statedAfter(st, 'old', '2026-12'), [], 'closing after everything is safe');
});
t('the closing month itself is not "after" it', () => {
  const st = withBalances(['2026-06']);
  eq(H.statedAfter(st, 'old', '2026-06'), [],
     'an account closed in the month of its last balance keeps that balance');
});
t('it only ever looks at the account being closed', () => {
  const st = withBalances(['2026-09']);
  st.years['2026'].overrides['cash|2026-11'] = { v: 500 };
  eq(H.statedAfter(st, 'old', '2026-10'), [], 'another account’s figures are not in the way');
});

group('A dividends row names the accounts it earns on');
/* It used to read the ids `cash` and `mid` literally — invisible until someone
   who wasn't the author renamed or deleted them, whereupon the row went blank
   with nothing on screen saying why. */
const divState = (cat) => H.coerceShape({

    { id: 'mid', name: 'Savings', creditTo: 'mid', divTo: 'mid' },

});
const divCell = (st) => H.computeAll(st)['2026'].cells['div|2026-02'];
t('a row written before the setting existed keeps earning on the old two', () => {
  const st = divState({});

t('and it can be pointed at any accounts instead', () => {

t('naming none leaves the month blank rather than claiming zero', () => {

group('Nominating the main account');
/* The hub is one boolean the whole engine reads: `normal` rows land on it and
   nowhere else, transfer and pass-through are both defined against it, and it
   is the only account with no start date. */
const threeAccounts = () => ({ settings: { accounts: [
  { id: 'cash', name: 'Cash (SPAXX)', hub: true, creditTo: 'cash', divTo: 'cash' },
  { id: 'chase', name: 'Chase Checking', creditTo: 'chase', divTo: 'chase' },
  { id: 'mt', name: 'M&T Checking', creditTo: 'mt', divTo: 'mt' }] }, years: {} });
t('nominating one moves it, and leaves exactly one', () => {
  const st = threeAccounts();
  const moved = H.nominateHub(st, 'chase');
  eq(moved, { from: 'Cash (SPAXX)', to: 'Chase Checking' }, 'it says what moved');
  eq(st.settings.accounts.filter(a => a.hub).length, 1, 'exactly one, always');
  eq(H.hubAccount(st).id, 'chase');
  eq(st.settings.accounts[0].hub, undefined, 'and the old one is properly cleared');
});
t('nominating the one that already holds it does nothing', () => {
  const st = threeAccounts();
  eq(H.nominateHub(st, 'cash'), null, 'nothing to report');
  eq(H.hubAccount(st).id, 'cash');
});
t('an unknown account cannot take it away from the one that has it', () => {

t('a plan that somehow had two ends up with one', () => {

  const st = threeAccounts();
  st.settings.accounts[1].hub = true;
  H.nominateHub(st, 'mt');
  eq(st.settings.accounts.filter(a => a.hub).length, 1);
  eq(H.hubAccount(st).id, 'mt');
});
t('the shape check always leaves a hub to find', () => {
  const st = H.coerceShape({ settings: { accounts: [
    { id: 'a', name: 'A' }, { id: 'b', name: 'B' }] }, years: {} });
  eq(st.settings.accounts.filter(x => x.hub).length, 1, 'one is chosen rather than none');
});

group('Accounts sharing a name are one account');
/* The history import made an account per distinct row NAME per sheet, so one
   real brokerage account arrived as four ids as the spreadsheet's wording
   drifted. Renaming them to match is how you say they are the same thing. */
const twoYears = (a, b) => ({
  settings: { accounts: [
    { id: 'old', name: 'Savings', until: '2021-12', creditTo: 'old', divTo: 'old' },
    { id: 'new', name: 'Savings', creditTo: 'new', divTo: 'new' }] },
  years: {
    '2021': { kind: 'grid', model: 'pinned', startMonth: '2021-01', monthCount: 12,
              overrides: a, seeds: {}, categories: [], cells: {} },
    '2022': { kind: 'grid', startMonth: '2022-01', monthCount: 12,
              overrides: b, seeds: {}, categories: [], cells: {} } },
});
t('a succession of same-named accounts becomes one, keeping every figure', () => {
  const st = twoYears({ 'old|2021-06': { v: 100 }, 'old|2021-12': { v: 250 } },
                      { 'new|2022-06': { v: 400 } });
  const rep = H.mergeAccountsByName(st);
  eq(st.settings.accounts.length, 1, 'one account left');
  eq(st.settings.accounts[0].id, 'new', 'the still-open one survives, not the closed one');
  eq(st.settings.accounts[0].until, undefined, 'and it is open, because the survivor was');
  eq(st.years['2021'].overrides['new|2021-06'].v, 100, 'the old balances moved across');
  eq(st.years['2021'].overrides['new|2021-12'].v, 250);
  eq(st.years['2021'].overrides['old|2021-06'], undefined, 'and left nothing behind');
  eq(st.years['2022'].overrides['new|2022-06'].v, 400, 'the survivor keeps its own');
  eq(rep[0].moved, 2);
});
t('a month claimed by both refuses the merge outright', () => {
  /* A balance is a fact. Dropping one to tidy a list is not a trade worth
     making, so an overlap leaves the whole group alone. */
  const st = twoYears({ 'old|2021-06': { v: 100 }, 'new|2021-06': { v: 999 } }, {});
  const rep = H.mergeAccountsByName(st);
  eq(st.settings.accounts.length, 2, 'both survive');
  eq(st.years['2021'].overrides['old|2021-06'].v, 100, 'and neither figure moved');
  eq(st.years['2021'].overrides['new|2021-06'].v, 999);
  eq(rep[0].refused, 1, 'and it says how many months were in the way');
});
t('every reference to an absorbed account is repointed', () => {
  /* Missing one would leave a row paying into an account that no longer
     exists, which reads on screen as money vanishing. */
  const st = twoYears({ 'old|2021-06': { v: 1 } }, {});
  st.settings.accounts[1].creditTo = 'old';
  st.years['2022'].categories = [{ id: 'x', name: 'X', role: 'transfer', transferTo: 'old' }];
  st.goals = [{ id: 'g', name: 'G', accounts: ['old', 'new'] }];
  H.mergeAccountsByName(st);
  eq(st.settings.accounts[0].creditTo, 'new');
  eq(st.years['2022'].categories[0].transferTo, 'new');
  eq(st.goals[0].accounts, ['new'], 'and a goal naming both does not list it twice');
});
t('different names are left well alone, and running twice changes nothing', () => {
  const st = twoYears({ 'old|2021-06': { v: 100 } }, { 'new|2022-06': { v: 400 } });
  st.settings.accounts[0].name = 'Old Savings';
  eq(H.mergeAccountsByName(st).length, 0, 'nothing to do');
  eq(st.settings.accounts.length, 2);
  st.settings.accounts[0].name = 'Savings';
  H.mergeAccountsByName(st);
  const once = JSON.stringify(st);
  H.mergeAccountsByName(st);
  eq(JSON.stringify(st), once, 'a second pass is a no-op');
});
t('the hub survives being merged into', () => {
  const st = twoYears({ 'old|2021-06': { v: 1 } }, {});
  st.settings.accounts[0].hub = true;          // the closed one was the hub
  H.mergeAccountsByName(st);
  eq(st.settings.accounts[0].hub, true, 'hub is a fact about the account, not the row that won');
});

group('The Refresh button ignores the six-hour cache');
/* Pressing the button is an explicit "look now". The six hours only ever
   existed to stop the AUTOMATIC pass spending the allowance on prices that
   cannot have moved. */
t('a price the automatic pass calls fresh is re-asked by a manual press', () => {
  const q = { price: 100, ts: Date.now() - 60 * 60e3 };   // an hour old
  eq(H.freshWithin(q, H.QUOTE_TTL_MS), true, 'the automatic pass leaves it alone');
  eq(H.freshWithin(q, H.MANUAL_FRESH_MS), false, 'the button asks again');
});
t('but a press seconds after the last one does not re-ask what it just got', () => {
  /* This is what makes a throttled batch CARRY ON instead of starting over:
     without it the next press spends the whole minute re-fetching the holdings
     the previous press already had, and never reaches the ones it missed. */
  const justNow = { price: 100, ts: Date.now() - 10e3 };
  eq(H.freshWithin(justNow, H.MANUAL_FRESH_MS), true);
});
t('the manual window is far too short to be a cache', () => {
  eq(H.MANUAL_FRESH_MS < H.QUOTE_TTL_MS, true);
  eq(H.MANUAL_FRESH_MS <= 5 * 60e3, true, 'minutes, not hours');
});

group('Where a holding’s price came from');
/* The bar above the tables reports ONE time for the whole table, and the oldest

   That is what made a working fund lookup look like it had never run. */
const NOON = new Date(2026, 7, 13, 12, 0, 0).getTime();
const at = (h, m) => new Date(2026, 7, 13, h, m, 0).getTime();
t('a fetched price says so, and when', () => {
  const s = H.priceProvenance({ price: 715.61, ts: at(15, 41) }, 715.61, true, NOON);
  eq(/^Fetched today at /.test(s), true, s);
});
t('a price typed over a fetched one does not claim to be fetched', () => {
  const s = H.priceProvenance({ price: 713.20, ts: at(15, 41) }, 715.61, true, NOON);
  eq(/^You typed this over /.test(s), true, s);
  eq(s.includes('713.20'), true, 'says what the fetched figure actually was');
});
t('a “no quote” marker is reported as one, not as a price', () => {
  const s = H.priceProvenance({ noQuote: true, ts: at(9, 5) }, 715.61, true, NOON);
  eq(/^No quote came back /.test(s), true, s);
});
t('a row never looked up, and one with lookup switched off, differ', () => {
  eq(H.priceProvenance(undefined, 10, true, NOON), 'Not fetched yet.');
  eq(H.priceProvenance({ price: 10, ts: at(9, 0) }, 10, false, NOON).includes('Lookup is off'),
     true, 'the reason there is no fetch time is the setting, not the clock');
});
t('the day is named only when it is not today', () => {
  eq(H.fetchedWhen(at(15, 41), NOON).startsWith('today at '), true);
  const y = new Date(2026, 7, 12, 15, 41, 0).getTime();

group('What one price answer means');
/* Real shapes, captured from Twelve Data rather than imagined. The two 429s
   are the pair that must never merge: the per-minute one clears while you are
   reading about it, the daily one does not. */
t('a quote is a price', () => {
  const v = H.classifyQuote(200, { symbol: 'FSKAX', close: '213.92999' });
  eq(v.kind, 'price');
  eq(v.price, 213.93, 'rounded to cents like every other figure in the app');
});
t('a fund quotes like anything else — the whole reason for the move', () => {
  eq(H.classifyQuote(200, { symbol: 'VTSAX', close: '185.87000' }).kind, 'price');
});
t('running out for the minute is not running out for the day', () => {
  const minute = H.classifyQuote(429, { code: 429, status: 'error', message:
    'You have run out of API credits for the current minute. 9 API credits were used, ' +
    'with the current limit being 8. Wait for the next minute or consider upgrading.' });
  eq(minute.kind, 'throttled', 'press Refresh again in a minute — do NOT say come back tomorrow');

t('a rejected key says so, instead of hiding as “no quote”', () => {

});
t('an unknown symbol is a determinate “there is no price”', () => {

  eq(H.classifyQuote(200, { symbol: 'X' }).kind, 'noQuote', 'a 200 carrying no price');
});
t('their outage is not our answer, and must not mark the ticker', () => {

  eq(H.classifyQuote(500, {}).kind, 'failed');

group('The price lookup’s memory');
/* A holding that can NEVER be quoted — a mutual fund on the free tier, or a row
   that isn't a security — used to be asked about on every single page load,
   spending one of the 25 daily lookups each time and never getting anything
   back. The marker is what stops that; its expiry is what keeps it honest. */
t('a “no quote” marker is remembered, but only for a day', () => {
  const now = Date.now();
  eq(H.noQuoteFresh({ noQuote: true, ts: now }), true, 'just answered — do not ask again');
  eq(H.noQuoteFresh({ noQuote: true, ts: now - 23 * 3600e3 }), true, 'still the same day');
  eq(H.noQuoteFresh({ noQuote: true, ts: now - 25 * 3600e3 }), false,
     'a fund the free tier starts covering is retried tomorrow');
  eq(H.noQuoteFresh(undefined), false, 'never asked about at all');
});
t('a marker is not a price, and a price is not a marker', () => {
  const now = Date.now();
  eq(H.quoteFresh({ noQuote: true, ts: now }), false,
     'a marker must never be read as a price — it has none');
  eq(H.noQuoteFresh({ price: 12, ts: now }), false,
     'a real quote is not a refusal');
  eq(H.quoteFresh({ price: 12, ts: now }), true);
});

group('How long a lookup’s complaints stay true');
/* Both notes used to be drawn straight out of stored state with no age check,
   so a run from the previous morning sat on the tab reading as a live refusal —
   which is exactly what "how can I be out of lookups?" was looking at. */
t('the daily cap is news only on the day it happened', () => {
  eq(H.runIsToday({ at: Date.now() }), true);

     'the allowance has reset since — saying otherwise sends you away for nothing');

});
t('the frequency limit clears in about a minute', () => {
  eq(H.runIsRecent({ at: Date.now() - 5e3 }, 10 * 60e3), true);
  eq(H.runIsRecent({ at: Date.now() - 30 * 60e3 }, 10 * 60e3), false);

});

group('What a subtotal is made of');
