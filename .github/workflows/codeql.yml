# CodeQL static analysis for the app's JavaScript.
#
# Added 2026-08-20. Dependabot was already watching this repo and reporting
# clean, but code scanning had never run anywhere in the family — an audit found
# "no analysis found" on all nine public repos. Dependabot only sees declared
# dependencies, and these apps have almost none; the code that matters is the
# single HTML file, which nothing was reading.
#
# CodeQL extracts the <script> blocks out of the HTML, so it covers the app
# itself and not just the two vendored .js files. What it is really here for is
# the shared-origin rule: every Pages site in this account is one browser
# origin, so an XSS hole in any page is a hole in all of them, and the escaping
# discipline that prevents it is worth having a machine re-check on every push.
#
# `security-events: write` is the one extra permission over the tests workflow,
# and it is what lets the run publish alerts to the Security tab. Everything
# else stays read-only.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published query pattern reaches this repo without
    # waiting for the next commit. Monday early, off the hour to avoid the
    # top-of-hour scheduling crush.
    - cron: '17 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
          # Vendored third-party bundles are excluded. chart.min.js must never be
          # hand-edited, so an alert in it is one nobody can act on — and minified
          # code trips the style queries constantly (single-letter variables
          # reassigned across scopes). Left in, the Security tab fills with
          # findings that cannot be fixed and the real ones stop being read.
          config: |
            paths-ignore:
              - '**/chart.min.js'

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
